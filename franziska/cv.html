<script>
/* A placeholder page, but it carries the switcher so the language does not silently flip back
   to English when someone navigates here. Same pattern as everywhere else. */
(function () {
  var DE = { 'h1': 'Lebenslauf', 'soon': 'Kommt bald' };
  var META = {
    en: { title: 'CV · Franziska Alber' },
    de: { title: 'Lebenslauf · Franziska Alber' }
  };

  var els = document.querySelectorAll('[data-i18n]');
  var EN = new Map();
  els.forEach(function (e) { EN.set(e, e.textContent); });

  function apply(lang) {
    var de = lang === 'de';
    els.forEach(function (e) {
      var s = DE[e.dataset.i18n];
      e.textContent = de && s ? s : EN.get(e);
    });
    document.title = META[de ? 'de' : 'en'].title;
  }

  window.__setLang = apply;
  if (document.documentElement.lang === 'de') apply('de');
})();
</script>
