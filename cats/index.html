  <div id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer">
    <img id="lightbox-img" src="" alt="">

  <script>
    const lb = document.getElementById('lightbox');
    const lbImg = document.getElementById('lightbox-img');
    const imgs = Array.from(document.querySelectorAll('.project-gallery img'));
    let current = 0;

    function show(index) {
      current = (index + imgs.length) % imgs.length;
      // Das Grid zeigt Thumbnails (440px); das Lightbox braucht die grosse
      // Fassung aus data-full. Sie wird erst hier geladen, also nur fuer
      // Bilder, die wirklich angeklickt werden.
      lbImg.src = imgs[current].dataset.full || imgs[current].src;
      lbImg.alt = imgs[current].alt;
      lb.classList.add('active');
      // Beim Blattern mit den Pfeiltasten waren die Nachbarn sonst erst beim
      // Anzeigen im Netz und blieben einen Moment leer. Ein Image-Objekt ohne
      // DOM reicht, um sie in den Cache zu holen.
      [current + 1, current - 1].forEach(i => {
        const n = imgs[(i + imgs.length) % imgs.length];
        const url = n && n.dataset.full;
        if (url) { const pre = new Image(); pre.src = url; }
      });
    }

    imgs.forEach((img, i) => img.addEventListener('click', () => show(i)));

    lb.addEventListener('click', e => {
      if (e.target !== lbImg) lb.classList.remove('active');
    });

    document.addEventListener('keydown', e => {
      if (!lb.classList.contains('active')) return;
      if (e.key === 'Escape') lb.classList.remove('active');
      if (e.key === 'ArrowRight') show(current + 1);
      if (e.key === 'ArrowLeft')  show(current - 1);
    });
  </script>

<script>
/* Little to translate here: the cat names and the years read the same in both languages, so
   this is the heading, the page title, the lightbox label and the image alt texts. The alt
   texts describe what is in each picture and therefore do need translating, which is what the
   cats.* keys below are; they name the cat as well, because the lightbox reads the alt text
   out with no heading next to it. Same pattern as everywhere else; registering window.__setLang
   keeps the lightbox listeners alive across a switch, which a reload would not. */
(function () {
  var DE = {
    'h1': 'Katzen',

    'cats.loki1': 'Loki gähnt weit auf einem Kratzbaum, Zunge und Zähne zu sehen',
    'cats.loki2': 'Loki sitzt hinter einer Glastür, neben einem Kratzbaum',
    'cats.loki3': 'Loki oben auf dem Kratzbaum, von unten fotografiert, eine Pfote greift zur Kamera',
    'cats.loki4': 'Loki steht im Profil auf einem Tisch, neben einer Schale mit Erdbeeren und Blaubeeren',
    'cats.loki5': 'Loki sitzt aufrecht vor einem türkisen Sessel und blickt in die Kamera',
    'cats.loki6': 'Loki liegt ausgestreckt auf der Seite auf einem dunklen Sitzkissen',
    'cats.mango1': 'Mango liegt in einem Katzenhäuschen aus Korbgeflecht',
    'cats.mango2': 'Mango steht auf den Hinterbeinen und schlägt nach einer Spielmaus an der Schnur',
    'cats.mango3': 'Mango sitzt auf einem flachen Pappkarton neben seinem Wassernapf',
    'cats.mango4': 'Mango klettert in eine blaue Kiste voller Kabel',
    'cats.mango5': 'Mango sitzt auf dem Schreibtisch zwischen Monitor und Maus',
    'cats.mango6': 'Mango steht im offenen Geschirrspüler auf dem unteren Korb',
    'cats.kimchi1': 'Kimchi döst mit geschlossenen Augen, an einen Arm gelehnt',
    'cats.kimchi2': 'Kimchi liegt auf einem Schreibtisch neben einem lila Strickstück',
    'cats.kimchi3': 'Kimchi liegt in einem Pappkarton, die Ohren nach außen gedreht',
    'cats.kimchi4': 'Kimchi klettert einen Baumstamm hoch, in einem sonnigen Garten',
    'cats.kimchi5': 'Kimchi liegt auf dem Holzboden, blickt in die Kamera, eine Pfote auf einem kleinen weißen Gegenstand',
    'cats.kimchi6': 'Kimchi liegt auf dem Rücken auf einem Bürostuhl, die Pfoten in der Luft'
  };
  var META = {
    en: { title: 'Cats: Alber', desc: 'Our cats: Loki, Mango, and Kimchi.', viewer: 'Image viewer' },
    de: { title: 'Katzen: Alber', desc: 'Unsere Katzen: Loki, Mango und Kimchi.', viewer: 'Bildansicht' }
  };

  var els = document.querySelectorAll('[data-i18n]');
  var EN = new Map();
  els.forEach(function (e) { EN.set(e, e.textContent); });

  var alts = document.querySelectorAll('[data-i18n-alt]');
  var ENALT = new Map();
  alts.forEach(function (e) { ENALT.set(e, e.getAttribute('alt')); });

  function apply(lang) {
    var de = lang === 'de';
    els.forEach(function (e) {
      var s = DE[e.dataset.i18n];
      e.textContent = de && s ? s : EN.get(e);
    });
    alts.forEach(function (e) {
      var s = DE[e.dataset.i18nAlt];
      e.setAttribute('alt', de && s ? s : ENALT.get(e));
    });
    var m = META[de ? 'de' : 'en'];
    document.title = m.title;
    var md = document.querySelector('meta[name="description"]');
    if (md) md.setAttribute('content', m.desc);
    var lb = document.getElementById('lightbox');
    if (lb) lb.setAttribute('aria-label', m.viewer);
  }

  window.__setLang = apply;
  if (document.documentElement.lang === 'de') apply('de');
})();
</script>
