<!doctype html>
<html lang="en" data-theme="dark" data-section="miscellaneous">
<head>
  <meta charset="utf-8">
  <!-- No theme one-liner and no switcher: the game fills the screen and only
       exists dark, like asteroid-corridor.html and asteroid-lab.html, so a
       stored light preference must not reach this page. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Hikyaku - 6DOF Courier Flight Prototype</title>
  <meta name="description" content="Prototype of a 6DOF courier flight game for a 3D mouse. Fly a small glider with gravity, drag and a flight assist through a timed route of rings over flat ground.">
  <link rel="stylesheet" href="/assets/css/pico.min.css">
  <link rel="stylesheet" href="/assets/css/custom.css">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <style>
    /* Full-screen canvas, so the Pico container, the site header and the site
       footer are deliberately absent, as in asteroid-corridor. Everything
       that would live in them goes into the floating panel. */
    html, body { height: 100%; }
    body { margin: 0; overflow: hidden; background: #05070b; }
    #root { position: fixed; inset: 0; }

    .hk-stage { position: absolute; inset: 0; touch-action: none; cursor: crosshair; }
    .hk-stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

    .hk-back { position: absolute; top: 12px; left: 12px; z-index: 3;
      font-size: 12.5px; color: var(--tool-label); text-decoration: none;
      padding: 5px 11px; border-radius: 999px; border: 1px solid rgba(51,65,85,.8);
      background: color-mix(in srgb, var(--tool-panel) 60%, transparent); backdrop-filter: blur(6px); }
    .hk-back:hover { color: var(--tool-text); border-color: var(--tool-faint); }

    /* The readouts are written straight into these nodes from the animation
       loop. Routing them through React state would re-render the panel sixty
       times a second for nothing. */
    .hk-hud { position: absolute; bottom: 12px; left: 12px; z-index: 3;
      pointer-events: none;
      padding: 9px 14px; border-radius: 10px; border: 1px solid rgba(51,65,85,.8);
      background: color-mix(in srgb, var(--tool-panel) 60%, transparent); backdrop-filter: blur(6px); }
    .hk-grid { display: grid; grid-template-columns: auto auto; gap: 3px 14px;
      font-size: 11.5px; color: var(--tool-note); font-variant-numeric: tabular-nums;
      letter-spacing: .02em; }
    .hk-grid b { color: var(--tool-text); font-weight: 600; text-align: right; }
    .hk-grid b.hot { color: #fbbf24; }
    .hk-grid b.acc { color: #2ee8ff; }

    .hk-clock { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 3;
      pointer-events: none; text-align: center;
      font-size: 22px; font-weight: 600; color: var(--tool-text); font-variant-numeric: tabular-nums;
      letter-spacing: .04em; text-shadow: 0 0 14px rgba(0,0,0,.9); }
    .hk-clock small { display: block; font-size: 11.5px; font-weight: 400; color: var(--tool-note);
      letter-spacing: .06em; margin-top: 2px; }

    .hk-splits { position: absolute; top: 74px; left: 50%; transform: translateX(-50%); z-index: 3;
      pointer-events: none; white-space: pre; font-size: 11.5px; line-height: 1.5;
      color: var(--tool-text); font-variant-numeric: tabular-nums; text-shadow: 0 0 10px rgba(0,0,0,.95); }

    .hk-msg { position: absolute; top: 38%; left: 50%; transform: translate(-50%, -50%);
      z-index: 3; pointer-events: none; text-align: center; max-width: 60ch;
      font-size: 15px; color: var(--tool-text); letter-spacing: .04em;
      text-shadow: 0 0 18px rgba(0,0,0,.95); }
    .hk-msg small { display: block; margin-top: 8px; font-size: 11.5px; color: var(--tool-note); letter-spacing: 0; }

    /* The cue to the next waypoint: a diamond on the target while it is on
       screen, an arrow at the screen edge while it is not. Positioned from
       the loop through style.transform, so it never touches layout. */
    .hk-cue { position: absolute; left: 0; top: 0; z-index: 2; pointer-events: none; display: none; }
    .hk-cue-box { width: 22px; height: 22px; margin: -11px 0 0 -11px; border: 2px solid #2ee8ff;
      transform: rotate(45deg); box-shadow: 0 0 10px rgba(46,232,255,.55); }
    .hk-cue-arrow { position: absolute; left: -12px; top: -12px; width: 24px; height: 24px; }
    .hk-cue-arrow i { position: absolute; left: 1px; top: 0; width: 0; height: 0;
      border-left: 11px solid transparent; border-right: 11px solid transparent;
      border-bottom: 20px solid #2ee8ff; filter: drop-shadow(0 0 5px rgba(46,232,255,.7)); }
    .hk-cue-d { position: absolute; left: 0; top: 16px; transform: translateX(-50%);
      font-size: 11.5px; color: #2ee8ff; white-space: nowrap; font-variant-numeric: tabular-nums;
      text-shadow: 0 0 6px #000, 0 0 2px #000; }

    .hk-panel { position: absolute; top: 12px; right: 12px; z-index: 4;
      width: min(330px, calc(100vw - 24px)); max-height: calc(100vh - 24px);
      overflow-y: auto; overscroll-behavior: contain;
      border: 1px solid var(--tool-border); border-radius: 10px; padding: 12px 14px 14px;
      background: color-mix(in srgb, var(--tool-panel) 88%, transparent); backdrop-filter: blur(10px);
      box-shadow: var(--tool-panel-shadow); }
    .hk-panel::-webkit-scrollbar { width: 8px; }
    .hk-panel::-webkit-scrollbar-thumb { background: var(--tool-border); border-radius: 4px; }
    .hk-toggle { position: absolute; top: 12px; right: 12px; z-index: 4;
      font-size: 12.5px; color: var(--tool-text); cursor: pointer; width: auto; margin: 0;
      padding: 6px 13px; border-radius: 999px; border: 1px solid var(--tool-border);
      background: color-mix(in srgb, var(--tool-panel) 75%, transparent); backdrop-filter: blur(8px); }
    .hk-toggle:hover { border-color: var(--tool-faint); }

    .hk-head { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
    .hk-head h2 { font-size: 14px; color: var(--tool-text); margin: 0; font-weight: 600; flex: 1; }
    .hk-x { background: none; border: none; color: var(--tool-note); cursor: pointer;
      font-size: 16px; line-height: 1; padding: 2px 4px; margin: 0; width: auto; }
    .hk-x:hover { color: var(--tool-text); }
    .hk-desc { font-size: 11.5px; color: var(--tool-note); margin: 0 0 6px; line-height: 1.45; }

    /* Accordion, the shape asteroid-corridor uses. A collapsed header keeps
       showing its current value. */
    .hk-acc { border-top: 1px solid var(--tool-hairline); }
    .hk-acc-h { display: flex; align-items: baseline; gap: 8px; width: 100%;
      margin: 0; padding: 9px 2px; background: none; border: none; cursor: pointer;
      font-size: 11px; color: var(--tool-note); letter-spacing: .06em; text-transform: uppercase;
      text-align: left; }
    .hk-acc-h:hover { color: var(--tool-text); }
    .hk-acc-h.open { color: var(--tool-label); }
    .hk-acc-s { margin-left: auto; font-size: 11px; color: var(--tool-faint);
      text-transform: none; letter-spacing: 0; font-variant-numeric: tabular-nums;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 58%; }
    .hk-acc-c { margin-left: auto; font-size: 13px; line-height: 1; color: var(--tool-faint); flex: none; }
    .hk-acc-s + .hk-acc-c { margin-left: 6px; }
    .hk-acc-b { padding: 0 2px 12px; }

    .hk-row { display: grid; grid-template-columns: 1fr auto; align-items: baseline;
      gap: 2px 8px; margin: 6px 0; }
    .hk-row label { font-size: 11.5px; color: var(--tool-label); margin: 0; }
    .hk-row output { font-size: 11.5px; color: var(--tool-text); text-align: right;
      font-variant-numeric: tabular-nums; }
    .hk-row input[type=range] { grid-column: 1 / -1; margin: 2px 0 0; }

    /* Number fields. Pico's input rule is input:not(...), which beats a plain
       class; the attribute selector here outranks it for height and padding. */
    .hk-nums { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; margin: 6px 0; }
    .hk-num { display: grid; grid-template-columns: 1fr 58px 3.2ch; align-items: center; gap: 4px;
      font-size: 11px; color: var(--tool-label); margin: 0; }
    .hk-num input[type=number] { height: 24px; padding: 1px 5px;
      font-size: 11.5px; margin: 0; font-variant-numeric: tabular-nums; }
    .hk-num i { font-style: normal; font-size: 10.5px; color: var(--tool-faint); }
    .hk-seed { display: flex; gap: 6px; align-items: center; margin: 6px 0 4px; }
    .hk-seed input[type=number] { height: 28px; padding: 2px 8px;
      width: 96px; margin: 0; font-size: 12px; font-variant-numeric: tabular-nums; }
    .hk-seed span { font-size: 11.5px; color: var(--tool-label); }
    .hk-seed button { margin: 0; width: auto; }

    /* Deliberate chip rows of separate actions, so they opt out of the shared
       adjacency rounding the way .rd-row and .qr-chips do. */
    .hk-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 6px; }
    .hk-chips button { width: auto; margin: 0; border-radius: 4px; margin-left: 0; }
    .hk-seg { margin: 4px 0 4px; }
    .hk-seg button { width: auto; margin: 0; }
    .hk-seg-l { font-size: 11.5px; color: var(--tool-label); display: block; margin: 9px 0 2px; }

    .hk-derived { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px;
      font-size: 11px; color: var(--tool-note); font-variant-numeric: tabular-nums;
      margin: 9px 0 0; padding-top: 8px; border-top: 1px solid var(--tool-hairline); }
    .hk-derived b { color: var(--tool-text); font-weight: 600; text-align: right; }

    .hk-note { font-size: 10.5px; color: var(--tool-faint); margin: 8px 0 0; line-height: 1.5; }
    .hk-note kbd { font-size: 10px; }
  </style>

<body>
  <div id="root"></div>

  <!-- The pure half: the route, the boxes around it, the ring test, the race
       clock and the box contacts. No DOM, no three.js, no React, so
       notes/dev/hikyaku.test.mjs pulls this block out by id and evaluates it
       on top of assets/js/sixdof.js. Moving any of it into the app block
       breaks that seam. -->
  <script id="hkcore">
var Hikyaku = (function () {
  'use strict';

  var SD = globalThis.SixDOF;
  if (!SD) throw new Error('hkcore needs SixDOF (assets/js/sixdof.js) loaded first');
  var add = SD.add, sub = SD.sub, mul = SD.mul, dot = SD.dot, cross = SD.cross, len = SD.len;
  var DEG = Math.PI / 180;

  function norm(v) { var l = len(v); return l > 1e-12 ? mul(v, 1 / l) : [0, 0, 0]; }
  function clamp(x, lo, hi) { return x < lo ? lo : x > hi ? hi : x; }
  function angle(a, b) {
    var c = dot(a, b) / Math.max(1e-12, len(a) * len(b));
    return Math.acos(clamp(c, -1, 1));
  }
  /* Only keys the defaults know, numbers only if finite. */
  function merge(def, cfg) {
    var o = {}, k;
    for (k in def) o[k] = def[k];
    if (cfg) for (k in def) {
      var v = cfg[k];
      if (v == null) continue;
      if (typeof def[k] === 'number' && !(typeof v === 'number' && isFinite(v))) continue;
      o[k] = v;
    }
    return o;
  }
  function pointSegDist(p, a, b) {
    var ab = sub(b, a), t = dot(sub(p, a), ab) / Math.max(1e-12, dot(ab, ab));
    t = clamp(t, 0, 1);
    return len(sub(p, add(a, mul(ab, t))));
  }

  /* ---- the route ----------------------------------------------------------
     World: flat ground at y = 0, sky up +y. The route is a list of waypoints
     and a smooth curve through them. The route comes first and the world is
     built around it (handoff, section 2), so everything the later city
     generator needs is in here: the waypoints, the curve, and a clearance
     tube along the curve that no building may enter.

     Waypoint shape, shared by every kind:
       { idx, kind, p, dir, right, up, shape, r, hw, hh, hold, biome }
     kind   'start' | 'ring' | 'finish'. v2 adds 'delivery': a waypoint where
            the pilot must hover or land. It reuses p and r (the radius of the
            hover zone) and fills hold = { ms, maxSpeed }; raceStep already
            handles it, nothing else has to change.
     shape  'circle' (rings, radius r) or 'rect' (gates, half sizes hw x hh,
            the portal rule of the handoff: rectangular, warm edge).
     dir    the facing direction, which is the curve tangent there. A ring
            counts only when crossed along dir.
     biome  'open' everywhere for now. The biome step marks legs here.

     The curve is a cubic Hermite spline per leg. The tangent at a waypoint
     is the bisector of the two legs meeting there, scaled by the chord of
     the leg. That keeps the curve tangent-continuous through every ring, and
     with the turn per leg bounded it bounds the curvature: the tightest
     possible leg (250 m chord, an S-bend at the full turn limit) comes out
     near 80 m radius, eight ring radii. The handoff warns that a curve
     tighter than the tube folds the tube; the tube here is 45 m, and the
     tests sample the radius on many seeds. */
  var DEF_ROUTE = {
    seed: 1, n: 12,
    ringR: 10,          /* handoff: ship 15 m, ring radius 10 m */
    gateW: 30, gateH: 18,
    tubeR: 45,          /* clearance radius, about 3 ship lengths */
    altMin: 30, altMax: 300,
    spMin: 250, spMax: 500,   /* horizontal distance between waypoints */
    maxTurn: 45,        /* degrees of heading change per waypoint */
    maxLeg: 58,         /* degrees between two consecutive legs in 3D */
    slope: 0.22,        /* climb per horizontal metre, at most */
    minSep: 120,        /* metres between a new leg and every older one */
    forgive: 1.5,       /* metres of grace on the ring and gate edge */
    leadIn: 160, leadOut: 120,
    step: 4             /* tube sample spacing, metres */
  };

  /* Right and up of a facing direction, with world up as the reference. */
  function frameOf(d) {
    var r = cross(d, [0, 1, 0]);
    if (len(r) < 1e-6) r = [1, 0, 0];
    r = norm(r);
    return { right: r, up: norm(cross(r, d)) };
  }

  function hermite(sg, t) {
    var t2 = t * t, t3 = t2 * t;
    var h00 = 2 * t3 - 3 * t2 + 1, h10 = t3 - 2 * t2 + t, h01 = -2 * t3 + 3 * t2, h11 = t3 - t2;
    var g00 = 6 * t2 - 6 * t, g10 = 3 * t2 - 4 * t + 1, g01 = -6 * t2 + 6 * t, g11 = 3 * t2 - 2 * t;
    var k00 = 12 * t - 6, k10 = 6 * t - 4, k01 = -12 * t + 6, k11 = 6 * t - 2;
    var p = [], d1 = [], d2 = [];
    for (var a = 0; a < 3; a++) {
      p.push(h00 * sg.p0[a] + h10 * sg.m0[a] + h01 * sg.p1[a] + h11 * sg.m1[a]);
      d1.push(g00 * sg.p0[a] + g10 * sg.m0[a] + g01 * sg.p1[a] + g11 * sg.m1[a]);
      d2.push(k00 * sg.p0[a] + k10 * sg.m0[a] + k01 * sg.p1[a] + k11 * sg.m1[a]);
    }
    return { p: p, d1: d1, d2: d2 };
  }

  function makeRoute(cfg) {
    var R = merge(DEF_ROUTE, cfg);
    R.n = Math.max(3, Math.round(R.n));
    R.seed = R.seed >>> 0;
    var rand = SD.rng(R.seed ^ 0x5bd1e995);
    var n = R.n, i, j;

    /* Waypoints. The heading drifts: a slow turn in one direction for two to
       four legs, then the other way, plus jitter. That gives a route that
       wanders without coming back on itself. A candidate leg is drawn again
       when it turns too hard in 3D or comes too close to an older leg. */
    var h = rand() * Math.PI * 2;
    var pts = [[0, R.altMin + 50 + rand() * 70, 0]];
    var sign = rand() < 0.5 ? -1 : 1, left = 2 + Math.floor(rand() * 3);
    var legPrev = null;
    for (i = 1; i < n; i++) {
      var p = pts[i - 1], got = null;
      for (var tr = 0; tr < 80 && !got; tr++) {
        var turn = sign * (8 + rand() * 22) + (rand() * 2 - 1) * 14;
        if (tr >= 50) turn *= 0.3;
        turn = clamp(turn, -R.maxTurn, R.maxTurn);
        var L = R.spMin + rand() * (R.spMax - R.spMin);
        var y = clamp(p[1] + (rand() * 2 - 1) * L * R.slope, R.altMin, R.altMax);
        var hh = h + turn * DEG;
        var q = [p[0] + Math.sin(hh) * L, y, p[2] - Math.cos(hh) * L];
        var leg = sub(q, p);
        if (legPrev && angle(legPrev, leg) > R.maxLeg * DEG) continue;
        var ok = true;
        for (j = 0; j + 2 < i && ok; j++) {
          for (var s = 0; s <= 8; s++) {
            if (pointSegDist(add(p, mul(leg, s / 8)), pts[j], pts[j + 1]) < R.minSep) { ok = false; break; }
          }
        }
        if (ok) got = { q: q, h: hh, leg: leg };
      }
      if (!got) {
        var q2 = [p[0] + Math.sin(h) * R.spMin, p[1], p[2] - Math.cos(h) * R.spMin];
        got = { q: q2, h: h, leg: sub(q2, p) };
      }
      pts.push(got.q); h = got.h; legPrev = got.leg;
      if (--left <= 0) { sign = -sign; left = 2 + Math.floor(rand() * 3); }
    }

    var dirs = pts.map(function (pt, k) {
      if (k === 0) return norm(sub(pts[1], pts[0]));
      if (k === n - 1) return norm(sub(pts[n - 1], pts[n - 2]));
      return norm(add(norm(sub(pt, pts[k - 1])), norm(sub(pts[k + 1], pt))));
    });

    var waypoints = pts.map(function (pt, k) {
      var kind = k === 0 ? 'start' : (k === n - 1 ? 'finish' : 'ring');
      var gate = kind !== 'ring', f = frameOf(dirs[k]);
      return {
        idx: k, kind: kind, p: pt, dir: dirs[k], right: f.right, up: f.up,
        shape: gate ? 'rect' : 'circle',
        r: gate ? 0 : R.ringR,
        hw: gate ? R.gateW / 2 : R.ringR, hh: gate ? R.gateH / 2 : R.ringR,
        hold: null, biome: 'open'
      };
    });

    var segments = [];
    for (i = 0; i + 1 < n; i++) {
      var c = len(sub(pts[i + 1], pts[i]));
      segments.push({ i: i, p0: pts[i], p1: pts[i + 1], m0: mul(dirs[i], c), m1: mul(dirs[i + 1], c), chord: c, biome: 'open' });
    }

    /* u runs from 0 at the start gate to n - 1 at the finish. */
    function spline(u) {
      var uu = clamp(u, 0, n - 1);
      var k = Math.min(n - 2, Math.floor(uu));
      var e = hermite(segments[k], uu - k);
      var sp = len(e.d1);
      var kap = sp > 1e-9 ? len(cross(e.d1, e.d2)) / (sp * sp * sp) : 0;
      return { p: e.p, d: mul(e.d1, 1 / Math.max(1e-9, sp)), curvature: kap };
    }

    /* The tube: dense samples along the curve, plus a straight lead-in before
       the start gate (the reset position sits on it) and a lead-out after the
       finish. A sample is { p, d, u, s }, s the arc length from the lead-in
       end. */
    var samples = [], sAcc = 0, minR = Infinity, last = null;
    function push(pt, d, u) {
      if (last) sAcc += len(sub(pt, last));
      samples.push({ p: pt, d: d, u: u, s: sAcc });
      last = pt;
    }
    var d0 = dirs[0], nIn = Math.ceil(R.leadIn / R.step);
    for (i = 0; i < nIn; i++) {
      var f0 = 1 - i / nIn;
      push(sub(pts[0], mul(d0, R.leadIn * f0)), d0, -f0);
    }
    for (i = 0; i + 1 < n; i++) {
      var nSt = Math.max(4, Math.ceil(segments[i].chord / R.step));
      for (j = 0; j < nSt; j++) {
        var sp2 = spline(i + j / nSt);
        if (sp2.curvature > 1e-12) minR = Math.min(minR, 1 / sp2.curvature);
        push(sp2.p, sp2.d, i + j / nSt);
      }
    }
    var dn = dirs[n - 1], nOut = Math.ceil(R.leadOut / R.step);
    for (i = 0; i <= nOut; i++) push(add(pts[n - 1], mul(dn, R.leadOut * i / nOut)), dn, n - 1 + i / nOut);

    var lo = [Infinity, Infinity, Infinity], hi = [-Infinity, -Infinity, -Infinity];
    for (i = 0; i < samples.length; i++) {
      for (j = 0; j < 3; j++) {
        lo[j] = Math.min(lo[j], samples[i].p[j] - R.tubeR);
        hi[j] = Math.max(hi[j], samples[i].p[j] + R.tubeR);
      }
    }
    var tube = {
      r: R.tubeR, samples: samples,
      /* Distance from p to the nearest sample. Brute force, for tests and
         generators; the loop never calls it. */
      dist: function (pt) {
        var best = Infinity;
        for (var k = 0; k < samples.length; k++) {
          var q = samples[k].p, dx = q[0] - pt[0], dy = q[1] - pt[1], dz = q[2] - pt[2];
          var dd = dx * dx + dy * dy + dz * dz;
          if (dd < best) best = dd;
        }
        return Math.sqrt(best);
      }
    };
    return {
      seed: R.seed, cfg: R, n: n, waypoints: waypoints, segments: segments,
      spline: spline, tube: tube, length: sAcc, minRadius: minR,
      bounds: { min: lo, max: hi }
    };
  }

  /* Where the ship is put on reset: back along the start gate's facing
     direction, at rest, nose along the direction, wings level. */
  function startState(route, back) {
    var w = route.waypoints[0], b = back == null ? 60 : back;
    var p = sub(w.p, mul(w.dir, b));
    return { p: p, v: [0, 0, 0], q: quatFromAxes(w.right, w.up, mul(w.dir, -1)), w: [0, 0, 0] };
  }

  /* Quaternion [w, x, y, z] of the rotation that takes the body axes onto
     the given world vectors (X right, Y up, Z aft). */
  function quatFromAxes(X, Y, Z) {
    var m00 = X[0], m01 = Y[0], m02 = Z[0];
    var m10 = X[1], m11 = Y[1], m12 = Z[1];
    var m20 = X[2], m21 = Y[2], m22 = Z[2];
    var tr = m00 + m11 + m22, q, S;
    if (tr > 0) {
      S = Math.sqrt(tr + 1) * 2;
      q = [0.25 * S, (m21 - m12) / S, (m02 - m20) / S, (m10 - m01) / S];
    } else if (m00 > m11 && m00 > m22) {
      S = Math.sqrt(1 + m00 - m11 - m22) * 2;
      q = [(m21 - m12) / S, 0.25 * S, (m01 + m10) / S, (m02 + m20) / S];
    } else if (m11 > m22) {
      S = Math.sqrt(1 + m11 - m00 - m22) * 2;
      q = [(m02 - m20) / S, (m01 + m10) / S, 0.25 * S, (m12 + m21) / S];
    } else {
      S = Math.sqrt(1 + m22 - m00 - m11) * 2;
      q = [(m10 - m01) / S, (m02 + m20) / S, (m12 + m21) / S, 0.25 * S];
    }
    return SD.qNorm(q);
  }

  /* ---- obstacles ----------------------------------------------------------
     The city (assets/js/hikyaku-city.js) builds the boxes around the route
     and answers boxesNear(p, r) with the shape contactsBoxes takes:
       { min, max, c, half, idx }
     The step-2 stand-in makeObstacles is gone. boxDist stays: tests and the
     contact code use it. */
  function boxDist(b, p) {
    var dx = Math.max(b.min[0] - p[0], 0, p[0] - b.max[0]);
    var dy = Math.max(b.min[1] - p[1], 0, p[1] - b.max[1]);
    var dz = Math.max(b.min[2] - p[2], 0, p[2] - b.max[2]);
    return Math.sqrt(dx * dx + dy * dy + dz * dz);
  }

  /* ---- contacts -----------------------------------------------------------
     Hull points against the OUTSIDE of axis-aligned boxes and against the
     ground plane y = 0, in the record SixDOF.resolve takes:
       { n, r, pen, key }
     n the world normal the hull has to move along, r the lever arm from the
     centre of mass, pen the depth, key the group for the positional
     correction (one per box, 'g' for the ground).
     A point inside a box leaves through the face it is least deep behind.
     The bottom face is skipped for boxes standing on the ground, because
     pushing the ship down into the ground is never the way out. At a few
     metres per substep against boxes 16 m wide and more, the least deep face
     is the face the point came through. */
  function contactsBoxes(s, pts, boxes) {
    var out = [], i, k;
    for (i = 0; i < pts.length; i++) {
      var r = SD.qRot(s.q, pts[i]);
      var wp = [s.p[0] + r[0], s.p[1] + r[1], s.p[2] + r[2]];
      if (wp[1] < 0) out.push({ n: [0, 1, 0], r: r, pen: -wp[1], key: 'g' });
      for (k = 0; k < boxes.length; k++) {
        var b = boxes[k], mn = b.min, mx = b.max;
        if (!(wp[0] > mn[0] && wp[0] < mx[0] && wp[1] > mn[1] && wp[1] < mx[1] &&
              wp[2] > mn[2] && wp[2] < mx[2])) continue;
        var best = mx[1] - wp[1], n = [0, 1, 0], c;
        if ((c = wp[0] - mn[0]) < best) { best = c; n = [-1, 0, 0]; }
        if ((c = mx[0] - wp[0]) < best) { best = c; n = [1, 0, 0]; }
        if ((c = wp[2] - mn[2]) < best) { best = c; n = [0, 0, -1]; }
        if ((c = mx[2] - wp[2]) < best) { best = c; n = [0, 0, 1]; }
        if (mn[1] > 0 && (c = wp[1] - mn[1]) < best) { best = c; n = [0, -1, 0]; }
        out.push({ n: n, r: r, pen: best, key: 'b' + (b.idx != null ? b.idx : k), box: b.idx != null ? b.idx : k });
      }
    }
    return out;
  }

  /* ---- rings and gates ----------------------------------------------------
     Did the segment prev -> cur pass through the waypoint? Only along its
     facing direction: a ring flown backwards does not count, which keeps the
     route a route and stops a pilot from taking ring 4 on the way back from
     ring 5. The edge has a small grace (route cfg.forgive, 1.5 m), because
     the test uses the centre of a 15 m ship and a graze that visibly went
     through should count. Returns the fraction along the segment at which
     the plane was crossed, or null. */
  function ringPass(prev, cur, wp, forgive) {
    var d0 = dot(sub(prev, wp.p), wp.dir), d1 = dot(sub(cur, wp.p), wp.dir);
    if (!(d0 < 0 && d1 >= 0)) return null;
    var f = d0 / (d0 - d1);
    var x = add(prev, mul(sub(cur, prev), f)), o = sub(x, wp.p);
    var tol = forgive == null ? DEF_ROUTE.forgive : forgive;
    var a = dot(o, wp.right), b = dot(o, wp.up);
    if (wp.shape === 'rect') {
      if (Math.abs(a) > wp.hw + tol || Math.abs(b) > wp.hh + tol) return null;
    } else if (a * a + b * b > (wp.r + tol) * (wp.r + tol)) return null;
    return f;
  }

  /* ---- the race -----------------------------------------------------------
     idle      only the start gate is live. Crossing it starts the clock
               (handoff: the clock starts at the start gate), at the
               interpolated crossing time, not at the frame.
     running   only waypoint `next` is live. Every other ring is scenery, so
               a ring taken out of order simply does not count.
     finished  the finish gate was crossed; time is the total and splits[k]
               the clock when waypoint k + 1 was taken (n - 1 of them, the
               last one equal to time). Nothing changes until a reset.
     t is the simulation time at cur, in milliseconds. raceStep is pure: it
     returns a new race with event set to what happened on this step. */
  function makeRace(route) {
    return {
      state: 'idle', next: 0, n: route.waypoints.length, wps: route.waypoints,
      forgive: route.cfg ? route.cfg.forgive : DEF_ROUTE.forgive,
      t0: null, lastT: null, splits: [], time: null, dwell: 0, event: null
    };
  }

  function raceStep(race, prev, cur, t) {
    var r = {}, k;
    for (k in race) r[k] = race[k];
    r.event = null;
    var tPrev = race.lastT == null ? t : race.lastT;
    r.lastT = t;
    if (r.state === 'finished') return r;
    var wp = r.wps[r.next];
    if (!wp) return r;
    var tc;
    if (wp.kind === 'delivery') {
      /* v2: hover inside the zone, slower than maxSpeed, for hold.ms. */
      var hd = wp.hold || { ms: 1500, maxSpeed: 2 };
      var dtm = t - tPrev, v = dtm > 0 ? len(sub(cur, prev)) / (dtm / 1000) : 0;
      if (len(sub(cur, wp.p)) <= (wp.r || 10) && v <= hd.maxSpeed) r.dwell = race.dwell + dtm;
      else r.dwell = 0;
      if (r.dwell < hd.ms) return r;
      r.dwell = 0;
      tc = t;
    } else {
      var f = ringPass(prev, cur, wp, r.forgive);
      if (f == null) return r;
      tc = tPrev + f * (t - tPrev);
    }
    if (r.state === 'idle') {
      r.state = 'running'; r.t0 = tc; r.next = 1;
      r.event = { type: 'start', idx: wp.idx, time: 0 };
      return r;
    }
    var split = tc - r.t0;
    r.splits = race.splits.concat([split]);
    r.next = race.next + 1;
    if (wp.kind === 'finish' || r.next >= r.n) {
      r.state = 'finished'; r.time = split;
      r.event = { type: 'finish', idx: wp.idx, time: split };
    } else {
      r.event = { type: wp.kind === 'delivery' ? 'delivery' : 'ring', idx: wp.idx, time: split };
    }
    return r;
  }

  /* The clock as shown: 0 before the start, running time, then the total. */
  function elapsed(race, t) {
    if (race.state === 'running') return t - race.t0;
    if (race.state === 'finished') return race.time;
    return 0;
  }

  /* m:ss.cc, truncated to the hundredth, as a race clock does. */
  function formatTime(ms) {
    if (ms == null || !isFinite(ms)) return '-:--.--';
    var neg = ms < 0, cs = Math.floor(Math.abs(ms) / 10);
    var m = Math.floor(cs / 6000), s = Math.floor(cs / 100) % 60, c = cs % 100;
    return (neg ? '-' : '') + m + ':' + (s < 10 ? '0' : '') + s + '.' + (c < 10 ? '0' : '') + c;
  }

  return {
    DEF_ROUTE: DEF_ROUTE,
    makeRoute: makeRoute, startState: startState, quatFromAxes: quatFromAxes, frameOf: frameOf,
    boxDist: boxDist, contactsBoxes: contactsBoxes,
    ringPass: ringPass, makeRace: makeRace, raceStep: raceStep, elapsed: elapsed,
    formatTime: formatTime
  };
})();

  <script id="app">
const html = htm.bind(React.createElement);
const { useState, useRef, useEffect, useMemo, useCallback } = React;
const SD = SixDOF;
const HF = HikyakuFlight;
const HK = Hikyaku;
const HC = HikyakuCity;
const CR = ColorRamps;
const G = HF.G0;

/* Colours are literals: the page has no theme switcher and only exists dark.
   The world is bone grey (handoff, Look), with two neon accents at most: the
   courier's cyan for the next ring and the cue, and a warm amber for the
   rectangular gates (the portal rule). */
const ACCENT = 0x2ee8ff;
const WARM = 0xffa63d;
const BONE = CR.rampById('bone').stops;
function boneAt(t) {
  const x = Math.max(0, Math.min(1, t)) * (BONE.length - 1);
  const i = Math.min(BONE.length - 2, Math.floor(x)), f = x - i;
  const a = BONE[i], b = BONE[i + 1];
  return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f];
}
function boneCss(t, k) {
  const c = boneAt(t).map((v) => Math.round(Math.min(1, v * (k == null ? 1 : k)) * 255));
  return 'rgb(' + c.join(',') + ')';
}
function boneColor(THREE, t, k) {
  const c = boneAt(t), s = k == null ? 1 : k;
  return new THREE.Color().setRGB(c[0] * s, c[1] * s, c[2] * s, THREE.SRGBColorSpace);
}

/* URL hooks. ?seed= makes a route shareable and best times comparable.
   ?shot=start|ring|top|city|canyon places the camera deterministically and
   ignores input, for headless screenshots; ?nohid=1 skips the 3D mouse;
   ?bench=1 measures tile builds and frame times and logs them with
   console.error (headless Chrome prints that to stderr). Test hooks, kept
   cheap. */
const URLP = new URLSearchParams(location.search);
const SHOT = ['start', 'ring', 'top', 'city', 'canyon'].indexOf(URLP.get('shot')) >= 0 ? URLP.get('shot') : null;
const BENCH = URLP.get('bench') === '1';
const NOHID = URLP.get('nohid') === '1';
const URL_SEED = parseInt(URLP.get('seed'), 10);

const DEF = {
  seed: 1,
  assist: true, gravity: true, drag: true,
  /* The courier's flat-plate drag torque pitches the nose away from the wind
     at angle of attack; a weak torque plus rate damping keeps it flyable. */
  dragTorque: 0.3, rateDamp: 2,
  /* Budget in g per body axis and sign, as in hikyaku-flight.js. */
  bXp: 1, bXn: 1, bYp: 3, bYn: 1.5, bZn: 1, bZp: 1, bBoost: 2,
  aPitch: 1.5, aYaw: 1.0, aRoll: 3.0, mass: 3000, cd: 0.9,
  restitution: 0.3,
  deadzone: 0, curve: 1, gain: 1,
  camMode: 'chase',
  camF0: 0.9, camZeta: 0.7071, camRoll: 0.25, camDist: 2.4, camUp: 0.45,
  shadows: false, overlay: false, routeLine: true,
  /* The city. Density, height and accents take effect on "Rebuild"; fog and
     the tile window apply at once. */
  cityDensity: 0.85, cityMaxH: 260, cityAccents: 2, fogDensity: 0.0034, cityRadius: 4
};
/* The two neon hues of the city (handoff: one or two per scene). The first
   is the courier's own cyan. */
const CITY_HUES = [ACCENT, 0xff3fa4];
const BUDGET_KEYS = ['bXp', 'bXn', 'bYp', 'bYn', 'bZn', 'bZp', 'bBoost', 'aPitch', 'aYaw', 'aRoll', 'mass', 'cd'];
const ENUMS = { camMode: ['chase', 'cockpit'] };
const STORE = 'hk.cfg';
const BEST = 'hk.best';
const SHIP_L = 15;
const H_STEP = 1 / 120;

/* The 3D mouse mapping of asteroid-corridor, unchanged. */
const DEF_INV = { fwd: -1, right: 1, up: -1, pitch: 1, yaw: -1, roll: 1 };
const DEF_MAP = { fwd: 'ty', right: 'tx', up: 'tz', pitch: 'rx', yaw: 'rz', roll: 'ry' };
const AXES = ['fwd', 'right', 'up', 'pitch', 'yaw', 'roll'];

/* Keyboard. Signs follow the body frame: pitch + is nose up, yaw + is nose
   left, roll + is left wing down. The arrows pitch like a stick: up pushes
   the nose down. */
const KEYMAP = {
  KeyW: ['fwd', 1], KeyS: ['fwd', -1], KeyD: ['right', 1], KeyA: ['right', -1],
  KeyR: ['up', 1], KeyF: ['up', -1],
  ArrowUp: ['pitch', -1], ArrowDown: ['pitch', 1],
  ArrowLeft: ['yaw', 1], ArrowRight: ['yaw', -1],
  KeyQ: ['roll', 1], KeyE: ['roll', -1],
  ShiftLeft: ['main', 1], ShiftRight: ['main', 1]
};

function fmt(x, d) { return Number.isFinite(x) ? x.toFixed(d == null ? 1 : d) : '-'; }

function loadStored() {
  let c = DEF;
  try {
    const raw = localStorage.getItem(STORE);
    if (raw) c = SD.mergeConfig(DEF, JSON.parse(raw), ENUMS);
  } catch (e) { c = DEF; }
  if (Number.isFinite(URL_SEED) && URL_SEED > 0) c = { ...c, seed: URL_SEED };
  return c;
}
function loadBest() {
  try { const b = JSON.parse(localStorage.getItem(BEST) || '{}'); return b && typeof b === 'object' ? b : {}; }
  catch (e) { return {}; }
}

function Slider(props) {
  return html`<div className="hk-row">
    <label>${props.label}</label>
    <output>${fmt(props.value * (props.scale || 1), props.digits)}${props.unit ? ' ' + props.unit : ''}</output>
    <input type="range" min=${props.min} max=${props.max} step=${props.step} value=${props.value}
      onInput=${(e) => props.onChange(parseFloat(e.target.value))} />
  </div>`;
}

function Num({ label, unit, value, step, min, onChange }) {
  return html`<label className="hk-num">
    <span>${label}</span>
    <input type="number" value=${value} step=${step} min=${min}
      onChange=${(e) => {
        const v = parseFloat(e.target.value);
        if (Number.isFinite(v) && v >= (min == null ? -Infinity : min)) onChange(v);
      }} />
    <i>${unit || ''}</i>
  </label>`;
}

function Seg({ label, value, options, onChange }) {
  return html`<${React.Fragment}>
    ${label ? html`<span className="hk-seg-l">${label}</span>` : null}
    <div className="hk-seg seg-row">
      ${options.map((o) => html`<button key=${o.value}
        className=${'lang-seg' + (value === o.value ? ' active' : '')}
        onClick=${() => onChange(o.value)}>${o.label}</button>`)}
    </div>
  <//>`;
}

function Section({ id, title, summary, open, onToggle, children }) {
  return html`<div className="hk-acc">
    <button type="button" className=${'hk-acc-h' + (open ? ' open' : '')}
      aria-expanded=${open} onClick=${() => onToggle(id)}>
      <span>${title}</span>
      ${!open && summary ? html`<span className="hk-acc-s">${summary}</span>` : null}
      <span className="hk-acc-c">${open ? '−' : '+'}</span>
    </button>
    ${open ? html`<div className="hk-acc-b">${children}</div>` : null}
  </div>`;
}

/* The street level: one city tile (HikyakuCity.TILE, 216 m) per texture
   repeat, streets 32 m wide on the tile edges and through the middle, with
   kerbs and faint lane dashes on the 54 m lane pitch. The pattern is
   symmetric, so the plane's uv orientation does not matter, only that its
   corner sits on a tile corner. */
function groundTexture(THREE, renderer) {
  const N = 1024, T = HC.TILE, k = N / T;
  const c = document.createElement('canvas');
  c.width = c.height = N;
  const g = c.getContext('2d');
  g.fillStyle = boneCss(0.16, 0.55);
  g.fillRect(0, 0, N, N);
  const half = HC.STREET / 2 * k;
  g.fillStyle = boneCss(0.1, 0.5);
  for (const m of [0, N / 2, N]) { g.fillRect(m - half, 0, 2 * half, N); g.fillRect(0, m - half, N, 2 * half); }
  g.fillStyle = boneCss(0.3, 0.45);
  for (const m of [0, N / 2, N]) for (const sgn of [-1, 1]) {
    const e = m + sgn * half - (sgn > 0 ? 2 : 0);
    g.fillRect(e, 0, 2, N); g.fillRect(0, e, N, 2);
  }
  /* lane dashes along every street, on the 54 m pitch offsets */
  g.fillStyle = boneCss(0.35, 0.35);
  for (const m of [0, N / 2, N]) for (const off of [-6, 6]) {
    for (let t = 0; t < N; t += 24) { g.fillRect(m + off * k - 1, t, 2, 12); g.fillRect(t, m + off * k - 1, 12, 2); }
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = Math.min(16, renderer.capabilities.getMaxAnisotropy());
  return tex;
}

/* A ship pose for the screenshot hooks: back along dir from p, nose along
   dir, wings level. */
function poseAt(p, dir, back) {
  const f = HK.frameOf(dir);
  return { p: SD.sub(p, SD.mul(dir, back)), v: [0, 0, 0], q: HK.quatFromAxes(f.right, f.up, SD.mul(dir, -1)), w: [0, 0, 0] };
}

/* The tall core of the city sits on the middle of the route. */
function routeCore(route) {
  const w = route.waypoints;
  return [w.reduce((a, q) => a + q.p[0], 0) / w.length, w.reduce((a, q) => a + q.p[2], 0) / w.length];
}

/* A gate frame after the portal rule: a dark rectangular body with real depth,
   and its reveal (the inner faces) glowing in the warm accent. The glow material
   is passed in, so its colour can follow the race state. */
function gateFrame(THREE, wp, mat, body) {
  const grp = new THREE.Group();
  const t = 2.2, dep = 5, hw = wp.hw, hh = wp.hh, lip = 0.35;
  const box = (w, h, d, x, y, z, m) => {
    const ms = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
    ms.position.set(x, y, z);
    grp.add(ms);
  };
  /* dark lit body */
  box(2 * hw + 2 * t, t, dep, 0, hh + t / 2, 0, body);
  box(2 * hw + 2 * t, t, dep, 0, -hh - t / 2, 0, body);
  box(t, 2 * hh, dep, -hw - t / 2, 0, 0, body);
  box(t, 2 * hh, dep, hw + t / 2, 0, 0, body);
  /* the glowing reveal: thin warm plates on the four inner faces */
  box(2 * hw, lip, dep + 0.1, 0, hh - lip / 2, 0, mat);
  box(2 * hw, lip, dep + 0.1, 0, -hh + lip / 2, 0, mat);
  box(lip, 2 * hh, dep + 0.1, -hw + lip / 2, 0, 0, mat);
  box(lip, 2 * hh, dep + 0.1, hw - lip / 2, 0, 0, mat);
  grp.position.set(wp.p[0], wp.p[1], wp.p[2]);
  /* Local x right, y up, z against the facing direction. */
  const q = HK.quatFromAxes(wp.right, wp.up, SD.mul(wp.dir, -1));
  grp.quaternion.set(q[1], q[2], q[3], q[0]);
  return grp;
}

function App() {
  const [p, setP] = useState(loadStored);
  const [panel, setPanel] = useState(!SHOT);
  const [sec, setSec] = useState('');
  const [dev, setDev] = useState({ name: null, err: null, supported: !!(window.SpaceNav && SpaceNav.supported()) });
  const [ready, setReady] = useState(!!window.__hkThreeReady);
  const [best, setBest] = useState(loadBest);
  const [lastRun, setLastRun] = useState(null);
  const [seedText, setSeedText] = useState(String(loadStored().seed));

  const stageRef = useRef(null);
  const hudRef = useRef({});
  const navRef = useRef(null);
  const glRef = useRef(null);
  const keysRef = useRef({});
  const lookRef = useRef({ yaw: 0, pitch: 0, dragging: false, chase: null });
  const killRef = useRef(false);
  const resetRef = useRef(0);
  const onFinishRef = useRef(null);

  /* The courier's own frame is kept for collision and drawing, and the
     principal moments are passed in as I. Letting makeCraft principalize the
