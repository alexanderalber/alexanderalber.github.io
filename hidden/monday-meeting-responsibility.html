<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Monday Meeting Rotation</title>
  <style>
    :root {
      --bg: #0b1120;
      --card-featured: #12233d;
      --text: #cbd5e1;
      --label: #94a3b8;
      --muted: #64748b;
      --faint: #475569;
      --accent: #38bdf8;
      --line: #1e2b45;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .wrap {
      width: 100%;
      max-width: 480px;
      padding: 56px 20px 40px;
    }
    .kicker {
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      margin: 0 0 10px;
    }
    .featured {
      background: var(--card-featured);
      border: 1px solid var(--line);
      border-left: 3px solid var(--accent);
      border-radius: 12px;
      padding: 22px 22px 20px;
      margin-bottom: 26px;
    }
    .featured .name {
      font-size: 30px;
      font-weight: 600;
      color: #f1f5f9;
      line-height: 1.1;
      margin: 0 0 8px;
    }
    .featured .date {
      font-size: 14px;
      color: var(--label);
      margin: 0;
    }
    .featured .rel {
      display: inline-block;
      margin-top: 12px;
      font-size: 12px;
      color: var(--muted);
    }
    .list-label {
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 12px 2px;
    }
    ol { list-style: none; margin: 0; padding: 0; }
    li {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 12px 2px;
      border-bottom: 1px solid var(--line);
    }
    li:last-child { border-bottom: none; }
    li .name { font-size: 16px; color: var(--text); }
    li .date { font-size: 13px; color: var(--muted); text-align: right; }
    footer {
      margin-top: 34px;
      font-size: 11px;
      color: var(--faint);
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="kicker">Up next</p>
    <div class="featured">
      <p class="name" id="feat-name"></p>
      <p class="date" id="feat-date"></p>
      <span class="rel" id="feat-rel"></span>
    </div>

    <p class="list-label">After that</p>
    <ol id="list"></ol>

    <footer>Meeting every other Monday. Handover at 17:00 (German time) on the meeting day.</footer>
  </div>

  <script>
  (function () {
    // --- configuration -----------------------------------------------------
    var ROTATION = ["Daniel", "Kevin", "Marco", "Andrew", "Mateusz", "John", "Roberto", "Alexander"];
    var ANCHOR = { y: 2026, m: 7, d: 27 }; // Daniel's first meeting (a Monday)
    var HANDOVER_HOUR = 17;                 // Berlin local time; after this on the meeting day the next person is shown
    var INTERVAL_DAYS = 14;                 // biweekly starting from the anchor meeting
    var TZ = "Europe/Berlin";
    var LOCALE = "en-GB";
    var DAY = 86400000;
    var UPCOMING = ROTATION.length;         // how many entries to list (one full cycle)

    var anchorDayNum = Date.UTC(ANCHOR.y, ANCHOR.m - 1, ANCHOR.d) / DAY;

    // --- date helpers ------------------------------------------------------
    function berlinNow() {
      var parts = new Intl.DateTimeFormat("en-CA", {
        timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit",
        hour: "2-digit", minute: "2-digit", hour12: false
      }).formatToParts(new Date());
      var m = {};
      parts.forEach(function (p) { m[p.type] = p.value; });
      var hour = parseInt(m.hour, 10);
      if (hour === 24) hour = 0; // some engines report 24 at midnight
      return { y: +m.year, mo: +m.month, d: +m.day, hour: hour };
    }

    // Smallest rotation index k whose meeting has not yet concluded.
    function currentIndex(now) {
      var nowDayNum = Date.UTC(now.y, now.mo - 1, now.d) / DAY;
      var delta = nowDayNum - anchorDayNum;
      if (delta < 0) return 0; // before the very first meeting
      var base = Math.floor(delta / INTERVAL_DAYS);
      var meetingDayBase = anchorDayNum + INTERVAL_DAYS * base; // largest meeting day <= today
      var concluded = (nowDayNum > meetingDayBase) ||
                      (nowDayNum === meetingDayBase && now.hour >= HANDOVER_HOUR);
      return concluded ? base + 1 : base;
    }

    function meetingDate(k) {
      // Noon UTC keeps the calendar date stable regardless of viewer timezone.
      return new Date((anchorDayNum + INTERVAL_DAYS * k) * DAY + 12 * 3600000);
    }

    function fmtDate(date) {
      return new Intl.DateTimeFormat(LOCALE, {
        timeZone: "UTC", weekday: "short", day: "2-digit", month: "short", year: "numeric"
      }).format(date);
    }

    function fmtDateLong(date) {
      return new Intl.DateTimeFormat(LOCALE, {
        timeZone: "UTC", weekday: "long", day: "2-digit", month: "long", year: "numeric"
      }).format(date);
    }

    // --- render ------------------------------------------------------------
    function render() {
      var now = berlinNow();
      var k = currentIndex(now);
      var nowDayNum = Date.UTC(now.y, now.mo - 1, now.d) / DAY;

      // featured
      document.getElementById("feat-name").textContent = ROTATION[k % ROTATION.length];
      document.getElementById("feat-date").textContent = fmtDateLong(meetingDate(k));

      var daysUntil = (anchorDayNum + INTERVAL_DAYS * k) - nowDayNum;
      var rel;
      if (daysUntil <= 0) rel = "today";
      else if (daysUntil === 1) rel = "tomorrow";
      else rel = "in " + daysUntil + " days";
      document.getElementById("feat-rel").textContent = rel;

      // the rest of the cycle
      var listEl = document.getElementById("list");
      listEl.innerHTML = "";
      for (var i = 1; i < UPCOMING; i++) {
        var idx = k + i;
        var li = document.createElement("li");
        var nameEl = document.createElement("span");
        nameEl.className = "name";
        nameEl.textContent = ROTATION[idx % ROTATION.length];
        var dateEl = document.createElement("span");
        dateEl.className = "date";
        dateEl.textContent = fmtDate(meetingDate(idx));
        li.appendChild(nameEl);
        li.appendChild(dateEl);
        listEl.appendChild(li);
      }
    }

    render();
    // Re-evaluate periodically so the page flips at the 17:00 handover without a reload.
    setInterval(render, 60000);
  })();
  </script>
</body>
</html>
