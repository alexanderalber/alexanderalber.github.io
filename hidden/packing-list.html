  <style>
    .pk-lead { color: var(--tool-label); max-width: 72ch; }
    /* Each field is as wide as its own buttons and the fields wrap as whole
       blocks. An equal-width grid broke the long rows (Unterkunft, Kind) inside
       themselves even on a wide screen. Only on a phone may a row break. */
    .pk-fields { display: flex; flex-wrap: wrap; gap: 14px 28px; }
    .pk-fields .seg-row { flex-wrap: nowrap; }
    @media (max-width: 420px) { .pk-fields .seg-row { flex-wrap: wrap; } }
    .pk-lbl { font-size: 0.85em; color: var(--tool-label); margin: 0 0 0.35rem; }
    .pk-fields .lang-seg { padding: 4px 12px; font-size: 0.9em; }
    /* Pico's input rule outranks a plain class, so size goes through its variables */
    input.pk-num { width: 110px; margin-bottom: 0;
      --pico-form-element-spacing-vertical: 0.3rem; --pico-form-element-spacing-horizontal: 0.6rem; }
    .pk-acts { display: flex; flex-wrap: wrap; gap: 0.4rem 1.4rem; }
    .pk-acts label { margin: 0; }

    .pk-bar { display: flex; gap: 10px 14px; align-items: center; flex-wrap: wrap; margin: 18px 0 4px; }
    .pk-prog { flex: 1 1 220px; color: var(--tool-label); font-size: 0.92em; }
    .pk-prog progress { margin: 4px 0 0; }

    .pk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 14px; margin-top: 12px; align-items: start; }
    .pk-cat { border: 1px solid var(--tool-border); border-radius: 8px; padding: 12px 14px;
      background: color-mix(in srgb, var(--tool-panel) 55%, transparent); }
    .pk-cat h2 { font-size: 0.98rem; margin: 0 0 0.45rem; color: var(--tool-emph); display: flex;
      justify-content: space-between; gap: 8px; }
    .pk-cat h2 small { color: var(--tool-note); font-weight: 400; font-variant-numeric: tabular-nums; }
    .pk-item { display: flex; gap: 0.55rem; align-items: baseline; padding: 3px 0; margin: 0; cursor: pointer;
      font-size: 0.93em; color: var(--tool-text); }
    .pk-item input[type=checkbox] { margin: 0; flex-shrink: 0; position: relative; top: 2px; }
    .pk-txt { flex: 1; }
    .pk-item.done .pk-txt { text-decoration: line-through; color: var(--tool-faint); }
    .pk-qty { color: var(--tool-note); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .pk-note { display: block; font-size: 0.82em; color: var(--tool-note); }
    .pk-x { padding: 0 6px; line-height: 1; }

    .pk-add { display: flex; gap: 8px; margin-top: 8px; }
    /* Pico gives both the text input and a submit button width:100%. The
       input's rule outranks any class, so it is sized by flex-basis (which
       Pico leaves alone); the button's rule is weak enough to just override. */
    .pk-add input { flex: 1 1 0; min-width: 0; margin: 0;
      --pico-form-element-spacing-vertical: 0.3rem; --pico-form-element-spacing-horizontal: 0.6rem; }
    .pk-add button { flex: none; width: auto; margin: 0; }
    .pk-foot { margin-top: 24px; font-size: 11px; color: var(--tool-note); }

    @media print {
      .no-print { display: none !important; }
      .pk-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
      .pk-cat { break-inside: avoid; box-shadow: none; background: none; }
    }

  <script id="packcore">
  (function (root) {
    /* After a week, washing once beats carrying more. So the daily clothes are
       counted up to seven days and then stop growing. */
    var WASH_AFTER = 7;

    var CATS = [
      { id: 'docs',   name: 'Dokumente und Geld' },
      { id: 'clothes', name: 'Kleidung (je Person)' },
      { id: 'hygiene', name: 'Hygiene' },

      { id: 'stay',   name: 'Unterkunft' },
      { id: 'act',    name: 'Aktivitäten' },

    var DEFAULTS = {
      nights: 7,
      climate: 'warm',   // warm | mixed | cold
      travel: 'car',     // car | train | plane
      stay: 'flat',      // hotel | flat | camping
      region: 'eu',      // home | eu | world
      kid: 'none',       // none | baby | toddler | child
      swim: true, hike: false, city: false, snow: false

    function days(o) { return o.nights + 1; }
    function daily(o) { return Math.min(days(o), WASH_AFTER); }
    function small(o) { return o.kid === 'baby' || o.kid === 'toddler'; }

      { id: 'visa', cat: 'docs', text: 'Visum / Einreiseformular', when: function (o) { return o.region === 'world'; },
        note: 'vorher nachsehen, ob nötig' },
      { id: 'kid-id', cat: 'docs', text: 'Ausweis oder Kinderreisepass fürs Kind',
        when: function (o) { return o.kid !== 'none' && abroad(o); } },
      { id: 'health-card', cat: 'docs', text: 'Krankenversicherungskarte',
        note: function (o) { return o.region === 'eu' ? 'Rückseite ist die europäische (EHIC)' : null; } },
      { id: 'travel-ins', cat: 'docs', text: 'Auslandskrankenversicherung (Nachweis)', when: function (o) { return o.region === 'world'; } },
      { id: 'vacc', cat: 'docs', text: 'Impfpass', when: function (o) { return o.region === 'world'; } },
      { id: 'cards', cat: 'docs', text: 'EC- und Kreditkarte' },
      { id: 'cash', cat: 'docs', text: 'Bargeld',
        note: function (o) { return o.region === 'world' ? 'etwas in Landeswährung' : null; } },
      { id: 'bookings', cat: 'docs', text: 'Buchungsbestätigungen (offline aufs Handy)' },
      { id: 'license', cat: 'docs', text: 'Führerschein', when: function (o) { return o.travel === 'car'; } },
      { id: 'car-papers', cat: 'docs', text: 'Fahrzeugschein', when: function (o) { return o.travel === 'car'; } },

      // Kleidung
      { id: 'underwear', cat: 'clothes', text: 'Unterwäsche', qty: daily },
      { id: 'socks', cat: 'clothes', text: 'Socken', qty: daily },
      { id: 'shirts', cat: 'clothes', text: 'T-Shirts / Oberteile',
        qty: function (o) { return Math.max(2, Math.min(Math.ceil(days(o) * 0.75), 6)); } },
      { id: 'trousers', cat: 'clothes',
        text: function (o) { return o.climate === 'warm' ? 'Hosen / Shorts' : 'Lange Hosen'; },
        qty: function (o) { return Math.max(1, Math.min(Math.ceil(days(o) / 3), 3)); } },
      { id: 'sleepwear', cat: 'clothes', text: 'Schlafsachen', qty: function (o) { return o.nights > 6 ? 2 : 1; } },
      { id: 'sweater', cat: 'clothes', text: 'Pullover / Fleece', qty: function (o) { return o.climate === 'warm' ? 1 : 2; } },
      { id: 'rain-jacket', cat: 'clothes', text: 'Regenjacke', when: function (o) { return o.climate !== 'cold'; } },
      { id: 'winter-jacket', cat: 'clothes', text: 'Winterjacke', when: function (o) { return o.climate === 'cold' || o.snow; } },
      { id: 'hat-gloves', cat: 'clothes', text: 'Mütze, Schal, Handschuhe', when: function (o) { return o.climate === 'cold' || o.snow; } },
      { id: 'thermal', cat: 'clothes', text: 'Thermounterwäsche', when: function (o) { return o.snow; } },
      { id: 'sun-hat', cat: 'clothes', text: 'Sonnenhut / Kappe', when: function (o) { return o.climate === 'warm' || o.swim; } },
      { id: 'sandals', cat: 'clothes', text: 'Sandalen / Badeschlappen', when: function (o) { return o.climate === 'warm' || o.swim; } },
      { id: 'shoes', cat: 'clothes', text: 'Bequeme Schuhe' },
      { id: 'nice-outfit', cat: 'clothes', text: 'Etwas Schickeres fürs Abendessen', when: function (o) { return o.city || o.stay === 'hotel'; } },
      { id: 'slippers', cat: 'clothes', text: 'Hausschuhe', when: function (o) { return o.stay === 'flat'; } },

      // Hygiene
      { id: 'toothbrush', cat: 'hygiene', text: 'Zahnbürste, Zahnpasta' },
      { id: 'shower', cat: 'hygiene', text: 'Duschgel, Shampoo',
        note: function (o) { return o.stay === 'hotel' ? 'Hotel hat meist welches' : null; } },
      { id: 'deo', cat: 'hygiene', text: 'Deo' },
      { id: 'brush', cat: 'hygiene', text: 'Haarbürste, Haargummis' },
      { id: 'razor', cat: 'hygiene', text: 'Rasierer' },
      { id: 'cream', cat: 'hygiene', text: 'Creme' },
      { id: 'glasses', cat: 'hygiene', text: 'Brille / Kontaktlinsen, Sonnenbrille' },
      { id: 'sunscreen', cat: 'hygiene', text: 'Sonnencreme', when: function (o) { return o.climate === 'warm' || o.swim || o.snow || o.hike; } },
      { id: 'lip', cat: 'hygiene', text: 'Lippenpflege', when: function (o) { return o.climate === 'cold' || o.snow; } },

        note: function (o) { return o.stay === 'flat' ? 'falls nicht gestellt' : null; } },
      { id: 'detergent', cat: 'hygiene', text: 'Reisewaschmittel', when: function (o) { return o.nights > WASH_AFTER; } },

      // Gesundheit
      { id: 'meds', cat: 'health', text: 'Eigene Medikamente',
        note: function (o) { return o.travel === 'plane' ? 'ins Handgepäck' : null; } },
      { id: 'painkiller', cat: 'health', text: 'Schmerzmittel' },
      { id: 'plasters', cat: 'health', text: 'Pflaster, Desinfektion' },
      { id: 'mosquito', cat: 'health', text: 'Mückenschutz', when: function (o) { return o.climate === 'warm' || o.hike || o.stay === 'camping'; } },
      { id: 'tick', cat: 'health', text: 'Zeckenzange', when: function (o) { return o.hike || o.stay === 'camping'; } },
      { id: 'blister', cat: 'health', text: 'Blasenpflaster', when: function (o) { return o.hike; } },
      { id: 'thermometer', cat: 'health', text: 'Fieberthermometer', when: function (o) { return o.kid !== 'none'; } },
      { id: 'kid-fever', cat: 'health', text: 'Fiebersaft / Zäpfchen fürs Kind', when: function (o) { return o.kid !== 'none'; } },
      { id: 'motion', cat: 'health', text: 'Mittel gegen Reiseübelkeit', when: function (o) { return o.kid !== 'none' && o.travel !== 'train'; } },

      // Technik
      { id: 'phone', cat: 'tech', text: 'Handy, Ladekabel, Netzteil' },
      { id: 'powerbank', cat: 'tech', text: 'Powerbank' },
      { id: 'headphones', cat: 'tech', text: 'Kopfhörer' },
      { id: 'reading', cat: 'tech', text: 'E-Reader / Buch' },
      { id: 'adapter', cat: 'tech', text: 'Reisestecker-Adapter', when: function (o) { return o.region === 'world'; },
        note: 'auch für Großbritannien und die Schweiz' },
      { id: 'power-strip', cat: 'tech', text: 'Mehrfachsteckdose' },
      { id: 'offline-maps', cat: 'tech', text: 'Offline-Karten laden', when: function (o) { return abroad(o) || o.hike; } },

      // Kind
      { id: 'kid-clothes', cat: 'kid', text: 'Kinderkleidung wie oben, plus Reserve',
        when: function (o) { return o.kid !== 'none'; }, qty: function (o) { return small(o) ? daily(o) + 2 : daily(o) + 1; },
        note: 'Garnituren' },
      { id: 'cuddly', cat: 'kid', text: 'Kuscheltier', when: function (o) { return o.kid !== 'none'; } },
      { id: 'pacifier', cat: 'kid', text: 'Schnuller (mit Ersatz)', when: small },
      { id: 'diapers', cat: 'kid', text: 'Windeln', when: small,
        qty: function (o) { return days(o) * (o.kid === 'baby' ? 6 : 4); },
        note: 'grob gerechnet; gibt es fast überall zu kaufen' },
      { id: 'wipes', cat: 'kid', text: 'Feuchttücher', when: small },
      { id: 'changing-mat', cat: 'kid', text: 'Wickelunterlage', when: small },
      { id: 'bottle-food', cat: 'kid', text: 'Fläschchen, Milchpulver, Brei', when: function (o) { return o.kid === 'baby'; } },
      { id: 'stroller', cat: 'kid', text: 'Kinderwagen oder Trage', when: small },
      { id: 'travel-cot', cat: 'kid', text: 'Reisebett', when: small,
        note: function (o) { return o.stay === 'camping' ? null : 'oder bei der Unterkunft anfragen'; } },
      { id: 'monitor', cat: 'kid', text: 'Babyphone', when: small },
      { id: 'toys', cat: 'kid', text: 'Spielzeug, Bücher', when: function (o) { return o.kid !== 'none'; } },
      { id: 'kid-bottle', cat: 'kid', text: 'Trinkflasche fürs Kind', when: function (o) { return o.kid !== 'none'; } },
      { id: 'swim-diapers', cat: 'kid', text: 'Schwimmwindeln', when: function (o) { return small(o) && o.swim; } },
      { id: 'floaties', cat: 'kid', text: 'Schwimmflügel', when: function (o) { return (o.kid === 'toddler' || o.kid === 'child') && o.swim; } },
      { id: 'uv-shirt', cat: 'kid', text: 'UV-Shirt fürs Kind', when: function (o) { return o.kid !== 'none' && (o.swim || o.climate === 'warm'); } },
      { id: 'car-seat', cat: 'kid', text: 'Kindersitz', when: function (o) { return o.kid !== 'none' && o.travel !== 'car'; },
        note: 'nur falls vor Ort ein Auto gemietet wird' },

      // Unterwegs
      { id: 'snacks', cat: 'travel', text: 'Snacks und Getränke' },
      { id: 'kid-bag', cat: 'travel', text: 'Wechselkleidung fürs Kind griffbereit', when: function (o) { return o.kid !== 'none'; } },
      { id: 'pastime', cat: 'travel', text: 'Beschäftigung für die Fahrt', when: function (o) { return o.kid !== 'none'; } },
      { id: 'car-kit', cat: 'travel', text: 'Warnwesten, Warndreieck, Verbandskasten', when: function (o) { return o.travel === 'car'; } },
      { id: 'toll', cat: 'travel', text: 'Vignette / Maut klären', when: function (o) { return o.travel === 'car' && abroad(o); } },
      { id: 'window-shade', cat: 'travel', text: 'Sonnenschutz fürs Autofenster', when: function (o) { return o.travel === 'car' && o.kid !== 'none'; } },
      { id: 'tickets', cat: 'travel', text: 'Tickets, Sitzplatzreservierung', when: function (o) { return o.travel === 'train'; } },
      { id: 'boarding', cat: 'travel', text: 'Bordkarten', when: function (o) { return o.travel === 'plane'; } },
      { id: 'liquids', cat: 'travel', text: 'Flüssigkeiten in 1-Liter-Beutel', when: function (o) { return o.travel === 'plane'; } },
      { id: 'weigh', cat: 'travel', text: 'Koffer wiegen', when: function (o) { return o.travel === 'plane'; } },

      // Unterkunft
      { id: 'dish-towels', cat: 'stay', text: 'Geschirrtücher, Spülschwamm', when: function (o) { return o.stay !== 'hotel'; } },
      { id: 'kitchen-basics', cat: 'stay', text: 'Kaffee, Filter, Salz, Öl', when: function (o) { return o.stay !== 'hotel'; } },
      { id: 'bin-bags', cat: 'stay', text: 'Müllbeutel', when: function (o) { return o.stay !== 'hotel'; } },
      { id: 'bedding', cat: 'stay', text: 'Bettwäsche', when: function (o) { return o.stay === 'flat'; }, note: 'falls nicht gestellt' },
      { id: 'tent', cat: 'stay', text: 'Zelt, Heringe', when: function (o) { return o.stay === 'camping'; } },
      { id: 'sleeping', cat: 'stay', text: 'Schlafsack, Isomatte', when: function (o) { return o.stay === 'camping'; } },
      { id: 'headlamp', cat: 'stay', text: 'Stirnlampe', when: function (o) { return o.stay === 'camping'; } },
      { id: 'stove', cat: 'stay', text: 'Kocher, Gas, Geschirr', when: function (o) { return o.stay === 'camping'; } },
      { id: 'line', cat: 'stay', text: 'Wäscheleine, Klammern', when: function (o) { return o.stay === 'camping' || o.nights > WASH_AFTER; } },

      // Aktivitäten
      { id: 'swimwear', cat: 'act', text: 'Badesachen', when: function (o) { return o.swim; }, qty: function () { return 2; } },
      { id: 'beach-towel', cat: 'act', text: 'Strandtuch', when: function (o) { return o.swim; } },
      { id: 'beach-toys', cat: 'act', text: 'Sandspielzeug', when: function (o) { return o.swim && o.kid !== 'none'; } },
      { id: 'backpack', cat: 'act', text: 'Tagesrucksack', when: function (o) { return o.hike || o.city; } },
      { id: 'boots', cat: 'act', text: 'Wanderschuhe', when: function (o) { return o.hike; } },
      { id: 'water-bottle', cat: 'act', text: 'Trinkflasche', when: function (o) { return o.hike || o.city; } },
      { id: 'ski-gear', cat: 'act', text: 'Skihose, Skijacke', when: function (o) { return o.snow; } },
      { id: 'goggles', cat: 'act', text: 'Skibrille, Helm', when: function (o) { return o.snow; } },
      { id: 'sled', cat: 'act', text: 'Schlitten', when: function (o) { return o.snow && o.kid !== 'none' && o.travel === 'car'; } },

      // Vor der Abfahrt
      { id: 'fridge', cat: 'home', text: 'Kühlschrank leeren' },
      { id: 'trash', cat: 'home', text: 'Müll raus' },
      { id: 'plants', cat: 'home', text: 'Pflanzen versorgen' },
      { id: 'heating', cat: 'home', text: 'Heizung runter, Fenster zu' },
      { id: 'plugs', cat: 'home', text: 'Stecker ziehen' },
      { id: 'mail', cat: 'home', text: 'Briefkasten leeren lassen', when: function (o) { return o.nights >= 7; } },
      { id: 'ooo', cat: 'home', text: 'Abwesenheitsnotiz einrichten' },
      { id: 'keys', cat: 'home', text: 'Hausschlüssel' }
    ];

    function val(v, o) { return typeof v === 'function' ? v(o) : v; }

    function normalize(o) {
      var out = {};
      for (var k in DEFAULTS) out[k] = (o && o[k] !== undefined) ? o[k] : DEFAULTS[k];
      var n = Math.round(Number(out.nights));
      out.nights = isFinite(n) ? Math.max(1, Math.min(n, 60)) : DEFAULTS.nights;
      return out;
    }

    // -> [{ id, name, items: [{ id, text, qty, note }] }], empty categories dropped
    function buildList(opts) {
      var o = normalize(opts);
      return CATS.map(function (c) {
        var items = ITEMS.filter(function (it) {
          return it.cat === c.id && (!it.when || it.when(o));
        }).map(function (it) {
          return { id: it.id, text: val(it.text, o), qty: it.qty ? it.qty(o) : null, note: val(it.note, o) || null };
        });
        return { id: c.id, name: c.name, items: items };
      }).filter(function (c) { return c.items.length; });
    }

    root.PackCore = { CATS: CATS, ITEMS: ITEMS, DEFAULTS: DEFAULTS, WASH_AFTER: WASH_AFTER,
      normalize: normalize, buildList: buildList };
  })(typeof window !== 'undefined' ? window : globalThis);
  </script>

  <script id="app">
    const html = htm.bind(React.createElement);
    const { useState, useEffect, useMemo } = React;
    const { buildList, normalize } = window.PackCore;

    const KEY = 'packing-list';
    function load() {
      try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; }
    }

    const SEGS = [
      { key: 'climate', label: 'Wetter', opts: [['warm', 'warm'], ['mixed', 'gemischt'], ['cold', 'kalt']] },
      { key: 'travel', label: 'Anreise', opts: [['car', 'Auto'], ['train', 'Zug'], ['plane', 'Flugzeug']] },
      { key: 'stay', label: 'Unterkunft', opts: [['hotel', 'Hotel'], ['flat', 'Ferienwohnung'], ['camping', 'Camping']] },
      { key: 'region', label: 'Ziel', opts: [['home', 'Inland'], ['eu', 'EU'], ['world', 'außerhalb']] },
      { key: 'kid', label: 'Kind', opts: [['none', 'keins'], ['baby', 'Baby'], ['toddler', 'Kleinkind'], ['child', 'älter']] }
    ];
    const ACTS = [['swim', 'Baden'], ['hike', 'Wandern'], ['city', 'Stadt'], ['snow', 'Schnee']];

    function Seg({ seg, value, set }) {
      return html`
        <div>
          <p className="pk-lbl">${seg.label}</p>
          <div className="seg-row">
            ${seg.opts.map(([v, l]) => html`
              <button key=${v} type="button" className=${'lang-seg' + (value === v ? ' active' : '')}
                onClick=${() => set(v)}>${l}</button>`)}
          </div>
        </div>`;
    }

    function Item({ it, done, toggle, onRemove }) {
      return html`
        <label className=${'pk-item' + (done ? ' done' : '')}>
          <input type="checkbox" checked=${done} onChange=${() => toggle(it.id)} />
          <span className="pk-txt">${it.text}${it.note ? html`<span className="pk-note">${it.note}</span>` : null}</span>
          ${it.qty ? html`<span className="pk-qty">${'× ' + it.qty}</span>` : null}
          ${onRemove ? html`
            <button type="button" className="tool-btn tool-btn-sm pk-x no-print" aria-label="Entfernen" title="Entfernen"
              onClick=${e => { e.preventDefault(); onRemove(it.id); }}>${ToolIcons.el('remove')}</button>` : null}
        </label>`;
    }

    function App() {
      const saved = useMemo(load, []);
      const [opts, setOpts] = useState(() => normalize(saved.opts));
      const [nightsText, setNightsText] = useState(String(normalize(saved.opts).nights));
      const [checked, setChecked] = useState(() => saved.checked || {});
      const [custom, setCustom] = useState(() => saved.custom || []);
      const [draft, setDraft] = useState('');

      useEffect(() => {
        try { localStorage.setItem(KEY, JSON.stringify({ opts, checked, custom })); } catch (e) {}
      }, [opts, checked, custom]);

      const cats = useMemo(() => buildList(opts), [opts]);
      const set = k => v => setOpts(o => ({ ...o, [k]: v }));
      const toggle = id => setChecked(c => {
        const n = { ...c };
        if (n[id]) delete n[id]; else n[id] = true;
        return n;
      });

      const ids = cats.flatMap(c => c.items.map(i => i.id)).concat(custom.map(c => c.id));
      const done = ids.filter(id => checked[id]).length;

      function addCustom(e) {
        e.preventDefault();
        const text = draft.trim();
        if (!text) return;
        setCustom(c => c.concat([{ id: 'c' + Date.now().toString(36), text }]));
        setDraft('');
      }
      function removeCustom(id) {
        setCustom(c => c.filter(x => x.id !== id));
        setChecked(c => { const n = { ...c }; delete n[id]; return n; });
      }

      return html`
        <div className="container">
          <h1 style=${{ fontSize: '1.5rem', color: 'var(--tool-text)', marginBottom: 8 }}>Packliste</h1>
          <p className="pk-lead no-print">
            Eine Packliste für den Urlaub, die sich nach Dauer, Anreise, Unterkunft, Wetter und
            Mitreisenden richtet. Häkchen und eigene Einträge bleiben in diesem Browser gespeichert.
          </p>

          <div className="ctl-card no-print">
            <div className="ctl-sec">
              <div className="pk-fields">
                <div>
                  <p className="pk-lbl">Nächte</p>
                  <input className="pk-num" type="number" min="1" max="60" value=${nightsText}
                    onChange=${e => {
                      setNightsText(e.target.value);
                      const n = parseInt(e.target.value, 10);
                      if (n >= 1) set('nights')(Math.min(n, 60));
                    }}
                    onBlur=${() => setNightsText(String(opts.nights))} />
                </div>
                ${SEGS.map(s => html`<${Seg} key=${s.key} seg=${s} value=${opts[s.key]} set=${set(s.key)} />`)}
              </div>
            </div>
            <div className="ctl-sec">
              <p className="ctl-sec-h">Vorhaben</p>
              <div className="pk-acts">
                ${ACTS.map(([k, l]) => html`
                  <label key=${k}>
                    <input type="checkbox" role="switch" checked=${opts[k]} onChange=${e => set(k)(e.target.checked)} />
                    ${l}
                  </label>`)}
              </div>
            </div>
          </div>

          <div className="pk-bar">
            <div className="pk-prog">
              ${done} von ${ids.length} erledigt
              <progress value=${done} max=${ids.length || 1}></progress>
            </div>
            <button type="button" className="tool-btn tool-btn-sm no-print" disabled=${!done}
              onClick=${() => setChecked({})}>${ToolIcons.el('reset')} Häkchen zurücksetzen</button>
            <button type="button" className="tool-btn tool-btn-sm no-print" onClick=${() => window.print()}>Drucken</button>
          </div>

          <div className="pk-grid">
            ${cats.map(c => html`
              <section key=${c.id} className="pk-cat">
                <h2>${c.name}<small>${c.items.filter(i => checked[i.id]).length}/${c.items.length}</small></h2>
                ${c.items.map(it => html`<${Item} key=${it.id} it=${it} done=${!!checked[it.id]} toggle=${toggle} />`)}
              </section>`)}

            <section className="pk-cat">
              <h2>Eigene Sachen<small>${custom.filter(i => checked[i.id]).length}/${custom.length}</small></h2>
              ${custom.map(it => html`
                <${Item} key=${it.id} it=${it} done=${!!checked[it.id]} toggle=${toggle} onRemove=${removeCustom} />`)}
              <form className="pk-add no-print" onSubmit=${addCustom}>
                <input type="text" placeholder="z.B. Fahrradschloss" value=${draft} onInput=${e => setDraft(e.target.value)}
                  aria-label="Eigenen Eintrag hinzufügen" />
                <button type="submit" className="tool-btn tool-btn-sm" disabled=${!draft.trim()}>${ToolIcons.el('plus')} Dazu</button>
              </form>
            </section>
          </div>

          <p className="pk-foot no-print">
            Mengen bei der Kleidung sind je Person und hören nach sieben Tagen auf zu wachsen: danach
            wird gewaschen. Alles bleibt lokal in diesem Browser, nichts wird hochgeladen.
          </p>
        </div>
      `;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
  </script>

  <footer class="container">
    <small>&copy; 2026 Franziska and Alexander Alber &middot; feedback@alber.me &middot; <a href="/datenschutz.html">Datenschutz</a> &middot; <a href="https://creativecommons.org/licenses/by-nc/4.0/">CC BY-NC 4.0</a></small>
  </footer>
</body>
</html>
