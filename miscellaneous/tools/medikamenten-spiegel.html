        day: "Tag",
        noIntakes: "Noch keine Einnahme. Füge oben eine hinzu.",
        about: "Die meisten Medikamente wirken, solange ihr Blutspiegel in einem bestimmten Bereich liegt. Bei kurzer Halbwertszeit muss man über den Tag verteilt nachdosieren, um den Spiegel halbwegs konstant zu halten – oder die Einnahme so legen, dass er nachts absinkt. Wirken die Dosen länger als der Abstand zwischen ihnen, überlagern sie sich und der Spiegel schaukelt sich über mehrere Tage bis zu einem Fließgleichgewicht (Steady State) auf. Dieses Werkzeug macht genau das sichtbar: Verschiebe die Einnahmezeitpunkte, kombiniere unretardierte und retardierte Formen und beobachte, wie sich Spitzen und Täler verändern.",
        model: "Modell",
        modelBody: "Der Blutspiegel entsteht als Faltung einer Resorptions-Rate mit einem Ein-Kompartiment-Abbau (Halbwertszeit kₑ = ln2/t½, exponentieller Schwanz). Der Anstieg davor kommt aus der Resorptions-Funktion, die je nach Präparat unterschiedlich ist: Resorption erster Ordnung (Bateman-Kurve, unretardiert) oder eine glatte Weibull-Freisetzung für Retard- und osmotische Systeme (Concerta, Metoprolol-Succinat, Valproat-ER usw.). Die Weibull-Form (Freisetzungsanteil Fₐ(t)=1−e^(−(t/td)^ss)) startet für ss>1 mit Steigung null – dadurch bleiben die Kurven knickfrei, anders als bei einem harten Verzögerungs-Lag oder einer Rechteck-Freisetzung. Alle Ansätze sind linear, daher addieren sich mehrere Einnahmen (Superposition) und Akkumulation/Steady State entstehen von selbst. V = Verteilungsvolumen (Gewicht × Literatur-V/kg), F = Bioverfügbarkeit. Dargestellt ist die Plasmakonzentration; die tatsächliche Wirkung folgt ihr nur verzögert und nicht linear. Bewusst weggelassen: Zwei-Kompartiment-Verteilung und sättigbare (nichtlineare) Kinetik.",

        loadError: "Wirkstoffdaten konnten nicht geladen werden.",
      },
      en: {

        weightLabel: "Body weight:",
        windowLabel: "Display window:",
        repeatLabel: "Repeat daily (steady state):",
        on: "on", off: "off",
        intakesTitle: "Intakes (daily schedule)",
        addIntake: "＋ Intake",
        dose: "Dose",
        time: "Time",
        remove: "remove",
        chartTitle: "Blood concentration",
        chartHint: "Tip: drag the intake markers below the curve with the mouse.",
        showContribs: "show individual contributions",
        axConc: "Concentration [mg/L]",
        axTime: "Time of day",
        total: "Total",
        night: "Night",
        cmax: "Peak (Cmax)",
        cmin: "Trough (Cmin)",
        cavg: "Mean (Cavg)",
        lastDay: "over the last day",
        day: "Day",
        noIntakes: "No intake yet. Add one above.",
        about: "Most drugs work while their blood level stays within a certain range. With a short half-life you have to re-dose across the day to keep the level roughly constant — or time the doses so it falls at night. When each dose lasts longer than the gap between doses, they overlap and the level builds up over several days to an equilibrium (steady state). This tool makes exactly that visible: drag the intake times, combine immediate- and extended-release forms, and watch how peaks and troughs change.",
        model: "Model",
        modelBody: "The blood level is the convolution of an absorption rate with one-compartment elimination (half-life kₑ = ln2/t½, exponential tail). The rise before that comes from the absorption function, which differs by formulation: first-order absorption (the Bateman curve, immediate-release) or a smooth Weibull release for extended-release and osmotic systems (Concerta, metoprolol succinate, valproate ER, etc.). The Weibull form (released fraction Fₐ(t)=1−e^(−(t/td)^ss)) starts with zero slope for ss>1, which keeps the curves kink-free — unlike a hard delay lag or a rectangular release. All approaches are linear, so multiple intakes add up (superposition) and accumulation/steady state emerge on their own. V = volume of distribution (weight × literature V/kg), F = bioavailability. Plasma concentration is shown; the actual effect follows it only with a delay and non-linearly. Deliberately omitted: two-compartment distribution and saturable (non-linear) kinetics.",
        source: "Parameters (V/kg, half-life, kₐ, bioavailability) are simplified order-of-magnitude values from standard literature, not patient-specific. Saturable kinetics, active metabolites, multi-compartment distribution and inter-individual variation are deliberately omitted.",
        disclaimer: "Simplified teaching model. Not medical advice and not a dosing recommendation. For questions about your own medication ask a physician or pharmacist. Personal hobby project, non-commercial, no warranty. Not affiliated with the named manufacturers; brand names are used only to identify the respective release profiles.",
        loading: "Loading substance data…",
        loadError: "Could not load substance data.",
      },
    };

    /* ── Colours (site palette) ──────────────────────────────────────────── */
    const COL_TOTAL = '#0fb5ad';   // teal – total curve
    const COL_CONTRIB = '#d9a441'; // gold – individual dose contributions
    const COL_GRID  = '#334155';
    const COL_AXIS  = '#64748b';
    const COL_PIN   = '#0fb5ad';
    const COL_PIN_GHOST = '#475569';
    const COL_NIGHT = '#1e293b';
    const LN2 = Math.log(2);

    /* ── Pharmacokinetics ────────────────────────────────────────────────── */
    /* One-compartment oral disposition (elimination kₑ, mono-exponential tail).
       The *shape* before the tail comes from the absorption/input function, which
       is chosen per phase (`kind`); a form sums fraction-weighted phases, so
       biphasic/retard profiles are just several phases added. Input kinds:
         • firstorder — rate ∝ kₐ·e^(−kₐt); Bateman rise/decay (default).
         • zeroorder  — constant release over a duration; the flat ER plateau.
         • weibull    — release Fₐ(t)=1−e^(−(t/td)^ss); ss>1 gives an ascending,
                        sigmoidal input (e.g. Concerta OROS). No closed form with
                        the kₑ kernel, so its single-dose response is convolved
                        numerically once per form onto a grid and interpolated.
       All kinds are linear, so multi-dose superposition (and steady state) still
       hold. Two-compartment disposition and saturable (non-linear) kinetics are
       deliberately out of scope here. unitConc returns concentration for D=1 mg,
       V=1 L; callers scale by (dose/V) to get mg/L. */
    const WDT = 0.01, WMAX = 30, WN = Math.round(WMAX / WDT);   // weibull grid: 0…30 h

    /* Single-dose Weibull input convolved with e^(−kₑt): S(t)=∫₀ᵗ Fₐ′(τ)e^(−kₑ(t−τ))dτ.
       Trapezoidal integration of dS/dt = Fₐ′(t) − kₑ·S on a fixed grid. */
    function weibullGrid(td, ss, ke) {
      const S = new Float64Array(WN + 1), e = Math.exp(-ke * WDT);
      const rate = t => t <= 0 ? 0 : (ss / td) * Math.pow(t / td, ss - 1) * Math.exp(-Math.pow(t / td, ss));
      let s = 0, prev = 0;
      for (let k = 1; k <= WN; k++) { const r = rate(k * WDT); s = s * e + 0.5 * WDT * (prev * e + r); prev = r; S[k] = s; }
      return S;
    }
    function weibullEval(S, ke, tau) {
      if (tau <= 0) return 0;
      const x = tau / WDT, i = Math.floor(x);
      if (i >= WN) return S[WN] * Math.exp(-ke * (tau - WN * WDT));   // release done → mono-exponential
      const f = x - i;
      return S[i] * (1 - f) + S[i + 1] * f;
    }

    /* Precompute per-form kinetics (weibull grids built once here, not per sample). */
    function formPK(form) {
      const ke = LN2 / form.half_life_h;
      const phases = form.phases.map(ph => {
        const kind = ph.kind || 'firstorder', lag = ph.lag_h || 0, frac = ph.frac;
        if (kind === 'zeroorder') return { kind, frac, lag, dur: ph.dur_h };
        if (kind === 'weibull')   return { kind, frac, lag, grid: weibullGrid(ph.td_h, ph.ss, ke) };
        return { kind: 'firstorder', frac, lag, ka: ph.ka_per_h };
      });
      return { ke, hl: form.half_life_h, F: form.f, phases };
    }

    /* Single-dose concentration for D=1 mg, V=1 L at elapsed time tau (h). */
    function unitConc(pk, tau) {
      if (tau < 0) return 0;
      const ke = pk.ke;
      let v = 0;
      for (let i = 0; i < pk.phases.length; i++) {
        const ph = pk.phases[i], t = tau - ph.lag;
        if (t < 0) continue;
        let shape;
        if (ph.kind === 'zeroorder') {
          if (t <= ph.dur) shape = (1 / (ke * ph.dur)) * (1 - Math.exp(-ke * t));
          else { const pk0 = (1 / (ke * ph.dur)) * (1 - Math.exp(-ke * ph.dur)); shape = pk0 * Math.exp(-ke * (t - ph.dur)); }
        } else if (ph.kind === 'weibull') {
          shape = weibullEval(ph.grid, ke, t);
        } else {                                   // firstorder
          const ka = ph.ka, dk = ka - ke;
          shape = Math.abs(dk) < 1e-4 ? ke * t * Math.exp(-ke * t) : (ka / dk) * (Math.exp(-ke * t) - Math.exp(-ka * t));
        }
        v += ph.frac * shape;
      }
      return pk.F * v;
    }

    /* Total concentration (mg/L) at absolute time T (h). Intakes are a daily
       schedule (hour ∈ [0,24)); with `repeat`, each recurs every 24 h so past
       days accumulate. pkOf maps a formId to its precomputed formPK. */
    function concAt(T, intakes, pkOf, V, repeat) {
      let total = 0;
      for (let i = 0; i < intakes.length; i++) {
        const it = intakes[i], pk = pkOf(it.formId);
        if (!pk) continue;
        let contrib = 0;
        if (repeat) {
          let k = Math.floor((T - it.hour) / 24);
          for (; k >= -60; k--) {
            const occ = it.hour + 24 * k;
            if (occ > T) continue;
            const tau = T - occ;
            if (tau > 25 * pk.hl) break;            // older doses are negligible
            contrib += unitConc(pk, tau);
          }
        } else if (it.hour <= T) {
          contrib += unitConc(pk, T - it.hour);
        }
        total += (it.mg / V) * contrib;
      }
      return total;
    }

    /* ── Small helpers ───────────────────────────────────────────────────── */
    const pad2 = n => (n < 10 ? '0' : '') + n;
    function clockLabel(h) {
      let m = Math.round(h * 60);
      m = ((m % 1440) + 1440) % 1440;
      return pad2(Math.floor(m / 60)) + ':' + pad2(m % 60);
    }
    const fmt = (x, d) => Number(x).toFixed(d);
    function niceConc(x) {
      const a = Math.abs(x);
      if (a === 0) return '0';
      if (a >= 10) return x.toFixed(1);
      if (a >= 1) return x.toFixed(2);
      if (a >= 0.1) return x.toFixed(3);
      if (a >= 0.01) return x.toFixed(4);
      return x.toFixed(5);
    }

    /* Round a number to a 1/2/5·10ⁿ "nice" value (for stable, round axis ticks). */
    function niceNum(x, round) {
      const exp = Math.floor(Math.log10(x)), f = x / Math.pow(10, exp);
      const nf = round ? (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10)
                       : (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10);
      return nf * Math.pow(10, exp);
    }
    /* Round tick *spacing*, but a FREE (continuous) top limit — so the scale
       tracks the peak smoothly while dragging and only the gridlines sit on
       round numbers. The step re-buckets rarely (1/2/5 boundary), not per pixel. */
    function niceAxis(dataMax, nTicks) {
      if (!(dataMax > 0)) return { max: 1, step: 1, ticks: [0, 1] };
      const max = dataMax * 1.08;                    // free top, no snapping
      const step = niceNum(dataMax / nTicks, true);  // round gridline spacing
      const ticks = [];
      for (let v = 0; v <= max + step * 1e-6; v += step) ticks.push(v);
      return { max, step, ticks };
    }
    function axisFmt(v, step) {
      const dec = Math.max(0, -Math.floor(Math.log10(step) + 1e-9));
      return v.toFixed(Math.min(dec, 6));
    }
    let UID = 1;

    /* ── Substance combobox with search ──────────────────────────────────── */
    function Combo({ substances, value, onChange, t }) {
      const [open, setOpen] = useState(false);
      const [q, setQ] = useState('');
      const boxRef = useRef(null);
      const sel = substances.find(s => s.id === value);
      const nameOf = s => (LANG === 'en' ? s.name_en : s.name_de);
      const list = substances
        .filter(s => nameOf(s).toLowerCase().includes(q.toLowerCase()))
        .sort((a, b) => nameOf(a).localeCompare(nameOf(b), LANG));

      useEffect(() => {
        const onDoc = e => { if (boxRef.current && !boxRef.current.contains(e.target)) setOpen(false); };
        document.addEventListener('mousedown', onDoc);
        return () => document.removeEventListener('mousedown', onDoc);
      }, []);

      return (
        <div ref={boxRef} style={{ position: 'relative', maxWidth: 340 }}>
          <input
            type="text"
            value={open ? q : (sel ? nameOf(sel) : '')}
            placeholder={t.searchPlaceholder}
            onFocus={() => { setOpen(true); setQ(''); }}
            onChange={e => { setQ(e.target.value); setOpen(true); }}
            style={{ marginBottom: 0 }}
          />
          {open && (
            <div className="combo-list">
              {list.map(s => (
                <div key={s.id} className={'combo-item' + (s.id === value ? ' hi' : '')}
                     onMouseDown={() => { onChange(s.id); setOpen(false); }}>
                  {nameOf(s)}
                </div>
              ))}
              {list.length === 0 && <div className="combo-item" style={{ color: '#64748b' }}>—</div>}
            </div>
          )}
        </div>
      );
    }

    /* Form picker: segmented buttons for ≤3 forms, a dropdown beyond that
       (e.g. Methylphenidat with five formulations would overflow as buttons). */
    function FormPicker({ forms, value, onChange, formLabel, small }) {
      if (forms.length <= 3) {
        return (
          <div className="seg-row" role="group" style={{ display: 'inline-flex' }}>
            {forms.map(f => (
              <button key={f.id} className={'lang-seg' + (f.id === value ? ' active' : '')}
                      style={small ? { fontSize: 12, padding: '3px 8px' } : null}
                      onClick={() => onChange(f.id)}>{formLabel(f)}</button>
            ))}
          </div>
        );
      }
      return (
        <select value={value} onChange={e => onChange(e.target.value)}
                style={{ width: 'auto', marginBottom: 0, padding: small ? '4px 8px' : '6px 10px' }}>
          {forms.map(f => <option key={f.id} value={f.id}>{formLabel(f)}</option>)}
        </select>
      );
    }

    /* ── Concentration chart with draggable intake pins ──────────────────── */
    function ConcChart({ intakes, pkOf, V, repeat, windowH, onDragHour, t }) {
      const W = 760, H = 336, L = 52, R = 16, TP = 14, B = 70;
      const svgRef = useRef(null);
      const [drag, setDrag] = useState(null);

      const N = 480;
      const { series, dataMax } = useMemo(() => {
        const tot = [];
        let dmax = 1e-9;
        for (let i = 0; i <= N; i++) {
          const T = windowH * i / N;
          const c = concAt(T, intakes, pkOf, V, repeat);
          tot.push([T, c]);
          if (c > dmax) dmax = c;
        }
        return { series: tot, dataMax: dmax };
      }, [intakes, pkOf, V, repeat, windowH]);

      const axis = niceAxis(dataMax, 4);
      const yMax = axis.max;

      const sx = x => L + (x / windowH) * (W - L - R);
      const sy = y => TP + (1 - y / yMax) * (H - TP - B);
      const path = pts => pts.map((p, i) => (i ? 'L' : 'M') + fmt(sx(p[0]), 1) + ' ' + fmt(sy(p[1]), 1)).join(' ');

      // x ticks every 6 h, day dividers every 24 h
      const xTicks = [];
      for (let h = 0; h <= windowH; h += 6) xTicks.push(h);
      const dayDivs = [];
      for (let d = 24; d < windowH; d += 24) dayDivs.push(d);
      // night shading 22:00–06:00 for each day in view
      const nights = [];
      for (let d = 0; d <= windowH; d += 24) {
        nights.push([Math.max(0, d - 2), Math.min(windowH, d + 6)]); // 22:00(prev) – 06:00
      }
      const yTicks = axis.ticks;

      const pinY = H - B + 20;

      function hourFromClientX(clientX) {
        const rect = svgRef.current.getBoundingClientRect();
        const px = (clientX - rect.left) / rect.width * W;
        let h = (px - L) / (W - L - R) * windowH;
        return h;
      }
      function onMove(e) {
        if (drag == null) return;
        let h = hourFromClientX(e.clientX);
        const lo = 0, hi = repeat ? 24 : windowH;
        h = Math.max(lo, Math.min(hi, h));
        h = Math.round(h * 4) / 4;   // snap to 15-min grid
        if (repeat && h >= 24) h = 23.75;
        onDragHour(drag, h);
      }

      return (
        <div>
          <svg ref={svgRef} className="conc-svg" viewBox={`0 0 ${W} ${H}`}
               style={{ width: '100%', height: 'auto', fontFamily: 'inherit', display: 'block' }}
               onPointerMove={onMove}
               onPointerUp={() => setDrag(null)} onPointerLeave={() => setDrag(null)}>
            {/* night shading */}
            {nights.map((n, i) => (
              <rect key={'n' + i} x={sx(n[0])} y={TP} width={Math.max(0, sx(n[1]) - sx(n[0]))}
                    height={H - TP - B} fill={COL_NIGHT} opacity={0.5} />
            ))}
            {/* y grid + labels */}
            {yTicks.map((y, i) => (
              <g key={'y' + i}>
                <line x1={L} y1={sy(y)} x2={W - R} y2={sy(y)} stroke={COL_GRID} strokeWidth={1} />
                <text x={L - 6} y={sy(y)} textAnchor="end" dominantBaseline="middle" fontSize={11} fill={COL_AXIS}>{axisFmt(y, axis.step)}</text>
              </g>
            ))}
            {/* x ticks */}
            {xTicks.map((x, i) => (
              <g key={'x' + i}>
                <line x1={sx(x)} y1={TP} x2={sx(x)} y2={H - B} stroke={COL_GRID} strokeWidth={1} opacity={0.4} />
                <text x={sx(x)} y={H - B + 50} textAnchor="middle" fontSize={10} fill={COL_AXIS}>{clockLabel(x)}</text>
              </g>
            ))}
            {/* day dividers + labels */}
            {dayDivs.map((x, i) => (
              <g key={'d' + i}>
                <line x1={sx(x)} y1={TP} x2={sx(x)} y2={H - B} stroke={COL_AXIS} strokeWidth={1} strokeDasharray="2 3" opacity={0.7} />
                <text x={sx(x) + 4} y={TP + 11} fontSize={10} fill={COL_AXIS}>{t.day} {x / 24 + 1}</text>
              </g>
            ))}
            {/* total curve */}
            <path d={path(series)} fill="none" stroke={COL_TOTAL} strokeWidth={2.4} strokeLinejoin="round" />
            {/* pin rail baseline */}
            <line x1={L} y1={pinY} x2={W - R} y2={pinY} stroke={COL_GRID} strokeWidth={1} />
            {/* ghost pins for repeated days */}
            {repeat && intakes.map(it => {
              const g = [];
              for (let dd = it.hour + 24; dd < windowH; dd += 24) g.push(dd);
              return g.map((gx, j) => (
                <circle key={'g' + it.id + j} cx={sx(gx)} cy={pinY} r={4} fill={COL_PIN_GHOST} opacity={0.6} />
              ));
            })}
            {/* draggable day-0 pins */}
            {intakes.map(it => (
              <g key={'p' + it.id} className="pin" onPointerDown={e => { e.currentTarget.setPointerCapture?.(e.pointerId); setDrag(it.id); }}>
                <line x1={sx(it.hour)} y1={TP} x2={sx(it.hour)} y2={pinY} stroke={COL_PIN} strokeWidth={1} strokeDasharray="2 3" opacity={0.5} />
                {/* enlarged transparent hit area for easier grabbing */}
                <circle cx={sx(it.hour)} cy={pinY} r={18} fill="transparent" />
                <circle cx={sx(it.hour)} cy={pinY} r={12} fill={drag === it.id ? '#22d3ee' : COL_PIN} stroke="#0f172a" strokeWidth={2} />
                <text x={sx(it.hour)} y={pinY + 4} textAnchor="middle" fontSize={11} fill="#0f172a" fontWeight="700" style={{ pointerEvents: 'none' }}>{it.mg}</text>
                <text x={sx(it.hour)} y={pinY - 17} textAnchor="middle" fontSize={10} fill={COL_AXIS} style={{ pointerEvents: 'none' }}>{clockLabel(it.hour)}</text>
              </g>
            ))}
            {/* axis titles */}
            <text x={(L + W - R) / 2} y={H - 2} textAnchor="middle" fontSize={11} fill={COL_AXIS}>{t.axTime}</text>
            <text transform={`translate(13,${(TP + H - B) / 2}) rotate(-90)`} textAnchor="middle" fontSize={11} fill={COL_AXIS}>{t.axConc}</text>
          </svg>
        </div>
      );
    }

    /* ── App ─────────────────────────────────────────────────────────────── */
    function App() {
      const t = STRINGS[LANG] || STRINGS.de;
      const [data, setData] = useState(null);
      const [err, setErr] = useState(false);
      const [subId, setSubId] = useState(null);
      const [weight, setWeight] = useState(70);
      const windowH = 24;                 // single-day view
      const [repeat, setRepeat] = useState(true);
      const [intakes, setIntakes] = useState([]);

      useEffect(() => {
        fetch('/assets/files/medications.json')
          .then(r => r.json())
          .then(d => {
            setData(d);
            // preselect from ?med=<id> (for shareable links), else the first substance
            const medParam = new URLSearchParams(location.search).get('med');
            const first = (medParam && d.substances.find(s => s.id === medParam)) || d.substances[0];
            setSubId(first.id);
            setIntakes([
              { id: UID++, hour: 8, mg: first.default_dose_mg, formId: first.forms[0].id },
              { id: UID++, hour: 14, mg: first.default_dose_mg, formId: first.forms[0].id },
            ]);
          })
          .catch(() => setErr(true));
      }, []);

      const sub = data && data.substances.find(s => s.id === subId);
      const nameOf = s => (LANG === 'en' ? s.name_en : s.name_de);
      const formLabel = f => (LANG === 'en' ? f.label_en : f.label_de);
      // Precompute each form's kinetics once (builds any Weibull grids); map by formId.
      const pkOf = useMemo(() => {
        if (!sub) return () => null;
        const m = {};
        sub.forms.forEach(f => { m[f.id] = formPK(f); });
        return fid => m[fid] || m[sub.forms[0].id];
      }, [sub]);
      const V = sub ? sub.vd_l_per_kg * weight : 1;

      function selectSubstance(id) {
        const s = data.substances.find(x => x.id === id);
        setSubId(id);
        // reflect the selection in the URL (keeps ?lang=) so the link is shareable
        const params = new URLSearchParams(location.search);
        params.set('med', id);
        history.replaceState(null, '', location.pathname + '?' + params.toString());
        // reset intakes to a sensible default schedule for the new substance
        setIntakes([
          { id: UID++, hour: 8, mg: s.default_dose_mg, formId: s.forms[0].id },
          { id: UID++, hour: 14, mg: s.default_dose_mg, formId: s.forms[0].id },
        ]);
      }
      function addIntake() {
        if (!sub) return;
        // place the new one a few hours after the latest existing intake
        const last = intakes.length ? Math.max(...intakes.map(i => i.hour)) : 8;
        const hour = Math.min(23.5, Math.round((last + 4) * 4) / 4) % 24;
        setIntakes(iv => [...iv, { id: UID++, hour, mg: sub.default_dose_mg, formId: sub.forms[0].id }]);
      }
      const setIntake = (id, patch) => setIntakes(iv => iv.map(i => i.id === id ? { ...i, ...patch } : i));
      const removeIntake = id => setIntakes(iv => iv.filter(i => i.id !== id));
      const onDragHour = (id, hour) => setIntakes(iv => iv.map(i => i.id === id ? { ...i, hour } : i));

      // metrics over the last full day of the window
      const metrics = useMemo(() => {
        if (!sub || !intakes.length) return null;
        const t0 = Math.max(0, windowH - 24), t1 = windowH;
        let mn = Infinity, mx = -Infinity, sum = 0, n = 0;
        for (let i = 0; i <= 240; i++) {
          const T = t0 + (t1 - t0) * i / 240;
          const c = concAt(T, intakes, pkOf, V, repeat);
          if (c < mn) mn = c; if (c > mx) mx = c; sum += c; n++;
        }
        return { cmin: mn, cmax: mx, cavg: sum / n };
      }, [sub, intakes, pkOf, V, repeat, windowH]);

      if (err) return <div className="container"><p style={{ color: '#e05260' }}>{t.loadError}</p></div>;
      if (!data || !sub) return <div className="container"><p style={{ color: '#94a3b8' }}>{t.loading}</p></div>;

      const multiForm = sub.forms.length > 1;
      const note = LANG === 'en' ? sub.note_en : sub.note_de;

      const ctrlLabel = { fontSize: 13, color: '#94a3b8', display: 'block', marginBottom: 4 };
      const card = { border: '1px solid #1e293b', borderRadius: 8, padding: '12px 14px', marginBottom: 14 };

      return (
        <div className="container" style={{ color: '#cbd5e1', maxWidth: 900 }}>
          <hgroup style={{ marginBottom: 18 }}>
            <h1 style={{ marginBottom: 4 }}>{t.title}</h1>
            <p style={{ color: '#94a3b8', fontSize: 15 }}>{t.subtitle}</p>
          </hgroup>

          {/* substance + form + globals */}
          <div style={card}>
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: 20, alignItems: 'flex-start' }}>
              <div style={{ minWidth: 260 }}>
                <label style={ctrlLabel}>{t.substanceLabel}</label>
                <Combo substances={data.substances} value={subId} onChange={selectSubstance} t={t} />
              </div>
            </div>
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: 20, marginTop: 14, alignItems: 'flex-end' }}>
              <div>
                <label style={ctrlLabel}>{t.weightLabel}</label>
                <span style={{ display: 'inline-flex', alignItems: 'center', gap: 8 }}>
                  <input type="range" min={40} max={120} step={1} value={weight}
                         onChange={e => setWeight(+e.target.value)} style={{ width: 130, marginBottom: 0 }} />
                  <span style={{ fontVariantNumeric: 'tabular-nums', minWidth: 52 }}>{weight} kg</span>
                </span>
              </div>
              <div>
                <label style={ctrlLabel}>{t.repeatLabel}</label>
                <div className="seg-row" role="group" style={{ display: 'inline-flex' }}>
                  <button className={'lang-seg' + (repeat ? ' active' : '')} onClick={() => setRepeat(true)}>{t.on}</button>
                  <button className={'lang-seg' + (!repeat ? ' active' : '')} onClick={() => setRepeat(false)}>{t.off}</button>
                </div>
              </div>
            </div>
            <p style={{ fontSize: 11, color: '#64748b', marginTop: 12, marginBottom: 0, lineHeight: 1.6 }}>{note}</p>
          </div>

          {/* chart */}
          <div style={card}>
            <strong style={{ fontSize: 15 }}>{t.chartTitle}</strong>
            <ConcChart intakes={intakes} pkOf={pkOf} V={V} repeat={repeat} windowH={windowH}
                       onDragHour={onDragHour} t={t} />
            <p style={{ fontSize: 11, color: '#64748b', margin: '2px 0 10px' }}>{t.chartHint}</p>
            {metrics && (
              <div style={{ display: 'flex', gap: 22, flexWrap: 'wrap', fontSize: 13 }}>
                <Metric label={t.cmax} value={niceConc(metrics.cmax)} unit="mg/L" />
                <Metric label={t.cmin} value={niceConc(metrics.cmin)} unit="mg/L" />
                <Metric label={t.cavg} value={niceConc(metrics.cavg)} unit="mg/L" />
                <span style={{ color: '#475569', fontSize: 11, alignSelf: 'center' }}>{t.lastDay}</span>
              </div>
            )}
          </div>

          {/* intakes */}
          <div style={card}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 10 }}>
              <strong style={{ fontSize: 15 }}>{t.intakesTitle}</strong>
              <button onClick={addIntake} className="lang-seg" style={{ borderRadius: 6 }}>{t.addIntake}</button>
            </div>
            {intakes.length === 0 && <p style={{ color: '#64748b', fontSize: 13 }}>{t.noIntakes}</p>}
            {intakes.slice().sort((a, b) => a.hour - b.hour).map(it => (
              <div key={it.id} style={{ position: 'relative', display: 'flex', flexWrap: 'wrap', gap: 12, alignItems: 'center', padding: '7px 34px 7px 0', borderTop: '1px solid #1e293b' }}>
                <span style={{ fontVariantNumeric: 'tabular-nums', minWidth: 96, display: 'inline-flex', alignItems: 'center', gap: 6 }}>
                  <span style={{ width: 10, height: 10, borderRadius: '50%', background: COL_PIN, display: 'inline-block' }} />
                  <strong>{clockLabel(it.hour)}</strong>
                </span>
                <span style={{ display: 'inline-flex', alignItems: 'center', gap: 6 }}>
                  <span style={{ fontSize: 12, color: '#64748b' }}>{t.time}</span>
                  <input type="range" min={0} max={repeat ? 24 : windowH} step={0.25} value={it.hour}
                         onChange={e => setIntake(it.id, { hour: Math.min(repeat ? 23.75 : windowH, +e.target.value) })}
                         style={{ width: 150, marginBottom: 0 }} />
                </span>
                <span style={{ display: 'inline-flex', alignItems: 'center', gap: 6 }}>
                  <span style={{ fontSize: 12, color: '#64748b' }}>{t.dose}</span>
                  <select value={it.mg} onChange={e => setIntake(it.id, { mg: +e.target.value })} style={{ width: 'auto', marginBottom: 0, padding: '4px 8px' }}>
                    {sub.doses_mg.map(d => {
                      const labels = LANG === 'en' ? sub.dose_labels_en : sub.dose_labels_de;
                      const lbl = labels && labels[d] ? ' – ' + labels[d] : '';
                      return <option key={d} value={d}>{d} mg{lbl}</option>;
                    })}
                  </select>
                </span>
                {multiForm && (
                  <FormPicker forms={sub.forms} value={it.formId} small
                              onChange={fid => setIntake(it.id, { formId: fid })} formLabel={formLabel} />
                )}
                <button onClick={() => removeIntake(it.id)} title={t.remove}
                        style={{ position: 'absolute', top: 4, right: 0, background: 'none', border: 'none', color: '#e05260', cursor: 'pointer', fontSize: 26, lineHeight: 1, padding: '2px 6px' }}>×</button>
              </div>
            ))}
          </div>

          {/* about + model + footer */}
          <p style={{ marginTop: 22, fontSize: 13, color: '#94a3b8', lineHeight: 1.7, maxWidth: 720 }}>{t.about}</p>
          <details style={{ marginTop: 12, maxWidth: 720 }}>
            <summary style={{ fontSize: 13, color: '#94a3b8', cursor: 'pointer' }}>{t.model}</summary>
            <p style={{ fontSize: 12.5, color: '#94a3b8', lineHeight: 1.7, marginTop: 8 }}>{t.modelBody}</p>
          </details>
          <p style={{ marginTop: 16, fontSize: 11, color: '#64748b', lineHeight: 1.7 }}>{t.source}</p>
          <p style={{ marginTop: 8, fontSize: 10, color: '#475569', lineHeight: 1.6 }}>{t.disclaimer}</p>
        </div>
      );
    }

    function Metric({ label, value, unit }) {
      return (
        <span>
          <span style={{ color: '#64748b', fontSize: 12 }}>{label}: </span>
          <strong style={{ color: '#cbd5e1', fontVariantNumeric: 'tabular-nums' }}>{value}</strong>
          <span style={{ color: '#64748b', fontSize: 11 }}> {unit}</span>
        </span>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>

  <footer class="container">
    <small>© 2026 Franziska and Alexander Alber · <a href="/">alber.me</a> · Feedback welcome: feedback@alber.me · <a href="https://creativecommons.org/licenses/by-nc/4.0/">CC BY-NC 4.0</a></small>
  </footer>
</body>
