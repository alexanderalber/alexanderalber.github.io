  <style>
    /* Full-screen canvas, so the Pico container, the site header and the site
       footer are deliberately absent, as in asteroid-corridor. Everything
       that would live in them goes into the floating panel. */
    html, body { height: 100%; }
    body { margin: 0; overflow: hidden; background: #05070b; }
    #root { position: fixed; inset: 0; }

    .hk-stage { position: absolute; inset: 0; touch-action: none; cursor: crosshair; }
    .hk-stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

    .hk-back { position: absolute; top: 12px; left: 12px; z-index: 3;
      font-size: 12.5px; color: var(--tool-label); text-decoration: none;
      padding: 5px 11px; border-radius: 999px; border: 1px solid rgba(51,65,85,.8);
      background: color-mix(in srgb, var(--tool-panel) 60%, transparent); backdrop-filter: blur(6px); }
    .hk-back:hover { color: var(--tool-text); border-color: var(--tool-faint); }

    /* The readouts are written straight into these nodes from the animation
       loop. Routing them through React state would re-render the panel sixty
       times a second for nothing. */
    .hk-hud { position: absolute; bottom: 12px; left: 12px; z-index: 3;
      pointer-events: none;
      padding: 9px 14px; border-radius: 10px; border: 1px solid rgba(51,65,85,.8);
      background: color-mix(in srgb, var(--tool-panel) 60%, transparent); backdrop-filter: blur(6px); }
    .hk-grid { display: grid; grid-template-columns: auto auto; gap: 3px 14px;
      font-size: 11.5px; color: var(--tool-note); font-variant-numeric: tabular-nums;
      letter-spacing: .02em; }
    .hk-grid b { color: var(--tool-text); font-weight: 600; text-align: right; }
    .hk-grid b.hot { color: #fbbf24; }
    .hk-grid b.acc { color: #2ee8ff; }

    .hk-clock { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 3;
      pointer-events: none; text-align: center;
      font-size: 22px; font-weight: 600; color: var(--tool-text); font-variant-numeric: tabular-nums;
      letter-spacing: .04em; text-shadow: 0 0 14px rgba(0,0,0,.9); }
    .hk-clock small { display: block; font-size: 11.5px; font-weight: 400; color: var(--tool-note);
      letter-spacing: .06em; margin-top: 2px; }

    .hk-splits { position: absolute; top: 74px; left: 50%; transform: translateX(-50%); z-index: 3;
      pointer-events: none; white-space: pre; font-size: 11.5px; line-height: 1.5;
      color: var(--tool-text); font-variant-numeric: tabular-nums; text-shadow: 0 0 10px rgba(0,0,0,.95); }

    .hk-msg { position: absolute; top: 38%; left: 50%; transform: translate(-50%, -50%);
      z-index: 3; pointer-events: none; text-align: center; max-width: 60ch;
      font-size: 15px; color: var(--tool-text); letter-spacing: .04em;
      text-shadow: 0 0 18px rgba(0,0,0,.95); }
    /* The start screen, the time trial and controls screens and the pause
       menu: one shared .ctl-card in a left column over the city
       (notes/tools/hikyaku/STARTSCREEN-PLAN.md). Only the surface is denser
       than the shared card's, as the panel's is, so the text reads over the
       neon. Entries are .tool-btn, full width, the one-line note under the
       label. The finish card is the same card at the right edge. */
    .hk-menu { position: absolute; left: 24px; top: 50%; transform: translateY(-50%); z-index: 4;
      width: min(360px, calc(100vw - 48px)); max-height: calc(100% - 72px); overflow-y: auto;
      overscroll-behavior: contain;
      background: color-mix(in srgb, var(--tool-panel) 86%, transparent); backdrop-filter: blur(10px); }
    .hk-menu::-webkit-scrollbar { width: 8px; }
    .hk-menu::-webkit-scrollbar-thumb { background: var(--tool-border); border-radius: 4px; }
    .hk-fin { position: absolute; right: 24px; top: 50%; transform: translateY(-50%); z-index: 4;
      width: min(300px, calc(100vw - 48px));
      background: color-mix(in srgb, var(--tool-panel) 86%, transparent); backdrop-filter: blur(10px); }
    .hk-fin.beside { right: 366px; }
    .hk-title { font-size: 26px; line-height: 1.15; margin: 0; color: var(--tool-emph); font-weight: 600; letter-spacing: .03em; }
    .hk-title.sm { font-size: 19px; }
    .hk-sub { font-size: 12.5px; color: var(--tool-note); margin: 5px 0 0; line-height: 1.45; }
    .hk-line { font-size: 12.5px; color: var(--tool-text); margin: 0; line-height: 1.45; font-variant-numeric: tabular-nums; }
    .hk-line + .hk-line, .hk-line + .hk-note { margin-top: 6px; }
    .hk-menu .hk-note, .hk-fin .hk-note { font-size: 11.5px; color: var(--tool-note); }
    .hk-menu .hk-note:first-child { margin-top: 0; }
    .hk-entries { display: flex; flex-direction: column; gap: 7px; }
    .hk-entry.tool-btn { display: flex; flex-direction: column; align-items: flex-start; gap: 1px;
      width: 100%; text-align: left; padding: 0.45rem 0.85rem; }
    .hk-entry small { font-size: 11px; color: var(--tool-note); font-weight: 400; line-height: 1.35; }
    .hk-menu .tool-btn:focus-visible, .hk-fin .tool-btn:focus-visible {
      outline: 2px solid var(--tool-label); outline-offset: 1px; }
    .hk-btns { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
    .hk-btns .tool-btn { flex: 1 1 auto; }
    .hk-btns .tool-btn-sm { flex: 0 0 auto; }
    .ctl-sec > .hk-btns:first-child { margin-top: 0; }
    .hk-menu .hk-seed { margin: 0 0 8px; }
    /* the wrap of the attract camera from the finish back to the start */
    .hk-fade { position: absolute; inset: 0; z-index: 2; pointer-events: none; background: black; opacity: 0; }
    .hk-hint { position: absolute; top: 80px; left: 50%; transform: translateX(-50%); z-index: 3;
      pointer-events: none; font-size: 12px; letter-spacing: .06em; color: var(--tool-note);
      text-shadow: 0 0 12px rgba(0,0,0,.95); }
    .hk-msg small { display: block; margin-top: 8px; font-size: 11.5px; color: var(--tool-note); letter-spacing: 0; }

    /* The cue to the next waypoint: a diamond on the target while it is on
       screen, an arrow at the screen edge while it is not. Positioned from
       the loop through style.transform, so it never touches layout. */
    .hk-cue { position: absolute; left: 0; top: 0; z-index: 2; pointer-events: none; display: none; }
    .hk-cue-box { width: 22px; height: 22px; margin: -11px 0 0 -11px; border: 2px solid #2ee8ff;
      transform: rotate(45deg); box-shadow: 0 0 10px rgba(46,232,255,.55); }
    .hk-cue-arrow { position: absolute; left: -12px; top: -12px; width: 24px; height: 24px; }
    .hk-cue-arrow i { position: absolute; left: 1px; top: 0; width: 0; height: 0;
      border-left: 11px solid transparent; border-right: 11px solid transparent;
      border-bottom: 20px solid #2ee8ff; filter: drop-shadow(0 0 5px rgba(46,232,255,.7)); }
    .hk-cue-d { position: absolute; left: 0; top: 16px; transform: translateX(-50%);
      font-size: 11.5px; color: #2ee8ff; white-space: nowrap; font-variant-numeric: tabular-nums;
      text-shadow: 0 0 6px #000, 0 0 2px #000; }

    .hk-panel { position: absolute; top: 12px; right: 12px; z-index: 4;
      width: min(330px, calc(100vw - 24px)); max-height: calc(100vh - 24px);
      overflow-y: auto; overscroll-behavior: contain;
      border: 1px solid var(--tool-border); border-radius: 10px; padding: 12px 14px 14px;
      background: color-mix(in srgb, var(--tool-panel) 88%, transparent); backdrop-filter: blur(10px);
      box-shadow: var(--tool-panel-shadow); }
    .hk-panel::-webkit-scrollbar { width: 8px; }
    .hk-panel::-webkit-scrollbar-thumb { background: var(--tool-border); border-radius: 4px; }
    .hk-toggle { position: absolute; top: 12px; right: 12px; z-index: 4;
      font-size: 12.5px; color: var(--tool-text); cursor: pointer; width: auto; margin: 0;
      padding: 6px 13px; border-radius: 999px; border: 1px solid var(--tool-border);
      background: color-mix(in srgb, var(--tool-panel) 75%, transparent); backdrop-filter: blur(8px); }
    .hk-toggle:hover { border-color: var(--tool-faint); }

    .hk-head { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
    .hk-head h2 { font-size: 14px; color: var(--tool-text); margin: 0; font-weight: 600; flex: 1; }
    .hk-x { background: none; border: none; color: var(--tool-note); cursor: pointer;
      font-size: 16px; line-height: 1; padding: 2px 4px; margin: 0; width: auto; }
    .hk-x:hover { color: var(--tool-text); }
    .hk-desc { font-size: 11.5px; color: var(--tool-note); margin: 0 0 6px; line-height: 1.45; }

    /* Accordion, the shape asteroid-corridor uses. A collapsed header keeps
       showing its current value. */
    .hk-acc { border-top: 1px solid var(--tool-hairline); }
    .hk-acc-h { display: flex; align-items: baseline; gap: 8px; width: 100%;
      margin: 0; padding: 9px 2px; background: none; border: none; cursor: pointer;
      font-size: 11px; color: var(--tool-note); letter-spacing: .06em; text-transform: uppercase;
      text-align: left; }
    .hk-acc-h:hover { color: var(--tool-text); }
    .hk-acc-h.open { color: var(--tool-label); }
    .hk-acc-s { margin-left: auto; font-size: 11px; color: var(--tool-faint);
      text-transform: none; letter-spacing: 0; font-variant-numeric: tabular-nums;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 58%; }
    .hk-acc-c { margin-left: auto; font-size: 13px; line-height: 1; color: var(--tool-faint); flex: none; }
    .hk-acc-s + .hk-acc-c { margin-left: 6px; }
    .hk-acc-b { padding: 0 2px 12px; }

    .hk-row { display: grid; grid-template-columns: 1fr auto; align-items: baseline;
      gap: 2px 8px; margin: 6px 0; }
    .hk-row label { font-size: 11.5px; color: var(--tool-label); margin: 0; }
    .hk-row output { font-size: 11.5px; color: var(--tool-text); text-align: right;
      font-variant-numeric: tabular-nums; }
    .hk-row input[type=range] { grid-column: 1 / -1; margin: 2px 0 0; }

    /* Number fields. Pico's input rule is input:not(...), which beats a plain
       class; the attribute selector here outranks it for height and padding. */
    .hk-nums { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; margin: 6px 0; }
    .hk-num { display: grid; grid-template-columns: 1fr 58px 3.2ch; align-items: center; gap: 4px;
      font-size: 11px; color: var(--tool-label); margin: 0; }
    .hk-num input[type=number] { height: 24px; padding: 1px 5px;
      font-size: 11.5px; margin: 0; font-variant-numeric: tabular-nums; }
    .hk-num i { font-style: normal; font-size: 10.5px; color: var(--tool-faint); }
    .hk-seed { display: flex; gap: 6px; align-items: center; margin: 6px 0 4px; }
    .hk-seed input[type=number] { height: 28px; padding: 2px 8px;
      width: 96px; margin: 0; font-size: 12px; font-variant-numeric: tabular-nums; }
    .hk-seed span { font-size: 11.5px; color: var(--tool-label); }
    .hk-seed button { margin: 0; width: auto; }

    /* Deliberate chip rows of separate actions, so they opt out of the shared
       adjacency rounding the way .rd-row and .qr-chips do. */
    .hk-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 6px; }
    .hk-chips button { width: auto; margin: 0; border-radius: 4px; margin-left: 0; }
    .hk-seg { margin: 4px 0 4px; }
    .hk-seg button { width: auto; margin: 0; }
    .hk-seg-l { font-size: 11.5px; color: var(--tool-label); display: block; margin: 9px 0 2px; }

    .hk-derived { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px;
      font-size: 11px; color: var(--tool-note); font-variant-numeric: tabular-nums;
      margin: 9px 0 0; padding-top: 8px; border-top: 1px solid var(--tool-hairline); }
    .hk-derived b { color: var(--tool-text); font-weight: 600; text-align: right; }

    .hk-note { font-size: 10.5px; color: var(--tool-faint); margin: 8px 0 0; line-height: 1.5; }
    .hk-note kbd { font-size: 10px; }
  </style>

<body>
  <div id="root"></div>

  <!-- The pure half: the route with its Menger block and its ventilation
       shaft, the boxes around it,
       the ring test, the race clock, the box contacts, the traffic lanes and
       the traffic clock. No DOM, no three.js, no React, so
       notes/dev/hikyaku.test.mjs pulls this block out by id and evaluates it
       on top of assets/js/sixdof.js, hikyaku-city.js, hikyaku-traffic.js,
       menger.js and shaft.js (their pure layers). Moving any of it into the app block
       breaks that seam. -->
  <script id="hkcore">
var Hikyaku = (function () {
  'use strict';

  var SD = globalThis.SixDOF;
  if (!SD) throw new Error('hkcore needs SixDOF (assets/js/sixdof.js) loaded first');
  var add = SD.add, sub = SD.sub, mul = SD.mul, dot = SD.dot, cross = SD.cross, len = SD.len;
  var DEG = Math.PI / 180;

  function norm(v) { var l = len(v); return l > 1e-12 ? mul(v, 1 / l) : [0, 0, 0]; }
  function clamp(x, lo, hi) { return x < lo ? lo : x > hi ? hi : x; }
  function angle(a, b) {
    var c = dot(a, b) / Math.max(1e-12, len(a) * len(b));
    return Math.acos(clamp(c, -1, 1));
  }
  /* Only keys the defaults know, numbers only if finite. */
  function merge(def, cfg) {
    var o = {}, k;
    for (k in def) o[k] = def[k];
    if (cfg) for (k in def) {
      var v = cfg[k];
      if (v == null) continue;
      if (typeof def[k] === 'number' && !(typeof v === 'number' && isFinite(v))) continue;
      o[k] = v;
    }
    return o;
  }
  function pointSegDist(p, a, b) {
    var ab = sub(b, a), t = dot(sub(p, a), ab) / Math.max(1e-12, dot(ab, ab));
    t = clamp(t, 0, 1);
    return len(sub(p, add(a, mul(ab, t))));
  }

  /* ---- the route ----------------------------------------------------------
     World: flat ground at y = 0, sky up +y. The route is a list of waypoints
     and a smooth curve through them. The route comes first and the world is
     built around it (handoff, section 2), so everything the later city
     generator needs is in here: the waypoints, the curve, and a clearance
     tube along the curve that no building may enter.

     Waypoint shape, shared by every kind:
       { idx, ri, kind, p, dir, right, up, shape, r, hw, hh, hold, biome }
     kind   'start' | 'ring' | 'portal' | 'via' | 'finish'. A portal is the
            mouth of a Menger block or of the shaft, a rectangular gate
            centred on c (the opening) that the race counts like a ring. A
            via point only shapes the curve (approach and leave of the block
            and the shaft, the pass points at the shaft's fans); the race
            skips it and ri, the race index, is null. v2 adds 'delivery': a waypoint where
            the pilot must hover or land. It reuses p and r (the radius of the
            hover zone) and fills hold = { ms, maxSpeed }; raceStep already
            handles it, nothing else has to change.
     shape  'circle' (rings, radius r), 'rect' (gates and portals, half
            sizes hw x hh, the portal rule of the handoff: rectangular, warm
            edge) or 'none' (via).
     dir    the facing direction, which is the curve tangent there. A ring
            counts only when crossed along dir.
     biome  'open', 'menger' on the five block points, 'shaft' on the
            shaft's points, 'canyon' on the five points of the street
            canyon (entry and exit are via points, the three rings
            between them count).

     The curve is a cubic Hermite spline per leg. The tangent at a waypoint
     is the bisector of the two legs meeting there, scaled by the chord of
     the leg. That keeps the curve tangent-continuous through every ring, and
     with the turn per leg bounded it bounds the curvature: the tightest
     possible leg (250 m chord, an S-bend at the full turn limit) comes out
     near 80 m radius, eight ring radii. The handoff warns that a curve
     tighter than the tube folds the tube; the tube here is 45 m, and the
     tests sample the radius on many seeds. */
  var DEF_ROUTE = {
    seed: 1, n: 12,
    ringR: 10,          /* handoff: ship 15 m, ring radius 10 m */
    gateW: 30, gateH: 18,
    tubeR: 45,          /* clearance radius, about 3 ship lengths */
    altMin: 30, altMax: 300,
    spMin: 250, spMax: 500,   /* horizontal distance between waypoints */
    maxTurn: 45,        /* degrees of heading change per waypoint */
    maxLeg: 58,         /* degrees between two consecutive legs in 3D */
    slope: 0.22,        /* climb per horizontal metre, at most */
    minSep: 120,        /* metres between a new leg and every older one */
    forgive: 1.5,       /* metres of grace on the ring and gate edge */
    leadIn: 160, leadOut: 120,
    step: 4,            /* tube sample spacing, metres */
    /* One street canyon (the handoff's biome "Street Canyon: schnelle
       Gerade, Rhythmuswechsel"), before the block, after canyonAt regular
       legs (2 puts its middle at 15 to 25 % of the race length): a
       straight leg of canyonMin to canyonMax metres down the centre line
       of a city street, between walls of towers canyonHMin to canyonHMax
       high. Inside it the tube radius drops to canyonR (see placeCanyon
       for why 8 m) and grows back by a metre per metre of arc outside it.
       canyonWeave: the rings' offset left and right of the centre line,
       canyonUp: the third ring's lift. canyonEntry and canyonExit: open
       street after the entry and before the exit before the walls start
       (the exit one keeps the next leg's full tube off the walls).
       canyonAir: the height above the leg kept free of bridges, cables,
       signs and holograms. 40 m puts its top at 116 m, just over the
       105 m lane band (95 to 115), so the bridges and cables across the
       canyon hang in the 116 to 145 m window under the 155 m band, 40 to
       70 m over the pilot, where the chase view still sees them ahead
       (at the 60 m first asked for, that window shrank to 136 to 145 m
       and nearly all of them went above 165 m, out of the picture). */
    canyon: true, canyonAt: 2, canyonMin: 450, canyonMax: 700, canyonR: 8, canyonWeave: 3, canyonUp: 8,
    canyonEntry: 30, canyonExit: 60, canyonAir: 40, canyonHMin: 180, canyonHMax: 260,
    /* One Menger block on the route (step 6): after mengerAt of the regular
       legs (the 1.6 km of shaft after it put the block at 31 to 46 % of
       the length), lead metres of straight approach and leave outside its
       mouths (more than the tube radius plus 10 m, so the next leg clears
       the block), its own lanes reaching mengerReach from its centre
       (inside the 2 x 2 tiles it reserves). */
    menger: true, mengerAt: 0.5, mengerLead: 60, mengerReach: 190,
    /* One ventilation shaft (assets/js/shaft.js) after the block, its middle
       at about shaftAt of the way along (0.8 puts one leg and the finish
       after it). It lies level at an altitude between shaftAltMin and
       shaftAltMax through a housing building of its own, the mouths in the
       end facades, with approach and leave legs of shaftLead metres
       outside the mouths. */
    shaft: true, shaftAt: 0.8, shaftAltMin: 70, shaftAltMax: 110, shaftLead: 80,
    /* Freighter lanes (HikyakuTraffic.freighterLanes) over the route's box
       plus freightMargin, the full set at density 1 (the panel's density
       picks a subset in makeLanes). A lane whose hull sweep comes within
       freightClear of the block or the shaft housing is left out. Every
       remaining lane reserves a corridor in the city: freightHalf metres to
       each side of its line, from freightFloor up, so no tower or landmark
       reaches a freighter (the city caps buildings 10 m under the corridor
       floor and keeps landmarks 30 m beside it). */

      var sSeed = 1 + ((Math.imul(R.seed ^ 0x2c9277b5, 2654435761) >>> 0) % 99991);
      var lead = R.shaftLead;
      var tryOnce = function () {
        var last = pts[pts.length - 1];

    }

  }

  /* Quaternion [w, x, y, z] of the rotation that takes the body axes onto

  function quatFromAxes(X, Y, Z) {

    } else if (m00 > m11 && m00 > m22) {
      S = Math.sqrt(1 + m00 - m11 - m22) * 2;
      q = [(m21 - m12) / S, 0.25 * S, (m01 + m10) / S, (m02 + m20) / S];
    } else if (m11 > m22) {
      S = Math.sqrt(1 + m11 - m00 - m22) * 2;
      q = [(m02 - m20) / S, (m01 + m10) / S, 0.25 * S, (m12 + m21) / S];
    } else {
      S = Math.sqrt(1 + m22 - m00 - m11) * 2;
      q = [(m10 - m01) / S, (m02 + m20) / S, (m12 + m21) / S, 0.25 * S];
    }

  }

  /* ---- obstacles ----------------------------------------------------------
     The city (assets/js/hikyaku-city.js) builds the boxes around the route
     and answers boxesNear(p, r) with the shape contactsBoxes takes:
       { min, max, c, half, idx }
     The step-2 stand-in makeObstacles is gone. boxDist stays: tests and the
     contact code use it. */
  function boxDist(b, p) {
    var dx = Math.max(b.min[0] - p[0], 0, p[0] - b.max[0]);
    var dy = Math.max(b.min[1] - p[1], 0, p[1] - b.max[1]);
    var dz = Math.max(b.min[2] - p[2], 0, p[2] - b.max[2]);
    return Math.sqrt(dx * dx + dy * dy + dz * dz);

  /* ---- contacts -----------------------------------------------------------
     Hull points against the OUTSIDE of axis-aligned boxes and against the
     ground plane y = 0, in the record SixDOF.resolve takes:
       { n, r, pen, key }
     n the world normal the hull has to move along, r the lever arm from the
     centre of mass, pen the depth, key the group for the positional
     correction (one per box, 'g' for the ground).
     A point inside a box leaves through the face it is least deep behind.
     The bottom face is skipped for boxes standing on the ground, because

    for (i = 0; i < pts.length; i++) {
      var r = SD.qRot(s.q, pts[i]);
      var wp = [s.p[0] + r[0], s.p[1] + r[1], s.p[2] + r[2]];
      if (wp[1] < 0) out.push({ n: [0, 1, 0], r: r, pen: -wp[1], key: 'g' });

        if ((c = mx[0] - wp[0]) < best) { best = c; n = [1, 0, 0]; }
        if ((c = wp[2] - mn[2]) < best) { best = c; n = [0, 0, -1]; }
        if ((c = mx[2] - wp[2]) < best) { best = c; n = [0, 0, 1]; }
        if (mn[1] > 0 && (c = wp[1] - mn[1]) < best) { best = c; n = [0, -1, 0]; }

      }

/* Event lookups: a hand-made event for the screenshot hooks, at a roof
   pad in front of the camera (the city must have streamed in). */
function shotEvent(kind, t, pos, fwd, pads, boxesNear) {
  if (kind === 'laser') return HE.shotLaser(t, pos, fwd, pads, boxesNear);
  const hf = Math.hypot(fwd[0], fwd[2]) || 1, f = [fwd[0] / hf, fwd[2] / hf];
  const near = kind === 'laser' ? [450, 900] : [350, 700];
  let best = null;
  for (const pd of pads) {
    if (pd.kind !== 'roof' || pd.p[1] < 25) continue;
    const dx = pd.p[0] - pos[0], dz = pd.p[2] - pos[2], d = Math.hypot(dx, dz);
    if (d < near[0] || d > near[1]) continue;
    const a = Math.atan2(f[0] * dz - f[1] * dx, f[0] * dx + f[1] * dz);
    const score = Math.abs(Math.abs(a) - 0.2);
    if (Math.abs(a) < 0.5 && (!best || score < best.score)) best = { p: pd.p.slice(), score };
  }
  const o = best ? best.p : [pos[0] + f[0] * 600, 60, pos[2] + f[1] * 600];
  /* across the view: the heading turned by 70 degrees toward the middle */
  const side = best && Math.atan2(f[0] * (o[2] - pos[2]) - f[1] * (o[0] - pos[0]), f[0] * (o[0] - pos[0]) + f[1] * (o[2] - pos[2])) > 0 ? -1 : 1;
  const az = Math.atan2(f[1], f[0]) + side * 70 * Math.PI / 180;
  if (URL_DRONE) {
    return { kind: 'searchlight', id: 'shot:searchlight', tStart: t - 30, tEnd: t + 100, origin: [o[0], o[1] + 120, o[2]],
      params: { mount: 'drone', len: 380, half: 5 * Math.PI / 180, elMin: -1.31, elMax: -0.26,
        az0: az, azAmp: 0, azW: 0, azPh: 0, el0: -45 * Math.PI / 180, elAmp: 0, elW: 0, elPh: 0,
        droneR: 30, droneW: 2 * Math.PI / 70, dronePh: 0, fadeIn: 5, fadeOut: 8 }, info: {} };
  }
  return { kind: 'searchlight', id: 'shot:searchlight', tStart: t - 30, tEnd: t + 100, origin: o,
    params: { mount: 'roof', len: 380, half: 5 * Math.PI / 180, elMin: -0.35, elMax: 0.87,

      droneR: 0, droneW: 0, dronePh: 0, fadeIn: 5, fadeOut: 8 }, info: {} };
}

function loadStored() {
  let c = DEF;
  try {
    const raw = localStorage.getItem(STORE);
    if (raw) {
      const o = JSON.parse(raw);
      if (o && typeof o === 'object') {
        if (!(o.cfgV >= 2)) { delete o.gravity; delete o.assist; }
        if (!(o.cfgV >= 3)) { delete o.cityDensity; delete o.cityMaxH; delete o.fogDensity; }
        if (!(o.cfgV >= 6)) { delete o.liveliness; delete o.freightDensity; }
      }
      c = { ...SD.mergeConfig(DEF, o, ENUMS), cfgV: DEF.cfgV };
    }
  } catch (e) { c = DEF; }
  /* Every visit gets a fresh city and a fresh tune (owner's wish), unless the
     URL names a route: ?seed= is the way to repeat one and compare times. The
     stored seeds are therefore only what the last visit happened to play. */
  const fresh = () => 1 + Math.floor(Math.random() * 99999);
  c = { ...c, seed: fresh(), musicSeed: fresh() };
  if (Number.isFinite(URL_SEED) && URL_SEED > 0) c = { ...c, seed: URL_SEED };
  return c;
}

/* The street level: one city tile (HikyakuCity.TILE, 216 m) per texture
   repeat, streets 32 m wide on the tile edges and through the middle, with
   kerbs and faint lane dashes on the 54 m lane pitch. The pattern is
   symmetric, so the plane's uv orientation does not matter, only that its
   corner sits on a tile corner. Two canvases: the albedo, and the light of
   the street (2026-10-25, the owner saw a black sheet): lamp strings along
   both kerbs, shop glow along the block fronts, a few accent signs, a dim
   glow over the blocks. Where the ground shows through the soup, it reads
   as a lit street grid in haze. */
function groundTextures(THREE, renderer) {
  const N = 1024, T = HC.TILE, k = N / T;
  const mk = () => { const c = document.createElement('canvas'); c.width = c.height = N; return c; };
  const c = mk(), e = mk();
  const g = c.getContext('2d'), h = e.getContext('2d');
  g.fillStyle = boneCss(0.16, 0.55);
  g.fillRect(0, 0, N, N);
  const half = HC.STREET / 2 * k;
  g.fillStyle = boneCss(0.1, 0.5);
  for (const m of [0, N / 2, N]) { g.fillRect(m - half, 0, 2 * half, N); g.fillRect(0, m - half, N, 2 * half); }
  g.fillStyle = boneCss(0.3, 0.45);
  for (const m of [0, N / 2, N]) for (const sgn of [-1, 1]) {
    const ed = m + sgn * half - (sgn > 0 ? 2 : 0);
    g.fillRect(ed, 0, 2, N); g.fillRect(0, ed, N, 2);
  }
  /* lane dashes along every street, on the 54 m pitch offsets */
  g.fillStyle = boneCss(0.35, 0.35);
  for (const m of [0, N / 2, N]) for (const off of [-6, 6]) {
    for (let t = 0; t < N; t += 24) { g.fillRect(m + off * k - 1, t, 2, 12); g.fillRect(t, m + off * k - 1, 12, 2); }
  }
  /* light: black is no light */
  h.fillStyle = '#000';
  h.fillRect(0, 0, N, N);
  /* dim glow over the blocks (windows, courtyards), brighter at the fronts */
  const rnd = Dust.rng(0x57ee7);
  const blocks = [[half, N / 2 - half], [N / 2 + half, N - half]];
  for (const [x0, x1] of blocks) for (const [z0, z1] of blocks) {
    h.fillStyle = 'rgba(120,135,150,0.10)';
    h.fillRect(x0, z0, x1 - x0, z1 - z0);
    h.fillStyle = 'rgba(190,200,205,0.22)';
    const fr = 2.5 * k;
    h.fillRect(x0, z0, x1 - x0, fr); h.fillRect(x0, z1 - fr, x1 - x0, fr);
    h.fillRect(x0, z0, fr, z1 - z0); h.fillRect(x1 - fr, z0, fr, z1 - z0);
    /* shop fronts: short warm-white and accent bars on the block edges */
    for (let i = 0; i < 26; i++) {
      const side = Math.floor(rnd() * 4), len = (4 + rnd() * 12) * k, at = rnd();
      const r = rnd();
      h.fillStyle = r < 0.12 ? 'rgba(46,232,255,0.9)' : r < 0.22 ? 'rgba(255,63,164,0.85)' : 'rgba(235,225,205,0.7)';
      const w = 1.2 * k;
      if (side === 0) h.fillRect(x0 + at * (x1 - x0 - len), z0 - w, len, w);
      else if (side === 1) h.fillRect(x0 + at * (x1 - x0 - len), z1, len, w);
      else if (side === 2) h.fillRect(x0 - w, z0 + at * (z1 - z0 - len), w, len);
      else h.fillRect(x1, z0 + at * (z1 - z0 - len), w, len);
    }
  }
  /* lamp strings: a lamp every 9 m on both kerbs of every street, and a
     faint pool of light on the road under each */
  for (const m of [0, N / 2, N]) for (const sgn of [-1, 1]) {
    const ln = m + sgn * (half - 2.2 * k);
    for (let t = 0; t < N; t += 9 * k) {
      const grad = (x, y) => {
        const gr = h.createRadialGradient(x, y, 0, x, y, 4 * k);
        gr.addColorStop(0, 'rgba(230,236,240,0.35)'); gr.addColorStop(1, 'rgba(230,236,240,0)');
        h.fillStyle = gr; h.fillRect(x - 4 * k, y - 4 * k, 8 * k, 8 * k);
        h.fillStyle = 'rgba(255,250,240,1)'; h.fillRect(x - 2, y - 2, 4, 4);
      };
      grad(ln, t + 4.5 * k); grad(t + 4.5 * k, ln);
    }
  }
  const tex = (cv, srgb) => {
    const t = new THREE.CanvasTexture(cv);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.colorSpace = THREE.SRGBColorSpace;
    t.anisotropy = Math.min(16, renderer.capabilities.getMaxAnisotropy());
    return t;
  };
  return { map: tex(c), light: tex(e) };
}

/* Rain: streaks on a lattice folded around the camera, the dust.js idea,
   but the fold runs in the vertex shader and every drop is a quad from
   its head back along its velocity relative to the camera, so the streaks
   lean and stretch with the ship's speed. dust.js draws round points by
   design (its comment explains why streaks lied there: the motes are the
   speed cue at rest too); rain is a streak in reality, so it gets its own
   small system here. Its random lattice comes from Dust.rng, so the field
   is the same on every load. */
function makeRain(THREE, n) {
  const rnd = Dust.rng(0x7a1e);
  const base = new Float32Array(n * 3);
  for (let i = 0; i < n * 3; i++) base[i] = rnd();
  const q = new THREE.PlaneGeometry(1, 2).translate(0.5, 0, 0);
  const geo = new THREE.InstancedBufferGeometry();
  geo.index = q.index; geo.setAttribute('position', q.getAttribute('position'));
  geo.setAttribute('iBase', new THREE.InstancedBufferAttribute(base, 3));
  geo.instanceCount = n;
  const mat = new THREE.ShaderMaterial({
    uniforms: {
      uCam: { value: new THREE.Vector3() }, uShift: { value: new THREE.Vector3() }, uS: { value: 70 },
      uRel: { value: new THREE.Vector3(0, -9, 0) }, uExp: { value: 0.035 }, uW: { value: 0.02 },
      uAlpha: { value: 0 }, uColor: { value: new THREE.Color(0.62, 0.68, 0.72) }
    },
    vertexShader: `
uniform vec3 uCam; uniform vec3 uShift; uniform float uS; uniform vec3 uRel; uniform float uExp; uniform float uW;
attribute vec3 iBase;
varying vec2 vP; varying float vA;
void main(){
  vec3 d = iBase * uS + uShift - uCam;
  d = (fract(d / uS + 0.5) - 0.5) * uS;
  vec3 head = uCam + d;
  vec3 st = -uRel * uExp;
  float L = length(st);
  if (L > 9.0) { st *= 9.0 / L; L = 9.0; }
  vec3 wp = head + st * position.x;
  vec3 toCam = cameraPosition - wp;
  float dist = length(toCam);
  vec3 dn = st / max(L, 1e-4);
  vec3 side = normalize(cross(dn, toCam));
  float w = max(uW, dist * 0.0011);
  wp += side * position.y * w;
  vP = position.xy;
  float r = length(d) / (0.5 * uS);
  vA = (1.0 - smoothstep(0.55, 1.0, r)) * smoothstep(0.6, 2.5, dist) * (uW / w);
  gl_Position = projectionMatrix * viewMatrix * vec4(wp, 1.0);
}`,
    fragmentShader: `
uniform float uAlpha; uniform vec3 uColor;
varying vec2 vP; varying float vA;
void main(){
  float a = exp(-vP.y * vP.y * 4.0) * smoothstep(0.0, 0.3, vP.x) * uAlpha * vA;
  if (a < 0.003) discard;
  gl_FragColor = vec4(uColor, a);
}`,
    transparent: true, depthWrite: false, side: THREE.DoubleSide
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.frustumCulled = false;
  mesh.renderOrder = 3;
  q.dispose();
  return {
    mesh,
    /* fall: the rain's own velocity (a little wind); vShip: the camera's
       velocity, so the streak is the drop's motion as the eye sees it.
       15 m/s is about a heavy drop's terminal speed; at 9.5 m/s the streaks
       leaned almost flat at flight speed (owner, 2026-10-25). */
    update(cam, t, level, vShip) {
      const u = mat.uniforms, S = u.uS.value;
      const fall = [0.6, -15, 0.35];
      u.uCam.value.copy(cam);
      u.uShift.value.set(((fall[0] * t) % S + S) % S, ((fall[1] * t) % S + S) % S, ((fall[2] * t) % S + S) % S);
      u.uRel.value.set(fall[0] - vShip[0], fall[1] - vShip[1], fall[2] - vShip[2]);
      u.uAlpha.value = 0.38 * level;
      mesh.visible = level > 0.01;
    },
    dispose() { geo.dispose(); mat.dispose(); }
  };
}

/* A ship pose for the screenshot hooks: back along dir from p, nose along
   dir, wings level. */
function poseAt(p, dir, back) {
  const f = HK.frameOf(dir);
  return { p: SD.sub(p, SD.mul(dir, back)), v: [0, 0, 0], q: HK.quatFromAxes(f.right, f.up, SD.mul(dir, -1)), w: [0, 0, 0] };
}

/* ---- chase camera collision ----
   The chase camera sits on the segment from the ship to where camStep and
   the panel want it, as far out as a 2.5 m sphere gets (hkcore
   cameraClamp): city and block boxes near the segment, the ground, and in
   and around the shaft its free space and its fans, and the traffic hulls
   whose bounding sphere reaches the sphere around the segment (hkcore
   vehicleBoxes; with traffic off there are none). Never closer than 8 m,
   which keeps the whole hull in front of the near plane; the distance drops
   at once when something comes between and grows back with a time
   constant of 0.35 s, so the view does not pump. */
const CAM_R = 2.5, CAM_MIN = 8, CAM_TAU = 0.35;
/* Free space around p for the shaft: inside the duct the distance to its
   wall (the section continued straight out of the mouths, so the opening
   stays free), outside the distance to the housing block (|x| < hw, ground
   to roof, mouth to mouth in duct coordinates). The ribs, pipes and the
   catwalk are left out: they reach at most 4.5 m into the duct. */
function shaftFree(sh, p) {
  const l = SHF.toLocal(sh, p), H = sh.housing, L = sh.length;
  const dIn = -SHF.secF(SHF.loftK(sh, Math.max(0, Math.min(L, l.s))), l.x, l.y);
  const qs = Math.max(-l.s, l.s - L), qx = Math.abs(l.x) - H.hw, qy = Math.max(-p[1], p[1] - H.top);
  const dOut = Math.hypot(Math.max(qs, 0), Math.max(qx, 0), Math.max(qy, 0)) + Math.min(Math.max(qs, qx, qy), 0);
  return Math.max(dIn, dOut);
}
/* A fan as a slab across the duct, as thick as its pitched blades (or the
   square fan's plate) reach along the axis. The gaps between the blades are
   not free for the camera: it passes the fan plane only once the ship has. */
function fanSlab(sh, fi) {
  const fan = sh.fans[fi], F = sh.fanFrames[fi];
  const chord = fan.radius * fan.cover * Math.PI / fan.blades / Math.cos(fan.pitch);
  const zh = Math.max(fan.plateHZ || 0, chord * Math.sin(fan.pitch) + fan.thick / 2 * Math.cos(fan.pitch) + 0.4) + 0.3;
  const along = (p) => (p[0] - F.p[0]) * F.T[0] + (p[2] - F.p[2]) * F.T[2];
  return {
    along: along,
    f: (p) => {
      const x = (p[0] - F.p[0]) * F.N[0] + (p[2] - F.p[2]) * F.N[2], y = p[1] - F.p[1];
      if (x * x + y * y > (SHF.ROUND_R + 8) * (SHF.ROUND_R + 8)) return 1e9;
      return Math.abs(along(p)) - zh;
    }
  };
}
function camClampAt(cfg, from, want, full, tVeh) {
  const mid = [(from[0] + want[0]) / 2, (from[1] + want[1]) / 2, (from[2] + want[2]) / 2];
  const r = full / 2 + CAM_R + 1;
  const probes = [cfg.city.boxesNear(mid, r)];
  if (tVeh != null && cfg.allLanes) {
    const nv = HT.nearVehicles(cfg.allLanes, mid, r, tVeh);
    if (nv.length) probes.push(HK.vehicleBoxes(nv));
  }
  if (cfg.block) probes.push(MG.boxesNear(cfg.block.block, mid, r));
  const shf = cfg.shaft;
  if (shf && SHF.near(shf.shaft, from, full + 10)) {
    const sh = shf.shaft;
    probes.push((p) => shaftFree(sh, p));
    for (let fi = 0; fi < sh.fans.length; fi++) {
      const sl = fanSlab(sh, fi);
      if (Math.abs(sl.along(from)) < full + 20) probes.push(sl.f);
    }
  }
  return HK.cameraClamp(from, want, CAM_R, probes, { min: CAM_MIN });
}

/* The tall core of the city sits on the middle of the route. */
function routeCore(route) {
  const w = route.waypoints;
  return [w.reduce((a, q) => a + q.p[0], 0) / w.length, w.reduce((a, q) => a + q.p[2], 0) / w.length];
}

/* A gate frame after the portal rule: a dark rectangular body with real depth,
   and its reveal (the inner faces) glowing in the warm accent. The glow material
   is passed in, so its colour can follow the race state. */
function gateFrame(THREE, wp, mat, body) {
  const grp = new THREE.Group();
  const t = 2.2, dep = 5, hw = wp.hw, hh = wp.hh, lip = 0.35;
  const box = (w, h, d, x, y, z, m) => {
    const ms = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
    ms.position.set(x, y, z);
    grp.add(ms);
  };
  /* dark lit body */
  box(2 * hw + 2 * t, t, dep, 0, hh + t / 2, 0, body);
  box(2 * hw + 2 * t, t, dep, 0, -hh - t / 2, 0, body);
  box(t, 2 * hh, dep, -hw - t / 2, 0, 0, body);
  box(t, 2 * hh, dep, hw + t / 2, 0, 0, body);
  /* the glowing reveal: thin warm plates on the four inner faces */
  box(2 * hw, lip, dep + 0.1, 0, hh - lip / 2, 0, mat);
  box(2 * hw, lip, dep + 0.1, 0, -hh + lip / 2, 0, mat);
  box(lip, 2 * hh, dep + 0.1, -hw + lip / 2, 0, 0, mat);
  box(lip, 2 * hh, dep + 0.1, hw - lip / 2, 0, 0, mat);
  grp.position.set(wp.p[0], wp.p[1], wp.p[2]);
  /* Local x right, y up, z against the facing direction. */
  const q = HK.quatFromAxes(wp.right, wp.up, SD.mul(wp.dir, -1));
  grp.quaternion.set(q[1], q[2], q[3], q[0]);
  return grp;
}

/* The controls, once: the panel's "Controls" section and the menu's
   Controls screen both render this, so the two cannot drift apart. The 3D
   mouse sentence follows DEF_MAP and the usual HID axis order. */
function ControlsText() {
  return html`<${React.Fragment}>
    <p className="hk-note">3D mouse: Push the cap forward or back: fly forward or back. Slide it sideways: slide.
      Pull it up or press it down: lift. Tilt it forward or back: pitch. Tilt it sideways: roll. Twist it: yaw.
      Right button: boost. Left button: stop rotation while held.</p>
    <p className="hk-note">Keys: <kbd>W</kbd><kbd>S</kbd> forward and back, <kbd>A</kbd><kbd>D</kbd> slide,
      <kbd>R</kbd><kbd>F</kbd> lift up and down, <kbd>Q</kbd><kbd>E</kbd> roll,
      arrow keys pitch and yaw (up pushes the nose down), <kbd>Shift</kbd> boost.
      <br/><kbd>Space</kbd> stop rotation, <kbd>X</kbd> flight assist, <kbd>G</kbd> gravity, <kbd>C</kbd> view,
      <kbd>Backspace</kbd> back to the start, <kbd>P</kbd> panel, <kbd>M</kbd> music,
      <kbd>Esc</kbd> pause and menu.</p>
    <p className="hk-note">Mouse: left drag looks around, middle click stops rotation, wheel sets the chase distance.</p>
    <p className="hk-note">In the menus: Arrow keys move, Enter picks, Esc goes back.</p>
    <p className="hk-note">All settings, the panel included, are kept in this browser across reloads.</p>
  <//>`;
}

function App() {
  const [p, setP] = useState(loadStored);
  /* The start screen and the menus (hkcore menuInit and menuStep): one
     screen value, a shot hook skips the menu. menuRef lets the loop and
     the key handler read the current screen. */
  const [menu, menuDo] = useReducer(HK.menuStep, { shot: SHOT, mode: p.lastMode }, HK.menuInit);
  const menuRef = useRef(menu);
  menuRef.current = menu;
  const parts = HK.hudParts(menu);
  const menuBoxRef = useRef(null);
  /* Panel and open section live in p, so they are stored with it. The
     screenshot hooks always hide the panel. */
  const panel = !SHOT && p.panel;
  const setPanel = useCallback((v) => setP((q) => ({ ...q, panel: typeof v === 'function' ? v(q.panel) : v })), []);
  const sec = p.sec;
  const [dev, setDev] = useState({ name: null, err: null, supported: !!(window.SpaceNav && SpaceNav.supported()) });
  const [ready, setReady] = useState(!!window.__hkThreeReady);
  const [best, setBest] = useState(loadBest);
  const [lastRun, setLastRun] = useState(null);
  const [seedText, setSeedText] = useState(String(loadStored().seed));

  const stageRef = useRef(null);
  const hudRef = useRef({});
  const navRef = useRef(null);
  const glRef = useRef(null);
  const keysRef = useRef({});
  const lookRef = useRef({ yaw: 0, pitch: 0, dragging: false });
  const killRef = useRef(false);
  const resetRef = useRef(0);
  const onFinishRef = useRef(null);

  /* The courier's own frame is kept for collision and drawing, and the
     principal moments are passed in as I. Letting makeCraft principalize the
     hull would tilt its points by a few tenths of a metre against the drawn
     ship, for products of inertia that are negligible on this hull. */
  const geo = useMemo(() => Courier.geometry(), []);
  const I0 = useMemo(() => SD.principalize(geo.collisionHull.verts, geo.collisionHull.faces).I, [geo]);
  const craft = useMemo(() => HF.makeCraft({
    hull: geo.collisionHull, I: I0, mass: p.mass, cd: p.cd,
    budget: { xp: p.bXp * G, xn: p.bXn * G, yp: p.bYp * G, yn: p.bYn * G, zp: p.bZp * G, zn: p.bZn * G },
    aBoost: p.bBoost * G, aPitch: p.aPitch, aYaw: p.aYaw, aRoll: p.aRoll,
    assist: p.assist, dragTorque: p.dragTorque, rateDamp: p.rateDamp
  }), [geo, I0, p.mass, p.cd, p.bXp, p.bXn, p.bYp, p.bYn, p.bZp, p.bZn, p.bBoost,
    p.aPitch, p.aYaw, p.aRoll, p.assist, p.dragTorque, p.rateDamp]);
  /* Space kills rotation with a strong damper and no pilot torque. */
  const killCraft = useMemo(() => ({ ...craft, rateDamp: 8 }), [craft]);

  /* The route is geometry: rebuilt only on a new seed, and the world is
     built around it. */
  const [routeCanyon, setRouteCanyon] = useState(() => p.canyon !== false);
  const route = useMemo(() => HK.makeRoute({ seed: p.seed, canyon: routeCanyon }), [p.seed, routeCanyon]);
  const bestKey = HK.bestKey('trial', p.seed, { canyon: routeCanyon });
  /* Oversized structures (the Menger block, later arcologies) are bigger
     than a tile and placed on the route by makeRoute. Their reserved boxes
     (the 2 x 2 tiles around the block) go to the city, which builds
     nothing inside them. */
  const specials = route.reserved;
  const block = route.specials.find((sp) => sp.kind === 'menger') || null;
  /* The ventilation shaft (shaft.js): its housing's envelope is in
     `specials` too, per 100 m of axis, and so are the freighter corridors
     (hkcore makeRoute). */
  const shaftSp = route.specials.find((sp) => sp.kind === 'shaft') || null;
  /* The traffic lanes, a pure function of the route and the density, with
     the gaps at the race line already cut (hkcore makeLanes). */
  const lanes = useMemo(() => (p.traffic || p.freighters ? HK.makeLanes(route, {
    on: p.traffic, density: p.trafficDensity, freight: p.freighters, freightDensity: p.freightDensity }) : null),
    [route, p.traffic, p.trafficDensity, p.freighters, p.freightDensity]);
  /* the city and block lanes plus the freighter lanes, for the traffic
     system and the contacts */
  const allLanes = useMemo(() => (lanes ? lanes.lanes.concat(lanes.freight) : null), [lanes]);
  /* The generator settings the city was built with. The panel edits p and
     "Rebuild" copies them over, so dragging a slider does not throw away
     every tile on each step. */
  const cityOf = (q) => ({ density: q.cityDensity, maxH: q.cityMaxH, accents: q.cityAccents,
    variety: q.cityVariety, districtSize: q.cityDistrict, landmarks: q.cityLandmarks, oldTown: q.cityOldTown,
    liveliness: q.liveliness, holograms: q.holograms, beacons: q.beacons });
  const [cityCfg, setCityCfg] = useState(() => cityOf(loadStored()));
  const city = useMemo(() => HC.makeCity(route, {
    density: cityCfg.density, maxH: cityCfg.maxH, accents: cityCfg.accents,
    variety: Number.isFinite(URL_VARIETY) ? Math.max(0, Math.min(1, URL_VARIETY)) : cityCfg.variety,
    districtSize: cityCfg.districtSize, landmarks: cityCfg.landmarks, oldTown: cityCfg.oldTown,
    liveliness: cityCfg.liveliness, holograms: cityCfg.holograms, beacons: cityCfg.beacons,
    core: routeCore(route), reserved: specials, signs: SIGN_META
  }), [route, cityCfg, specials]);
  const cityNow = cityOf(p);
  const cityPending = Object.keys(cityNow).some((k) => cityNow[k] !== cityCfg[k]);
  const rebuildCity = () => setCityCfg(cityNow);

  const cfgRef = useRef(null);
  cfgRef.current = { p, craft, killCraft, route, city, block, shaft: shaftSp, lanes, allLanes, geo };

  /* ---- music -----------------------------------------------------------
     synthwave.js needs a user gesture for its AudioContext, so every start
     comes from a key or a click handler: M, the panel button, or the first
     gesture of the visit when the stored setting is on (the HUD shows
     "press M for music" until then). Off pauses the context, so on again
     carries on where it was; a new music seed starts afresh. The loop
     feeds intensity, biome and rain. */
  /* ---- pause ----
     Escape pauses: no physics, so the race clock, the traffic and the fans
     stand still; the wall-clock things (weather, rain, events) run on the
     pause clock (hkcore pauseTime); the music is suspended. The scene keeps
     rendering, and the mouse still looks around. The menu drives it
     (hkcore menuPaused): Escape or "Resume" resumes. */
  const pauseRef = useRef(HK.pauseClock());
  const setPaused = useCallback((on) => {
    const pc = pauseRef.current;
    if (!!on === pc.paused || SHOT) return;
    HK.pauseSet(pc, on, performance.now());
    const S = window.Synthwave, M = musicRef.current;
    if (S && M.started && M.live) { if (on) S.pause(); else S.resume(); }
  }, []);
  const musicRef = useRef({ started: false, live: false, audible: false, hidTried: false, int: HK.musicIntensity(0), biome: 'open', rain: false, acc: 0 });
  const [musicLive, setMusicLive] = useState(false);
  /* audible: the context really runs (Synthwave.playing(), polled by the
     loop). live only says a start was asked for; from the 3D mouse the
     browser may keep the context suspended, and the hint has to stay. */
  const [musicAudible, setMusicAudible] = useState(false);
  const [musicHidTried, setMusicHidTried] = useState(false);
  const musicPlay = useCallback(() => {
    const S = window.Synthwave, M = musicRef.current;
    if (!S) return false;
    const q = cfgRef.current.p;
    try {
      if (M.started) S.resume();
      else {
        S.start({ seed: q.musicSeed, intensity: M.int, biome: M.biome, rain: M.rain, volume: q.musicVolume, bpm: q.musicBpm });
        M.started = true;
      }
    } catch (e) { console.error('Synthwave.start failed: ' + (e && e.message)); return false; }
    M.live = true;
    setMusicLive(true);
    return true;
  }, []);
  const musicHalt = useCallback(() => {
    const S = window.Synthwave, M = musicRef.current;
    if (S && M.started) S.pause();
    M.live = false;
    setMusicLive(false);
  }, []);
  /* from a gesture: on plays (and stores on), off pauses */
  const musicToggle = useCallback(() => {
    const M = musicRef.current;
    if (M.live) { musicHalt(); setP((q) => ({ ...q, music: false })); }
    else if (musicPlay()) {
      setP((q) => ({ ...q, music: true }));
      /* paused: the context is unlocked now, but stays quiet until resume */
      if (pauseRef.current.paused && window.Synthwave) window.Synthwave.pause();
    }
  }, [musicPlay, musicHalt]);
  useEffect(() => {
    /* the first gesture starts a stored "on"; M and the panel button handle
       themselves */
    const first = (e) => {
      if (e.code === 'KeyM' || (e.target && e.target.closest && e.target.closest('[data-music]'))) return;
      const M = musicRef.current;
      /* not live, or live but held suspended (a start from the 3D mouse
         without any gesture before it): this gesture unlocks it */
      if (cfgRef.current.p.music && !(M.live && M.audible) && !SHOT) {
        musicPlay();
        if (pauseRef.current.paused && window.Synthwave) window.Synthwave.pause();
      }
    };
    window.addEventListener('keydown', first, true);
    window.addEventListener('pointerdown', first, true);
    return () => {
      window.removeEventListener('keydown', first, true);
      window.removeEventListener('pointerdown', first, true);
      if (musicRef.current.started && window.Synthwave) window.Synthwave.stop();
      musicRef.current.started = false; musicRef.current.live = false;
    };
  }, [musicPlay]);
  useEffect(() => {
    const S = window.Synthwave;
    if (S && musicRef.current.started) S.setVolume(p.musicVolume);
  }, [p.musicVolume]);
  useEffect(() => {
    const S = window.Synthwave;
    if (S && musicRef.current.started) S.setBpm(p.musicBpm);
  }, [p.musicBpm]);
  const musicSeedRef = useRef(p.musicSeed);
  useEffect(() => {
    if (musicSeedRef.current === p.musicSeed) return;
    musicSeedRef.current = p.musicSeed;
    const S = window.Synthwave, M = musicRef.current;
    if (!S || !M.started) return;
    /* a new composition: stop the old one; if it was playing, the context
       is already unlocked, so the new one starts at once */
    S.stop(); M.started = false;
    if (M.live) musicPlay();
  }, [p.musicSeed, musicPlay]);
  /* ?music=1: the headless check. A dispatched click is no user
     activation, so the context may stay suspended; what matters is that
     start throws nothing. */
  useEffect(() => {
    if (!URL_MUSIC) return undefined;
    const onClick = () => {
      const ok = musicPlay();
      console.error('HKMUSIC start ' + (ok ? 'ok' : 'failed'));
      setTimeout(() => {
        const S = window.Synthwave;
        console.error('HKMUSIC playing=' + (S ? S.playing() : 'no Synthwave') + ' ctx=' + (S && S._ctx ? S._ctx.state : '-'));
      }, 1500);
    };
    window.addEventListener('click', onClick, { once: true });
    const id = setTimeout(() => document.body.dispatchEvent(new MouseEvent('click', { bubbles: true })), 400);
    return () => { clearTimeout(id); window.removeEventListener('click', onClick); };
  }, [musicPlay]);

  const der = useMemo(() => HF.speeds(craft, p.gravity ? G : 0), [craft, p.gravity]);

  /* ---- 3D mouse -------------------------------------------------------- */
  useEffect(() => {
    if (NOHID || !window.SpaceNav || !SpaceNav.supported()) return undefined;
    const ctl = SpaceNav.create({
      opts: { deadzone: 0, curve: 1 },
      onStatus: (s) => setDev((d) => ({ ...d, name: s.connected, err: s.error }))
    });
    ctl.init();
    navRef.current = ctl;
    return () => { ctl.destroy(); navRef.current = null; };
  }, []);
  /* The connect click is a user gesture, the 3D mouse's input reports are
     not. So the click only unlocks audio: it creates and resumes the
     AudioContext that Synthwave.start later reuses (synthwave.js keeps it
     in _ctx and takes an existing one), and the music itself starts with
     the first clear input of the device (musicFromHid). The button carries
     data-music, so the first-gesture handler leaves it alone. */
  const connect = useCallback(() => {
    const S = window.Synthwave;
    if (S && cfgRef.current.p.music && !SHOT) {
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!S._ctx && Ctx) S._ctx = new Ctx({ latencyHint: 'playback' });
        if (S._ctx && S._ctx.state === 'suspended') S._ctx.resume();
      } catch (e) { /* no Web Audio: the music just stays off */ }
    }
    if (navRef.current) navRef.current.connect();
  }, []);
  /* Called from the loop on the first clear 3D mouse input (an axis above
     0.3 after norm6, or a button). Without the connect click or any other
     gesture earlier in this document Chromium keeps the context suspended;
     the hint then asks for a click or a key, and that gesture resumes it. */
  const musicFromHidRef = useRef(null);
  musicFromHidRef.current = () => {
    const M = musicRef.current;
    if (M.hidTried || SHOT) return;
    M.hidTried = true;
    setMusicHidTried(true);
    if (!cfgRef.current.p.music) return;
    if (!M.live) musicPlay();
    else if (window.Synthwave) window.Synthwave.resume();
  };

  useEffect(() => {
    try { localStorage.setItem(STORE, JSON.stringify(p)); } catch (e) { /* private mode */ }
  }, [p]);
  useEffect(() => {
    setSeedText(String(p.seed));
    setLastRun(null);
    try {
      const u = new URL(location.href);
      u.searchParams.set('seed', String(p.seed));
      history.replaceState(null, '', u.toString());
    } catch (e) { /* file:// or sandbox */ }
  }, [p.seed]);

  /* Called from the loop when the finish gate is crossed. */
  onFinishRef.current = (race) => {
    const key = bestKey;
    const prevBest = best[key];
    /* the best time is the total, missed rings included */
    const isBest = !(prevBest > 0) || race.total < prevBest;
    if (isBest) {
      const nb = { ...best, [key]: race.total };
      setBest(nb);
      try { localStorage.setItem(BEST, JSON.stringify(nb)); } catch (e) { /* private mode */ }
    }
    setLastRun({ time: race.time, penalty: race.penalty, total: race.total, splits: race.splits.slice(),
      missed: race.missed.slice(), best: isBest, prevBest: prevBest > 0 ? prevBest : null, seed: p.seed });
    /* the finish card (the menu ignores this outside the time trial) */
    menuDo({ type: 'finish' });
    return isBest;
  };

  const toggleSec = useCallback((id) => setP((q) => ({ ...q, sec: q.sec === id ? '' : id })), []);
  const upd = (k) => (v) => setP((q) => ({ ...q, [k]: v }));
  const setSeed = (v) => {
    const n = Math.max(1, Math.min(999999, Math.round(v)));
    setP((q) => ({ ...q, seed: n }));
    setRouteCanyon(p.canyon !== false);
    resetRef.current++;
  };

  useEffect(() => {
    if (ready) return undefined;
    const on = () => setReady(true);
    window.addEventListener('hk-three-ready', on, { once: true });
    if (window.__hkThreeReady) setReady(true);
    return () => window.removeEventListener('hk-three-ready', on);
  }, [ready]);

  /* ---- keyboard --------------------------------------------------------
     Escape goes through the menu (pause, resume, back). P and M work on
     every screen. In a menu the arrows move the focus over its buttons and
     Enter picks (the browser clicks the focused button itself); the flight
     keys and Space reach the ship only while it flies (hkcore
     flightInputLive). */
  useEffect(() => {
    const down = (e) => {
      const inField = e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
      if (e.code === 'Escape') {
        if (inField && e.target.blur) e.target.blur();
        menuDo({ type: 'esc' }); e.preventDefault(); return;
      }
      if (inField) return;
      if (e.code === 'KeyP') { setPanel((v) => !v); return; }
      if (e.code === 'KeyM') { if (!e.repeat) musicToggle(); return; }
      if (!HK.flightInputLive(menuRef.current)) {
        const box = menuBoxRef.current;
        if (!box) return;
        const bs = Array.from(box.querySelectorAll('button:not(:disabled)'));
        if (e.code === 'ArrowDown' || e.code === 'ArrowUp') {
          if (bs.length) {
            const i = bs.indexOf(document.activeElement);
            const j = i < 0 ? 0 : (i + (e.code === 'ArrowDown' ? 1 : -1) + bs.length) % bs.length;
            bs[j].focus();
          }
          e.preventDefault();
        } else if ((e.code === 'Enter' || e.code === 'NumpadEnter') && !box.contains(document.activeElement)) {
          const b = box.querySelector('[data-focus]') || bs[0];
          if (b) { b.click(); e.preventDefault(); }
        }
        return;
      }
      if (KEYMAP[e.code]) { keysRef.current[e.code] = 1; e.preventDefault(); }
      else if (e.code === 'Space') { killRef.current = true; e.preventDefault(); }
      else if (e.code === 'KeyX') setP((q) => ({ ...q, assist: !q.assist }));
      else if (e.code === 'KeyG') setP((q) => ({ ...q, gravity: !q.gravity }));
      else if (e.code === 'KeyC') setP((q) => ({ ...q, camMode: q.camMode === 'chase' ? 'cockpit' : 'chase' }));
      else if (e.code === 'Backspace') { menuDo({ type: 'restart' }); e.preventDefault(); }
    };
    const up = (e) => { delete keysRef.current[e.code]; };
    const blur = () => { keysRef.current = {}; };
    window.addEventListener('keydown', down);
    window.addEventListener('keyup', up);
    window.addEventListener('blur', blur);
    return () => {
      window.removeEventListener('keydown', down);
      window.removeEventListener('keyup', up);
      window.removeEventListener('blur', blur);
    };
  }, [musicToggle, setPanel]);

  /* ---- menu side effects ------------------------------------------------
     The pause clock follows the menu (setPaused stays the one place that
     touches it and the music). Starting a mode stores it as lastMode. In
     flight the focus leaves the menu buttons, so Space and the arrows
     cannot press them; a menu screen puts the focus on its marked entry
     (the title on the last used mode, the pause menu on Resume). */
  useEffect(() => { setPaused(HK.menuPaused(menu)); }, [menu, setPaused]);
  useEffect(() => {
    if (menu.run > 0 && menu.screen === 'flying') setP((q) => (q.lastMode === menu.mode ? q : { ...q, lastMode: menu.mode }));
  }, [menu.run]);
  useEffect(() => {
    if (SHOT && SHOT !== 'title') return;
    if (HK.flightInputLive(menu)) {
      const a = document.activeElement;
      if (a && a !== document.body && a.blur) a.blur();
      return;
    }
    const box = menuBoxRef.current;
    const want = box && (box.querySelector('[data-focus]') || box.querySelector('button:not(:disabled)'));
    if (want) want.focus({ preventScroll: true });
  }, [menu.screen]);

  /* ---- the scene and the loop ------------------------------------------
     Built once. The route-dependent meshes are rebuilt in the effect below;
     everything else is read out of cfgRef each frame. */
  useEffect(() => {
    if (!ready || !stageRef.current) return undefined;
    const THREE = window.THREE;
    const host = stageRef.current;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    renderer.setClearColor(boneColor(THREE, 0.5), 1);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    host.appendChild(renderer.domElement);

    /* One atmosphere for the whole page (hikyaku-city.js makeFog, the model
       is written down there): a ground soup that buries the streets and a
       haze above the roofs whose density the slider sets. Every lit
       material is patched to use it, the sky sphere is the same model for
       an endless ray. scene.fog is a zero-density placeholder: it only
       switches the fog chunk on. */
    const fog = HC.makeFog(THREE);
    fog.set({ density: hazeOf(cfgRef.current.p) });
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000000, 0);
    scene.add(HC.makeSky(THREE, fog));
    const camera = new THREE.PerspectiveCamera(62, 1, 0.5, 30000);

    const worldGrp = new THREE.Group();
    scene.add(worldGrp);
    const shipGrp = new THREE.Group();
    scene.add(shipGrp);

    /* Dusk light as in the concepts: a pale moon and a bone sky light. */
    const sunDir = new THREE.Vector3(-0.4, 1, 0.3).normalize();
    const sun = new THREE.DirectionalLight(boneColor(THREE, 0.85), 0.9);
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.normalBias = 0.4;
    scene.add(sun);
    scene.add(sun.target);
    const hemi = new THREE.HemisphereLight(boneColor(THREE, 0.75), boneColor(THREE, 0.12), 1.1);
    scene.add(hemi);

    /* The courier. Plumes are scaled from the loop: the four fan plumes with
       the lift the fans deliver, the two main plumes with the boost. */
    const ship = Courier.build(THREE);
    shipGrp.add(ship.visual);
    const fans = [], mains = [];
    ship.visual.traverse((o) => {
      if (o.userData.thruster === 'fan') fans.push(o);
      else if (o.userData.thruster === 'main') mains.push(o);
      else if (o.isMesh && !o.userData.fx) {
        o.castShadow = true; o.receiveShadow = true;
        const mats = Array.isArray(o.material) ? o.material : [o.material];
        for (const m of mats) if (m && !m.transparent && !m.userData.hkFog) { fog.patch(m); m.userData.hkFog = true; }
      }
    });

    const state = {
      rain: -1, camPrev: null, camVel: [0, 0, 0],
      s: null, info: null, cam: { q: [1, 0, 0, 0], w: [0, 0, 0] },
      simT: 0, acc: 0, race: null, hits: 0, msg: '', msgUntil: 0, fps: 0, splitsText: '',
      /* world events: one schedule cache per seed (an event keeps the
         origin it got when first seen), the hand-made shot event, and the
         traffic clock a shot may fix (tFix) */
      evCache: new Map(), evShot: null, tFix: null,
      /* the attract camera: seconds since the title came up, and its
         clamped distance (smoothed like the chase camera's) */
      attT: 0, attD: null
    };
    /* cityR: the city renderer, owned by the city effect below. traffic:
       the traffic system of the traffic effect (hikyaku-traffic.js); the
       loop calls traffic.update(trafficTime, camera) when it is set.
       menger: the block's visual, from the block effect. hullBoxes: the
       vehicle hull debug view. */
    /* Speed cue and weather: drifting motes (dust.js, as in the corridor)
       and rain that comes and goes (makeRain above). */
    const dust = Dust.makeField(THREE, { count: 2600, color: boneAt(0.62), seed: 0x6b1 });
    scene.add(dust.obj);
    const rain = makeRain(THREE, 32000);   /* 2 triangles a drop; 14000 until 2026-10-25 */
    scene.add(rain.mesh);

    const g = { THREE, renderer, scene, camera, worldGrp, shipGrp, ship, fog, rings: null, gates: null, cityR: null,
      traffic: null, menger: null, shaft: null, hullBoxes: null, groundMat: null };
    glRef.current = g;

    const colNext = new THREE.Color(ACCENT);
    const colAhead = boneColor(THREE, 0.8, 0.95);
    const colDone = boneColor(THREE, 0.4, 0.8);
    /* Lit gates glow like the Menger block's portal rims, which Menger.build
       draws as neon that is not tone mapped, at a gain over 1: the warm
       clips toward gold. The rims run at 2.6 but are thin and sit in an
       orange halo; a gate's flat reveal reads the same at 1.6. */
    const warmOn = new THREE.Color(WARM).multiplyScalar(1.6);
    const warmOff = new THREE.Color(WARM).multiplyScalar(0.45);

    /* Ring and gate colours follow the race: the next waypoint in the
       accent, the ones ahead pale, the ones taken dim. */
    const mark = () => {
      const race = state.race;
      if (!race) return;
      if (g.rings) {
        const R = g.rings;
        for (let k = 0; k < R.ri.length; k++) {
          const wi = R.ri[k];
          const col = race.state !== 'idle' && wi === race.next ? colNext
            : (race.state !== 'idle' && wi < race.next) || race.state === 'finished' ? colDone : colAhead;
          R.mesh.setColorAt(k, col);
        }
        R.mesh.instanceColor.needsUpdate = true;
      }
      if (g.gates) {
        g.gates.start.copy(race.state === 'idle' ? warmOn : warmOff);
        g.gates.finish.copy(race.state === 'running' && race.next === race.n - 1 ? warmOn : warmOff);
      }
    };
    g.mark = mark;

    const reset = () => {
      const cfg = cfgRef.current;
      state.s = HK.startState(cfg.route, 60);
      /* the city shots stay on the open part of the route */
      const open = cfg.route.waypoints.filter((w) => w.biome === 'open');
      if (SHOT === 'city' || SHOT === 'laser') {
        const w = open[Math.min(5, open.length - 1)];
        state.s = poseAt(w.p, w.dir, 70);
      } else if (SHOT === 'canyon') {
        const w = open[Math.min(5, open.length - 1)];
        const spot = HC.findCanyon(cfg.city, w.p, 900);
        if (spot) {
          /* Lift the view to a traffic lane in that street, if it has one,
             so the shot shows vehicles in the canyon. */
          const ax = Math.abs(spot.dir[0]) > 0.5 ? 0 : 2, pa = 2 - ax;
          const ln = cfg.lanes ? cfg.lanes.lanes.find((l) => l.spec.kind === 'city' && l.spec.axis === (ax === 0 ? 'x' : 'z')
            && Math.abs(l.points[0][pa] - spot.p[pa]) < 8
            && Math.min(l.points[0][ax], l.points[1][ax]) < spot.p[ax] - 200 && Math.max(l.points[0][ax], l.points[1][ax]) > spot.p[ax] + 200) : null;
          const sp2 = spot.p.slice();
          if (ln) sp2[1] = ln.points[0][1] + 9;
          state.s = poseAt(sp2, spot.dir, 0);
        }
      } else if (SHOT === 'canyonrun') {
        /* chase view in the street canyon, 50 m before its second ring */
        const cy = cfg.route.specials.find((sp) => sp.kind === 'canyon');
        if (cy) {
          const w = cfg.route.waypoints[cy.i0 + 2];
          state.s = poseAt(w.p, w.dir, 50);
        }
      } else if ((SHOT === 'mouth' || SHOT === 'inside') && cfg.block) {
        const ws = cfg.route.waypoints, i0 = cfg.block.i0;
        state.s = SHOT === 'mouth' ? poseAt(ws[i0 + 1].p, ws[i0 + 1].dir, 120) : poseAt(ws[i0 + 2].p, ws[i0 + 2].dir, -10);
      } else if ((SHOT === 'shaftmouth' || SHOT === 'shaftinside') && cfg.shaft) {
        const ws = cfg.route.waypoints.slice(cfg.shaft.i0, cfg.shaft.i0 + cfg.shaft.count);
        const entry = ws.find((w) => w.kind === 'portal'), ring = ws.find((w) => w.kind === 'ring');
        state.s = SHOT === 'shaftmouth' ? poseAt(entry.p, entry.dir, 120) : poseAt(ring.p, ring.dir, 0);
      } else if (SHOT === 'shaftwall' && cfg.shaft) {
        /* the camera clamp at work: the ship 6 m from the right wall of the
           round section, between the two round fans, yawed 15 degrees
           toward the axis, so the chase camera wants to sit in the wall */
        const sh = cfg.shaft.shaft, sW = (sh.fans[0].s + sh.fans[1].s) / 2, f = SHF.frameAt(sh, sW);
        const off = SHF.ROUND_R - 6, a = 15 * Math.PI / 180;
        const dir = [f.T[0] * Math.cos(a) - f.N[0] * Math.sin(a), 0, f.T[2] * Math.cos(a) - f.N[2] * Math.sin(a)];
        state.s = poseAt([f.p[0] + f.N[0] * off, f.p[1], f.p[2] + f.N[2] * off], dir, 0);
      }
      if (SHOT === 'landmark') {
        /* the landmark nearest to the sixth open ring, seen from 600 m on
           the route's side, 470 m up, above the roofs */
        const w = open[Math.min(5, open.length - 1)], C = cfg.city.cfg, cell = HC.TILE * HC.LM_CELL;
        let best = null;
        for (let i = -2; i <= 2; i++) for (let k = -2; k <= 2; k++) {
          const L = HC.landmarkAt(Math.floor(w.p[0] / cell) + i, Math.floor(w.p[2] / cell) + k, C, cfg.route);
          if (!L) continue;
          const c = [(L.rect[0] + L.rect[2]) / 2, 380, (L.rect[1] + L.rect[3]) / 2];
          const d = Math.hypot(c[0] - w.p[0], c[2] - w.p[2]);
          if (!best || d < best.d) best = { c, d };
        }
        if (best) {
          const h = Math.hypot(best.c[0] - w.p[0], best.c[2] - w.p[2]) || 1;
          const u = [(best.c[0] - w.p[0]) / h, (best.c[2] - w.p[2]) / h];
          const cam = [best.c[0] - u[0] * 600, 470, best.c[2] - u[1] * 600];
          const v = SD.sub(best.c, cam), l = SD.len(v);
          state.s = poseAt(cam, [v[0] / l, v[1] / l, v[2] / l], 0);
        }
      }
      if (SHOT === 'altstadt') {
        const A = HC.oldTownNear(cfg.route, cfg.city.cfg, 1500);
        if (A) {
          const c = [A.c[0], 15, A.c[1]];
          let h = [A.p[0] - c[0], A.p[2] - c[2]], l = Math.hypot(h[0], h[1]);
          if (l < 1) { h = [1, 0]; l = 1; }
          const off = Math.max(l, 180);
          const cam = [c[0] + h[0] / l * off, Math.max(80, A.p[1]), c[2] + h[1] / l * off];
          const v = SD.sub(c, cam), lv = SD.len(v);
          state.s = poseAt(cam, [v[0] / lv, v[1] / lv, v[2] / lv], 0);
        }
      }
      if (SHOT === 'crown') {
        const w = open[Math.min(5, open.length - 1)], t0 = HC.tileOf(w.p);
        let cb = null;
        for (let i = -4; i <= 4; i++) for (let k = -4; k <= 4; k++) {
          const t = cfg.city.peek(t0[0] + i, t0[1] + k), lg = t.landmark ? t.landmark.g : -1;
          const own = new Map();
          for (const b of t.boxes) {
            if (b.kind !== 'crown' || b.g === lg) continue;
            const q = own.get(b.g) || { lo: [Infinity, Infinity, Infinity], hi: [-Infinity, -Infinity, -Infinity] };
            for (let a = 0; a < 3; a++) { q.lo[a] = Math.min(q.lo[a], b.min[a]); q.hi[a] = Math.max(q.hi[a], b.max[a]); }
            own.set(b.g, q);
          }
          for (const q of own.values()) {
            const c = [(q.lo[0] + q.hi[0]) / 2, q.lo[1], (q.lo[2] + q.hi[2]) / 2];
            const d = Math.hypot(c[0] - w.p[0], c[2] - w.p[2]);
            if (!cb || d < cb.d) cb = { c, d, top: q.hi[1] };
          }
        }
        if (cb) {
          const h = Math.hypot(w.p[0] - cb.c[0], w.p[2] - cb.c[2]) || 1;
          const cam = [cb.c[0] + (w.p[0] - cb.c[0]) / h * 150, cb.top + 30, cb.c[2] + (w.p[2] - cb.c[2]) / h * 150];
          const tg = [cb.c[0], cb.c[1], cb.c[2]], v = SD.sub(tg, cam), l = SD.len(v);
          state.s = poseAt(cam, [v[0] / l, v[1] / l, v[2] / l], 0);
        }
      }
      if (SHOT === 'blockfar' && cfg.block) {
        /* the Menger block from 1050 m back along the approach, 300 m up,
           city between and behind (the owner's depth screenshot) */
        const b = cfg.block.block.bounds, ws = cfg.route.waypoints, d0 = ws[cfg.block.i0].dir;
        const c = [(b.min[0] + b.max[0]) / 2, (b.min[1] + b.max[1]) / 2, (b.min[2] + b.max[2]) / 2];
        const h = Math.hypot(d0[0], d0[2]) || 1;
        const cam = [c[0] - d0[0] / h * 1050, 300, c[2] - d0[2] / h * 1050];
        const v = SD.sub(c, cam), l = SD.len(v);
        state.s = poseAt(cam, [v[0] / l, v[1] / l, v[2] / l], 0);
        state.blockC = c;
      }
      if (SHOT === 'hologram') {
        const w = open[Math.min(5, open.length - 1)], t0 = HC.tileOf(w.p);
        let hb = null;
        for (let i = -4; i <= 4; i++) for (let k = -4; k <= 4; k++) for (const H of cfg.city.peek(t0[0] + i, t0[1] + k).holograms) {
          const d = Math.hypot(H.p[0] - w.p[0], H.p[2] - w.p[2]);
          if (!hb || d < hb.d) hb = { H, d };
        }
        if (hb) {
          const H = hb.H, n = [-H.right[2], 0, H.right[0]], cam = [H.p[0] - n[0] * 130, H.p[1] - 18, H.p[2] - n[2] * 130];
          const v = SD.sub(H.p, cam), l = SD.len(v);
          state.s = poseAt(cam, [v[0] / l, v[1] / l, v[2] / l], 0);
        }
      }
      if (SHOT === 'sign') {
        const w = open[Math.min(5, open.length - 1)], t0 = HC.tileOf(w.p);
        let sb = null;
        for (let i = -3; i <= 3; i++) for (let k = -3; k <= 3; k++) for (const A of cfg.city.peek(t0[0] + i, t0[1] + k).accents) {
          if (A.kind !== 'blade' || A.p[1] < 25) continue;
          const d = Math.hypot(A.p[0] - w.p[0], A.p[2] - w.p[2]);
          if (!sb || d < sb.d) sb = { A, d };
        }
        if (sb) {
          /* level, so the sign stands above the ship rather than behind it */
          const A = sb.A, cam = [A.p[0] + A.n[0] * 40, A.p[1] - 9, A.p[2] + A.n[2] * 40];
          state.s = poseAt(cam, [-A.n[0], 0, -A.n[2]], 0);
        }
      }
      state.tFix = null;
      if (SHOT === 'freighter' && cfg.lanes && cfg.lanes.freight.length) {
        /* the freighter lane nearest the sixth open ring: the point of its
           line closest to the ring, the traffic clock fixed at the moment
           its freighter passes 60 m beyond that point */
        const w = open[Math.min(5, open.length - 1)];
        let fb = null;
        for (const ln of cfg.lanes.freight) {
          const ax = ln.freight.axis === 'x' ? 0 : 2, ac = 2 - ax;
          const d = Math.abs(w.p[ac] - ln.freight.row);
          if (!fb || d < fb.d) fb = { ln, d, ax, ac };
        }
        const ln = fb.ln, ax = fb.ax, ac = fb.ac;
        const q = ln.points[0].slice(); q[ax] = w.p[ax];
        const ns = HT.nearestS(ln, q);
        const sc = Math.min(ln.L - 300, Math.max(300, ns.s + 60));
        let tF = (sc - ln.phase) / ln.speed + ln.t0;
        const per = ln.spacing / ln.speed;
        tF -= Math.floor(tF / per) * per;
        state.tFix = tF;
        const P = HT.poseAt(ln, 0, tF);
        const c = P ? P.p : q;
        /* over its corridor (free from 220 m up),
           260 m ahead and 100 m above its lane, looking back at it */
        const cam = c.slice(); cam[1] = ln.freight.y + 100; cam[ac] = ln.freight.row + 20; cam[ax] += 260 * Math.sign(ln.points[1][ax] - ln.points[0][ax]);
        const v = SD.sub(c, cam), l = SD.len(v);
        state.s = poseAt(cam, [v[0] / l, v[1] / l, v[2] / l], 0);
      }
      if (SHOT === 'high' || SHOT === 'searchlight') {
        const w = open[Math.min(5, open.length - 1)];
        const h = Math.hypot(w.dir[0], w.dir[2]) || 1;
        const d = [w.dir[0] / h * 0.87, -0.5, w.dir[2] / h * 0.87];
        state.s = poseAt([w.p[0], 320, w.p[2]], d, 0);
      }
      state.info = null;
      state.cam = { q: state.s.q.slice(), w: [0, 0, 0] };
      state.camD = null;
      state.simT = 0; state.acc = 0; state.hits = 0;
      state.race = HK.makeRace(cfg.route, { missPenalty: cfg.p.missPenalty });
      state.msg = ''; state.msgUntil = 0; state.splitsText = '';
      killRef.current = false;
      mark();
    };
    g.reset = reset;
    reset();
    let lastReset = resetRef.current;
    let lastRunN = menuRef.current.run;
    let lastRoute = cfgRef.current.route;

    const resize = () => {
      const w = host.clientWidth || window.innerWidth;
      const h = host.clientHeight || window.innerHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    };
    resize();
    window.addEventListener('resize', resize);

    const onDown = (e) => {
      if (e.button === 0) { lookRef.current.dragging = true; e.preventDefault(); }
      if (e.button === 1) { killRef.current = true; e.preventDefault(); }
    };
    const onUp = (e) => { if (e.button === 0) lookRef.current.dragging = false; };
    const onMove = (e) => {
      const L = lookRef.current;
      if (!L.dragging) return;
      L.yaw -= (e.movementX || 0) * 0.004;
      L.pitch = Math.max(-1.4, Math.min(1.4, L.pitch - (e.movementY || 0) * 0.004));
    };
    /* The wheel sets the stored chase distance, the same value as the
       Camera slider, so it survives a reload. */
    const onWheel = (e) => {
      const k = Math.exp(e.deltaY * 0.0012);
      setP((q) => ({ ...q, camDist: Math.round(Math.max(0.8, Math.min(12, q.camDist * k)) * 100) / 100 }));
      e.preventDefault();
    };
    host.addEventListener('mousedown', onDown);
    window.addEventListener('mouseup', onUp);
    window.addEventListener('mousemove', onMove);
    host.addEventListener('wheel', onWheel, { passive: false });

    const tmpV = new THREE.Vector3();
    let last = 0, raf = 0;

    /* ?bench=1: tile build times (pure generator and mesh separately), then,
       once streaming has settled, 120 frames with the city and 120 without,
       timed on the CPU and, where the browser has the timer query, on the
       GPU. The city's GPU cost is the difference. Reported once through
       console.error. */
    const gl = renderer.getContext();
    const tq = BENCH ? gl.getExtension('EXT_disjoint_timer_query_webgl2') : null;
    const bench = { builds: [], pendQ: [], phase: 'settle', settle: 0, A: { dt: [], cpu: [], gpu: [] }, B: { dt: [], cpu: [], gpu: [] }, done: false, info: null };
    const benchPoll = (sink) => {
      while (bench.pendQ.length) {
        const q = bench.pendQ[0];
        if (!gl.getQueryParameter(q.q, gl.QUERY_RESULT_AVAILABLE)) break;
        const ns = gl.getQueryParameter(q.q, gl.QUERY_RESULT);
        const dis = gl.getParameter(tq.GPU_DISJOINT_EXT);
        gl.deleteQuery(q.q); bench.pendQ.shift();
        if (!dis && q.sink) q.sink.gpu.push(ns / 1e6);
      }
    };
    const benchReport = () => {
      const avg = (a) => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
      const pct = (a, f) => { if (!a.length) return null; const b = a.slice().sort((x, y) => x - y); return b[Math.min(b.length - 1, Math.floor(f * b.length))]; };
      const r2 = (x) => x == null ? null : Math.round(x * 1000) / 1000;
      const pure = bench.builds.map((b) => b.pure), mesh = bench.builds.map((b) => b.mesh);
      const trA = bench.info && bench.info.trafficMs ? bench.info.trafficMs : [];
      if (bench.info) bench.info.trafficMs = r2(avg(trA));
      if (bench.info && g.traffic) {
        const ts3 = g.traffic.tr.stats;
        Object.assign(bench.info, { near: ts3.near, mid: ts3.mid, far: ts3.far, culled: ts3.culled, nearDenied: ts3.deniedTotal });
      }
      const dbg = gl.getExtension('WEBGL_debug_renderer_info');
      const out = {
        gpu: dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER),
        shot: SHOT, w: renderer.domElement.width, h: renderer.domElement.height,
        builds: bench.builds.length, buildPureAvg: r2(avg(pure)), buildPureMax: r2(Math.max(0, ...pure)),
        buildMeshAvg: r2(avg(mesh)), buildMeshMax: r2(Math.max(0, ...mesh)),
        frameAvg: r2(avg(bench.A.dt)), frameP95: r2(pct(bench.A.dt, 0.95)),
        cpuAvg: r2(avg(bench.A.cpu)), cpuNoCity: r2(avg(bench.B.cpu)),
        gpuAvg: r2(avg(bench.A.gpu)), gpuNoCity: r2(avg(bench.B.gpu)),
        gpuCity: avg(bench.A.gpu) != null && avg(bench.B.gpu) != null ? r2(avg(bench.A.gpu) - avg(bench.B.gpu)) : null,
        gpuSamples: [bench.A.gpu.length, bench.B.gpu.length],
        ...bench.info
      };
      console.error('HKBENCH ' + JSON.stringify(out));
      document.title = 'HKBENCH ' + JSON.stringify(out);
    };
    let topKeys = null;

    const say = (txt, ms, ts) => { state.msg = txt; state.msgUntil = ts + ms; };

    const onEvent = (ev, ts) => {
      const race = state.race;
      if (ev.type === 'start') say('GO', 1200, ts);
      else if (ev.type === 'ring' || ev.type === 'delivery' || ev.type === 'portal') {
        say((ev.type === 'portal' ? 'PORTAL ' : 'RING ') + ev.ri + ' of ' + (race.n - 2) + '   ' + HK.formatTime(ev.time), 1400, ts);
      } else if (ev.type === 'miss') {
        say('MISSED ' + (ev.kind === 'portal' ? 'PORTAL ' : 'RING ') + ev.ri
          + (race.missPenalty > 0 ? '   + ' + race.missPenalty + ' s' : ''), 1600, ts);
      } else if (ev.type === 'finish') {
        const isBest = onFinishRef.current ? onFinishRef.current(race) : false;
        say('FINISH ' + HK.formatRun(ev.time, ev.penalty) + (isBest ? '   best for this seed' : ''), 6000, ts);
        state.splitsText = race.splits.map((t, i) => {
          if (i === race.splits.length - 1) return 'finish ' + HK.formatRun(t, race.penalty);
          const w = race.wps[i + 1];
          return (w.kind === 'portal' ? 'gate ' : 'ring ') + String(i + 1).padStart(2, ' ') + ' ' + HK.formatTime(t)
            + (race.missed.indexOf(w.ri) >= 0 ? '  missed' : '');
        }).join('\n');
      }
      mark();
    };

    const frame = (ts) => {
      raf = requestAnimationFrame(frame);
      const cfg = cfgRef.current;
      const pp = cfg.p, cr = cfg.craft, route = cfg.route, city = cfg.city;
      const c0 = performance.now();
      const dtRaw = last ? (ts - last) / 1000 : 0;
      last = ts;
      const dt = Math.min(0.1, dtRaw);
      if (dtRaw > 0) state.fps = state.fps ? state.fps * 0.95 + 0.05 / dtRaw : 1 / dtRaw;
      /* the menu: a new run (start, restart, quit) resets the ship and the
         race like Backspace did; the title screens fly the attract camera
         and keep the physics off */
      const mst = menuRef.current;
      const live = HK.flightInputLive(mst);
      const attract = HK.menuTitle(mst);
      const newRun = mst.run !== lastRunN;
      if (resetRef.current !== lastReset || route !== lastRoute || newRun) {
        if (route !== lastRoute) state.evCache = new Map();
        lastReset = resetRef.current; lastRoute = route; lastRunN = mst.run; reset();
        state.attD = null;
