        const dis = gl.getParameter(tq.GPU_DISJOINT_EXT);
        gl.deleteQuery(q.q); bench.pendQ.shift();
        if (!dis && q.sink) q.sink.gpu.push(ns / 1e6);
      }
    };
    const benchReport = () => {
      const avg = (a) => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
      const pct = (a, f) => { if (!a.length) return null; const b = a.slice().sort((x, y) => x - y); return b[Math.min(b.length - 1, Math.floor(f * b.length))]; };
      const r2 = (x) => x == null ? null : Math.round(x * 1000) / 1000;
      const pure = bench.builds.map((b) => b.pure), mesh = bench.builds.map((b) => b.mesh);
      const trA = bench.info && bench.info.trafficMs ? bench.info.trafficMs : [];
      if (bench.info) bench.info.trafficMs = r2(avg(trA));
      if (bench.info && g.traffic) {
        const ts3 = g.traffic.tr.stats;
        Object.assign(bench.info, { near: ts3.near, mid: ts3.mid, far: ts3.far, culled: ts3.culled, nearDenied: ts3.deniedTotal });
      }
      const dbg = gl.getExtension('WEBGL_debug_renderer_info');
      const out = {
        gpu: dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER),
        shot: SHOT, w: renderer.domElement.width, h: renderer.domElement.height,
        builds: bench.builds.length, buildPureAvg: r2(avg(pure)), buildPureMax: r2(Math.max(0, ...pure)),
        buildMeshAvg: r2(avg(mesh)), buildMeshMax: r2(Math.max(0, ...mesh)),
        frameAvg: r2(avg(bench.A.dt)), frameP95: r2(pct(bench.A.dt, 0.95)),
        cpuAvg: r2(avg(bench.A.cpu)), cpuNoCity: r2(avg(bench.B.cpu)),
        gpuAvg: r2(avg(bench.A.gpu)), gpuNoCity: r2(avg(bench.B.gpu)),
        gpuCity: avg(bench.A.gpu) != null && avg(bench.B.gpu) != null ? r2(avg(bench.A.gpu) - avg(bench.B.gpu)) : null,
        gpuSamples: [bench.A.gpu.length, bench.B.gpu.length],
        ...bench.info
      };
      console.error('HKBENCH ' + JSON.stringify(out));
      document.title = 'HKBENCH ' + JSON.stringify(out);
    };
    let topKeys = null;

    const say = (txt, ms, ts) => { state.msg = txt; state.msgUntil = ts + ms; };

    const onEvent = (ev, ts) => {
      const race = state.race;
      if (ev.type === 'start') say('GO', 1200, ts);
      else if (ev.type === 'ring' || ev.type === 'delivery' || ev.type === 'portal') {
        say((ev.type === 'portal' ? 'PORTAL ' : 'RING ') + ev.ri + ' of ' + (race.n - 2) + '   ' + HK.formatTime(ev.time), 1400, ts);
      } else if (ev.type === 'miss') {
        say('MISSED ' + (ev.kind === 'portal' ? 'PORTAL ' : 'RING ') + ev.ri
          + (race.missPenalty > 0 ? '   + ' + race.missPenalty + ' s' : ''), 1600, ts);
      } else if (ev.type === 'finish') {
        const isBest = onFinishRef.current ? onFinishRef.current(race) : false;
        say('FINISH ' + HK.formatRun(ev.time, ev.penalty) + (isBest ? '   best for this seed' : ''), 6000, ts);
        state.splitsText = race.splits.map((t, i) => {
          if (i === race.splits.length - 1) return 'finish ' + HK.formatRun(t, race.penalty);
          const w = race.wps[i + 1];
          return (w.kind === 'portal' ? 'gate ' : 'ring ') + String(i + 1).padStart(2, ' ') + ' ' + HK.formatTime(t)
            + (race.missed.indexOf(w.ri) >= 0 ? '  missed' : '');
        }).join('\n');
      }
      mark();
    };

    const frame = (ts) => {
      raf = requestAnimationFrame(frame);
      const cfg = cfgRef.current;
      const pp = cfg.p, cr = cfg.craft, route = cfg.route, city = cfg.city;
      const c0 = performance.now();
      const dtRaw = last ? (ts - last) / 1000 : 0;
      last = ts;
      const dt = Math.min(0.1, dtRaw);
      if (dtRaw > 0) state.fps = state.fps ? state.fps * 0.95 + 0.05 / dtRaw : 1 / dtRaw;
      if (resetRef.current !== lastReset || route !== lastRoute) {
        if (route !== lastRoute) state.evCache = new Map();
        lastReset = resetRef.current; lastRoute = route; reset();
      }

      /* ---- input ---- */
      const cmd = { fwd: 0, right: 0, up: 0, pitch: 0, yaw: 0, roll: 0, main: 0 };
      let holdKill = false;
      const isPaused = pauseRef.current.paused;
      /* the pause clock in seconds: the wall clock without paused stretches */
      const wallT = HK.pauseTime(pauseRef.current, ts) / 1000;
      if (!SHOT && !isPaused) {
        const nav = navRef.current;
        const raw = nav && nav.axes();
        if (raw) {
          const n6 = SpaceNav.norm6(raw, { deadzone: pp.deadzone, curve: pp.curve });
          for (const a of AXES) cmd[a] = n6[DEF_MAP[a]] * DEF_INV[a] * pp.gain;
        }
        const btn = nav ? nav.buttons() : 0;
        if (btn & 2) cmd.main = 1;
        holdKill = !!(btn & 1);
        for (const code in keysRef.current) {
          const m = KEYMAP[code];
          if (m) cmd[m[0]] = cmd[m[0]] + m[1];
        }
        for (const k in cmd) cmd[k] = Math.max(k === 'main' ? 0 : -1, Math.min(1, cmd[k]));
      }

      /* ---- city streaming ----
         Diff the wanted tile window against the loaded tiles. The 3 x 3
         around the ship is built at once (collision needs it), anything else
         one tile per frame, nearest first. Screenshots build everything at
         once. The top view loads every tile under the route. */
      const cityR = g.cityR;
      if (cityR && cityR.owner === city) {
        const sp = state.s;
        const hv = Math.hypot(sp.v[0], sp.v[2]);
        const dirv = hv > 5 ? sp.v : SD.qRot(sp.q, [0, 0, -1]);
        const tb0 = performance.now();
        let ch;
        if (SHOT === 'top') {
          if (!topKeys) {
            topKeys = new Set();
            const b = route.bounds;
            for (let i = Math.floor(b.min[0] / HC.TILE) - 1; i <= Math.floor(b.max[0] / HC.TILE) + 1; i++) {
              for (let k = Math.floor(b.min[2] / HC.TILE) - 1; k <= Math.floor(b.max[2] / HC.TILE) + 1; k++) topKeys.add(HC.tileKey(i, k));
            }
          }
          ch = city.syncKeys(topKeys, topKeys, sp.p, { maxBuilds: Infinity });
        } else {
          /* the ring shot looks at ring 3 from wherever the ship is, so it
             streams around that ring */
          const focus = SHOT === 'ring' ? route.waypoints[Math.min(3, route.n - 1)].p : sp.p;
          ch = city.sync(focus, dirv, { radius: pp.cityRadius, maxBuilds: SHOT ? Infinity : 1 });
        }
        const tb1 = performance.now();
        for (const key of ch.removed) cityR.removeTile(key);
        for (const t of ch.added) {
          const m0 = performance.now();
          cityR.addTile(t);
          if (BENCH) bench.builds.push({ pure: (tb1 - tb0) / ch.added.length, mesh: performance.now() - m0 });
        }
        state.pending = ch.pending;
      }

      /* ---- physics, fixed 1/120 s steps ----
         Flight, then contacts against the boxes within reach and the ground,
         then the race. The race sees each substep, so the crossing time is
         interpolated inside a step of 8 ms. */
      const killing = killRef.current || holdKill;
      const fc = killing ? cfg.killCraft : cr;
      const fcmd = killing ? { ...cmd, pitch: 0, yaw: 0, roll: 0 } : cmd;
      const env = { g: pp.gravity ? G : 0, rho: pp.drag ? HF.RHO : 0 };
      state.acc = isPaused ? 0 : state.acc + dt;
      let steps = 0;
      while (state.acc >= H_STEP && steps < 16) {
        const prev = state.s.p;
        const o = HF.step(fc, state.s, fcmd, env, H_STEP, 1);
        state.s = o.state; state.info = o.info;
        const near = city.boxesNear(state.s.p, 12);
        const blk = cfg.block;
        if (blk) { const mb = MG.boxesNear(blk.block, state.s.p, 12); for (let i = 0; i < mb.length; i++) near.push(mb[i]); }
        let cs = HK.contactsBoxes(state.s, cr.hull.verts, near);
        /* The shaft: its wall, dressing and housing, and the fans, which
           turn on the traffic clock (race time from the start gate on), so
           every run of a seed meets the same blades. Only near the housing. */
        const shf = cfg.shaft;
        if (shf && SHF.near(shf.shaft, state.s.p, 20)) {
          const cw = SHF.contactsWall(state.s, cr.hull.verts, shf.shaft);
          const cf = SHF.contactsFans(state.s, cr.hull.verts, shf.shaft, HK.trafficTime(state.race, state.simT + H_STEP));
          if (cw.length) cs = cs.concat(cw);
          if (cf.length) cs = cs.concat(cf);
        }
        /* Vehicles: the ones whose bounding sphere reaches the ship's, at
           the traffic time of the new state. vs in each contact is the
           vehicle's surface velocity, so a hauler hits like a moving wall. */
        if (g.traffic && cfg.allLanes) {
          const tT = state.tFix != null ? state.tFix : HK.trafficTime(state.race, state.simT + H_STEP);
          const nv = HT.nearVehicles(cfg.allLanes, state.s.p, SHIP_R + 1, tT);
          if (nv.length) {
            const cv = HT.contactsVehicles(state.s, cr.hull.verts, nv, { hull: cfg.geo.collisionHull });
            if (cv.length) cs = cs.concat(cv);
          }
        }
        if (cs.length) {
          const hit = SD.resolve(state.s, cs, cr.I, pp.restitution);
          if (hit) {
            state.s = hit.state;
            if (hit.impact > 1.5) {
              state.hits++;
              const ky = hit.contact.key;
              say((ky === 'g' ? 'GROUND ' : ky[0] === 'v' ? 'TRAFFIC ' : ky === 'sw' || ky === 'sh' ? 'SHAFT ' : ky[0] === 'f' ? 'FAN ' : 'HIT ')
                + fmt(hit.impact, 1) + ' m/s', 1000, ts);
            }
          }
        }
        state.simT += H_STEP;
        const r2 = HK.raceStep(state.race, prev, state.s.p, state.simT * 1000);
        state.race = r2;
        for (let ei = 0; ei < r2.events.length; ei++) onEvent(r2.events[ei], ts);
        state.acc -= H_STEP;
        steps++;
      }
      if (steps >= 16) state.acc = 0;
      if (killRef.current && SD.len(state.s.w) < 2e-3) killRef.current = false;

      /* ---- ship and plumes ---- */
      const s = state.s, info = state.info;
      shipGrp.position.set(s.p[0], s.p[1], s.p[2]);
      shipGrp.quaternion.set(s.q[1], s.q[2], s.q[3], s.q[0]);
      const use = info ? info.assistUse : null;
      const fanAmt = Math.min(1, (use ? Math.max(use.yp, use.yn) : 0) + Math.abs(cmd.up) * 0.8);
      const mainAmt = Math.max(cmd.main, use ? use.boost : 0);
      for (const f of fans) f.scale.set(1, 0.25 + 1.75 * fanAmt, 1);
      for (const m of mains) { m.visible = mainAmt > 0.02; m.scale.set(1, 0.1 + 1.6 * mainAmt, 1); }

      /* ---- sun and shadows ---- */
      sun.castShadow = pp.shadows;
      sun.target.position.set(s.p[0], s.p[1], s.p[2]);
      sun.target.updateMatrixWorld();
      sun.position.set(s.p[0] + sunDir.x * 800, s.p[1] + sunDir.y * 800, s.p[2] + sunDir.z * 800);
      if (pp.shadows) {
        const sc = sun.shadow.camera;
        sc.left = -220; sc.right = 220; sc.top = 220; sc.bottom = -220;
        sc.near = 10; sc.far = 2000;
        sc.updateProjectionMatrix();
      }

      /* ---- camera ---- */
      const L = lookRef.current;
      if (!L.dragging) { L.yaw *= Math.exp(-dt / 0.12); L.pitch *= Math.exp(-dt / 0.12); }
      const look = SD.qMul(SD.qFromRotVec([0, L.yaw, 0]), SD.qFromRotVec([L.pitch, 0, 0]));
      camera.up.set(0, 1, 0);
      if (pp.camMode === 'cockpit' && !SHOT) {
        const cq = SD.qMul(s.q, look);
        const off = SD.qRot(s.q, [0, 1.1, -2.6]);
        camera.position.set(s.p[0] + off[0], s.p[1] + off[1], s.p[2] + off[2]);
        camera.quaternion.set(cq[1], cq[2], cq[3], cq[0]);
      } else {
        state.cam = SD.camStep(state.cam, s.q, dt, pp.camF0, pp.camZeta, pp.camRoll);
        const cq = SD.qMul(state.cam.q, look);
        const off = SD.qRot(cq, [0, pp.camUp * SHIP_L, pp.camDist * SHIP_L]);
        /* collision: the camera moves in along off, so the ship keeps its
           place on screen and the view direction stays the chase one */
        const full = SD.len(off);
        const want = [s.p[0] + off[0], s.p[1] + off[1], s.p[2] + off[2]];
        const cc = camClampAt(cfg, s.p, want, full);
        let dC = state.camD == null ? cc.d : Math.min(state.camD, full);
        if (cc.d < dC) dC = cc.d;
        else dC += (cc.d - dC) * (1 - Math.exp(-dt / CAM_TAU));
        state.camD = dC;
        state.camHit = cc.hit;
        const kC = full > 1e-6 ? dC / full : 1;
        camera.position.set(s.p[0] + off[0] * kC, s.p[1] + off[1] * kC, s.p[2] + off[2] * kC);
        camera.quaternion.set(cq[1], cq[2], cq[3], cq[0]);
      }
      shipGrp.visible = pp.camMode !== 'cockpit' || !!SHOT;
      if (SHOT === 'blockfar' && state.blockC) {
        shipGrp.visible = false;
        camera.position.set(s.p[0], s.p[1], s.p[2]);
        camera.lookAt(state.blockC[0], state.blockC[1], state.blockC[2]);
      } else if (SHOT === 'ring') {
        const w = route.waypoints[Math.min(3, route.n - 1)];
        camera.position.set(w.p[0] - w.dir[0] * 80, w.p[1] - w.dir[1] * 80 + 6, w.p[2] - w.dir[2] * 80);
        camera.lookAt(w.p[0], w.p[1], w.p[2]);
      } else if (SHOT === 'top') {
        const b = route.bounds;
        const cx = (b.min[0] + b.max[0]) / 2, cz = (b.min[2] + b.max[2]) / 2;
        const span = Math.max(b.max[0] - b.min[0], (b.max[2] - b.min[2]) * camera.aspect) / camera.aspect;
        const hgt = span / (2 * Math.tan(camera.fov * Math.PI / 360)) * 1.08 + 200;
        camera.position.set(cx, hgt, cz);
        camera.up.set(0, 0, -1);
        camera.lookAt(cx, 0, cz);
        /* the map view: a thin uniform haze scaled to the height, unless
           the URL asks for a given fog */
        if (!Number.isFinite(URL_FOG)) fog.set({ soupK: 0.004, hazeK: 0.25 / hgt, hazeH: 1e6 });
        if (cityR) cityR.skyline.visible = false;
      }
      if (URL_CAMDX) camera.translateX(URL_CAMDX);
      camera.updateMatrixWorld();
      if (cityR) cityR.update(camera.position, isPaused ? 0 : dt, Number.isFinite(URL_T) ? URL_T : state.simT);

      /* ---- weather and particles ----
         The rain level follows HikyakuCity.weatherAt (auto) or the panel,
         at most a tenth per second, so a switch fades instead of popping.
         It thickens the haze, darkens the sky, wets the ground (lower
         roughness, brighter lamp pools) and shows the streaks. The camera
         velocity skews the streaks and moves the motes past the eye. */
      {
        const mode = URL_WEATHER || pp.weather;
        const target = mode === 'rain' ? 1 : mode === 'dry' ? 0 : HC.weatherAt(wallT, (pp.seed * 7919) >>> 0);
        const dtW = isPaused ? 0 : dt;
        if (state.rain < 0 || SHOT) state.rain = target;
        else state.rain += Math.max(-dtW / 10, Math.min(dtW / 10, target - state.rain));
        const lvl = state.rain;
        if (Math.abs(fog.state.rain - lvl) > 1e-3) fog.set({ rain: lvl });
        if (g.groundMat) {
          g.groundMat.roughness = 0.9 - 0.55 * lvl;
          g.groundMat.emissiveIntensity = 1 + 0.5 * lvl;
        }
        const cp = camera.position;
        if (state.camPrev && dt > 0) {
          const k = Math.min(1, dt * 8);
          for (let i = 0; i < 3; i++) state.camVel[i] += k * ((cp.getComponent(i) - state.camPrev[i]) / dt - state.camVel[i]);
        }
        state.camPrev = [cp.x, cp.y, cp.z];
        rain.update(cp, wallT, lvl, SHOT ? s.v : state.camVel);
        dust.obj.visible = pp.particles;
        if (pp.particles) {
          Dust.update(dust, [cp.x, cp.y, cp.z], { far: 90, sizeNear: 3.2, sizeFar: 1.4, opNear: 0.55, opFar: 0.1,
            edge: 0.3, pix: renderer.getPixelRatio() });
        }
      }
      /* The traffic layer: every pose a closed formula of the traffic time
         (race time once the start gate is crossed, hkcore trafficTime). */
      const tTraffic = state.tFix != null ? state.tFix : HK.trafficTime(state.race, state.simT);
      let trMs = 0;
      if (g.traffic) {
        const t0 = performance.now();
        g.traffic.update(tTraffic, camera);
        trMs = performance.now() - t0;
      }
      if (g.menger) g.menger.update(state.simT, camera.position);

      /* ---- world events (hikyaku-events.js) ----
         Laser exchanges and searchlights on their own clock (the page's
         wall clock; ?t= or 0 on shots), drawn from a schedule that is the
         same for a seed at any time it is asked. Origins: roof pads of the
         loaded city 400 to 1500 m from the ship, to the sides of the
         flight direction for lasers (a ground origin would drown in the
         street fog), a little ahead for searchlights, never in the route
         tube. */
      let evActive = null;
      if (g.events) {
        const evT = SHOT ? (Number.isFinite(URL_T) ? URL_T : 0) : wallT;
        const kinds = [];
        if (pp.lasers) kinds.push('laser');
        if (pp.searchlights) kinds.push('searchlight');
        let evs = [];
        if (kinds.length && pp.liveliness > 0 && cityR) {
          const sp0 = state.s.p, hv0 = Math.hypot(state.s.v[0], state.s.v[2]);
          const fw = hv0 > 5 ? state.s.v : SD.qRot(state.s.q, [0, 0, -1]);
          const fh = Math.hypot(fw[0], fw[2]) || 1, fx = fw[0] / fh, fz = fw[2] / fh;
          let padsNow = null;
          const tubeR = route.cfg.tubeR;
          evs = HE.schedule(route.seed, evT - 1, evT + 1, {
            liveliness: pp.liveliness, kinds, cache: state.evCache, around: sp0, forward: [fx, 0, fz],
            clearance: (q) => route.tube.dist(q) > tubeR + 20,
            pickOrigin: (kind, rng) => {
              if (!padsNow) padsNow = city.pads().filter((pd) => pd.kind === 'roof' && pd.p[1] > 25);
              const ok = [];
              for (const pd of padsNow) {
                const dx = pd.p[0] - sp0[0], dz = pd.p[2] - sp0[2], d = Math.hypot(dx, dz);
                if (d < 400 || d > 1500) continue;
                const c = (dx * fx + dz * fz) / d;
                if (kind === 'laser' ? Math.abs(c) < 0.6 : c > 0.25) ok.push(pd);
              }
              return ok.length ? ok[Math.floor(rng() * ok.length)].p.slice() : null;
            }
          });
        }
        if (URL_EVENT) {
          if (!state.evShot && cityR && !state.pending) {
            const cp0 = camera.position, fd = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            state.evShot = shotEvent(URL_EVENT, evT, [cp0.x, cp0.y, cp0.z], [fd.x, fd.y, fd.z], city.pads());
          }
          if (state.evShot) evs = evs.concat([state.evShot]);
        }
        g.events.update(evT, camera.position, evs);
        for (const ev of evs) {
          if (ev.kind !== 'laser' || evT < ev.tStart || evT > ev.tEnd) continue;
          const d = Math.hypot(ev.origin[0] - s.p[0], ev.origin[1] - s.p[1], ev.origin[2] - s.p[2]);
          if (d < 1500 && (evActive == null || d < evActive)) evActive = d;
        }
      }

      /* ---- music: intensity from the airspeed, smoothed over 3 s; biome
         from where the ship is; rain from the weather level ---- */
      {
        const M = musicRef.current, SW = window.Synthwave;
        if (!isPaused) M.int += (HK.musicIntensity(info ? info.airspeed : 0) - M.int) * (1 - Math.exp(-dt / 3));
        const shf = cfg.shaft, blk = cfg.block;
        M.biome = shf && SHF.near(shf.shaft, s.p, 5) && SHF.inside(shf.shaft, s.p) ? 'shaft'
          : blk && MG.inside(blk.block, s.p, 0) ? 'menger' : 'open';
        if (state.rain > 0.6) M.rain = true; else if (state.rain < 0.4) M.rain = false;
        M.acc += dt;
        if (M.started && SW && M.acc > 0.25) {
          M.acc = 0;
          SW.setIntensity(M.int); SW.setBiome(M.biome); SW.setRain(M.rain);
        }
      }
      /* The shaft's fans on the traffic clock, as in the contacts. Inside
         the duct the sun and the sky light fade (to a fifth, over the first
         40 m behind a mouth): the duct is lit by its own lamps, and the
         courier should not look like it flies in daylight down there. */
      if (g.shaft) g.shaft.update(tTraffic, camera.position);
      {
        const shf = cfg.shaft;
        const dIn = shf ? SHF.depthIn(shf.shaft, [camera.position.x, camera.position.y, camera.position.z]) : -1;
        const kIn = dIn > 0 ? Math.min(1, dIn / 40) : 0;
        sun.intensity = 0.9 * (1 - 0.8 * kIn);
        hemi.intensity = 1.1 * (1 - 0.8 * kIn);
      }

      /* ---- HUD ---- */
      const H = hudRef.current;
      const set = (k, v, cls) => {
        const el = H[k];
        if (!el) return;
        if (el.textContent !== v) el.textContent = v;
        const cn = cls || '';
        if (el.className !== cn) el.className = cn;
      };
      const race = state.race;
      const tNow = state.simT * 1000;
      set('spd', fmt(info ? info.airspeed : 0, 1) + ' m/s');
      set('alt', fmt(s.p[1], 0) + ' m', s.p[1] < 15 ? 'hot' : '');
      set('vs', (s.v[1] >= 0 ? '+' : '') + fmt(s.v[1], 1) + ' m/s');
      const nRings = race.n - 1, nMiss = race.missed.length;
      const taken = race.state === 'idle' ? 0 : (race.state === 'finished' ? nRings : race.next - 1) - nMiss;
      set('ring', taken + ' of ' + nRings + (nMiss ? '   MISSED ' + nMiss : ''), nMiss ? 'hot' : '');
      if (!pp.assist) set('assist', 'off');
      else if (info && info.saturated) set('assist', 'short ' + fmt(info.missing / G, 2) + ' g', 'hot');
      else if (info) {
        const u = info.assistUse;
        const load = Math.max(u.xp, u.xn, u.yp, u.yn, u.zp, u.zn, u.boost);
        set('assist', fmt(load * 100, 0) + ' % load');
      }
      set('hits', String(state.hits), state.hits ? 'hot' : '');
      set('evt', evActive != null ? 'LASER ' + fmt(evActive, 0) + ' m' : '-', evActive != null ? 'acc' : '');
      if (g.traffic && cfg.allLanes) {
        const nv = HT.nearVehicles(cfg.allLanes, s.p, 150, tTraffic);
        let dmin = Infinity;
        for (const v of nv) dmin = Math.min(dmin, SD.len(SD.sub(v.pose.p, s.p)) - HT.TYPES[v.type].radius);
        set('veh', Number.isFinite(dmin) ? fmt(Math.max(0, dmin), 0) + ' m' : '-', dmin < 15 ? 'hot' : '');
        if (g.hullBoxes) g.hullBoxes.update(nv);
      } else set('veh', 'off');
      set('fps', fmt(state.fps, 0));
      set('clock', HK.formatRun(HK.elapsed(race, tNow), race.penalty), race.state === 'finished' ? 'acc' : '');
      set('clockSub', race.state === 'idle' ? 'fly through the start gate'
        : race.state === 'finished' ? 'finished, Backspace to reset'
        : (race.next === race.n - 1 ? 'finish gate next' : 'ring ' + race.next + ' next'));
      if (H.msg) H.msg.textContent = ts < state.msgUntil ? state.msg : '';
      if (H.splits && H.splits.textContent !== state.splitsText) H.splits.textContent = state.splitsText;

      /* ---- the cue to the next waypoint ---- */
      const cue = H.cue;
      if (cue) {
        const wp = race.state === 'finished' ? null : race.wps[race.next];
        if (!wp || SHOT === 'top') cue.style.display = 'none';
        else {
          const W = host.clientWidth || window.innerWidth, Hh = host.clientHeight || window.innerHeight;
          tmpV.set(wp.p[0], wp.p[1], wp.p[2]).applyMatrix4(camera.matrixWorldInverse);
          const front = tmpV.z < 0;
          const dist = Math.hypot(wp.p[0] - s.p[0], wp.p[1] - s.p[1], wp.p[2] - s.p[2]);
          let x, y, onScreen = false, ang = 0;
          if (front) {
            tmpV.applyMatrix4(camera.projectionMatrix);
            if (Math.abs(tmpV.x) < 0.94 && Math.abs(tmpV.y) < 0.9) {
              onScreen = true;
              x = (tmpV.x + 1) / 2 * W; y = (1 - tmpV.y) / 2 * Hh;
            } else { ang = Math.atan2(tmpV.y, tmpV.x); }
          } else {
            /* Behind the camera: point the shortest way round. Straight
               behind has no preferred side, so it points down. */
            ang = (Math.abs(tmpV.x) + Math.abs(tmpV.y) < 1e-6) ? -Math.PI / 2 : Math.atan2(tmpV.y, tmpV.x);
          }
          if (!onScreen) {
            const cx = W / 2, cy = Hh / 2, mx = cx - 46, my = cy - 46;
            const dx = Math.cos(ang), dy = -Math.sin(ang);
            const k = Math.min(mx / Math.max(1e-6, Math.abs(dx)), my / Math.max(1e-6, Math.abs(dy)));
            x = cx + dx * k; y = cy + dy * k;
          }
          cue.style.display = 'block';
          cue.style.transform = 'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px)';
          if (H.cueBox) H.cueBox.style.display = onScreen ? 'block' : 'none';
          if (H.cueArrow) {
            H.cueArrow.style.display = onScreen ? 'none' : 'block';
            H.cueArrow.style.transform = 'rotate(' + (90 - ang * 180 / Math.PI).toFixed(1) + 'deg)';
          }
          if (H.cueD) H.cueD.textContent = fmt(dist, 0) + ' m' + (wp.kind === 'finish' ? ' finish' : wp.kind === 'start' ? ' start' : wp.kind === 'portal' ? ' portal' : '');
        }
      }

      if (!BENCH || bench.done || !cityR) { renderer.render(scene, camera); return; }

      /* ---- bench ---- */
      let sink = null;
      if (bench.phase === 'settle') {
        if (!state.pending) bench.settle++;
        if (bench.settle > 60) {
          bench.phase = 'A';
          const st = cityR.stats();
          bench.info = { tiles: st.tiles, cityTris: st.tris, cityBoxes: st.boxes, trafficMs: [] };
          if (g.traffic) {
            const ts2 = g.traffic.tr.stats;
            bench.info.vehicles = ts2.total; bench.info.lanes = cfg.lanes ? cfg.lanes.lanes.length : 0;
          }
          if (g.menger) bench.info.mengerBuildMs = Math.round(g.menger.stats.buildMs);
          if (g.shaft) { bench.info.shaftBuildMs = Math.round(g.shaft.stats.buildMs); bench.info.shaftTris = g.shaft.stats.tris; }
        }
      } else sink = bench[bench.phase];
      if (sink) cityR.group.visible = bench.phase === 'A';
      let q = null;
      if (tq && bench.pendQ.length < 8) { q = gl.createQuery(); gl.beginQuery(tq.TIME_ELAPSED_EXT, q); }
      renderer.render(scene, camera);
      if (q) { gl.endQuery(tq.TIME_ELAPSED_EXT); bench.pendQ.push({ q, sink }); }
      if (tq) benchPoll();
      if (sink) {
        sink.dt.push(dtRaw * 1000);
        sink.cpu.push(performance.now() - c0);
        if (bench.phase === 'A') bench.info.trafficMs.push(trMs);
        if (bench.phase === 'A' && !bench.info.calls) { bench.info.calls = renderer.info.render.calls; bench.info.tris = renderer.info.render.triangles; }
        if (sink.dt.length >= 120) {
          if (bench.phase === 'A') bench.phase = 'B';
          else if (!bench.pendQ.length || sink.dt.length > 200) {
            bench.done = true; cityR.group.visible = true; benchReport();
          }
        }
      }
    };
    raf = requestAnimationFrame(frame);

    return () => {
      cancelAnimationFrame(raf);
      window.removeEventListener('resize', resize);
      host.removeEventListener('mousedown', onDown);
      window.removeEventListener('mouseup', onUp);
      window.removeEventListener('mousemove', onMove);
      host.removeEventListener('wheel', onWheel);
      ship.dispose();
      dust.geo.dispose(); dust.obj.material.dispose(); rain.dispose();
      renderer.dispose();
      if (renderer.domElement.parentNode) renderer.domElement.parentNode.removeChild(renderer.domElement);
      glRef.current = null;
    };
  }, [ready]);

  /* ---- the world around the route --------------------------------------
     Rebuilt when the route changes: the street-level ground, rings as one
     instanced torus mesh, the two gates, and a faint line along the route.
     The city itself is streamed (effect below and the loop). */
  useEffect(() => {
    const g = glRef.current;
    if (!g) return undefined;
    const THREE = g.THREE;
    const grp = g.worldGrp;
    const wipe = () => {
      grp.traverse((c) => {
        if (c === grp) return;
        if (c.geometry) c.geometry.dispose();
        if (c.material) {
          if (c.material.map) c.material.map.dispose();
          if (c.material.emissiveMap) c.material.emissiveMap.dispose();
          c.material.dispose();
        }
      });
      while (grp.children.length) grp.remove(grp.children[grp.children.length - 1]);
    };
    wipe();

    /* Ground: snapped so a texture repeat sits exactly on a city tile, and
       large enough to reach past the fog in every direction. */
    const T = HC.TILE;
    const b = route.bounds;
    const cx = (b.min[0] + b.max[0]) / 2, cz = (b.min[2] + b.max[2]) / 2;
    const size = Math.ceil((Math.max(b.max[0] - b.min[0], b.max[2] - b.min[2]) + 12000) / (2 * T)) * 2 * T;
    const tx = groundTextures(THREE, g.renderer);
    tx.map.repeat.set(size / T, size / T);
    tx.light.repeat.set(size / T, size / T);
    /* Standard, not Lambert, so rain can make it glossy (the loop lowers
       the roughness with the rain level) */
    const gMat = g.fog.patch(new THREE.MeshStandardMaterial({ map: tx.map, emissiveMap: tx.light,
      emissive: new THREE.Color(1, 1, 1), emissiveIntensity: 1, roughness: 0.9, metalness: 0 }));
    g.groundMat = gMat;
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(size, size).rotateX(-Math.PI / 2), gMat);
    ground.position.set(Math.round(cx / T) * T, 0, Math.round(cz / T) * T);
    ground.receiveShadow = true;
    grp.add(ground);

    /* Rings: one instanced torus, coloured per instance by the race. */
    const ringWps = route.waypoints.filter((w) => w.kind === 'ring');
    if (ringWps.length) {
      const R0 = route.cfg.ringR;
      const tg = new THREE.TorusGeometry(R0, 0.55, 10, 64);
      const tm = g.fog.patch(new THREE.MeshBasicMaterial({ color: 0xffffff, toneMapped: false }), { fogK: 0.45 });
      const rm = new THREE.InstancedMesh(tg, tm, ringWps.length);
      const M = new THREE.Matrix4(), Q = new THREE.Quaternion(), P = new THREE.Vector3(), S = new THREE.Vector3(1, 1, 1);
      const Z = new THREE.Vector3(0, 0, 1), D = new THREE.Vector3();
      ringWps.forEach((w, i) => {
        P.set(w.p[0], w.p[1], w.p[2]);
        Q.setFromUnitVectors(Z, D.set(w.dir[0], w.dir[1], w.dir[2]));
        M.compose(P, Q, S);
        rm.setMatrixAt(i, M);
        rm.setColorAt(i, new THREE.Color(0xffffff));
      });
      rm.instanceMatrix.needsUpdate = true;
      rm.frustumCulled = false;
      grp.add(rm);
      g.rings = { mesh: rm, ri: ringWps.map((w) => w.ri) };
    } else g.rings = null;

    const gs = g.fog.patch(new THREE.MeshBasicMaterial({ color: WARM, toneMapped: false }), { fogK: 0.45 });
    const gf = g.fog.patch(new THREE.MeshBasicMaterial({ color: WARM, toneMapped: false }), { fogK: 0.45 });
    /* The block's portals are their own gates: Menger.build draws the warm
       rim on the mouths, the route adds only the cue. */
    const gb = g.fog.patch(new THREE.MeshLambertMaterial({ color: boneColor(THREE, 0.3, 0.6) }));
    grp.add(gateFrame(THREE, route.waypoints[0], gs, gb));
    grp.add(gateFrame(THREE, route.waypoints[route.n - 1], gf, gb));
    g.gates = { start: gs.color, finish: gf.color };

    if (p.routeLine) {
      const lp = [];
      for (const sm of route.tube.samples) if (sm.u >= 0 && sm.u <= route.n - 1) lp.push(sm.p[0], sm.p[1], sm.p[2]);
      const lg = new THREE.BufferGeometry();
      lg.setAttribute('position', new THREE.Float32BufferAttribute(lp, 3));
      grp.add(new THREE.Line(lg, g.fog.patch(new THREE.LineBasicMaterial({ color: ACCENT, transparent: true, opacity: 0.22, toneMapped: false }), { fogK: 0.6 })));
    }
    if (g.mark) g.mark();
    return undefined;
  }, [ready, route, p.routeLine]);

  /* ---- the city renderer -------------------------------------------------
     One per city object: a new route or a rebuild empties both the pure
     container and the renderer, and the loop streams the tiles back in.
     owner ties the two together, so the loop never feeds one city's tiles
     into another city's renderer. Slots for later steps: the traffic layer
     goes into g.traffic (see the main effect), oversized structures into
     `specials` above, whose boxes the city keeps free; their meshes would
     hang on the scene next to cityR.group. */
  useEffect(() => {
    const g = glRef.current;
    if (!g) return undefined;
    city.clear();
    const q0 = cfgRef.current.p;
    const cr = HC.makeCityRenderer(g.THREE, { fog: g.fog, seed: city.seed, accents: city.cfg.accents, accentColors: CITY_HUES,
      liveliness: q0.liveliness, windowLife: q0.windowLife, beacons: q0.beacons });
    cr.owner = city;
    g.scene.add(cr.group);
    g.cityR = cr;
    return () => {
      cr.dispose();
      if (g.cityR === cr) g.cityR = null;
    };
  }, [ready, city]);

  /* the shader side of the city life follows the panel at once */
  useEffect(() => {
    const g = glRef.current;
    if (g && g.cityR) g.cityR.setLife({ liveliness: p.liveliness, windowLife: p.windowLife, beacons: p.beacons });
  }, [ready, city, p.liveliness, p.windowLife, p.beacons]);

  useEffect(() => {
    const g = glRef.current;
    if (g && (SHOT !== 'top' || Number.isFinite(URL_FOG))) g.fog.set({ density: hazeOf(p) });
  }, [ready, p.fogDensity]);

  /* ---- world events ----
     One fixed pool of laser segments, glows and searchlight cones
     (hikyaku-events.js), fogged by the page's atmosphere; the loop fills
     it from the schedule. */
  useEffect(() => {
    const g = glRef.current;
    if (!g) return undefined;
    const fx = HE.create(g.THREE, { fog: g.fog, colors: { laserGain: 4 } });
    g.scene.add(fx.group);
    g.events = fx;
    return () => {
      fx.dispose();
      if (g.events === fx) g.events = null;
    };
  }, [ready]);

  /* ---- the Menger block ----------------------------------------------
     Built once per route (about 50 ms, off the hot path). Its details keep
     clear of the route's own curve through it, passed as paths. */
  useEffect(() => {
    const g = glRef.current;
    if (!g || !block) return undefined;
    const path = [];
    for (const sm of route.tube.samples) if (MG.inside(block.block, sm.p, 80)) path.push(sm.p);
    const vis = MG.build(g.THREE, block.block, { paths: [path], fog: g.fog, accent: ACCENT, warm: WARM });
    g.scene.add(vis.group);
    g.menger = vis;
    return () => {
      vis.dispose();
      if (g.menger === vis) g.menger = null;
    };
  }, [ready, route, block]);

  /* ---- the ventilation shaft --------------------------------------------
     Built once per route (about 200 ms: the swept wall and the dressing
     along 1.5 km, off the hot path), fogged by the page's atmosphere. The
     loop turns the fans. Cable bundles keep clear of the race line, passed
     as paths. */
  useEffect(() => {
    const g = glRef.current;
    if (!g || !shaftSp) return undefined;
    const path = [];
    for (const sm of route.tube.samples) if (sm.inShaft) path.push(sm.p);
    const vis = SHF.build(g.THREE, shaftSp.shaft, { paths: [path], fog: g.fog, accent: ACCENT, warm: WARM });
    g.scene.add(vis.group);
    g.shaft = vis;
    return () => {
      vis.dispose();
      if (g.shaft === vis) g.shaft = null;
    };
  }, [ready, route, shaftSp]);

  /* ---- traffic ---------------------------------------------------------
     One traffic system for the city lanes, the block's lanes and the
     freighter lanes. The page owns the clock (hkcore trafficTime); the
     loop passes it in. The flat cull band is for the street types only:
     the freighter keeps its own bands (hikyaku-traffic.js TYPE_BANDS). */
  useEffect(() => {
    const g = glRef.current;
    if (!g || !allLanes || !allLanes.length) return undefined;
    const tr = HT.createTraffic(g.THREE, { lanes: allLanes, accents: CITY_HUES, warm: WARM, fog: g.fog, bands: { cull: 1300 } });
    g.scene.add(tr.group);
    g.traffic = { tr, update: (t, camera) => tr.update(t, camera.position) };
    return () => {
      g.scene.remove(tr.group);
      tr.dispose();
      g.traffic = null;
    };
  }, [ready, allLanes]);
  useEffect(() => {
    const g = glRef.current;
    if (g && g.traffic) g.traffic.tr.setDebug(p.trafficTint);
  }, [ready, lanes, p.trafficTint]);

  /* ---- vehicle hull boxes (debug) ----
     The collision boxes of the vehicles within 150 m, as wire boxes, drawn
     from the same poses the contacts use. */
  useEffect(() => {
    const g = glRef.current;
    if (!g || !p.trafficHulls || !lanes) return undefined;
    const THREE = g.THREE, MAX = 48;
    const pos = new Float32Array(MAX * 24 * 3);
    const geoL = new THREE.BufferGeometry();
    geoL.setAttribute('position', new THREE.BufferAttribute(pos, 3).setUsage(THREE.DynamicDrawUsage));
    geoL.setDrawRange(0, 0);
    const line = new THREE.LineSegments(geoL, new THREE.LineBasicMaterial({ color: 0xff5a4a, toneMapped: false }));
    line.frustumCulled = false;
    g.scene.add(line);
    const E = [[0, 1], [2, 3], [4, 5], [6, 7], [0, 2], [1, 3], [4, 6], [5, 7], [0, 4], [1, 5], [2, 6], [3, 7]];
    const hulls = {};
    for (const tn of HT.TYPE_NAMES) hulls[tn] = HT.vehicleHull(tn);
    g.hullBoxes = {
      update(nv) {
        let n = 0;
        for (const v of nv) {
          if (n >= MAX) break;
          const P = v.pose, hv = hulls[v.type].verts;
          const w = hv.map((c) => [
            P.p[0] + P.right[0] * c[0] + P.up[0] * c[1] - P.fwd[0] * c[2],
            P.p[1] + P.right[1] * c[0] + P.up[1] * c[1] - P.fwd[1] * c[2],
            P.p[2] + P.right[2] * c[0] + P.up[2] * c[1] - P.fwd[2] * c[2]]);
          for (const e of E) for (const vi of e) { pos.set(w[vi], n * 72 + (E.indexOf(e) * 2 + e.indexOf(vi)) * 3); }
          n++;
        }
        geoL.setDrawRange(0, n * 24);
        geoL.attributes.position.needsUpdate = true;
      }
    };
    return () => {
      g.scene.remove(line);
      geoL.dispose(); line.material.dispose();
      g.hullBoxes = null;
    };
  }, [ready, lanes, p.trafficHulls]);

  /* ---- collision overlay (debug) ---- */
  useEffect(() => {
    const g = glRef.current;
    if (!g || !p.overlay) return undefined;
    const ov = Courier.collisionOverlay(g.ship, g.THREE);
    g.ship.visual.add(ov.dots);
    g.ship.visual.add(ov.lines);
    return () => {
      g.ship.visual.remove(ov.dots);
      g.ship.visual.remove(ov.lines);
      ov.dispose();
    };
  }, [ready, p.overlay]);

  const hudRow = (k, label) => html`<${React.Fragment} key=${k}>
    <span>${label}</span>
    <b ref=${(el) => { hudRef.current[k] = el; }}>-</b>
  <//>`;
  const H = hudRef.current;
  const bestHere = best[String(p.seed)];

  return html`<${React.Fragment}>
    <div className="hk-stage" ref=${stageRef}></div>
    <a className="hk-back" href="/miscellaneous/#games">${'←'} Games</a>

    <div className="hk-clock">
      <span ref=${(el) => { H.clock = el; }}>0:00.00</span>
      <small ref=${(el) => { H.clockSub = el; }}></small>
    </div>
    <div className="hk-splits" ref=${(el) => { H.splits = el; }}></div>

    <div className="hk-cue" ref=${(el) => { H.cue = el; }}>
      <div className="hk-cue-box" ref=${(el) => { H.cueBox = el; }}></div>
      <div className="hk-cue-arrow" ref=${(el) => { H.cueArrow = el; }}><i></i></div>
      <div className="hk-cue-d" ref=${(el) => { H.cueD = el; }}></div>
    </div>

    <div className="hk-hud">
      <div className="hk-grid">
        ${hudRow('spd', 'AIRSPEED')}
        ${hudRow('alt', 'ALTITUDE')}
        ${hudRow('vs', 'VERTICAL')}
        ${hudRow('ring', 'RINGS')}
        ${hudRow('assist', 'ASSIST')}
        ${hudRow('hits', 'CONTACTS')}
        ${hudRow('veh', 'NEAREST VEHICLE')}
        ${hudRow('evt', 'EVENT')}
        ${hudRow('fps', 'FPS')}
      </div>
    </div>

    ${p.music && !musicLive && !SHOT && !paused ? html`<div className="hk-hint">music starts with the first key</div>` : null}
    ${paused ? html`<div className="hk-pause">
      <b>PAUSED</b>
      <p>Esc or any flight key resumes.</p>
      <p><kbd>W</kbd><kbd>S</kbd> forward and back, <kbd>A</kbd><kbd>D</kbd> slide, <kbd>R</kbd><kbd>F</kbd> lift,
        <kbd>Q</kbd><kbd>E</kbd> roll, arrows pitch and yaw, <kbd>Shift</kbd> boost.
        <br/><kbd>Space</kbd> stop rotation, <kbd>X</kbd> assist, <kbd>G</kbd> gravity, <kbd>C</kbd> view,
        <kbd>Backspace</kbd> back to the start, <kbd>P</kbd> panel, <kbd>M</kbd> music, <kbd>Esc</kbd> pause.</p>
    </div>` : null}

    <div className="hk-msg">
      <span ref=${(el) => { H.msg = el; }}></span>
      ${!SHOT && !NOHID && !dev.supported ? html`<small>This browser has no WebHID, so the 3D mouse cannot connect.
        The keys under "Controls" work in every browser.</small>` : null}
    </div>

    ${!panel ? html`<button className="hk-toggle" onClick=${() => setPanel(true)}>Panel</button>` : html`
    <div className="hk-panel">
      <div className="hk-head">
        <h2>Hikyaku</h2>
        <button className=${'lang-seg' + (paused ? ' active' : '')} onClick=${() => setPaused(!paused)}>${paused ? 'Resume' : 'Pause'}</button>
        <button className="hk-x" onClick=${() => setPanel(false)} aria-label="Close">${'×'}</button>
      </div>
      <p className="hk-desc">A 6DOF courier flight for a 3D mouse. Fly the rings in order against the clock,
        through a city that is built around the route.</p>

      <div className="hk-chips">
        <button className=${'lang-seg' + (dev.name ? ' active' : '')} onClick=${connect}
          disabled=${!dev.supported || NOHID}>${dev.name || 'Connect 3D mouse'}</button>
        <button className="lang-seg" onClick=${() => { resetRef.current++; }}>Reset</button>
        <button className=${'lang-seg' + (p.assist ? ' active' : '')}
          onClick=${() => upd('assist')(!p.assist)}>Assist</button>
      </div>

      <div className="hk-seed">
        <span>Seed</span>
        <input type="number" min="1" step="1" value=${seedText}
          onChange=${(e) => setSeedText(e.target.value)}
          onKeyDown=${(e) => { if (e.key === 'Enter') { const v = parseInt(seedText, 10); if (v > 0) setSeed(v); } }}
          onBlur=${() => { const v = parseInt(seedText, 10); if (v > 0 && v !== p.seed) setSeed(v); else setSeedText(String(p.seed)); }} />
        <button className="lang-seg" onClick=${() => setSeed(1 + Math.floor(Math.random() * 99999))}>New route</button>
      </div>
      <div className="hk-derived">
        <span>Rings and portals, then the finish</span><b>${route.waypoints.filter((w) => w.kind === 'ring').length} + ${route.waypoints.filter((w) => w.kind === 'portal').length} + 1</b>
        <span>On the route</span><b>${route.specials.map((sp) => (sp.kind === 'menger' ? 'block' : sp.kind)).join(', ') || 'open city only'}</b>
        <span>Route length</span><b>${fmt(route.length / 1000, 2)} km</b>
        <span>Tightest curve radius</span><b>${fmt(route.minRadius, 0)} m</b>
        <span>City tile</span><b>${HC.TILE} m, window ${2 * p.cityRadius + 1} x ${2 * p.cityRadius + 1}</b>
        <span>Best for this seed</span><b>${bestHere > 0 ? HK.formatTime(bestHere) : '-'}</b>
      </div>
      <p className="hk-note">The seed is in the address bar. Share the address to fly the same route and compare times.</p>

      <${Seg} label="View" value=${p.camMode} onChange=${upd('camMode')}
        options=${[{ value: 'chase', label: 'Chase' }, { value: 'cockpit', label: 'Cockpit' }]} />

      <${Section} id="run" title="Race and last run" open=${sec === 'run'} onToggle=${toggleSec}
        summary=${(lastRun ? HK.formatRun(lastRun.time, lastRun.penalty) + (lastRun.best ? ', best' : '') : 'no run yet')
          + ', miss + ' + p.missPenalty + ' s'}>
        <${Slider} label="Penalty per missed ring" unit="s" digits=${0} min=${0} max=${30} step=${1}
          value=${p.missPenalty} onChange=${upd('missPenalty')} />
        ${lastRun ? html`<div className="hk-derived">
          ${lastRun.splits.map((t, i) => html`<${React.Fragment} key=${i}>
            <span>${i === lastRun.splits.length - 1 ? 'Finish' : 'Ring ' + (i + 1) + (lastRun.missed.indexOf(i + 1) >= 0 ? ', missed' : '')}</span>
            <b>${i === lastRun.splits.length - 1 ? HK.formatRun(t, lastRun.penalty) : HK.formatTime(t)}</b>
          <//>`)}
        </div>` : html`<p className="hk-note">No finished run on this seed yet.</p>`}
        <p className="hk-note">The clock starts at the start gate and stops at the finish gate. A ring only counts when it
          is the next one, flown in its direction. Fly past it, outside the ring or more than ${HK.DEF_RACE.missDepth} m
          beyond it, and it counts as missed: the cue moves on and the penalty is added to the time. The best time
          includes the penalties. A new penalty applies from the next reset.</p>
      <//>

      <${Section} id="flight" title="Flight model" open=${sec === 'flight'} onToggle=${toggleSec}
        summary=${(p.gravity ? 'gravity' : 'no gravity') + ', ' + (p.drag ? 'drag' : 'no drag') + ', assist ' + (p.assist ? 'on' : 'off')}>
        <div className="hk-chips">
          <button className=${'lang-seg' + (p.gravity ? ' active' : '')} onClick=${() => upd('gravity')(!p.gravity)}>Gravity</button>
          <button className=${'lang-seg' + (p.drag ? ' active' : '')} onClick=${() => upd('drag')(!p.drag)}>Drag</button>
          <button className=${'lang-seg' + (p.assist ? ' active' : '')} onClick=${() => upd('assist')(!p.assist)}>Assist</button>
        </div>
        <${Slider} label="Drag torque" digits=${2} min=${0} max=${1} step=${0.05}
          value=${p.dragTorque} onChange=${upd('dragTorque')} />
        <${Slider} label="Rate damping" digits=${1} min=${0} max=${6} step=${0.1}
          value=${p.rateDamp} onChange=${upd('rateDamp')} />
        <${Slider} label="Restitution" digits=${2} min=${0} max=${0.9} step=${0.05}
          value=${p.restitution} onChange=${upd('restitution')} />
        <${Slider} label="3D mouse gain" digits=${2} min=${0.2} max=${1.5} step=${0.05}
          value=${p.gain} onChange=${upd('gain')} />
        <div className="hk-derived">
          <span>Top speed, nose first</span><b>${fmt(der.noseFirst, 0)} m/s</b>
          <span>Top speed with boost</span><b>${fmt(der.boost, 0)} m/s</b>
          <span>Flat fall, no thrust</span><b>${fmt(der.flatFall, 0)} m/s</b>
        </div>
        <p className="hk-note">The assist spends part of the thrust on holding the ship against gravity, in any attitude.
          Upside down, the weaker reversed fans do that work, so less is left for you. "Assist" in the HUD
          shows how much of the busiest channel the hold uses, and turns amber when it cannot hold.</p>
        <p className="hk-note">Drag acts on the area the hull shows to the wind. Nose first is fast, flat is an air brake.
          "Drag torque" turns the hull in the airflow. At angle of attack it lifts the nose further, so
          some "Rate damping" keeps the ship calm. Rate damping stops a rotation once you let go of that axis.</p>
      <//>

      <${Section} id="budget" title="Thrust budget" open=${sec === 'budget'} onToggle=${toggleSec}
        summary=${'lift ' + fmt(p.bYp, 1) + ' g, boost ' + fmt(p.bBoost, 1) + ' g, ' + fmt(p.mass / 1000, 1) + ' t'}>
        <div className="hk-nums">
          <${Num} label="Lift up" unit="g" value=${p.bYp} step=${0.1} min=${0} onChange=${upd('bYp')} />
          <${Num} label="Lift down" unit="g" value=${p.bYn} step=${0.1} min=${0} onChange=${upd('bYn')} />
          <${Num} label="Forward" unit="g" value=${p.bZn} step=${0.1} min=${0} onChange=${upd('bZn')} />
          <${Num} label="Back" unit="g" value=${p.bZp} step=${0.1} min=${0} onChange=${upd('bZp')} />
          <${Num} label="Right" unit="g" value=${p.bXp} step=${0.1} min=${0} onChange=${upd('bXp')} />
          <${Num} label="Left" unit="g" value=${p.bXn} step=${0.1} min=${0} onChange=${upd('bXn')} />
          <${Num} label="Boost" unit="g" value=${p.bBoost} step=${0.1} min=${0} onChange=${upd('bBoost')} />
          <${Num} label="Mass" unit="kg" value=${p.mass} step=${100} min=${100} onChange=${upd('mass')} />
          <${Num} label="Pitch" unit="r/s2" value=${p.aPitch} step=${0.1} min=${0} onChange=${upd('aPitch')} />
          <${Num} label="Yaw" unit="r/s2" value=${p.aYaw} step=${0.1} min=${0} onChange=${upd('aYaw')} />
          <${Num} label="Roll" unit="r/s2" value=${p.aRoll} step=${0.1} min=${0} onChange=${upd('aRoll')} />
          <${Num} label="Drag coeff." unit="" value=${p.cd} step=${0.05} min=${0} onChange=${upd('cd')} />
        </div>
        <div className="hk-chips">
          <button className="lang-seg" onClick=${() => setP((q) => {
            const o = { ...q };
            for (const k of BUDGET_KEYS) o[k] = DEF[k];
            return o;
          })}>Reset to defaults</button>
        </div>
        <p className="hk-note">Thrust per body axis and direction, in g. The rotation rates are angular accelerations in
          rad/s2. Mass only matters for drag: a heavier ship keeps its speed longer.</p>
      <//>

      <${Section} id="cam" title="Camera" open=${sec === 'cam'} onToggle=${toggleSec}
        summary=${fmt(p.camDist * SHIP_L, 0) + ' m behind, ' + fmt(p.camUp * SHIP_L, 0) + ' m up'}>
        <${Slider} label="Distance" unit="ship lengths" digits=${1} min=${0.8} max=${12} step=${0.1}
          value=${p.camDist} onChange=${upd('camDist')} />
        <${Slider} label="Height" unit="ship lengths" digits=${2} min=${0} max=${2} step=${0.05}
          value=${p.camUp} onChange=${upd('camUp')} />
        <${Slider} label="Follow frequency" unit="Hz" digits=${2} min=${0.1} max=${3} step=${0.05}
          value=${p.camF0} onChange=${upd('camF0')} />
        <${Slider} label="Damping" digits=${2} min=${0.3} max=${1.5} step=${0.01}
          value=${p.camZeta} onChange=${upd('camZeta')} />
        <${Slider} label="Roll follow" digits=${2} min=${0} max=${1} step=${0.05}
          value=${p.camRoll} onChange=${upd('camRoll')} />
        <p className="hk-note">The chase camera follows the ship's attitude with a lag. "Roll follow" sets how much of a
          roll it copies. The mouse wheel also changes the distance.</p>
      <//>

      <${Section} id="city" title="City" open=${sec === 'city'} onToggle=${toggleSec}
        summary=${(cityPending ? 'rebuild to apply, ' : '') + 'up to ' + fmt(cityCfg.maxH, 0) + ' m, variety ' + fmt(cityCfg.variety, 2) + ', ' + cityCfg.accents + ' accent' + (cityCfg.accents === 1 ? '' : 's')}>
        <${Slider} label="Density" digits=${2} min=${0.3} max=${1} step=${0.05}
          value=${p.cityDensity} onChange=${upd('cityDensity')} />
        <${Slider} label="Max height" unit="m" digits=${0} min=${120} max=${500} step=${10}
          value=${p.cityMaxH} onChange=${upd('cityMaxH')} />
        <${Seg} label="Neon accent colours" value=${p.cityAccents} onChange=${upd('cityAccents')}
          options=${[{ value: 0, label: 'None' }, { value: 1, label: 'One' }, { value: 2, label: 'Two' }]} />
        <${Slider} label="Variety" digits=${2} min=${0} max=${1} step=${0.05}
          value=${p.cityVariety} onChange=${upd('cityVariety')} />
        <${Slider} label="District size" unit="m" digits=${0} min=${600} max=${2000} step=${50}
          value=${p.cityDistrict} onChange=${upd('cityDistrict')} />
        <div className="hk-chips">
          <button className=${'lang-seg' + (p.cityLandmarks ? ' active' : '')} onClick=${() => upd('cityLandmarks')(!p.cityLandmarks)}>Landmarks</button>
          <button className=${'lang-seg' + (cityPending ? ' active' : '')} onClick=${rebuildCity}>Rebuild</button>
        </div>
        <${Slider} label="Haze" unit="per km" digits=${1} scale=${1000} min=${0.001} max=${0.008} step=${0.0001}
          value=${p.fogDensity} onChange=${upd('fogDensity')} />
        <${Slider} label="Tile window" unit="tiles each way" digits=${0} min=${2} max=${5} step=${1}
          value=${p.cityRadius} onChange=${upd('cityRadius')} />
        <p className="hk-note">Density, height, accents, variety, district size and landmarks apply on "Rebuild".
          "Variety" mixes in residential and industrial districts with their own building types and facades;
          at 0 the city is the old uniform field of setback towers. Landmarks stand one per 2.6 km cell, 150 to
          400 m beside the route. The city never builds inside the
          45 m tube around the route: buildings there are lowered, split into a canyon or left out, so every ring
          stays reachable. Bridges and cables keep clear of the three future traffic altitudes
          (${HC.LANE_Y.join(', ')} m). The tile window loads around the ship, biased forward; fog hides its edge.
          "Haze" sets the fog above the roofs. The fog in the streets stays dense at any setting, and it thins out
          above about 60 m. "Max height" is the top of the regular towers; a few landmarks reach a fifth higher.</p>
      <//>

      <${Section} id="traffic" title="Traffic" open=${sec === 'traffic'} onToggle=${toggleSec}
        summary=${!p.traffic ? 'off' : (TRAFFIC_DENSITIES.find((d) => d.value === p.trafficDensity) || { label: fmt(p.trafficDensity, 2) }).label.toLowerCase()
          + (lanes ? ', ' + lanes.stats.vehicles + ' vehicles' : '')}>
        <div className="hk-chips">
          <button className=${'lang-seg' + (p.traffic ? ' active' : '')} onClick=${() => upd('traffic')(!p.traffic)}>Traffic</button>
          <button className=${'lang-seg' + (p.trafficTint ? ' active' : '')} onClick=${() => upd('trafficTint')(!p.trafficTint)}
            disabled=${!p.traffic}>LOD tint</button>
          <button className=${'lang-seg' + (p.trafficHulls ? ' active' : '')} onClick=${() => upd('trafficHulls')(!p.trafficHulls)}
            disabled=${!p.traffic}>Hull boxes</button>
        </div>
        <${Seg} label="Density" value=${p.trafficDensity} onChange=${upd('trafficDensity')} options=${TRAFFIC_DENSITIES} />
        ${lanes ? html`<div className="hk-derived">
          <span>Lanes, city and block</span><b>${lanes.stats.city - (lanes.specs.filter((q) => q.kind === 'city' && q.fix === 'dropped').length)} + ${lanes.stats.block - (lanes.specs.filter((q) => q.kind === 'menger' && q.fix === 'dropped').length)}</b>
          <span>Vehicles</span><b>${lanes.stats.vehicles}</b>
          <span>Crossings of the race line</span><b>${lanes.stats.crossings}</b>
          <span>Gaps cut: phase, empty slots, spacing</span><b>${lanes.stats.phased} / ${lanes.stats.emptied} / ${lanes.stats.spaced}</b>
          <span>Lanes dropped</span><b>${lanes.stats.dropped}</b>
        </div>` : null}
        <p className="hk-note">Vehicles fly fixed lanes along the streets, x and z on different altitudes, so lanes never cross
          each other. Traffic never dodges, and its clock is the race clock: the same seed always meets the same traffic.
          Where a lane crosses the race line, the generator cut a gap of at least 3 s around the time a ship at 45 m/s
          gets there. Fly faster or slower and the gap moves away from you. "LOD tint" colours the three detail levels,
          "Hull boxes" shows the collision boxes of nearby vehicles.</p>
      <//>

      <${Section} id="world" title="World" open=${sec === 'world'} onToggle=${toggleSec}
        summary=${'liveliness ' + fmt(p.liveliness, 2) + (p.freighters ? ', freighters' : '') + (cityPending ? ', rebuild to apply' : '')}>
        <${Slider} label="Liveliness" digits=${2} min=${0} max=${1} step=${0.05}
          value=${p.liveliness} onChange=${upd('liveliness')} />
        <div className="hk-chips">
          <button className=${'lang-seg' + (p.holograms ? ' active' : '')} onClick=${() => upd('holograms')(!p.holograms)}>Holograms</button>
          <button className=${'lang-seg' + (p.beacons ? ' active' : '')} onClick=${() => upd('beacons')(!p.beacons)}>Beacons</button>
          <button className=${'lang-seg' + (p.windowLife ? ' active' : '')} onClick=${() => upd('windowLife')(!p.windowLife)}>Window life</button>
        </div>
        <div className="hk-chips">
          <button className=${'lang-seg' + (p.freighters ? ' active' : '')} onClick=${() => upd('freighters')(!p.freighters)}>Freighters</button>
          <button className=${'lang-seg' + (p.lasers ? ' active' : '')} onClick=${() => upd('lasers')(!p.lasers)}>Lasers</button>
          <button className=${'lang-seg' + (p.searchlights ? ' active' : '')} onClick=${() => upd('searchlights')(!p.searchlights)}>Searchlights</button>
          <button className=${'lang-seg' + (cityPending ? ' active' : '')} onClick=${rebuildCity}>Rebuild</button>
        </div>
        <${Slider} label="Freighter density" digits=${2} min=${0} max=${1} step=${0.05}
          value=${p.freightDensity} onChange=${upd('freightDensity')} />
        ${lanes && p.freighters ? html`<div className="hk-derived">
          <span>Freighter lanes on this route</span><b>${lanes.freight.length} of ${route.freight.lanes.length}</b>
        </div>` : null}
        <p className="hk-note">"Liveliness" scales every rare thing in the world at once, 0 switches all of it off.
          Holograms hang between neighbouring towers of similar height, beacons blink red on masts and tall towers.
          Both are placed with the city, so they, and the liveliness they were placed with, apply on "Rebuild".
          "Window life" lets lit windows change over time; it and the blinking follow the slider at once.</p>
        <p className="hk-note">Freighters are 160 m long and fly slowly on lanes of their own, along x at 280 m and along z
          at 320 m, far above the street traffic. Each lane carries one, and it is there less than half the time. The city
          keeps a 60 m wide corridor under every freighter lane free from 220 m up. Where the race line crosses a
          freighter lane, the freighter leaves a gap of 3 s, like the street lanes. Lasers are rare green exchanges
          between rooftops, searchlights slow pale cones from roofs and drones.</p>
      <//>

      <${Section} id="music" title="Music" open=${sec === 'music'} onToggle=${toggleSec}
        summary=${(musicLive ? 'playing' : p.music ? 'on, starts with the first key' : 'off') + ', ' + p.musicBpm + ' bpm'}>
        <div className="hk-chips">
          <button data-music="1" className=${'lang-seg' + (musicLive ? ' active' : '')} onClick=${musicToggle}>${musicLive ? 'Music on' : 'Music off'}</button>
        </div>
        <${Slider} label="Volume" digits=${2} min=${0} max=${1} step=${0.05}
          value=${p.musicVolume} onChange=${upd('musicVolume')} />
        <${Slider} label="Tempo" unit="bpm" digits=${0} min=${90} max=${140} step=${1}
          value=${p.musicBpm} onChange=${upd('musicBpm')} />
        <div className="hk-nums">
          <${Num} label="Music seed" unit="" value=${p.musicSeed} step=${1} min=${1} onChange=${(v) => upd('musicSeed')(Math.max(1, Math.round(v)))} />
        </div>
        <p className="hk-note">Endless generated synthwave, made in the browser. It gets more intense with your airspeed,
          changes its colour inside the block and the shaft, and hears the rain. <kbd>M</kbd> switches it on and off.
          The browser only allows sound after a key or a click, so a stored "on" waits for the first one.</p>
      <//>

      <${Section} id="debug" title="Display and debug" open=${sec === 'debug'} onToggle=${toggleSec}>
        <div className="hk-chips">
          <button className=${'lang-seg' + (p.routeLine ? ' active' : '')} onClick=${() => upd('routeLine')(!p.routeLine)}>Route line</button>
          <button className=${'lang-seg' + (p.overlay ? ' active' : '')} onClick=${() => upd('overlay')(!p.overlay)}>Collision hull</button>
          <button className=${'lang-seg' + (p.shadows ? ' active' : '')} onClick=${() => upd('shadows')(!p.shadows)}>Shadows</button>
          <button className=${'lang-seg' + (p.particles ? ' active' : '')} onClick=${() => upd('particles')(!p.particles)}>Particles</button>
        </div>
        <${Seg} label="Weather" value=${p.weather} onChange=${upd('weather')}
          options=${[{ value: 'auto', label: 'Auto' }, { value: 'dry', label: 'Dry' }, { value: 'rain', label: 'Rain' }]} />
        <p className="hk-note">"Collision hull" shows the 18 points and the hull the physics uses. Shadows are off by default
          because they cost frame time. "Particles" are the drifting motes that show your speed. On "Auto", rain comes
          and goes: a shower of 40 to 90 s in most five-minute stretches, fading in and out over 10 s.</p>
      <//>

      <${Section} id="keys" title="Controls" open=${sec === 'keys'} onToggle=${toggleSec}>
        <p className="hk-note">
          3D mouse: the cap drives all six axes. Right button: boost. Left button: stop rotation while held.
          <br/>Keys: <kbd>W</kbd><kbd>S</kbd> forward and back, <kbd>A</kbd><kbd>D</kbd> slide,
          <kbd>R</kbd><kbd>F</kbd> lift up and down, <kbd>Q</kbd><kbd>E</kbd> roll,
          arrow keys pitch and yaw (up pushes the nose down), <kbd>Shift</kbd> boost.
          <br/><kbd>Space</kbd> stop rotation, <kbd>X</kbd> flight assist, <kbd>G</kbd> gravity, <kbd>C</kbd> view,
          <kbd>Backspace</kbd> back to the start, <kbd>P</kbd> panel, <kbd>M</kbd> music,
          <kbd>Esc</kbd> pause (Esc or any flight key resumes).
          <br/>Mouse: left drag looks around, middle click stops rotation, wheel sets the chase distance.
          <br/>All settings, the panel included, are kept in this browser across reloads.
        </p>
      <//>
    </div>`}
  <//>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
  </script>
</body>
</html>
