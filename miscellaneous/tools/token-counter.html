  <style>
    .tc-wrap { max-width: 920px; }
    /* Eingabebereich mit farbiger Token-Ebene: transparentes Textfeld über
       einer deckungsgleichen Backdrop, die die Tokens einfärbt. */
    .tc-editor { position: relative; min-height: 240px; }
    .tc-editor .tc-input,
    .tc-editor .tc-backdrop {
      box-sizing: border-box; width: 100%; min-height: 240px; margin: 0;
      padding: 14px 16px; border: 1px solid var(--pico-form-element-border-color, rgba(255,255,255,.18));
      border-radius: 11px; font-family: inherit; font-size: 1rem; line-height: 1.6;
      letter-spacing: normal; tab-size: 4;
      white-space: pre-wrap; overflow-wrap: break-word; word-break: normal;
    }
    .tc-backdrop {
      position: absolute; inset: 0; overflow: hidden;
      color: #e2e8f0; background: var(--pico-form-element-background-color, var(--pico-card-background-color));
      border-color: transparent; pointer-events: none; user-select: none; z-index: 1;
    }
    .tc-backdrop span { border-radius: 3px; }
    .tc-input {
      position: relative; z-index: 2; resize: vertical;
      background: transparent; color: transparent;
      -webkit-text-fill-color: transparent; caret-color: var(--pico-primary);
    }
    .tc-input::placeholder { color: var(--pico-muted-color); -webkit-text-fill-color: var(--pico-muted-color); opacity: 1; }
    .tc-input::selection { background: rgba(148,163,184,.35); }
    .tc-toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 10px 0 0; }
    .tc-toolbar .spacer { flex: 1 1 auto; }
    .tc-btn {
      font-size: .82rem; padding: 6px 12px; border-radius: 7px;
      background: transparent; color: var(--pico-muted-color);
      border: 1px solid var(--pico-muted-border-color, rgba(255,255,255,.14));
      cursor: pointer; line-height: 1.2; width: auto; margin: 0;
    }
    .tc-btn:hover { color: var(--pico-primary); border-color: var(--pico-primary); }

    .tc-stats {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr));
      gap: 12px; margin: 20px 0 8px;
    }
    .tc-tile {
      background: var(--pico-card-background-color);
      border: 1px solid var(--pico-card-border-color, rgba(255,255,255,.08));
      border-radius: 11px; padding: 13px 15px;
    }
    .tc-tile .num {
      font-size: 1.55rem; font-weight: 700; color: #e2e8f0;
      line-height: 1.1; font-variant-numeric: tabular-nums;
    }
    .tc-tile .lbl {
      font-size: .7rem; text-transform: uppercase; letter-spacing: .045em;
      color: var(--pico-muted-color); margin-top: 5px;
    }
    .tc-tile .sub { font-size: .66rem; color: var(--pico-muted-color); opacity: .68; margin-top: 2px; }

    .tc-hero {
      grid-column: 1 / -1;
      display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
      background:
        radial-gradient(120% 160% at 0% 0%, color-mix(in srgb, var(--pico-primary) 16%, transparent), transparent 60%),
        var(--pico-card-background-color);
      border-color: color-mix(in srgb, var(--pico-primary) 32%, transparent);
    }
    .tc-hero .num { font-size: 2.7rem; color: var(--pico-primary); }
    .tc-hero .lbl { margin-top: 0; font-size: .78rem; }

    .tc-note { margin-top: 22px; font-size: .78rem; color: var(--pico-muted-color); line-height: 1.7; }
    .tc-note code { font-size: .9em; }
    .tc-privacy { margin-top: 8px; font-size: .72rem; color: #475569; line-height: 1.6; }
    .tc-warn { color: #fbbf24; font-size: .8rem; margin-top: 10px; }
  </style>

    "author": {
      "@type": "Person",

      "name": "Alexander Alber",
      "url": "https://alber.me/alexander/"
    },
    "isAccessibleForFree": true,
    "browserRequirements": "Requires JavaScript"
  }

<body>

    <nav>
      <ul>
        <li><a href="/"><span class="site-logo" aria-label="alber.me"></span></a></li>
      </ul>
      <ul>
        <li><a href="/miscellaneous/" aria-current="page">Miscellaneous</a></li>
        <li class="lang-switcher">
          <button class="lang-seg" data-lang="en">EN</button><button class="lang-seg" data-lang="de">DE</button>
        </li>
      </ul>
    </nav>
  </header>

  <script>
    (function () {
      var urlLang = new URLSearchParams(location.search).get('lang');
      if (urlLang === 'en' || urlLang === 'de') { try { localStorage.setItem('lang', urlLang); } catch (e) {} }
      var l = urlLang;
      if (l !== 'en' && l !== 'de') { try { l = localStorage.getItem('lang') || 'de'; } catch (e) { l = 'de'; } }
      document.querySelectorAll('.lang-seg').forEach(function (btn) {
        if (btn.getAttribute('data-lang') === l) btn.classList.add('active');
        btn.onclick = function () {
          var lang = btn.getAttribute('data-lang');
          try { localStorage.setItem('lang', lang); } catch (e) {}
          var url = new URL(location.href);
          if (lang === 'de') url.searchParams.delete('lang'); else url.searchParams.set('lang', lang);
          location.replace(url.href);
        };
      });
    })();
  </script>

  <main>
    <p class="container" style="margin-bottom:0;padding-top:var(--pico-spacing);">
      <a href="/miscellaneous/">← Sonstiges</a>
    </p>
    <script>if((localStorage.getItem('lang')||'de')==='en')document.currentScript.previousElementSibling.querySelector('a').textContent='← Miscellaneous';</script>
    <div id="root">
      <div class="container">
        <h1 style="font-size:1.5rem;color:#cbd5e1;margin-bottom:8px">Token- &amp; Zeichenzähler</h1>
        <p style="color:#94a3b8;max-width:70ch">Text einfügen und live Tokens, Zeichen, Wörter, Sätze, Zeilen und Bytes zählen.</p>
      </div>
    </div>
  </main>

  <script type="text/babel">
    const { useState, useMemo, useEffect, useRef } = React;
    const LANG = localStorage.getItem('lang') || 'de';

    const VIZ_CAP = 2500;               // max. Tokens in der Visualisierung
    const DEBOUNCE_MS = 140;            // Verzögerung für Token-Berechnung
    const WPM = 200;                    // Wörter pro Minute (Lesezeit)
    const TOK = typeof window !== 'undefined' ? window.GPTTokenizer_o200k_base : null;

    const TOK_COLORS = [
      'rgba(56,189,248,.22)', 'rgba(52,211,153,.22)', 'rgba(251,191,36,.20)',
      'rgba(244,114,182,.22)', 'rgba(167,139,250,.24)',
    ];

    const STRINGS = {
      de: {
        title: "Token- & Zeichenzähler",
        subtitle: "Text einfügen - Tokens, Zeichen, Wörter und mehr live gezählt.",
        placeholder: "Text hier einfügen oder tippen …",
        clear: "Leeren",
        sample: "Beispiel",
        colorsOn: "Färbung: an",
        colorsOff: "Färbung: aus",
        tokens: "Tokens",
        tokensSub: "o200k_base · GPT-4o / o-Serie",
        words: "Wörter",
        chars: "Zeichen",
        charsNoSpace: "Zeichen (ohne Leerz.)",
        sentences: "Sätze",
        lines: "Zeilen",
        bytes: "Bytes (UTF-8)",
        reading: "Lesezeit",
        readingSub: "~200 W/Min",
        min: "Min",
        vizTrunc: n => `Ab ${n.toLocaleString('de-DE')} Tokens wird nicht mehr eingefärbt (die Zählung bleibt exakt).`,
        noTokenizer: "Tokenizer konnte nicht geladen werden - Token-Zählung nicht verfügbar.",
        note1: "Tokens werden mit dem o200k_base-Tokenizer gezählt, den OpenAI für GPT-4o, GPT-4.1 und die o-Serie nutzt.",
        note2: "Andere moderne Modelle verwenden ähnliche, aber nicht identische Tokenizer - die Zahl ist eine gute Näherung, für ein bestimmtes Modell aber nicht exakt. Claude, Gemini und Llama haben eigene Tokenizer und zählen etwas anders, besonders bei Code, Zahlen und nicht-englischem Text.",
        privacy: "Alles läuft lokal in deinem Browser. Kein Text wird gesendet, gespeichert oder getrackt.",
        sampleText: "Die Grenzen meiner Sprache bedeuten die Grenzen meiner Welt. Ein Token ist die kleinste Einheit, in die ein Sprachmodell Text zerlegt - oft ein Wortteil, manchmal ein ganzes Wort, manchmal nur ein Zeichen. 你好, 🎉 und Emojis brauchen häufig mehrere Tokens.",
      },
      en: {
        title: "Token & Character Counter",
        subtitle: "Paste text - tokens, characters, words and more counted live.",
        placeholder: "Paste or type your text here …",
        clear: "Clear",
        sample: "Sample",
        colorsOn: "Colors: on",
        colorsOff: "Colors: off",
        tokens: "Tokens",
        tokensSub: "o200k_base · GPT-4o / o-series",
        words: "Words",
        chars: "Characters",
        charsNoSpace: "Characters (no spaces)",
        sentences: "Sentences",
        lines: "Lines",
        bytes: "Bytes (UTF-8)",
        reading: "Reading time",
        readingSub: "~200 wpm",
        min: "min",
        vizTrunc: n => `Above ${n.toLocaleString('en-US')} tokens highlighting is off (the count stays exact).`,
        noTokenizer: "Tokenizer failed to load - token counting unavailable.",
        note1: "Tokens are counted with the o200k_base tokenizer that OpenAI uses for GPT-4o, GPT-4.1 and the o-series.",
        note2: "Other modern models use similar but not identical tokenizers - the number is a good approximation but not exact for any given model. Claude, Gemini and Llama have their own tokenizers and count somewhat differently, especially for code, numbers and non-English text.",
        privacy: "Everything runs locally in your browser. No text is sent, stored or tracked.",
        sampleText: "The limits of my language mean the limits of my world. A token is the smallest unit a language model splits text into - often a word piece, sometimes a whole word, sometimes just a character. 你好, 🎉 and emoji frequently take several tokens.",
      },
    };

    const LOCALE = LANG === 'de' ? 'de-DE' : 'en-US';
    const fmt = n => n.toLocaleString(LOCALE);

    // Segmenter einmalig anlegen (Wort-/Satzgrenzen)
    const hasSeg = typeof Intl !== 'undefined' && Intl.Segmenter;
    const wordSeg = hasSeg ? new Intl.Segmenter(undefined, { granularity: 'word' }) : null;
    const sentSeg = hasSeg ? new Intl.Segmenter(undefined, { granularity: 'sentence' }) : null;

    function countChars(t) { return [...t].length; }
    function countCharsNoSpace(t) { return [...t.replace(/\s+/g, '')].length; }
    function countWords(t) {
      if (!t.trim()) return 0;
      if (wordSeg) { let n = 0; for (const s of wordSeg.segment(t)) if (s.isWordLike) n++; return n; }
      return t.trim().split(/\s+/).length;
    }
    function countSentences(t) {
      if (!t.trim()) return 0;
      if (sentSeg) { let n = 0; for (const s of sentSeg.segment(t)) if (s.segment.trim()) n++; return n; }
      const m = t.match(/[^.!?…]+[.!?…]+/g); return m ? m.length : 1;
    }
    function countLines(t) { return t.length === 0 ? 0 : t.split(/\r\n|\r|\n/).length; }
    function countBytes(t) { return new TextEncoder().encode(t).length; }

    function TokenCounter() {
      const t = STRINGS[LANG] || STRINGS.de;
      const [text, setText] = useState('');
      const [debounced, setDebounced] = useState('');
      const [highlight, setHighlight] = useState(true);
      const taRef = useRef(null);
      const backdropRef = useRef(null);

      // Zeichen/Wörter/… sofort; Token-Berechnung leicht verzögert
      useEffect(() => {
        const id = setTimeout(() => setDebounced(text), DEBOUNCE_MS);
        return () => clearTimeout(id);
      }, [text]);

      const basic = useMemo(() => ({
        chars: countChars(text),
        charsNoSpace: countCharsNoSpace(text),
        words: countWords(text),
        sentences: countSentences(text),
        lines: countLines(text),
        bytes: countBytes(text),
      }), [text]);

      const tokenData = useMemo(() => {
        if (!TOK) return { count: null, ids: null };
        if (!debounced) return { count: 0, ids: [] };
        const ids = TOK.encode(debounced);
        return { count: ids.length, ids };
      }, [debounced]);

      const pieces = useMemo(() => {
        if (!highlight || !TOK || !tokenData.ids || !tokenData.ids.length || tokenData.ids.length > VIZ_CAP) return null;
        const out = [];
        for (const p of TOK.decodeGenerator(tokenData.ids)) out.push(p);
        return out;
      }, [highlight, tokenData]);

      const truncated = tokenData.ids && tokenData.ids.length > VIZ_CAP;

      // Backdrop nur einfärben, wenn der berechnete Text exakt dem aktuellen entspricht
      // (sonst kurz beim Tippen: einfacher Text, deckungsgleich ausgerichtet).
      const colored = highlight && pieces && debounced === text;

      // Scroll der Backdrop mit dem Textfeld synchron halten
      const syncScroll = () => {
        const b = backdropRef.current, a = taRef.current;
        if (b && a) { b.scrollTop = a.scrollTop; b.scrollLeft = a.scrollLeft; }
      };
      useEffect(syncScroll, [text, colored]);

      const readMin = basic.words / WPM;
      const readVal = basic.words === 0 ? '0'
        : readMin < 1 ? '<1'
        : readMin < 10 ? readMin.toFixed(1)
        : String(Math.round(readMin));

      return (
        <div className="container tc-wrap" style={{ paddingTop: 'var(--pico-spacing)', paddingBottom: 40 }}>
          <hgroup style={{ marginBottom: 18 }}>
            <h1 style={{ marginBottom: 4 }}>{t.title}</h1>
            <p style={{ color: '#94a3b8', margin: 0 }}>{t.subtitle}</p>
          </hgroup>

          <div className="tc-editor">
            <div className="tc-backdrop" ref={backdropRef} aria-hidden="true">
              {colored
                ? pieces.map((p, i) => (
                    <span key={i} style={{ background: TOK_COLORS[i % TOK_COLORS.length] }}>{p}</span>
                  ))
                : text}
              {'\n'}
            </div>
            <textarea
              ref={taRef}
              className="tc-input"
              value={text}
              onChange={e => setText(e.target.value)}
              onScroll={syncScroll}
              placeholder={t.placeholder}
              spellCheck={false}
              autoFocus
            />
          </div>

          <div className="tc-toolbar">
            <button className="tc-btn" onClick={() => setText('')}>{t.clear}</button>
            <button className="tc-btn" onClick={() => setText(t.sampleText)}>{t.sample}</button>
            <span className="spacer"></span>
            <button className="tc-btn" onClick={() => setHighlight(v => !v)} disabled={!TOK}>
              {highlight ? t.colorsOn : t.colorsOff}
            </button>
          </div>

          {!TOK && <p className="tc-warn">{t.noTokenizer}</p>}

          <div className="tc-stats">
            <div className="tc-tile tc-hero">
              <span className="num">{tokenData.count == null ? '-' : fmt(tokenData.count)}</span>
              <span>
                <span className="lbl">{t.tokens}</span>
                <span className="sub" style={{ display: 'block' }}>{t.tokensSub}</span>
              </span>
            </div>

            <div className="tc-tile"><div className="num">{fmt(basic.words)}</div><div className="lbl">{t.words}</div></div>
            <div className="tc-tile"><div className="num">{fmt(basic.chars)}</div><div className="lbl">{t.chars}</div></div>
            <div className="tc-tile"><div className="num">{fmt(basic.charsNoSpace)}</div><div className="lbl">{t.charsNoSpace}</div></div>
            <div className="tc-tile"><div className="num">{fmt(basic.sentences)}</div><div className="lbl">{t.sentences}</div></div>
            <div className="tc-tile"><div className="num">{fmt(basic.lines)}</div><div className="lbl">{t.lines}</div></div>
            <div className="tc-tile"><div className="num">{fmt(basic.bytes)}</div><div className="lbl">{t.bytes}</div></div>
            <div className="tc-tile"><div className="num">{readVal}</div><div className="lbl">{t.reading}</div><div className="sub">{t.min} · {t.readingSub}</div></div>
          </div>

          {highlight && truncated && <p className="tc-privacy" style={{ marginTop: 8 }}>{t.vizTrunc(VIZ_CAP)}</p>}

          <p className="tc-note">
            {t.note1}<br />
            {t.note2}
          </p>
          <p className="tc-privacy">{t.privacy}</p>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<TokenCounter />);
  </script>

  <footer class="container">

  </footer>
