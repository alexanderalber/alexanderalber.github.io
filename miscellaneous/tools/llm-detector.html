    const t = STRINGS[LANG] || STRINGS.de;

    const pct = x => Math.round(x * 100);
    const fmtNum = (x, d) => x.toLocaleString(LOCALE, { minimumFractionDigits: d, maximumFractionDigits: d });

    // Dieselbe Normalisierung wie die Engine, damit die Span-Offsets passen.
    function normalizeText(s) {
      return s.replace(/\r\n/g, "\n").normalize("NFC");
    }

    function verdictFor(p) {
      if (p >= 0.85) return t.verdictStrongLlm;
      if (p >= 0.6) return t.verdictLeanLlm;
      if (p > 0.4) return t.verdictUnclear;
      if (p > 0.15) return t.verdictLeanHuman;
      return t.verdictStrongHuman;
    }

    function probColor(p) {
      if (p >= 0.7) return '#fbbf24';
      if (p <= 0.3) return '#34d399';
      return '#cbd5e1';
    }

    // Spans in nicht überlappende Segmente auflösen; KI-Phrasen gewinnen
    // gegenüber Verbindungswörtern, wenn sie sich überschneiden.
    function buildSegments(normText, spans) {
      const marks = [];
      (spans.ai_phrases || []).forEach(s => marks.push({ start: s.start, end: s.end, kind: 'ai' }));
      (spans.connectors || []).forEach(s => marks.push({ start: s.start, end: s.end, kind: 'conn' }));
      marks.sort((a, b) => a.start - b.start || (a.kind === 'ai' ? -1 : 1));

      const out = [];
      let cursor = 0;
      for (const m of marks) {
        const start = Math.max(m.start, cursor);
        if (start >= m.end || m.end > normText.length) continue;
        if (start > cursor) out.push({ text: normText.slice(cursor, start), kind: null });
        out.push({ text: normText.slice(start, m.end), kind: m.kind });
        cursor = m.end;
      }
      if (cursor < normText.length) out.push({ text: normText.slice(cursor), kind: null });
      return out;
    }

    function Scale({ p, band }) {
      const lo = clamp01(p - band), hi = clamp01(p + band);
      return (
        <div className="ld-scale">
          <div className="track"></div>
          <div className="band" style={{ left: (lo * 100) + '%', width: ((hi - lo) * 100) + '%' }}></div>
          <div className="pin" style={{ left: (p * 100) + '%' }}></div>
          <div className="ends"><span>0 % · {t.endHuman}</span><span>{t.endLlm} · 100 %</span></div>
        </div>
      );
    }

    function Features({ features }) {
      const sorted = [...features].sort((a, b) => Math.abs(b.contribution) - Math.abs(a.contribution));
      const max = Math.max(...sorted.map(f => Math.abs(f.contribution)), 1e-6);
      return (
        <div className="ld-feats">
          {sorted.map(f => {
            const rel = Math.abs(f.contribution) / max;   // 0..1 der halben Balkenbreite
            const w = rel * 50;
            const pos = f.contribution > 0;
            return (
              <div className="ld-feat" key={f.name}>
                <span className="nm" title={f.humanLabel[LANG] || f.name}>{f.humanLabel[LANG] || f.name}</span>
                <span className="bar">
                  <span className="axis"></span>
                  <span
                    className={'fill ' + (pos ? 'pos' : 'neg')}
                    style={pos ? { left: '50%', width: w + '%' } : { right: '50%', width: w + '%' }}
                  ></span>
                </span>
                <span className="val">{(f.contribution >= 0 ? '+' : '−') + fmtNum(Math.abs(f.contribution), 2)}</span>
              </div>
            );
          })}
        </div>
      );
    }

    function Detector() {
      const [text, setText] = useState('');
      const [debounced, setDebounced] = useState('');
      const [model, setModel] = useState(null);
      const [modelError, setModelError] = useState(false);
      const [highlight, setHighlight] = useState(true);
      const taRef = useRef(null);
      const backdropRef = useRef(null);

      useEffect(() => {
        let alive = true;
        fetch(MODEL_URL)
          .then(r => { if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
          .then(m => { if (alive) setModel(m); })
          .catch(() => { if (alive) setModelError(true); });
        return () => { alive = false; };
      }, []);

      useEffect(() => {
        const id = setTimeout(() => setDebounced(text), DEBOUNCE_MS);
        return () => clearTimeout(id);
      }, [text]);

      const result = useMemo(() => {
        if (!ENGINE || !model || !debounced.trim()) return null;
        try {
          return ENGINE.detect(debounced, model);
        } catch (e) {
          return { error: true };
        }
      }, [debounced, model]);

      const normText = useMemo(() => normalizeText(text), [text]);
      const tooLongForHl = normText.length > HL_CAP;

      const segments = useMemo(() => {
        if (!highlight || tooLongForHl) return null;
        if (!result || result.abstain || result.error || !result.spans) return null;
        // Spans gelten für den debounceten Text; solange getippt wird, passen sie
        // nicht mehr auf den aktuellen Inhalt - dann lieber nicht einfärben.
        if (normalizeText(debounced) !== normText) return null;
        return buildSegments(normText, result.spans);
      }, [highlight, tooLongForHl, result, normText, debounced]);

      const syncScroll = () => {
        if (taRef.current && backdropRef.current) {
          backdropRef.current.scrollTop = taRef.current.scrollTop;
          backdropRef.current.scrollLeft = taRef.current.scrollLeft;
        }
      };

      const confWord = c => c === 'high' ? t.confHigh : c === 'low' ? t.confLow : t.confMedium;

      return (
        <div className="container ld-wrap">
          <h1 style={{ fontSize: '1.5rem', color: '#cbd5e1', marginBottom: 8 }}>{t.title}</h1>
          <p style={{ color: '#94a3b8', maxWidth: '70ch' }}>{t.subtitle}</p>

          <p className="ld-prehint">{t.prehint}</p>

          <div className="ld-editor">
            <div className="ld-backdrop" ref={backdropRef} aria-hidden="true">
              {segments
                ? segments.map((s, i) => (
                    s.kind
                      ? <mark key={i} className={s.kind === 'ai' ? 'ld-mk-ai' : 'ld-mk-conn'}>{s.text}</mark>
                      : <span key={i}>{s.text}</span>
                  ))
                : text}
              {'\n'}
            </div>
            <textarea
              ref={taRef}
              className="ld-input"
              value={text}
              onChange={e => setText(e.target.value)}
              onScroll={syncScroll}
              placeholder={t.placeholder}
              spellCheck={false}
              autoFocus
            />
          </div>

          <div className="ld-toolbar">
            <button className="ld-btn" onClick={() => setText('')}>{t.clear}</button>
            <button className="ld-btn" onClick={() => setText(t.sampleAiText)}>{t.sampleAi}</button>
            <button className="ld-btn" onClick={() => setText(t.sampleHumanText)}>{t.sampleHuman}</button>
            <span className="spacer"></span>
            <button className="ld-btn" onClick={() => setHighlight(v => !v)}>
              {highlight ? t.hlOn : t.hlOff}
            </button>
          </div>

          {highlight && !tooLongForHl && (
            <div className="ld-legend">
              <span><span className="sw ld-mk-ai"></span>{t.legendAi}</span>
              <span><span className="sw ld-mk-conn"></span>{t.legendConn}</span>
            </div>
          )}
          {tooLongForHl && <p className="ld-privacy" style={{ marginTop: 8 }}>{t.hlCap}</p>}

          {!ENGINE && <p className="ld-warn">{t.noEngine}</p>}
          {ENGINE && modelError && <p className="ld-warn">{t.loadError}</p>}
          {ENGINE && !model && !modelError && <p className="ld-idle">{t.loading}</p>}

          {ENGINE && model && !result && <p className="ld-idle">{t.idle}</p>}

          {result && result.error && <p className="ld-warn">{t.loadError}</p>}

          {result && !result.error && result.abstain && (
            <div className="ld-abstain">
              {result.notes && result.notes.indexOf('unsupported_language') !== -1 ? (
                <>
                  <div className="h">{t.abstainLangH}</div>
                  <div className="d">
                    {t.abstainLangD}
                    {result.language_ratios && typeof result.language_ratios.en === 'number' &&
                      ' ' + t.abstainLangRatio(result.language_ratios.en)}
                  </div>
                </>
              ) : (
                <>
                  <div className="h">{t.abstainShortH}</div>
                  <div className="d">{t.abstainShortD(result.word_count)}</div>
                </>
              )}
            </div>
          )}

          {result && !result.error && !result.abstain && (
            <>
              <div className="ld-result">
                <div className="ld-num" style={{ color: probColor(result.probability) }}>
                  {pct(result.probability)} %
                </div>
                <div style={{ fontSize: '.78rem', color: '#64748b', marginTop: 4, maxWidth: '54ch' }}>
                  {t.probLabel}
                </div>
                <div className="ld-verdict">{verdictFor(result.probability)}</div>

                <Scale p={result.probability} band={BAND[result.confidence] || BAND.medium} />
                <div className="ld-band-label">{t.bandLabel(confWord(result.confidence))}</div>
                {result.confidence === 'low' && (
                  <div className="ld-band-label" style={{ color: '#94a3b8' }}>{t.lowConfHint}</div>
                )}
              </div>

              <details className="ld-details">
                <summary>{t.methodSummary}</summary>
                <div className="body">
                  <div className="ld-kv">
                    <div><div className="k">{t.confK}</div><div className="v">{confWord(result.confidence)}</div></div>
                    <div><div className="k">{t.wcK}</div><div className="v">{result.word_count.toLocaleString(LOCALE)}</div></div>
                    {typeof result.bayes_factor === 'number' && (
                      <div><div className="k">{t.bfK}</div><div className="v">{fmtNum(result.bayes_factor, result.bayes_factor >= 10 ? 0 : 2)}</div></div>
                    )}
                    <div><div className="k">{t.rawK}</div><div className="v">{fmtNum(result.probability_raw, 3)}</div></div>
                  </div>

                  <div className="ld-sub">{t.featH}</div>
                  <p style={{ marginTop: 0 }}>{t.featP}</p>
                  <Features features={result.features} />

                  {typeof result.bayes_factor === 'number' && (
                    <>
                      <div className="ld-sub">{t.bfH}</div>
                      <p style={{ marginTop: 0 }}>{t.bfP}</p>
                    </>
                  )}

                  <div className="ld-sub">{t.howH}</div>
                  <p style={{ marginTop: 0 }}>{t.howP}</p>

                  <div className="ld-sub">{t.qualityH}</div>
                  <p style={{ marginTop: 0 }}>{t.qualityP}</p>

                  <div className="ld-sub">{t.limitsH}</div>
                  <ul style={{ marginTop: 0 }}>
                    {t.limits.map((l, i) => <li key={i}>{l}</li>)}
                  </ul>
                </div>
              </details>
            </>
          )}

          {(!result || result.abstain || result.error) && (
            <details className="ld-details">
              <summary>{t.methodSummary}</summary>
              <div className="body">
                <div className="ld-sub">{t.howH}</div>
                <p style={{ marginTop: 0 }}>{t.howP}</p>
                <div className="ld-sub">{t.qualityH}</div>
                <p style={{ marginTop: 0 }}>{t.qualityP}</p>
                <div className="ld-sub">{t.limitsH}</div>
                <ul style={{ marginTop: 0 }}>
                  {t.limits.map((l, i) => <li key={i}>{l}</li>)}
                </ul>
              </div>
            </details>
          )}

          <p className="ld-privacy" style={{ marginTop: 22 }}>{t.privacy}</p>
          <p className="ld-privacy">{t.disclaimer}</p>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<Detector />);
  </script>

  </footer>
