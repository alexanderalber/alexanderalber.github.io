      '  if (solidAt(p)) { o = vec4(0.0); return; }',
      '  vec2 v1 = vel(pos);',
      '  vec2 v2 = vel(pos - 0.5*uDt*v1);',
      '  vec2 src = pos - uDt*v2;',
      '  vec4 d = texture(uDye, src / sz) * uFade;',
      '  if (pos.x < 3.0) {',
      '    float yy = pos.y / sz.y * uRake;',
      '    float dist = abs(fract(yy) - 0.5) * sz.y / uRake;',
      '    d.r = max(d.r, 1.0 - smoothstep(0.5, 1.5, dist));',
      '  }',
      '  if (solidAt(p + ivec2(1,0)) || solidAt(p - ivec2(1,0)) || solidAt(p + ivec2(0,1)) || solidAt(p - ivec2(0,1))) d.g = 1.0;',
      '  o = vec4(clamp(d.rg, 0.0, 1.0), 0.0, 1.0);',
      '}'
    ].join('\n');

    /* Tracer particles, one per texel of a 128 x 128 RGBA32F texture:
       x, y in cell units, age in steps, a per-particle random. Midpoint
       advection; whoever leaves, hits an obstacle or gets old is reborn at
       the inlet. */
    var PSIDE = 128;
    var PART = [
      HEAD,
      'uniform sampler2D uP, uC, uMask;',
      'uniform ivec2 uGrid;',
      'uniform float uDt, uSeed, uPeriodic, uInit;',
      'out vec4 o;',
      VEL,
      'float hash(vec2 v){ return fract(sin(dot(v, vec2(12.9898, 78.233))) * 43758.5453); }',
      'void main(){',
      '  vec2 t = gl_FragCoord.xy;',
      '  vec4 q = texelFetch(uP, ivec2(t), 0);',
      '  vec2 sz = vec2(uGrid);',
      '  if (uInit > 0.5) {',
      '    o = vec4(hash(t + 0.13) * sz.x, hash(t + 7.7) * sz.y, 0.0, hash(t + 3.1));',
      '    return;',
      '  }',
      '  vec2 pos = q.xy;',
      '  vec2 v1 = vel(pos);',
      '  pos += uDt * vel(pos + 0.5*uDt*v1);',
      '  if (uPeriodic > 0.5) pos.y = mod(pos.y, sz.y);',
      '  float age = q.z + uDt;',
      '  ivec2 c = ivec2(floor(pos));',
      '  bool dead = pos.x >= sz.x - 1.0 || pos.x < 0.0 || pos.y < 0.0 || pos.y >= sz.y',
      '           || texelFetch(uMask, clamp(c, ivec2(0), uGrid - 1), 0).r > 0.5',
      '           || age > 4.0e4 * (0.5 + q.w);',
      '  if (dead) {',
      '    pos = vec2(hash(t + uSeed) * 2.0, hash(t * 1.7 + uSeed + 5.3) * sz.y);',
      '    age = 0.0;',
      '  }',
      '  o = vec4(pos, age, q.w);',
      '}'
    ].join('\n');

    var PVERT = [
      HEAD,
      'uniform sampler2D uP;',
      'uniform vec2 uGridF;',
      'uniform float uPt;',
      'out float vA;',
      'void main(){',
      '  ivec2 t = ivec2(gl_VertexID % ' + PSIDE + ', gl_VertexID / ' + PSIDE + ');',
      '  vec4 q = texelFetch(uP, t, 0);',
      '  gl_Position = vec4(q.xy / uGridF * 2.0 - 1.0, 0.0, 1.0);',
      '  gl_PointSize = uPt;',
      '  vA = clamp(q.z / 60.0, 0.0, 1.0);',   // fade in after a rebirth
      '}'
    ].join('\n');

    var PFRAG = [
      HEAD,
      'in float vA;',
      'out vec4 o;',
      'void main(){',
      '  vec2 d = gl_PointCoord - 0.5;',
      '  float a = (1.0 - smoothstep(0.25, 0.5, length(d))) * vA * 0.75;',
      '  o = vec4(vec3(0.93, 0.95, 1.0) * a, a);',
      '}'
    ].join('\n');

    /* Display. Field colour from the OKLab maps of VSCore (sRGB stops,
       interpolated as given), smoke on top, obstacles last. The scales are
       physical: vorticity in units of U/D, pressure as the pressure
       coefficient cp = (p - p0) / (rho U^2 / 2) with p = rho / 3, speed in
       units of U. Contrast multiplies all three. */
    var SHOW = [
      HEAD,
      'in vec2 vUv;',
      'uniform sampler2D uDer, uDye;',
      'uniform vec3 uDiv[11], uPres[11], uSeq[9];',
      'uniform int uView, uSmoke;',
      'uniform float uGain, uU, uD;',
      'out vec4 o;',
      'vec3 div(float t){ float s = (clamp(t, -1.0, 1.0)*0.5 + 0.5)*10.0; int i = int(min(s, 9.0)); return mix(uDiv[i], uDiv[i+1], s - float(i)); }',
      'vec3 pres(float t){ float s = (clamp(t, -1.0, 1.0)*0.5 + 0.5)*10.0; int i = int(min(s, 9.0)); return mix(uPres[i], uPres[i+1], s - float(i)); }',
      'vec3 seq(float t){ float s = clamp(t, 0.0, 1.0)*8.0; int i = int(min(s, 7.0)); return mix(uSeq[i], uSeq[i+1], s - float(i)); }',
      'void main(){',
      '  vec4 d = texture(uDer, vUv);',
      '  vec2 dye = texture(uDye, vUv).rg;',
      '  vec3 bg = vec3(0.043, 0.055, 0.078);',
      '  vec3 col = bg;',
      '  if (uView == 1) col = div(d.x * uD / uU * 0.25 * uGain);',
      '  else if (uView == 2) col = seq(d.y / uU * 0.6 * uGain);',
      '  else if (uView == 3) col = pres((d.z / 3.0) / (0.5*uU*uU) * 0.6 * uGain);',
      '  if (uView == 0) {',
      '    col = mix(col, vec3(0.93, 0.95, 0.98), clamp(dye.r * 0.95 * uGain, 0.0, 1.0));',
      '    col = mix(col, vec3(1.0, 0.62, 0.30), clamp(dye.g * 0.9 * uGain, 0.0, 1.0));',
      '  } else if (uSmoke == 1) {',
      '    col = mix(col, vec3(0.93, 0.95, 0.98), clamp(dye.r * 0.55, 0.0, 1.0));',
      '    col = mix(col, vec3(0.95, 0.95, 0.9), clamp(dye.g * 0.35, 0.0, 1.0));',
      '  }',
      '  col = mix(col, vec3(0.50, 0.55, 0.62), clamp((d.w - 0.25) * 2.0, 0.0, 1.0));',
      '  o = vec4(col, 1.0);',
      '}'
    ].join('\n');

    function compile(gl, type, src) {
      var s = gl.createShader(type);
      gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
        throw new Error('shader: ' + gl.getShaderInfoLog(s));
      return s;
    }
    function makeProg(gl, vs, fs) {
      var p = gl.createProgram();
      gl.attachShader(p, compile(gl, gl.VERTEX_SHADER, vs));
      gl.attachShader(p, compile(gl, gl.FRAGMENT_SHADER, fs));
      gl.linkProgram(p);
      if (!gl.getProgramParameter(p, gl.LINK_STATUS))
        throw new Error('link: ' + gl.getProgramInfoLog(p));
      return p;
    }
    function uni(gl, p) {
      var out = {}, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
      for (var i = 0; i < n; i++) {
        var info = gl.getActiveUniform(p, i);
        out[info.name.replace(/\[0\]$/, '')] = gl.getUniformLocation(p, info.name);
      }
      return out;
    }
    function flat(stops) {
      var a = new Float32Array(stops.length * 3);
      for (var i = 0; i < stops.length; i++) { a[i * 3] = stops[i][0]; a[i * 3 + 1] = stops[i][1]; a[i * 3 + 2] = stops[i][2]; }
      return a;
    }

    /* opts: { params, shapes, running, mode, onPointer, onPaint, onTick,
               onSample, onBlowup, onRegrid, onLost, headless: {w, h} }
       headless builds a fixed grid without loop or display, for the GPU
       versus CPU check (notes/dev/vortex-street.gpu.mjs). */
    function create(container, opts) {
      opts = opts || {};
      var headless = opts.headless || null;
      var canvas = document.createElement('canvas');
      var gl = canvas.getContext('webgl2', {
        antialias: false, alpha: false, depth: false, stencil: false,
        preserveDrawingBuffer: false, powerPreference: 'high-performance'
      });
      if (!gl) return null;
      if (!gl.getExtension('EXT_color_buffer_float')) return null;   // no float FBO, no simulation
      if (gl.getParameter(gl.MAX_DRAW_BUFFERS) < 4) return null;
      container.innerHTML = '';
      container.appendChild(canvas);

      var P = {};
      try {
        P.sim = makeProg(gl, VERT, SIM); P.init = makeProg(gl, VERT, INIT);
        P.red = makeProg(gl, VERT, REDUCE); P.der = makeProg(gl, VERT, DERIVE);
        P.dye = makeProg(gl, VERT, DYE); P.part = makeProg(gl, VERT, PART);
        P.pdraw = makeProg(gl, PVERT, PFRAG); P.show = makeProg(gl, VERT, SHOW);
      } catch (e) {
        if (window.console) console.error(e);
        container.innerHTML = '';
        return null;
      }
      var U = {};
      for (var key in P) if (P.hasOwnProperty(key)) U[key] = uni(gl, P[key]);

      var quad = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, quad);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
      var vao = gl.createVertexArray();
      gl.bindVertexArray(vao);
      gl.bindBuffer(gl.ARRAY_BUFFER, quad);
      gl.enableVertexAttribArray(0);
      gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
      gl.bindVertexArray(null);
      var emptyVao = gl.createVertexArray();

      var params = Object.assign({}, core.DEFAULTS, opts.params || {});
      var running = headless ? false : opts.running !== false;
      var mode = opts.mode || 'move';
      var res = params.res;
      var shapes = opts.shapes || [];
      var DIV = flat(core.MAPS.vort), PRES = flat(core.MAPS.pres), SEQ = flat(core.MAPS.speed);

      var GW = 0, GH = 0;
      var st = [null, null], cur = 0;        // each {A, B, C, fbo}
      var forceTex = null;
      var maskTex = null, mask = null, paint = null, maskBytes = null, frontal = 0, atInlet = false;
      var derT = null, derF = null;
      var dyeT = [null, null], dyeF = [null, null], dcur = 0;
      var partT = [null, null], partF = [null, null], pcur = 0;
      var red = [];                           // reduction chain {tex, fbo, w, h}
      var pbo = gl.createBuffer(), fence = null, fenceStep = 0, readBuf = new Float32Array(4);
      gl.bindBuffer(gl.PIXEL_PACK_BUFFER, pbo);
      gl.bufferData(gl.PIXEL_PACK_BUFFER, 16, gl.STREAM_READ);
      gl.bindBuffer(gl.PIXEL_PACK_BUFFER, null);
      var disposed = false, ctxLost = false, rafId = 0, totalSteps = 0, seed = 0;
      var allocOk = true;

      function tex(w, h, ifmt, filter) {
        var t = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, t);
        gl.texStorage2D(gl.TEXTURE_2D, 1, ifmt, w, h);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        return t;
      }
      function fboFor(texs) {
        var f = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, f);
        var bufs = [];
        for (var i = 0; i < texs.length; i++) {
          gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0 + i, gl.TEXTURE_2D, texs[i], 0);
          bufs.push(gl.COLOR_ATTACHMENT0 + i);
        }
        gl.drawBuffers(bufs);
        if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) allocOk = false;
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        return f;
      }

      var owned = [];
      function freeAll() {
        for (var i = 0; i < owned.length; i++) {
          var o = owned[i];
          if (o instanceof WebGLTexture) gl.deleteTexture(o); else gl.deleteFramebuffer(o);
        }
        owned = [];
      }
      function T(w, h, f, filt) { var t = tex(w, h, f, filt); owned.push(t); return t; }
      function FB(texs) { var f = fboFor(texs); owned.push(f); return f; }

      function allocate(w, h) {
        var oldPaint = paint, ow = GW, oh = GH;
        if (fence) { gl.deleteSync(fence); fence = null; }
        freeAll();
        GW = w; GH = h;
        allocOk = true;
        forceTex = T(w, h, gl.RGBA32F, gl.NEAREST);
        for (var i = 0; i < 2; i++) {
          var A = T(w, h, gl.RGBA32F, gl.NEAREST), B = T(w, h, gl.RGBA32F, gl.NEAREST), Cc = T(w, h, gl.RGBA32F, gl.NEAREST);
          st[i] = { A: A, B: B, C: Cc, fbo: FB([A, B, Cc, forceTex]) };
          dyeT[i] = T(w, h, gl.RGBA16F, gl.LINEAR); dyeF[i] = FB([dyeT[i]]);
          partT[i] = T(PSIDE, PSIDE, gl.RGBA32F, gl.NEAREST); partF[i] = FB([partT[i]]);
        }
        derT = T(w, h, gl.RGBA16F, gl.LINEAR); derF = FB([derT]);
        maskTex = T(w, h, gl.R8, gl.NEAREST);
        red = [];
        var rw = w, rh = h;
        while (rw > 1 || rh > 1) {
          rw = Math.ceil(rw / 8); rh = Math.ceil(rh / 8);
          var rt = T(rw, rh, gl.RGBA32F, gl.NEAREST);
          red.push({ tex: rt, fbo: FB([rt]), w: rw, h: rh });
        }
        // the freehand layer survives a regrid, resampled nearest
        paint = new Uint8Array(w * h);
        if (oldPaint && ow > 0 && oh > 0) {
          for (var y = 0; y < h; y++) {
            var sy = Math.min(oh - 1, Math.floor((y + 0.5) * oh / h));
            for (var x = 0; x < w; x++) {
              var sx = Math.min(ow - 1, Math.floor((x + 0.5) * ow / w));
              paint[y * w + x] = oldPaint[sy * ow + sx];
            }
          }
        }
        mask = new Uint8Array(w * h);
        maskBytes = new Uint8Array(w * h);
        cur = 0; dcur = 0; pcur = 0;
        if (!allocOk) return false;
        rebuildMask();
        resetFlow();
        clearFbo(dyeF[0]); clearFbo(dyeF[1]);
        initParticles();
        return true;
      }

      function clearFbo(f) {
        gl.bindFramebuffer(gl.FRAMEBUFFER, f);
        gl.clearColor(0, 0, 0, 0);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      }

      function draw(fbo, w, h) {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
        gl.viewport(0, 0, w, h);
        gl.bindVertexArray(vao);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        gl.bindVertexArray(null);
      }
      function bindTex(unit, t, loc) {
        gl.activeTexture(gl.TEXTURE0 + unit);
        gl.bindTexture(gl.TEXTURE_2D, t);
        gl.uniform1i(loc, unit);
      }
      function profileFlag() { return params.walls === 'noslip' ? 1 : 0; }

      function uploadMask() {
        for (var i = 0; i < mask.length; i++) maskBytes[i] = mask[i] ? 255 : 0;
        gl.bindTexture(gl.TEXTURE_2D, maskTex);
        gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
        gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, GW, GH, gl.RED, gl.UNSIGNED_BYTE, maskBytes);
        frontal = core.frontalHeight(mask, GW, GH);
        atInlet = false;
        for (var y = 0; y < GH && !atInlet; y++) if (mask[y * GW]) atInlet = true;
      }
      function rebuildMask() {
        core.rasterize(shapes, GW, GH, paint, mask);
        uploadMask();
      }

      function resetFlow(kick) {
        gl.useProgram(P.init);
        bindTex(0, maskTex, U.init.uMask);
        gl.uniform2i(U.init.uSize, GW, GH);
        gl.uniform1i(U.init.uProfile, profileFlag());
        gl.uniform1f(U.init.uU, params.u);
        gl.uniform1f(U.init.uKick, kick === undefined ? core.KICK : kick);
        draw(st[0].fbo, GW, GH);
        cur = 0;
        if (fence) { gl.deleteSync(fence); fence = null; }
      }

      function initParticles() {
        gl.useProgram(P.part);
        bindTex(0, partT[1], U.part.uP);
        bindTex(1, st[cur].C, U.part.uC);
        bindTex(2, maskTex, U.part.uMask);
        gl.uniform2i(U.part.uGrid, GW, GH);
        gl.uniform1f(U.part.uInit, 1);
        gl.uniform1f(U.part.uDt, 0);
        gl.uniform1f(U.part.uSeed, 0);
        gl.uniform1f(U.part.uPeriodic, 0);
        draw(partF[0], PSIDE, PSIDE);
        pcur = 0;
      }

      function simStep() {
        var s = st[cur], d = st[1 - cur];
        gl.useProgram(P.sim);
        var u = U.sim;
        bindTex(0, s.A, u.uA); bindTex(1, s.B, u.uB); bindTex(2, s.C, u.uC); bindTex(3, maskTex, u.uMask);
        gl.uniform2i(u.uSize, GW, GH);
        gl.uniform1i(u.uWalls, params.walls === 'noslip' ? 1 : params.walls === 'periodic' ? 2 : 0);
        gl.uniform1i(u.uProfile, profileFlag());
        gl.uniform1i(u.uReg, params.collision === 'reg' ? 1 : 0);
        var L = core.spongeLen(GW);
        gl.uniform1i(u.uSpongeX, GW - L);
        gl.uniform1f(u.uSpongeL, L);
        gl.uniform1f(u.uSpongeNu, core.SPONGE_NU);
        gl.uniform1f(u.uAbsorb, params.absorb === false ? 0 : core.ABSORB);
        gl.uniform1f(u.uU, params.u);
        gl.uniform1f(u.uNu, params.nu);
        gl.uniform1f(u.uCs, params.cs);
        gl.uniform1f(u.uLambda, core.LAMBDA);
        draw(d.fbo, GW, GH);
        cur = 1 - cur;
        totalSteps++;
      }

      /* Reduce the force texture to one texel and read it back without
         stalling: readPixels into a pixel buffer, a fence, and the result
         is picked up a frame or two later. */
      function requestSample() {
        if (fence) return;
        var src = forceTex, sw = GW, sh = GH;
        gl.useProgram(P.red);
        for (var i = 0; i < red.length; i++) {
          bindTex(0, src, U.red.uSrc);
          gl.uniform2i(U.red.uSrcSize, sw, sh);
          draw(red[i].fbo, red[i].w, red[i].h);
          src = red[i].tex; sw = red[i].w; sh = red[i].h;
        }
        gl.bindFramebuffer(gl.FRAMEBUFFER, red[red.length - 1].fbo);
        gl.bindBuffer(gl.PIXEL_PACK_BUFFER, pbo);
        gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.FLOAT, 0);
        gl.bindBuffer(gl.PIXEL_PACK_BUFFER, null);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        fence = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
        fenceStep = totalSteps;
        gl.flush();
      }
      function pollSample() {
        if (!fence) return;
        var status = gl.getSyncParameter(fence, gl.SYNC_STATUS);
        if (status !== gl.SIGNALED) return;
        gl.deleteSync(fence); fence = null;
        gl.bindBuffer(gl.PIXEL_PACK_BUFFER, pbo);
        gl.getBufferSubData(gl.PIXEL_PACK_BUFFER, 0, readBuf);
        gl.bindBuffer(gl.PIXEL_PACK_BUFFER, null);
        var fx = readBuf[0], fy = readBuf[1], bad = readBuf[2];
        if (!isFinite(fx) || !isFinite(fy) || !(bad < 0.5)) {
          // smoke and tracers were advected by the broken velocities too
          resetFlow();
          clearFbo(dyeF[0]); clearFbo(dyeF[1]);
          initParticles();
          if (opts.onBlowup) opts.onBlowup({ step: fenceStep, cells: isFinite(bad) ? Math.round(bad) : null });
          return;
        }
        if (opts.onSample) opts.onSample({ t: fenceStep, fx: fx, fy: fy, d: frontal });
      }

      function advectDye(n) {
        gl.useProgram(P.dye);
        bindTex(0, dyeT[dcur], U.dye.uDye);
        bindTex(1, st[cur].C, U.dye.uC);
        bindTex(2, maskTex, U.dye.uMask);
        gl.uniform2i(U.dye.uGrid, GW, GH);
        gl.uniform1f(U.dye.uDt, n);
        gl.uniform1f(U.dye.uRake, core.RAKE);
        gl.uniform1f(U.dye.uFade, Math.pow(0.99995, n));
        draw(dyeF[1 - dcur], GW, GH);
        dcur = 1 - dcur;
      }
      function advectParticles(n) {
        gl.useProgram(P.part);
        bindTex(0, partT[pcur], U.part.uP);
        bindTex(1, st[cur].C, U.part.uC);
        bindTex(2, maskTex, U.part.uMask);
        gl.uniform2i(U.part.uGrid, GW, GH);
        gl.uniform1f(U.part.uInit, 0);
        gl.uniform1f(U.part.uDt, n);
        seed = (seed + 0.618034) % 1;
        gl.uniform1f(U.part.uSeed, seed * 100);
        gl.uniform1f(U.part.uPeriodic, params.walls === 'periodic' ? 1 : 0);
        draw(partF[1 - pcur], PSIDE, PSIDE);
        pcur = 1 - pcur;
      }

      function display() {
        gl.useProgram(P.der);
        bindTex(0, st[cur].C, U.der.uC);
        bindTex(1, maskTex, U.der.uMask);
        gl.uniform2i(U.der.uGrid, GW, GH);
        draw(derF, GW, GH);

        gl.useProgram(P.show);
        var u = U.show;
        bindTex(0, derT, u.uDer);
        bindTex(1, dyeT[dcur], u.uDye);
        gl.uniform3fv(u.uDiv, DIV);
        gl.uniform3fv(u.uPres, PRES);
        gl.uniform3fv(u.uSeq, SEQ);
        var v = params.view;
        gl.uniform1i(u.uView, v === 'vort' ? 1 : v === 'speed' ? 2 : v === 'pres' ? 3 : 0);
        gl.uniform1i(u.uSmoke, params.smoke ? 1 : 0);
        gl.uniform1f(u.uGain, params.gain);
        gl.uniform1f(u.uU, Math.max(1e-4, params.u));
        gl.uniform1f(u.uD, frontal > 0 ? frontal : GH * 0.1);
        draw(null, canvas.width, canvas.height);

        if (params.particles) {
          gl.useProgram(P.pdraw);
          bindTex(0, partT[pcur], U.pdraw.uP);
          gl.uniform2f(U.pdraw.uGridF, GW, GH);
          gl.uniform1f(U.pdraw.uPt, Math.max(1.5, 1.1 * canvas.width / Math.max(1, GW)));
          gl.enable(gl.BLEND);
          gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
          gl.bindFramebuffer(gl.FRAMEBUFFER, null);
          gl.viewport(0, 0, canvas.width, canvas.height);
          gl.bindVertexArray(emptyVao);
          gl.drawArrays(gl.POINTS, 0, PSIDE * PSIDE);
          gl.bindVertexArray(null);
          gl.disable(gl.BLEND);
        }
      }

      function resize(force) {
        if (headless) return;
        var w = container.clientWidth || window.innerWidth;
        var h = container.clientHeight || window.innerHeight;
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        var pw = Math.max(1, Math.round(w * dpr)), ph = Math.max(1, Math.round(h * dpr));
        if (canvas.width !== pw || canvas.height !== ph) { canvas.width = pw; canvas.height = ph; }
        var g = core.gridFor(res, w, h, force ? null : { w: GW, h: GH });
        if (force || g.w !== GW || g.h !== GH) {
          allocate(g.w, g.h);
          if (opts.onRegrid) opts.onRegrid({ w: GW, h: GH, d: frontal, atInlet: atInlet });
        }
      }

      var ro = null;
      if (headless) {
        canvas.width = 1; canvas.height = 1;
        allocate(headless.w, headless.h);
      } else {
        resize(true);
        if (window.ResizeObserver) {
          ro = new ResizeObserver(function () { if (!disposed) resize(false); });
          ro.observe(container);
        } else {
          window.addEventListener('resize', function () { resize(false); });
        }
      }
      if (!allocOk) { container.innerHTML = ''; return null; }

      // ---- pointer: draw and erase here; move mode goes to the caller,
      // which owns the shape list and the hit testing
      var pointing = false, lastU = 0, lastV = 0, pid = -1;
      function toUv(ev) {
        var r = canvas.getBoundingClientRect();
        return {
          u: (ev.clientX - r.left) / Math.max(1, r.width),
          v: 1 - (ev.clientY - r.top) / Math.max(1, r.height)   // GL origin is bottom left
        };
      }
      function brushValue(ev) { return (ev.shiftKey || mode === 'erase') ? 0 : 1; }
      function stroke(au, av, bu, bv, val) {
        core.stampSegment(paint, GW, GH, au, av, bu, bv, params.brush, val);
        rebuildMask();
        if (!running) display();
      }
      function onDown(ev) {
        if (ev.button !== undefined && ev.button !== 0) return;
        var p = toUv(ev);
        pointing = true; pid = ev.pointerId;
        lastU = p.u; lastV = p.v;
        if (canvas.setPointerCapture) { try { canvas.setPointerCapture(pid); } catch (e) {} }
        if (mode === 'move') { if (opts.onPointer) opts.onPointer('down', p.u, p.v); }
        else stroke(p.u, p.v, p.u, p.v, brushValue(ev));
        ev.preventDefault();
      }
      function onMove(ev) {
        if (!pointing || ev.pointerId !== pid) return;
        var p = toUv(ev);
        if (mode === 'move') { if (opts.onPointer) opts.onPointer('move', p.u, p.v); }
        else stroke(lastU, lastV, p.u, p.v, brushValue(ev));
        lastU = p.u; lastV = p.v;
        ev.preventDefault();
      }
      function onUp(ev) {
        if (ev.pointerId !== pid) return;
        pointing = false; pid = -1;
        if (canvas.releasePointerCapture) { try { canvas.releasePointerCapture(ev.pointerId); } catch (e) {} }
        if (mode === 'move') { if (opts.onPointer) opts.onPointer('up', lastU, lastV); }
        else if (opts.onPaint) opts.onPaint();
      }
      if (!headless) {
        canvas.addEventListener('pointerdown', onDown);
        canvas.addEventListener('pointermove', onMove);
        canvas.addEventListener('pointerup', onUp);
        canvas.addEventListener('pointercancel', onUp);
      }
      function onLost(ev) { ev.preventDefault(); ctxLost = true; if (opts.onLost) opts.onLost(); }
      canvas.addEventListener('webglcontextlost', onLost);

      // ---- main loop
      var recorder = null, recChunks = [];
      var lastTs = -1, fpsAccum = 0, fpsFrames = 0, stepsAccum = 0;
      function frame(ts) {
        if (disposed || ctxLost) return;
        rafId = requestAnimationFrame(frame);
        var dt = lastTs < 0 ? 0.016 : Math.min(0.25, (ts - lastTs) / 1000);
        lastTs = ts;
        pollSample();
        if (running) {
          var n = Math.max(1, Math.round(params.steps));
          for (var i = 0; i < n; i++) simStep();
          stepsAccum += n;
          requestSample();
          if (params.view === 'smoke' || params.smoke) advectDye(n);
          if (params.particles) advectParticles(n);
        }
        display();
        fpsAccum += dt; fpsFrames++;
        if (fpsAccum > 0.5) {
          if (opts.onTick) opts.onTick({
            fps: fpsFrames / fpsAccum, w: GW, h: GH, steps: totalSteps,
            mlups: stepsAccum * GW * GH / fpsAccum / 1e6, d: frontal
          });
          fpsAccum = 0; fpsFrames = 0; stepsAccum = 0;
        }
      }
      if (!headless) rafId = requestAnimationFrame(frame);

      var api = {
        setParams: function (p) {
          var wallsBefore = params.walls;
          for (var k in p) if (p.hasOwnProperty(k)) params[k] = p[k];
          // switching to or from the channel profile changes the inflow shape
          if (p.walls !== undefined && (p.walls === 'noslip') !== (wallsBefore === 'noslip')) resetFlow();
        },
        setMode: function (m) { mode = m; },
        setShapes: function (list) {
          shapes = list.slice();
          rebuildMask();
          if (!running) display();
        },
        setRunning: function (on) { running = !!on; },
        stepOnce: function () {
          simStep(); requestSample();
          if (params.view === 'smoke' || params.smoke) advectDye(1);
          if (params.particles) advectParticles(1);
          display();
        },
        resetFlow: function () {
          resetFlow();
          clearFbo(dyeF[0]); clearFbo(dyeF[1]);
          initParticles();
          if (!running) display();
        },
        clearPaint: function () {
          paint.fill(0);
          rebuildMask();
          if (!running) display();
        },
        setResolution: function (nres) {
          if (nres === res) return;
          res = nres;
          resize(true);
          if (!running) display();
        },
        getGrid: function () { return { w: GW, h: GH, d: frontal, atInlet: atInlet }; },
        getAspect: function () { return GH > 0 ? GW / GH : 1; },
        frontalFor: function (list) {
          return core.frontalHeight(core.rasterize(list, GW, GH, paint, null), GW, GH);
        },
        // ---- for the GPU check
        setMaskArray: function (m) { mask.set(m); uploadMask(); },
        init: function (kick) { resetFlow(kick); },
        stepN: function (n) { for (var i = 0; i < n; i++) simStep(); },
        setParamsRaw: function (p) { for (var k in p) if (p.hasOwnProperty(k)) params[k] = p[k]; },
        readForce: function () {
          // the same reduction as requestSample, read back synchronously
          var src = forceTex, sw = GW, sh = GH;
          gl.useProgram(P.red);
          for (var i = 0; i < red.length; i++) {
            bindTex(0, src, U.red.uSrc);
            gl.uniform2i(U.red.uSrcSize, sw, sh);
            draw(red[i].fbo, red[i].w, red[i].h);
            src = red[i].tex; sw = red[i].w; sh = red[i].h;
          }
          var out = new Float32Array(4);
          gl.bindFramebuffer(gl.FRAMEBUFFER, red[red.length - 1].fbo);
          gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.FLOAT, out);
          gl.bindFramebuffer(gl.FRAMEBUFFER, null);
          return { fx: out[0], fy: out[1], bad: out[2] };
        },
        readState: function () {
          var out = {}, names = ['A', 'B', 'C', 'F'];
          gl.bindFramebuffer(gl.FRAMEBUFFER, st[cur].fbo);
          for (var i = 0; i < 4; i++) {
            var buf = new Float32Array(GW * GH * 4);
            gl.readBuffer(gl.COLOR_ATTACHMENT0 + i);
            gl.readPixels(0, 0, GW, GH, gl.RGBA, gl.FLOAT, buf);
            out[names[i]] = buf;
          }
          gl.readBuffer(gl.COLOR_ATTACHMENT0);
          gl.bindFramebuffer(gl.FRAMEBUFFER, null);
          return out;
        },
        startRecord: function (onDone) {
          if (recorder || !canvas.captureStream || typeof MediaRecorder === 'undefined') return false;
          var stream = canvas.captureStream(60);
          var mime = MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported('video/webm;codecs=vp9')
            ? 'video/webm;codecs=vp9' : 'video/webm';
          try { recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 8000000 }); }
          catch (e) { recorder = null; return false; }
          recChunks = [];
          recorder.ondataavailable = function (ev) { if (ev.data && ev.data.size) recChunks.push(ev.data); };
          recorder.onstop = function () {
            var blob = new Blob(recChunks, { type: 'video/webm' });
            recChunks = []; recorder = null;
            if (onDone) onDone(blob);
          };
          recorder.start();
          return true;
        },
        stopRecord: function () { if (recorder && recorder.state !== 'inactive') recorder.stop(); },
        snapshot: function () {
          display();
          try { return canvas.toDataURL('image/png'); } catch (e) { return null; }
        },
        dispose: function () {
          disposed = true;
          if (recorder && recorder.state !== 'inactive') { try { recorder.stop(); } catch (e) {} }
          if (rafId) cancelAnimationFrame(rafId);
          if (ro) ro.disconnect();
          canvas.removeEventListener('pointerdown', onDown);
          canvas.removeEventListener('pointermove', onMove);
          canvas.removeEventListener('pointerup', onUp);
          canvas.removeEventListener('pointercancel', onUp);
          canvas.removeEventListener('webglcontextlost', onLost);
          if (fence) { gl.deleteSync(fence); fence = null; }
          freeAll();
          gl.deleteBuffer(quad); gl.deleteBuffer(pbo);
          gl.deleteVertexArray(vao); gl.deleteVertexArray(emptyVao);
          for (var k in P) if (P.hasOwnProperty(k)) gl.deleteProgram(P[k]);
          if (canvas.parentNode) canvas.parentNode.removeChild(canvas);
        }
      };
      return api;
    }

    return { create: create, SIM_SOURCE: SIM, PSIDE: PSIDE };
  })();
  </script>

  <script id="app">
    const { useState, useEffect, useRef, useCallback } = React;
    const html = htm.bind(React.createElement);
    const C = window.VSCore;
    const icon = (n) => window.ToolIcons ? ToolIcons.el(n) : null;

    const cssVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
    const COL = { text: cssVar('--tool-text'), label: cssVar('--tool-label'),
      note: cssVar('--tool-note'), faint: cssVar('--tool-faint'), hair: cssVar('--tool-hairline') };

    /* Measurement history: one sample per frame (every `steps` lattice steps),
       capped, cleared whenever geometry or flow parameters change so a mean
       never mixes two experiments. */
    const HIST_MAX = 3000;
    function newHist() { return { t: [], cd: [], cl: [], clc: [], start: 0 }; }

    function fmt(v, d) { return v === null || v === undefined || !isFinite(v) ? '-' : v.toFixed(d); }
    function fmtRe(re) {
      if (!(re > 0)) return '-';
      return re < 100 ? re.toFixed(1) : String(Math.round(re));
    }

    function Slider({ label, value, min, max, step, show, onChange }) {
      return html`
        <div className="vs-param">
          <label>
            <span>${label}</span>
            <span className="vs-val">${show}</span>
          </label>
          <input type="range" min=${min} max=${max} step=${step} value=${value}
                 onChange=${e => onChange(parseFloat(e.target.value))} />
        </div>
      `;
    }

    function Seg({ items, value, onChange, wrap }) {
      return html`
        <div className=${'seg-row' + (wrap ? ' vs-wrap' : '')}>
          ${items.map(it => html`
            <button key=${it.id} type="button"
                    className=${'lang-seg' + (value === it.id ? ' active' : '')}
                    onClick=${() => onChange(it.id)}>${it.name}</button>
          `)}
        </div>
      `;
    }

    function Section({ id, title, summary, open, onToggle, children }) {
      return html`
        <div className="vs-acc">
          <button type="button" className=${'vs-acc-h' + (open ? ' open' : '')}
                  aria-expanded=${open} onClick=${() => onToggle(id)}>
            <span>${title}</span>
            ${!open && summary ? html`<span className="vs-acc-s">${summary}</span>` : null}
            <span className="vs-acc-c">${open ? '−' : '+'}</span>
          </button>
          ${open ? html`<div className="vs-acc-b">${children}</div>` : null}
        </div>
      `;
    }

    /* Lift and drag over the recorded window, drawn on a small canvas. */
    function Plot({ hist, tick }) {
      const ref = useRef(null);
      useEffect(() => {
        const cv = ref.current;
        if (!cv) return;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const W = Math.round(cv.clientWidth * dpr), H = Math.round(cv.clientHeight * dpr);
        if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
        const g = cv.getContext('2d');
        g.clearRect(0, 0, W, H);
        const n = hist.t.length;
        if (n < 2) return;
        const series = [[hist.cl, '#f59e5b'], [hist.cd, '#7cc4f0']];
        let lo = Infinity, hi = -Infinity;
        for (const [arr] of series) for (let i = 0; i < n; i++) { if (arr[i] < lo) lo = arr[i]; if (arr[i] > hi) hi = arr[i]; }
        if (lo > 0) lo = 0;
        if (hi < 0) hi = 0;
        if (hi - lo < 1e-6) { hi += 0.5; lo -= 0.5; }
        const pad = (hi - lo) * 0.08; lo -= pad; hi += pad;
        const t0 = hist.t[0], t1 = hist.t[n - 1];
        const X = (t) => (t - t0) / Math.max(1, t1 - t0) * (W - 2) + 1;
        const Y = (v) => H - (v - lo) / (hi - lo) * H;
        g.strokeStyle = COL.hair || 'rgba(148,163,184,.25)';
        g.lineWidth = 1;
        g.beginPath(); g.moveTo(0, Y(0)); g.lineTo(W, Y(0)); g.stroke();
        g.lineWidth = 1.4 * dpr;
        for (const [arr, col] of series) {
          g.strokeStyle = col;
          g.beginPath();
          for (let i = 0; i < n; i++) { const x = X(hist.t[i]), y = Y(arr[i]); i ? g.lineTo(x, y) : g.moveTo(x, y); }
          g.stroke();
        }
      }, [tick]);
      return html`<canvas className="vs-plot" ref=${ref} aria-label="Drag and lift coefficient over time"></canvas>`;
    }

    /* Four digits, applied once all four are there; a half-typed code
       stays in the box without reaching the flow. */
    function NacaInput({ code, onCode }) {
      const [v, setV] = useState(code);
      return html`
        <input type="text" inputMode="numeric" maxLength=${4} aria-label="NACA four-digit code" value=${v}
               onChange=${e => {
                 const t = e.target.value.replace(/\D/g, '').slice(0, 4);
                 setV(t);
                 if (t.length === 4) onCode(C.parseNaca(t).code);
               }} />
      `;
    }

    const MODES = [
      { id: 'move', name: 'Move' },
      { id: 'paint', name: 'Draw' },
      { id: 'erase', name: 'Erase' }
    ];
    const TYPE_NAMES = { circle: 'Cylinder', box: 'Box', naca: 'Airfoil' };
    const RE_CHIPS = [20, 100, 200, 500, 1000, 5000];

    function summarize(hist, d, u) {
      const n = hist.t.length;
      if (n < 4) return null;
      const T = C.sheddingPeriod(hist.t, hist.cl);
      // average over the last three periods if there is shedding, else over
      // the last quarter of the record
      const span = T ? 3 * T : 0.25 * (hist.t[n - 1] - hist.t[0]);
      const tMin = hist.t[n - 1] - span;
      let k = n - 1;
      while (k > 0 && hist.t[k - 1] >= tMin) k--;
      let cd = 0, cl = 0, clc = 0, m = 0, lo = Infinity, hi = -Infinity;
      for (let i = k; i < n; i++) {
        cd += hist.cd[i]; cl += hist.cl[i]; clc += hist.clc[i]; m++;
        if (hist.cl[i] < lo) lo = hist.cl[i];
        if (hist.cl[i] > hi) hi = hist.cl[i];
      }
      return {
        cd: cd / m, cl: cl / m, clc: clc / m, clAmp: T ? 0.5 * (hi - lo) : null,
        st: T && d > 0 ? d / (u * T) : null, period: T, steps: hist.t[n - 1] - hist.start
      };
    }

    function App() {
      const [st, setSt] = useState(() => {
        const d = C.decodeState(location.hash);
        const { shapes, ...rest } = d;
        return rest;
      });
      const [shapes, setShapes] = useState(() => C.decodeState(location.hash).shapes);
      const [mode, setMode] = useState('move');
      const [selId, setSelId] = useState(null);
      const [running, setRunning] = useState(true);
      const [open, setOpen] = useState(() => localStorage.getItem('vs.panel') !== '0');
      const [sec, setSec] = useState(() => localStorage.getItem('vs.sec') || 'flow');
      const [webgl, setWebgl] = useState(true);
      const [hud, setHud] = useState(null);
      const [grid, setGrid] = useState({ w: 0, h: 0, d: 0 });
      const [alert, setAlert] = useState(null);
      const [copied, setCopied] = useState(false);
      const [rec, setRec] = useState(false);
      const [tick, setTick] = useState(0);

      const stageRef = useRef(null);
      const engineRef = useRef(null);
      const dragRef = useRef(null);
      const shapesRef = useRef(shapes);
      const stRef = useRef(st);
      const histRef = useRef(newHist());
      const blowRef = useRef([]);
      const gridRef = useRef(grid);
      shapesRef.current = shapes;
      stRef.current = st;
      gridRef.current = grid;

      const set = useCallback((patch) => setSt(s => Object.assign({}, s, patch)), []);
      const clearHist = useCallback(() => { histRef.current = newHist(); setTick(t => t + 1); }, []);

      useEffect(() => { localStorage.setItem('vs.panel', open ? '1' : '0'); }, [open]);
      useEffect(() => { localStorage.setItem('vs.sec', sec); }, [sec]);
      const toggleSec = useCallback((id) => setSec(s => (s === id ? '' : id)), []);

      const onPointer = useCallback((type, u, v) => {
        const eng = engineRef.current;
        if (!eng) return;
        const aspect = eng.getAspect();
        if (type === 'down') {
          const hit = C.hitTest(shapesRef.current, u, v, aspect);
          if (hit) {
            setSelId(hit.id);
            dragRef.current = { id: hit.id, dx: hit.x - u, dy: hit.y - v };
            setSec('obstacles');
          } else {
            setSelId(null);
            dragRef.current = null;
          }
        } else if (type === 'move') {
          const d = dragRef.current;
          if (!d) return;
          setShapes(list => list.map(s => s.id === d.id
            ? Object.assign({}, s, { x: C.clamp(u + d.dx, 0, 1), y: C.clamp(v + d.dy, 0, 1) })
            : s));
        } else {
          dragRef.current = null;
        }
      }, []);

      const onSample = useCallback((s) => {
        const h = histRef.current, p = stRef.current;
        const d = s.d;
        if (h.t.length && s.t <= h.t[h.t.length - 1]) return;
        if (!h.t.length) h.start = s.t;
        h.t.push(s.t);
        h.cd.push(C.coefficient(s.fx, p.u, d));
        h.cl.push(C.coefficient(s.fy, p.u, d));
        // lift on a single airfoil is conventionally per chord, not per height
        const sh = shapesRef.current;
        const chord = sh.length === 1 && sh[0].type === 'naca' ? sh[0].p1 * gridRef.current.h : 0;
        h.clc.push(chord > 0 ? C.coefficient(s.fy, p.u, chord) : 0);
        if (h.t.length > HIST_MAX) { h.t.shift(); h.cd.shift(); h.cl.shift(); h.clc.shift(); }
      }, []);

      useEffect(() => {
        if (!stageRef.current || !window.VSGL) { setWebgl(false); return; }
        let eng = null;
        try {
          eng = window.VSGL.create(stageRef.current, {
            params: st, shapes: shapesRef.current, mode: mode, running: true,
            onPointer: onPointer,
            onPaint: () => {
              histRef.current = newHist();
              if (engineRef.current) setGrid(engineRef.current.getGrid());
            },
            onTick: s => { setHud(s); setTick(t => t + 1); },
            onSample: onSample,
            onRegrid: g => { setGrid(g); histRef.current = newHist(); },
            onBlowup: () => {
              histRef.current = newHist();
              // three in a row: stop instead of flickering through restarts
              const now = Date.now();
              const recent = blowRef.current.filter(t => now - t < 15000).concat([now]);
              blowRef.current = recent;
              const stop = recent.length >= 3;
              if (stop) { blowRef.current = []; setRunning(false); }
              setAlert({ at: now, stopped: stop });
            },
            onLost: () => setWebgl(false)
          });
        } catch (e) { eng = null; if (window.console) console.error(e); }
        if (!eng) { setWebgl(false); return; }
        engineRef.current = eng;
        setGrid(eng.getGrid());
        return () => { eng.dispose(); engineRef.current = null; };
        // eslint-disable-next-line react-hooks/exhaustive-deps
      }, []);

      useEffect(() => { const e = engineRef.current; if (e) e.setParams(st); }, [st]);
      useEffect(() => { const e = engineRef.current; if (e) e.setResolution(st.res); }, [st.res]);
      useEffect(() => { const e = engineRef.current; if (e) e.setRunning(running); }, [running]);
      useEffect(() => { const e = engineRef.current; if (e) e.setMode(mode); }, [mode]);
      useEffect(() => {
        const e = engineRef.current;
        if (!e) return;
        e.setShapes(shapes);
        setGrid(e.getGrid());
        clearHist();
      }, [shapes]);
      // a change of the flow parameters starts a new measurement
      useEffect(() => { clearHist(); }, [st.u, st.nu, st.cs, st.collision, st.walls]);

      useEffect(() => {
        if (!alert) return;
        const id = setTimeout(() => setAlert(null), 9000);
        return () => clearTimeout(id);
      }, [alert]);

      const selected = shapes.find(s => s.id === selId) || null;
      const updateSel = (patch) => {
        if (!selected) return;
        setShapes(list => list.map(s => s.id === selected.id ? Object.assign({}, s, patch) : s));
      };
      const addShape = (type) => {
        if (shapes.length >= C.SHAPE_LIMIT) return;
        const s = C.makeShape(type);
        setShapes(list => list.concat([s]));
        setSelId(s.id);
        setMode('move');
      };

      const d = grid.d;
      const re = C.reynolds(st.u, d, st.nu);
      const setRe = (target) => {
        const dd = d > 0 ? d : Math.round(grid.h * 0.1);
        set({ nu: C.clampTo('nu', C.nuForRe(st.u, dd, target)) });
      };

      const applyPreset = (p) => {
        const e = engineRef.current;
        const list = p.make(e ? e.getAspect() : 16 / 9);
        setShapes(list);
        setSelId(null);
        const patch = {};
        if (p.walls) patch.walls = p.walls;
        if (p.re > 0 && e) {
          const dd = e.frontalFor(list);
          if (dd > 0) patch.nu = C.clampTo('nu', C.nuForRe(st.u, dd, p.re));
        }
        set(patch);
        if (e) e.resetFlow();
      };

      const resetFlow = () => {
        const e = engineRef.current;
        if (e) e.resetFlow();
        clearHist();
      };
      const clearAll = () => {
        setShapes([]);
        setSelId(null);
        const e = engineRef.current;
        if (e) { e.clearPaint(); e.resetFlow(); }
        clearHist();
      };

      const download = (url, name) => {
        const a = document.createElement('a');
        a.href = url; a.download = name; a.click();
      };
      const savePng = () => {
        const e = engineRef.current;
        if (!e) return;
        const url = e.snapshot();
        if (url) download(url, 'vortex-street.png');
      };
      const toggleRec = () => {
        const e = engineRef.current;
        if (!e) return;
        if (rec) { e.stopRecord(); return; }
        if (e.startRecord(blob => {
          setRec(false);
          const url = URL.createObjectURL(blob);
          download(url, 'vortex-street.webm');
          setTimeout(() => URL.revokeObjectURL(url), 5000);
        })) setRec(true);
      };
      const copyLink = () => {
        const hash = '#' + C.encodeState(st, shapes);
        history.replaceState(null, '', location.pathname + hash);
        const done = () => { setCopied(true); setTimeout(() => setCopied(false), 1400); };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(location.href).then(done, done);
        } else done();
      };

      if (!webgl) {
        return html`
          <${React.Fragment}>
            <h1 className="vs-sr">Vortex Street</h1>
            <div className="vs-fallback">
              <div>
                <p style=${{ color: COL.text }}>This one needs WebGL2 with floating point render targets.</p>
                <p style=${{ fontSize: 13, color: COL.note }}>
                  Your browser did not provide them, so there is no wind to put in the tunnel.
                  Most of the other tools on <a href="/miscellaneous/">the tools page</a> work without a GPU.
                </p>
              </div>
            </div>
          <//>
        `;
      }

      const tau = C.tauFor(st.nu);
      const cellRe = st.u / st.nu;
      const peak = st.walls === 'noslip' ? 1.5 * st.u : st.u;
      const edgy = tau - 0.5 < 0.03 && cellRe > 8 && st.cs === 0 && st.collision === 'trt';
      // an obstacle in the inlet column has no front face: what it feels is
      // the pressure that drives the whole channel, not a drag
      const m = grid.atInlet ? null : summarize(histRef.current, d, st.u);
      const single = shapes.length === 1 ? shapes[0] : null;
      const hint = mode === 'move'
        ? (shapes.length ? 'drag obstacles' : 'add an obstacle or draw one')
        : mode === 'erase' ? 'drag to erase drawn cells' : 'drag to draw, shift-drag to erase';

      return html`
        <${React.Fragment}>
          <h1 className="vs-sr">Vortex Street</h1>
          <div className=${'vs-stage' + (mode === 'move' ? ' move' : '')} ref=${stageRef}></div>
          <a className="vs-back" href="/miscellaneous/#playground">← Playground</a>

          ${alert && html`
            <div className="vs-alert" role="alert">
              The flow blew up and was restarted: too fast for this grid. Raise the viscosity,
              lower the speed, turn up Smagorinsky or switch to the regularised collision.
              ${alert.stopped ? ' Paused after three restarts in a row.' : ''}
            </div>
          `}

          ${hud && html`
            <div className="vs-hud">
              <b>Re ${fmtRe(re)}</b>
              ${m && html`<span>c<sub>D</sub> ${fmt(m.cd, 2)}</span>`}
              ${m && single && single.type === 'naca'
                ? html`<span>c<sub>L</sub> ${fmt(m.clc, 2)} per chord</span>`
                : m && m.clAmp !== null && html`<span>c<sub>L</sub> ±${fmt(m.clAmp, 2)}</span>`}
              ${m && m.st !== null && html`<span>St ${fmt(m.st, 3)}</span>`}
              <span>${hud.fps.toFixed(0)} fps · ${Math.round(hud.mlups)} MLUPS</span>
              <span>${hud.w}×${hud.h}</span>
              <span>${hint}</span>
            </div>
          `}

          ${!open && html`
            <button type="button" className="vs-toggle" onClick=${() => setOpen(true)}>≡ Controls</button>
          `}

          ${open && html`
            <div className="vs-panel">
              <div className="vs-head">
                <h2>Vortex Street</h2>
                <button type="button" className="vs-x" onClick=${() => setOpen(false)}
                        aria-label="Collapse panel">✕</button>
              </div>

              <div className="vs-row" style=${{ marginBottom: 10 }}>
                <button type="button" className=${'tool-btn tool-btn-sm' + (running ? '' : ' tool-btn-primary')}
                        onClick=${() => setRunning(r => !r)}>
                  ${icon(running ? 'pause' : 'play')} ${running ? 'Pause' : 'Run'}
                </button>
                <button type="button" className="tool-btn tool-btn-sm"
                        onClick=${() => engineRef.current && engineRef.current.stepOnce()}>Step</button>
                <button type="button" className="tool-btn tool-btn-sm" onClick=${resetFlow}>
                  ${icon('reset')} Restart flow
                </button>
              </div>

              <div className="vs-row" style=${{ marginBottom: 8 }}>
                <span style=${{ fontSize: 11, color: COL.note, letterSpacing: '.06em', textTransform: 'uppercase' }}>Pointer</span>
                <${Seg} items=${MODES} value=${mode} onChange=${setMode} />
              </div>
              ${mode !== 'move' && html`
                <${Slider} label="Brush size" value=${st.brush} min=${C.RANGES.brush[0]} max=${C.RANGES.brush[1]}
                        step=${0.001} show=${(st.brush * 200).toFixed(1) + '% of height'}
                        onChange=${v => set({ brush: v })} />
              `}

              <${Section} id="flow" title="Flow" summary=${'Re ' + fmtRe(re) + ' · U ' + st.u.toFixed(3)}
                       open=${sec === 'flow'} onToggle=${toggleSec}>
                <${Slider} label="Inflow speed U" value=${st.u} min=${C.RANGES.u[0]} max=${C.RANGES.u[1]}
                        step=${0.002} show=${st.u.toFixed(3) + ' · Ma ' + C.mach(peak).toFixed(2)}
                        onChange=${v => set({ u: v })} />
                <${Slider} label="Viscosity ν" value=${C.nuToSlider(st.nu)} min=${0} max=${1} step=${0.002}
                        show=${st.nu < 0.01 ? st.nu.toFixed(4) : st.nu.toFixed(3)}
                        onChange=${v => set({ nu: C.sliderToNu(v) })} />
                <div className="vs-row" style=${{ margin: '2px 0 8px' }}>
                  <span style=${{ fontSize: 11.5, color: COL.label }}>Set Re</span>
                  ${RE_CHIPS.map(r => html`
                    <button key=${r} type="button" className="vs-chip" disabled=${!(d > 0)}
                            onClick=${() => setRe(r)}>${r}</button>
                  `)}
                </div>
                <p className="vs-note">
                  Re = U·D/ν = ${fmtRe(re)}, with D = ${d > 0 ? d + ' cells' : 'no obstacle'} of frontal height.
                  τ = ${tau.toFixed(4)}, cell Reynolds number U/ν = ${cellRe.toFixed(1)}.
                </p>
                ${edgy && html`
                  <p className="vs-note vs-warn">
                    TRT without a subgrid model this close to τ = ½ is where it blows up at sharp corners.
                    Turn up Smagorinsky under Solver, or watch it happen.
                  </p>
                `}
                ${C.mach(peak) > 0.25 && html`
                  <p className="vs-note vs-warn">
                    At this Mach number the compressibility error of the method is no longer small;
                    the numbers below drift by several percent.
                  </p>
                `}
              <//>

              <${Section} id="obstacles" title="Obstacles"
                       summary=${shapes.length + (shapes.length === 1 ? ' shape' : ' shapes')}
                       open=${sec === 'obstacles'} onToggle=${toggleSec}>
                <div className="vs-row">
                  ${C.PRESETS.map(p => html`
                    <button key=${p.id} type="button" className="vs-chip"
                            onClick=${() => applyPreset(p)}>${p.name}</button>
                  `)}
                </div>
                <div className="vs-row" style=${{ marginTop: 9 }}>
                  ${C.SHAPE_TYPES.map(t => html`
                    <button key=${t} type="button" className="tool-btn tool-btn-sm"
                            disabled=${shapes.length >= C.SHAPE_LIMIT}
                            onClick=${() => addShape(t)}>${icon('plus')} ${TYPE_NAMES[t]}</button>
                  `)}
                  <button type="button" className="tool-btn tool-btn-sm" onClick=${clearAll}>${icon('remove')} Clear</button>
                </div>

                ${selected && html`
                  <div className="vs-sel">
                    <div className="vs-sel-head">
                      <b style=${{ color: COL.text }}>${TYPE_NAMES[selected.type]}</b>
                      ${selected.type === 'naca' && html`
                        <span>NACA</span>
                        <${NacaInput} key=${selected.id} code=${selected.code} onCode=${c => updateSel({ code: c })} />
                      `}
                      <button type="button" className="tool-danger tool-btn-sm"
                              onClick=${() => { setShapes(list => list.filter(s => s.id !== selected.id)); setSelId(null); }}>
                        ${icon('remove')} Remove
                      </button>
                    </div>
                    ${selected.type === 'circle' && html`
                      <${Slider} label="Diameter" value=${selected.p1} min=${0.01} max=${0.3} step=${0.0025}
                              show=${(selected.p1 * 200).toFixed(1) + '% · ' + Math.round(selected.p1 * 2 * grid.h) + ' cells'}
                              onChange=${v => updateSel({ p1: v })} />
                    `}
                    ${selected.type === 'box' && html`
                      <${React.Fragment}>
                        <${Slider} label="Length" value=${selected.p1} min=${0.003} max=${0.5} step=${0.001}
                                show=${Math.max(1, Math.round(selected.p1 * 2 * grid.h)) + ' cells'} onChange=${v => updateSel({ p1: v })} />
                        <${Slider} label="Height" value=${selected.p2} min=${0.003} max=${0.5} step=${0.001}
                                show=${Math.max(1, Math.round(selected.p2 * 2 * grid.h)) + ' cells'} onChange=${v => updateSel({ p2: v })} />
                      <//>
                    `}
                    ${selected.type === 'naca' && html`
                      <${Slider} label="Chord" value=${selected.p1} min=${0.08} max=${0.8} step=${0.005}
                              show=${Math.round(selected.p1 * grid.h) + ' cells'} onChange=${v => updateSel({ p1: v })} />
                    `}
                    ${selected.type !== 'circle' && html`
                      <${Slider} label=${selected.type === 'naca' ? 'Angle of attack' : 'Rotation'}
                              value=${selected.rot} min=${-Math.PI / 2} max=${Math.PI / 2} step=${0.5 * Math.PI / 180}
                              show=${(selected.rot * 180 / Math.PI).toFixed(1) + '°'} onChange=${v => updateSel({ rot: v })} />
                    `}
                  </div>
                `}
                <p className="vs-note" style=${{ marginTop: 9 }}>
                  ${selected ? 'Drag it on the canvas in Move mode.'
                    : shapes.length ? 'Click an obstacle (Move mode) to edit it. Draw mode adds solid cells freehand.'
                    : 'Pick a preset, add a shape, or draw one in Draw mode.'}
                </p>
              <//>

              <${Section} id="meas" title="Measurements"
                       summary=${m ? 'cD ' + fmt(m.cd, 2) + (m.st !== null ? ' · St ' + fmt(m.st, 3) : '') : ''}
                       open=${sec === 'meas'} onToggle=${toggleSec}>
                <div className="vs-meas">
                  <span>c<sub>D</sub></span><b>${m ? fmt(m.cd, 3) : '-'}</b>
                  <span>St</span><b>${m && m.st !== null ? fmt(m.st, 3) : '-'}</b>
                  <span>c<sub>L</sub> mean</span><b>${m ? fmt(m.cl, 3) : '-'}</b>
                  <span>c<sub>L</sub> ±</span><b>${m && m.clAmp !== null ? fmt(m.clAmp, 3) : '-'}</b>
                  ${single && single.type === 'naca' && html`
                    <${React.Fragment}>
                      <span>c<sub>L</sub> chord</span><b>${m ? fmt(m.clc, 3) : '-'}</b>
                      <span>L/D</span><b>${m && Math.abs(m.cd) > 1e-6 ? fmt(m.cl / m.cd, 1) : '-'}</b>
                    <//>
                  `}
                </div>
                ${grid.atInlet && html`
                  <p className="vs-note vs-warn">
                    An obstacle touches the inlet. The force on it is mostly the pressure that pushes the
                    flow through the tunnel, so drag and lift coefficients mean nothing here and are not shown.
                  </p>
                `}
                <${Plot} hist=${histRef.current} tick=${tick} />
                <p className="vs-note">
                  <span style=${{ color: '#7cc4f0' }}>c<sub>D</sub></span> and
                  <span style=${{ color: '#f59e5b' }}> c<sub>L</sub></span>${' '}over the last
                  ${m ? Math.round(m.steps).toLocaleString('en-US') : 0} steps. Coefficients are 2F/(ρU²D) with the
                  frontal height D, averaged over the last three shedding periods; the Strouhal number is D/(U·T)
                  from the period T of the lift. Any change starts the record over, and the first
                  few thousand steps are the start-up, not the answer.
                </p>
              <//>

              <${Section} id="look" title="Look"
                       summary=${(C.VIEWS.find(v => v.id === st.view) || C.VIEWS[0]).name +
                         (st.particles ? ' · tracers' : '')}
                       open=${sec === 'look'} onToggle=${toggleSec}>
                <div style=${{ marginBottom: 9 }}>
                  <${Seg} items=${C.VIEWS} value=${st.view} wrap onChange=${v => set({ view: v })} />
                </div>
                ${st.view !== 'smoke' && html`
                  <label className="vs-check">
                    <input type="checkbox" checked=${st.smoke} onChange=${e => set({ smoke: e.target.checked })} />
                    Smoke on top
                  </label>
                `}
                <label className="vs-check">
                  <input type="checkbox" checked=${st.particles} onChange=${e => set({ particles: e.target.checked })} />
                  Tracer particles
                </label>
                <${Slider} label="Contrast" value=${st.gain} min=${0.05} max=${2} step=${0.01}
                        show=${'×' + st.gain.toFixed(2)} onChange=${v => set({ gain: v })} />
                <p className="vs-note">
                  ${st.view === 'smoke' ? 'White smoke is let in at the inlet in fourteen streaks; orange dye seeps out of every obstacle surface and marks the boundary layer and the vortices it sheds.'
                    : st.view === 'vort' ? 'Vorticity, the local spin of the flow, in units of U/D: blue clockwise, orange counter-clockwise.'
                    : st.view === 'speed' ? 'Speed in units of the inflow: the dark band behind an obstacle is the wake.'
                    : 'Pressure coefficient, (p − p∞)/(½ρU²): green high, violet low. The stagnation point in front of a cylinder sits near +1.'}
                </p>
              <//>

              <${Section} id="solver" title="Solver"
                       summary=${(st.collision === 'reg' ? 'Regularised' : 'TRT') + (st.cs > 0 ? ' + LES' : '') + ' · ' +
                         (C.WALLS.find(w => w.id === st.walls) || C.WALLS[0]).name}
                       open=${sec === 'solver'} onToggle=${toggleSec}>
                <div style=${{ marginBottom: 9 }}>
                  <${Seg} items=${C.COLLISIONS} value=${st.collision} onChange=${v => set({ collision: v })} />
                </div>
                <${Slider} label="Smagorinsky constant" value=${st.cs} min=${C.RANGES.cs[0]} max=${C.RANGES.cs[1]}
                        step=${0.005} show=${st.cs === 0 ? 'off' : st.cs.toFixed(3)} onChange=${v => set({ cs: v })} />
                <p className="vs-note" style=${{ marginBottom: 9 }}>
                  TRT relaxes symmetric and antisymmetric parts at two rates; the regularised collision
                  rebuilds every cell from its density, velocity and stress and throws the rest away.
                  Smagorinsky adds viscosity where the flow shears hard, which is what keeps a coarse grid alive at high Re.
                </p>
                <div className="vs-row" style=${{ marginBottom: 4 }}>
                  <span style=${{ fontSize: 11.5, color: COL.label }}>Top and bottom</span>
                  <${Seg} items=${C.WALLS} value=${st.walls} onChange=${v => set({ walls: v })} />
                </div>
                <p className="vs-note" style=${{ marginBottom: 9 }}>
                  ${st.walls === 'noslip' ? 'A channel: walls that hold the fluid still, and the inflow is the matching parabolic profile.'
                    : st.walls === 'periodic' ? 'What leaves at the top comes back in at the bottom: an infinite row of copies.'
                    : 'Frictionless walls: the flow slides along them, which is the cheapest stand-in for open air.'}
                </p>
                <${Slider} label="Steps per frame" value=${st.steps} min=${C.RANGES.steps[0]} max=${C.RANGES.steps[1]}
                        step=${1} show=${String(st.steps)} onChange=${v => set({ steps: v })} />
                <div className="vs-row">
                  <${Seg} items=${C.RES_STEPS.map(n => ({ id: n, name: String(n) }))}
                       value=${st.res} onChange=${v => set({ res: v })} />
                </div>
                <p className="vs-note" style=${{ marginTop: 7 }}>
                  Cells along the long edge. A finer grid makes the same obstacle more cells tall, so at
                  the same viscosity the Reynolds number goes up; the flow restarts.
                </p>
              <//>

              <${Section} id="share" title="Export" open=${sec === 'share'} onToggle=${toggleSec}>
                <div className="vs-row">
                  <button type="button" className="tool-btn tool-btn-sm" onClick=${savePng}>${icon('download')} PNG</button>
                  <button type="button" className="tool-btn tool-btn-sm" onClick=${toggleRec}>
                    ${rec ? 'Stop recording' : 'Record video'}
                  </button>
                  <button type="button" className="tool-btn tool-btn-sm" onClick=${copyLink}>
                    ${icon(copied ? 'check' : 'link')} ${copied ? 'Copied' : 'Copy link'}
                  </button>
                </div>
                <p className="vs-note" style=${{ marginTop: 7 }}>
                  Recording captures the canvas as WebM until you stop it. The link carries the settings
                  and the shapes, not what you drew freehand.
                </p>
              <//>

              <${Section} id="about" title="About" open=${sec === 'about'} onToggle=${toggleSec}>
                <div className="vs-about">
                  <p>
                    Nine numbers per grid cell: how much of the fluid there is moving in each of nine
                    directions, rest included. Every step they hop one cell along their direction and
                    then relax a little towards the distribution a gas in equilibrium would have. That is
                    the lattice Boltzmann method, and it is all the program does. The Navier-Stokes
                    equations are not in it anywhere; they come out of it, in the same way they come out
                    of real molecules, which also do not know they are a fluid.
                  </p>
                  <p>
                    The vortex street is not programmed either. Behind a cylinder above a Reynolds number
                    of about 47 the wake stops being symmetric and starts shedding vortices, alternately
                    from the top and the bottom, at a frequency that in units of U/D sits near 0.2 for
                    a free cylinder at a few hundred (Williamson 1996). The numbers the panel reports are
                    measured, not looked up: the force is the momentum the fluid hands to the obstacle
                    every step, summed over every cell face it touches.
                  </p>
                  <p>
                    How honest those numbers are: in the Schäfer-Turek channel benchmark at Re 100
                    the reference Strouhal number is 0.30 and this solver gets 0.297 with 16 cells
                    across the cylinder and 0.302 with 64. Drag comes out about 3 % high at 64 cells
                    and 7 % at 16, because a round obstacle here is made of square cells, and the
                    fluid notices. The preset of that name has the benchmark's channel and cylinder
                    but not its length, which is whatever your screen allows, so its numbers drift a
                    little further. Slip walls are close, not infinitely far, so a free cylinder in
                    this tunnel also feels the blockage.
                  </p>
                  <p>
                    It blows up sometimes. Low viscosity means τ close to ½, where the method runs out
                    of numerical damping, and the trouble starts at sharp corners. Things worth trying:
                    the plate across at Re 300 with TRT and Smagorinsky off; the airfoil past 15° until it
                    stalls; two cylinders in a row, where the second one sits in the first one's street.
                  </p>
                  <p style=${{ color: COL.note }}>
                    Methods from Krüger et al., The Lattice Boltzmann Method (Springer 2017), Ginzburg et al.
                    2008 (TRT), Latt and Chopard 2006 and Coreixas et al. 2017 (regularised collision),
                    Zou and He 1997 (inlet), Ladd 1994 and Mei et al. 2002 (bounce-back, momentum exchange),
                    Hou et al. 1996 (Smagorinsky), written from the papers. The warning about τ near ½
                    comes from the issue tracker of
