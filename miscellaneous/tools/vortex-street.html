    /* Full-screen canvas tool, the same deliberate exception as ripple-tank and
       reaction-diffusion: no Pico container, no site header, no site footer.

    html, body { height: 100%; }
    body { margin: 0; overflow: hidden; background: #0b1017; }
    #root { position: fixed; inset: 0; }

    .vs-stage { position: absolute; inset: 0; touch-action: none; cursor: crosshair; }
    .vs-stage.move { cursor: grab; }
    .vs-stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

    .vs-back { position: absolute; top: 12px; left: 12px; z-index: 3;
      font-size: 12.5px; color: var(--tool-label); text-decoration: none;
      padding: 5px 11px; border-radius: 999px; border: 1px solid rgba(51,65,85,.8);
      background: color-mix(in srgb, var(--tool-panel) 60%, transparent); backdrop-filter: blur(6px); }
    .vs-back:hover { color: var(--tool-text); border-color: var(--tool-faint); }

    .vs-hud { position: absolute; bottom: 12px; left: 12px; z-index: 3;
      display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px;
      max-width: calc(100vw - 24px);
      font-size: 11.5px; color: var(--tool-label); font-variant-numeric: tabular-nums;
      pointer-events: none; letter-spacing: .02em;
      padding: 5px 11px; border-radius: 14px; border: 1px solid rgba(51,65,85,.8);
      background: color-mix(in srgb, var(--tool-panel) 60%, transparent); backdrop-filter: blur(6px); }
    .vs-hud b { color: var(--tool-text); font-weight: 600; }
    .vs-hud span { color: var(--tool-note); }

    .vs-alert { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 5;
      max-width: min(520px, calc(100vw - 380px)); min-width: 240px;
      font-size: 12.5px; line-height: 1.55; color: var(--tool-danger-text, #fecaca);
      padding: 8px 14px; border-radius: 10px;
      border: 1px solid var(--tool-danger-border, #f87171);
      background: color-mix(in srgb, var(--tool-panel) 88%, transparent); backdrop-filter: blur(8px); }

    .vs-panel { position: absolute; top: 12px; right: 12px; z-index: 4;
      width: min(340px, calc(100vw - 24px)); max-height: calc(100vh - 24px);
      overflow-y: auto; overscroll-behavior: contain;
      border: 1px solid var(--tool-border); border-radius: 10px; padding: 12px 14px 14px;
      background: color-mix(in srgb, var(--tool-panel) 82%, transparent); backdrop-filter: blur(10px);
      box-shadow: var(--tool-panel-shadow); }
    .vs-panel::-webkit-scrollbar { width: 8px; }
    .vs-panel::-webkit-scrollbar-thumb { background: var(--tool-border); border-radius: 4px; }

    .vs-toggle { position: absolute; top: 12px; right: 12px; z-index: 4;
      font-size: 12.5px; color: var(--tool-text); cursor: pointer;
      padding: 6px 13px; border-radius: 999px; border: 1px solid var(--tool-border);
      background: color-mix(in srgb, var(--tool-panel) 75%, transparent); backdrop-filter: blur(8px); }
    .vs-toggle:hover { border-color: var(--tool-faint); }

    .vs-sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

    .vs-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }

    .vs-x { background: none; border: none; color: var(--tool-note); cursor: pointer;

    .vs-acc-h:hover { color: var(--tool-text); }

    .vs-plot { display: block; width: 100%; height: 92px;

<body>
  <div id="root"></div>

  <!-- ────────────────────────────────────────────────────────────────────────
       Core: plain JS, no DOM and no GL, so the Node test suite can pull this
       block out and eval it (notes/dev/vortex-street.test.mjs). The lattice,
       both collision operators, the boundary rules, a CPU reference stepper,
       the obstacle geometry and the measurements live here. The GLSL in the
       vsgl block is generated from the same tables and has to agree with
       stepCPU bit for bit up to float32 (vortex-street.gpu.mjs checks that).
       ──────────────────────────────────────────────────────────────────── -->
  <script id="vscore">
  /* VS-CORE-START -- pure logic, also runs in the Node test suite */
  window.VSCore = (function () {
    'use strict';

    /* ---------- the lattice ----------

       D2Q9 (Qian, d'Humieres, Lallemand 1992), numbered as in Krüger et al.,
       The Lattice Boltzmann Method, Springer 2017, ch. 3: 0 rest, 1 to 4 the
       axes E N W S, 5 to 8 the diagonals NE NW SW SE. Lattice units throughout:
       cell size 1, time step 1, sound speed cs = 1/sqrt(3), so cs^2 = 1/3 and
       the kinematic viscosity is nu = cs^2 (tau - 1/2).                      */

    var CX = [0, 1, 0, -1, 0, 1, -1, -1, 1];
    var CY = [0, 0, 1, 0, -1, 1, 1, -1, -1];
    var WT = [4 / 9, 1 / 9, 1 / 9, 1 / 9, 1 / 9, 1 / 36, 1 / 36, 1 / 36, 1 / 36];
    var OPP = [0, 3, 4, 1, 2, 7, 8, 5, 6];      // c_OPP[i] = -c_i
    var MIR = [0, 1, 4, 3, 2, 8, 7, 6, 5];      // same cx, cy flipped (slip walls)

    /* TRT "magic" parameter Lambda = (tau+ - 1/2)(tau- - 1/2) (Ginzburg,
       Verhaeghe, d'Humieres 2008). 3/16 puts the halfway bounce-back wall
       exactly half a cell out for Poiseuille flow, whatever the viscosity;
       that is what makes the channel test below exact up to compressibility. */
    var LAMBDA = 3 / 16;

    /* Outlet sponge: in the last SPONGE_FRAC of the tunnel the viscosity is
       raised by up to SPONGE_NU (quadratic ramp), so a vortex is mostly
       smeared out before it reaches the zero-gradient outlet column, which
       reflects whatever arrives there sharply. The measurements never look
       at that band. */
    var SPONGE_FRAC = 0.08;
    var SPONGE_MIN = 8;
    var SPONGE_NU = 0.08;

    function spongeLen(w) { return Math.max(SPONGE_MIN, Math.round(w * SPONGE_FRAC)); }

    /* Absorbing layer against sound. Lattice Boltzmann is a compressible
       solver run at low Mach number, so every start-up, every shed vortex and
       every dragged obstacle sends pressure waves through the tunnel, and the
       velocity inlet and the pressure outlet both reflect them. With little
       viscosity the box then rang for hundreds of thousands of steps: pressure
       blobs the size of the screen, and a 10 degree airfoil whose lift swung
       by +-6. In the outlet sponge every cell is now also pulled towards the
       free-stream equilibrium after collision, g += sigma (f_eq(1, u_in) - g),
       sigma ramping up quadratically to ABSORB at the last column (a sponge
       layer in the sense of Israeli and Orszag 1981). In the empty tunnel or
       the developed channel the target is the flow itself and the layer does
       nothing.

       Only at the outlet, on purpose. A matching layer at the inlet was tried
       and removed: it forces the velocity towards the free stream exactly
       where an obstacle's blockage already slows the flow down, and in the
       Schaefer-Turek channel (cylinder 1.5 D behind the inlet) it raised the
       Re 100 peak drag from 3.34 to 3.61 and turned the Re 20 lift negative.
       Keeping the local density there made it worse (Re 20 drag 6.24). The
       outlet layer alone is enough: a wave reflected at the inlet has to
       cross it on the next pass. */
    var ABSORB = 0.05;
    function absorbSigma(x, w, L) {
      var s = (x - (w - L)) / L;
      if (s <= 0) return 0;
      if (s > 1) s = 1;
      return ABSORB * s * s;
    }
    function spongeNu(x, w, L) {
      var s = (x - (w - L)) / L;
      if (s <= 0) return 0;
      if (s > 1) s = 1;
      return SPONGE_NU * s * s;
    }

    /* Mean inflow speed u is what the speed slider sets. With no-slip walls
       the inlet is the developed channel profile (Poiseuille) with that mean,
       peak 1.5 u; the walls sit half a cell outside the first and last row. */
    function inletU(p, y, h) {
      var prof = p.profile || (p.walls === 'noslip' ? 'parabolic' : 'uniform');
      if (prof !== 'parabolic') return p.u;
      var eta = y + 0.5;
      return 6 * p.u * eta * (h - eta) / (h * h);
    }

    function feq(rho, ux, uy, out) {
      var usq = 1.5 * (ux * ux + uy * uy);
      for (var i = 0; i < 9; i++) {
        var cu = CX[i] * ux + CY[i] * uy;
        out[i] = WT[i] * rho * (1 + 3 * cu + 4.5 * cu * cu - usq);
      }
      return out;
    }

    /* Smagorinsky subgrid viscosity, solved for the total relaxation time
       locally from the non-equilibrium momentum flux (Hou, Sterling, Chen,
       Doolen 1996; Malaspinas & Sagaut 2012): Pi_neq = -2 rho cs^2 tau S,
       nu_t = (Cs Delta)^2 |S| with Delta = 1, gives a quadratic in tau with
       tau = (tau0 + sqrt(tau0^2 + 18 Cs^2 sqrt(2 Pi:Pi) / rho)) / 2.        */
    function smagTau(tau0, cs, pxx, pyy, pxy, rho) {
      if (!(cs > 0)) return tau0;
      var q = Math.sqrt(2 * (pxx * pxx + pyy * pyy + 2 * pxy * pxy));
      return 0.5 * (tau0 + Math.sqrt(tau0 * tau0 + 18 * cs * cs * q / rho));
    }

    /* Hermite polynomials per direction for the regularised collision:
       H_xx = cx^2 - 1/3, H_yy, H_xy = cx cy, and the two third-order ones
       D2Q9 can carry, H_xxy = cx^2 cy - cy/3 and H_xyy = cx cy^2 - cx/3. */
    var HXX = [], HYY = [], HXY = [], HXXY = [], HXYY = [];
    for (var hi = 0; hi < 9; hi++) {
      HXX.push(CX[hi] * CX[hi] - 1 / 3);
      HYY.push(CY[hi] * CY[hi] - 1 / 3);
      HXY.push(CX[hi] * CY[hi]);
      HXXY.push(CX[hi] * CX[hi] * CY[hi] - CY[hi] / 3);
      HXYY.push(CX[hi] * CY[hi] * CY[hi] - CX[hi] / 3);
    }

    /* ---------- collision on one cell ----------
       F: the nine incoming populations, G: output. Returns tau actually used
       (with the subgrid part), which the tests look at. */

    function collide(F, G, rho, ux, uy, tau0, p) {
      return collideN(F, G, rho, ux, uy, tau0, p.cs || 0, p.collision === 'reg');
    }

    /* Unrolled, because this runs once per cell per step and the benchmark
       tests take minutes otherwise. The shader in vsgl is the same code line
       by line; vortex-street.test.mjs checks both operators against a plain
       loop over the Hermite polynomials above. */
    function collideN(F, G, rho, ux, uy, tau0, csm, isReg) {
      var f0 = F[0], f1 = F[1], f2 = F[2], f3 = F[3], f4 = F[4],
          f5 = F[5], f6 = F[6], f7 = F[7], f8 = F[8];
      var usq = 1.5 * (ux * ux + uy * uy);
      var r0 = rho * (4 / 9), r1 = rho * (1 / 9), r2 = rho * (1 / 36);
      var ua = ux + uy, ub = uy - ux;
      var e0 = r0 * (1 - usq);
      var e1 = r1 * (1 + 3 * ux + 4.5 * ux * ux - usq);
      var e3 = r1 * (1 - 3 * ux + 4.5 * ux * ux - usq);
      var e2 = r1 * (1 + 3 * uy + 4.5 * uy * uy - usq);
      var e4 = r1 * (1 - 3 * uy + 4.5 * uy * uy - usq);
      var e5 = r2 * (1 + 3 * ua + 4.5 * ua * ua - usq);
      var e7 = r2 * (1 - 3 * ua + 4.5 * ua * ua - usq);
      var e6 = r2 * (1 + 3 * ub + 4.5 * ub * ub - usq);
      var e8 = r2 * (1 - 3 * ub + 4.5 * ub * ub - usq);
      var d1 = f1 - e1, d2 = f2 - e2, d3 = f3 - e3, d4 = f4 - e4;
      var d5 = f5 - e5, d6 = f6 - e6, d7 = f7 - e7, d8 = f8 - e8;
      var dd = d5 + d6 + d7 + d8;
      var pxx = d1 + d3 + dd, pyy = d2 + d4 + dd, pxy = d5 - d6 + d7 - d8;
      var tau = smagTau(tau0, csm, pxx, pyy, pxy, rho);
      var om = 1 / tau;
      if (isReg) {
        /* Recursive regularised BGK (Latt & Chopard 2006; Malaspinas 2015;
           Coreixas et al. 2017): rebuild every population from rho, u and
           Pi_neq up to the third-order Hermite moments D2Q9 can hold. The
           ghost moments the two-relaxation-time scheme carries along, and
           barely damps as tau -> 1/2, are dropped every step. */
        var k = 1 - om;
        var A = 4.5 * (rho * ux * ux + k * pxx);
        var B = 4.5 * (rho * uy * uy + k * pyy);
        var Cc = 9 * (rho * ux * uy + k * pxy);
        var P = 13.5 * (rho * ux * ux * uy + k * (2 * ux * pxy + uy * pxx));
        var Q = 13.5 * (rho * ux * uy * uy + k * (2 * uy * pxy + ux * pyy));
        var s2 = 2 * (A + B) / 3, ax = (2 * A - B) / 3, by = (2 * B - A) / 3;
        var rx = 3 * rho * ux, ry = 3 * rho * uy, ra = 3 * rho * ua, rb = 3 * rho * ub;
        G[0] = (4 / 9) * (rho - (A + B) / 3);
        G[1] = (1 / 9) * (rho + rx + ax - Q / 3);
        G[3] = (1 / 9) * (rho - rx + ax + Q / 3);
        G[2] = (1 / 9) * (rho + ry + by - P / 3);
        G[4] = (1 / 9) * (rho - ry + by + P / 3);
        G[5] = (1 / 36) * (rho + ra + s2 + Cc + 2 * (P + Q) / 3);
        G[7] = (1 / 36) * (rho - ra + s2 + Cc - 2 * (P + Q) / 3);
        G[6] = (1 / 36) * (rho + rb + s2 - Cc + 2 * (P - Q) / 3);
        G[8] = (1 / 36) * (rho - rb + s2 - Cc - 2 * (P - Q) / 3);
      } else {
        /* Two-relaxation-time (Ginzburg et al. 2008): the symmetric half of
           each opposite pair relaxes with tau+ (it carries the viscosity),
           the antisymmetric half with tau- = 1/2 + Lambda / (tau+ - 1/2). */
        var wp = om, wm = 1 / (0.5 + LAMBDA / (tau - 0.5));
        var hp = 0.5 * wp, hm = 0.5 * wm, sp, sm;
        G[0] = f0 - wp * (f0 - e0);
        sp = hp * (d1 + d3); sm = hm * (d1 - d3); G[1] = f1 - sp - sm; G[3] = f3 - sp + sm;
        sp = hp * (d2 + d4); sm = hm * (d2 - d4); G[2] = f2 - sp - sm; G[4] = f4 - sp + sm;
        sp = hp * (d5 + d7); sm = hm * (d5 - d7); G[5] = f5 - sp - sm; G[7] = f7 - sp + sm;
        sp = hp * (d6 + d8); sm = hm * (d6 - d8); G[6] = f6 - sp - sm; G[8] = f8 - sp + sm;
      }
      return tau;
    }

    /* ---------- the simulation on plain arrays ----------

       Populations are stored post-collision, one plane per direction:
       f[i * n + y * w + x]. A step is pull streaming plus collision in one
       pass, exactly like the fragment shader: every cell gathers the nine
       populations that arrive at it, applies the boundary rules, collides
       and writes. y = 0 is the bottom row (GL convention).

       Boundary rules, in the order the gather checks them:
       - from x < 0: the inlet. The three unknown populations (1, 5, 8) are
         set by Zou and He (1997) for the prescribed velocity (u_in(y), 0).
       - from x >= w: the outlet. The population is copied from the last
         column (zero gradient), and its equilibrium part is moved to
         density 1: F = f* + (1 - rho_s) f_eq(1, u_s), with rho_s and u_s the
         previous step's moments of the source cell. This is a pressure
         outlet after the non-equilibrium extrapolation idea of Guo, Zheng
         and Shi (2002). A plain copy holds no pressure level at all: in a
         no-slip channel, where friction needs a pressure drop, the density
         then climbs without bound (it reached 6 in the channel test before
         this rule went in).
       - from beyond the top or bottom row: periodic wraps; no-slip bounces
         back halfway (Ladd 1994); slip reflects specularly, taking the
         mirrored population from the same row.
       - from a solid cell: halfway bounce-back, and the momentum handed to
         the wall, 2 c f*, is added to the force on the obstacles (momentum

       p: { u, nu, cs, collision: 'trt'|'reg', walls: 'slip'|'noslip'|'periodic',

    function createSim(w, h) {

    /* Start from rest-of-the-world flow: everything moving with the inflow,
       plus a weak cellular stir that breaks the mirror symmetry, so a centred
       cylinder starts shedding within a few periods instead of waiting for
       round-off. The stir is the curl of psi = A sin(2 pi x/h) sin(pi y/h),
       so it is divergence free and vanishes at the walls. The first version
       was a uniform sideways drift instead: slip walls turned that into a
       vertical sound wave sloshing between them for a million steps, which

      '  oB = vec4(r1*(1.0 - 3.0*uy + 4.5*uy*uy - usq), r2*(1.0 + 3.0*ua + 4.5*ua*ua - usq),',
      '            r2*(1.0 + 3.0*ub + 4.5*ub*ub - usq), r2*(1.0 - 3.0*ua + 4.5*ua*ua - usq));',
      '  oC = vec4(r2*(1.0 - 3.0*ub + 4.5*ub*ub - usq), ux, uy, 1.0);',
      '  oF = vec4(0.0);',
      '}'
    ].join('\n');

    /* Sum of 8x8 blocks, for the force and the blow-up count. */
    var REDUCE = [
      HEAD,
      'uniform sampler2D uSrc;',
      'uniform ivec2 uSrcSize;',
      'out vec4 o;',
      'void main(){',
      '  ivec2 b = ivec2(gl_FragCoord.xy) * 8;',
      '  vec4 s = vec4(0.0);',
      '  for (int j = 0; j < 8; j++) for (int i = 0; i < 8; i++) {',
      '    ivec2 q = b + ivec2(i, j);',
      '    if (q.x < uSrcSize.x && q.y < uSrcSize.y) s += texelFetch(uSrc, q, 0);',

    /* Shared helper: bilinear velocity at a position in cell units (cell
       centres at i + 0.5), from C.yz. The state is NEAREST because 32F
       filtering needs an extension. */
    var VEL = [
      'vec2 vel(vec2 pos){',
      '  vec2 g = pos - 0.5;',
      '  ivec2 i0 = ivec2(floor(g));',
      '  vec2 f = g - floor(g);',
      '  ivec2 hi = uGrid - 1;',
      '  vec2 a = texelFetch(uC, clamp(i0, ivec2(0), hi), 0).yz;',
      '  vec2 b = texelFetch(uC, clamp(i0 + ivec2(1,0), ivec2(0), hi), 0).yz;',
      '  vec2 c = texelFetch(uC, clamp(i0 + ivec2(0,1), ivec2(0), hi), 0).yz;',
      '  vec2 d = texelFetch(uC, clamp(i0 + ivec2(1,1), ivec2(0), hi), 0).yz;',
      '  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);',
      '}'
    ].join('\n');

    /* Derived fields at grid resolution into RGBA16F, which may be filtered:
       vorticity, speed, density deviation, solid. */
    var DERIVE = [
      HEAD,
      'uniform sampler2D uC, uMask;',
      'uniform ivec2 uGrid;',
      'out vec4 o;',
      'vec2 uAt(ivec2 q){ return texelFetch(uC, clamp(q, ivec2(0), uGrid - 1), 0).yz; }',
      'void main(){',
      '  ivec2 p = ivec2(gl_FragCoord.xy);',
      '  vec4 c = texelFetch(uC, p, 0);',
      '  float w = 0.5*(uAt(p + ivec2(1,0)).y - uAt(p - ivec2(1,0)).y)',
      '          - 0.5*(uAt(p + ivec2(0,1)).x - uAt(p - ivec2(0,1)).x);',
      '  float sol = texelFetch(uMask, p, 0).r;',
      '  o = vec4(w, length(c.yz), c.w - 1.0, sol);',
      '}'
    ].join('\n');

    /* Smoke: semi-Lagrangian advection of two dye channels with a midpoint
       back trace, once per frame over all of its steps. r = the smoke rake
       at the inlet, g = dye that seeps out of every obstacle surface, which
       is how the vortices in the wake become visible. */
    var DYE = [
      HEAD,
      'uniform sampler2D uDye, uC, uMask;',
      'uniform ivec2 uGrid;',
      'uniform float uDt, uRake, uFade;',
      'out vec4 o;',
      VEL,
      'bool solidAt(ivec2 q){ return texelFetch(uMask, clamp(q, ivec2(0), uGrid - 1), 0).r > 0.5; }',
      'void main(){',
      '  ivec2 p = ivec2(gl_FragCoord.xy);',
      '  vec2 pos = gl_FragCoord.xy;',
