  <!-- ──────────────────────────────────────────────────────────────────────────
       Format core: plain JS (no JSX) so it can be unit-tested in Node.
       All async/await lives here on purpose. The babel block below is run
       through preset-env, which would compile async functions down to
       regeneratorRuntime, and that runtime is not loaded anywhere.
       So: Promises in the UI, await only in here.

       Written from the public format descriptions (MobileRead wiki). No code
       from Calibre or KindleUnpack (both GPLv3) was copied or translated.
       ────────────────────────────────────────────────────────────────────── -->
  <script id="ebookcore">
  window.EbookCore = (function () {
    'use strict';

    // ══ byte helpers ═════════════════════════════════════════════════════════

    function concatBytes(chunks) {
      let n = 0;
      for (const c of chunks) n += c.length;
      const out = new Uint8Array(n);
      let o = 0;
      for (const c of chunks) { out.set(c, o); o += c.length; }
      return out;
    }

    const UTF8 = { enc: new TextEncoder(), };
    function encodeUtf8(s) { return UTF8.enc.encode(s); }
    function decodeUtf8(b) { return new TextDecoder('utf-8').decode(b); }

    // Decode a text file whose encoding we do not know. Strict UTF-8 first;
    // if that throws, the file is almost certainly a legacy single-byte one.
    function decodeText(bytes) {
      if (bytes.length >= 3 && bytes[0] === 0xEF && bytes[1] === 0xBB && bytes[2] === 0xBF) {
        return { text: decodeUtf8(bytes.subarray(3)), encoding: 'utf-8 (BOM)' };
      }
      if (bytes.length >= 2 && bytes[0] === 0xFF && bytes[1] === 0xFE) {
        return { text: new TextDecoder('utf-16le').decode(bytes.subarray(2)), encoding: 'utf-16le' };
      }
      if (bytes.length >= 2 && bytes[0] === 0xFE && bytes[1] === 0xFF) {
        return { text: new TextDecoder('utf-16be').decode(bytes.subarray(2)), encoding: 'utf-16be' };
      }
      try {
        return { text: new TextDecoder('utf-8', { fatal: true }).decode(bytes), encoding: 'utf-8' };
      } catch (e) {
        return { text: new TextDecoder('windows-1252').decode(bytes), encoding: 'windows-1252' };
      }
    }

    // A byte-per-character string, so that string indices equal byte offsets.
    // TextDecoder cannot do this: in the Encoding Standard both "latin1" and
    // "iso-8859-1" are aliases for windows-1252, which remaps 0x80..0x9F to
    // other code points and would corrupt those bytes on the way back.
    function bytesToBinaryString(bytes) {
      const CHUNK = 0x8000;
      const parts = [];
      for (let i = 0; i < bytes.length; i += CHUNK) {
        parts.push(String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK)));
      }
      return parts.join('');
    }
    function binaryStringToBytes(s) {
      const out = new Uint8Array(s.length);
      for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i) & 0xFF;
      return out;
    }

    function sniffImageMime(b) {
      if (b.length > 3 && b[0] === 0xFF && b[1] === 0xD8 && b[2] === 0xFF) return 'image/jpeg';
      if (b.length > 8 && b[0] === 0x89 && b[1] === 0x50 && b[2] === 0x4E && b[3] === 0x47) return 'image/png';
      if (b.length > 6 && b[0] === 0x47 && b[1] === 0x49 && b[2] === 0x46) return 'image/gif';
      if (b.length > 2 && b[0] === 0x42 && b[1] === 0x4D) return 'image/bmp';
      if (b.length > 12 && b[8] === 0x57 && b[9] === 0x45 && b[10] === 0x42 && b[11] === 0x50) return 'image/webp';
      return null;
    }

    const MIME_BY_EXT = {
      jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', gif: 'image/gif',
      bmp: 'image/bmp', webp: 'image/webp', svg: 'image/svg+xml',
      css: 'text/css', ttf: 'font/ttf', otf: 'font/otf', woff: 'font/woff', woff2: 'font/woff2',
      xhtml: 'application/xhtml+xml', html: 'application/xhtml+xml', htm: 'application/xhtml+xml',
      ncx: 'application/x-dtbncx+xml', opf: 'application/oebps-package+xml',
    };
    const EXT_BY_MIME = {
      'image/jpeg': 'jpg', 'image/png': 'png', 'image/gif': 'gif', 'image/bmp': 'bmp',
      'image/webp': 'webp', 'image/svg+xml': 'svg', 'text/css': 'css',
      'font/ttf': 'ttf', 'font/otf': 'otf', 'font/woff': 'woff', 'font/woff2': 'woff2',
      'application/font-woff': 'woff', 'application/vnd.ms-opentype': 'otf',
    };
    function extOf(path) {
      const m = /\.([A-Za-z0-9]+)$/.exec(path);
      return m ? m[1].toLowerCase() : '';
    }
    function mimeForPath(path) { return MIME_BY_EXT[extOf(path)] || 'application/octet-stream'; }

    // ══ CRC32 + deflate ══════════════════════════════════════════════════════

    const CRC_TABLE = (function () {
      const t = new Uint32Array(256);
      for (let n = 0; n < 256; n++) {
        let c = n;
        for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
        t[n] = c >>> 0;
      }
      return t;
    })();

    function crc32(buf) {
      let c = 0xFFFFFFFF;
      for (let i = 0; i < buf.length; i++) c = CRC_TABLE[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
      return (c ^ 0xFFFFFFFF) >>> 0;
    }

    // Push bytes through a (De)CompressionStream. The write side must not be
    // awaited before the read loop starts, or backpressure deadlocks on inputs
    // bigger than the internal queue.
    async function pumpStream(stream, bytes) {
      const writer = stream.writable.getWriter();
      const written = (async () => { await writer.write(bytes); await writer.close(); })();
      const reader = stream.readable.getReader();
      const chunks = [];
      for (;;) {
        const r = await reader.read();
        if (r.done) break;
        chunks.push(r.value);
      }
      await written;
      return concatBytes(chunks);
    }

    function deflateRaw(bytes) { return pumpStream(new CompressionStream('deflate-raw'), bytes); }
    function inflateRaw(bytes) { return pumpStream(new DecompressionStream('deflate-raw'), bytes); }

    // ══ ZIP ══════════════════════════════════════════════════════════════════

    const SIG_EOCD = 0x06054b50;
    const SIG_EOCD64_LOC = 0x07064b50;
    const SIG_EOCD64 = 0x06064b50;
    const SIG_CD = 0x02014b50;
    const SIG_LOCAL = 0x04034b50;

    // Read a ZIP into { path -> Uint8Array }.
    async function zipRead(bytes) {
      const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
      let eocd = -1;
      const scanFrom = Math.max(0, bytes.length - 65557 - 22);
      for (let i = bytes.length - 22; i >= scanFrom; i--) {
        if (dv.getUint32(i, true) === SIG_EOCD) { eocd = i; break; }
      }
      if (eocd < 0) throw new Error('Not a ZIP archive (no end-of-central-directory record).');

      let count = dv.getUint16(eocd + 10, true);
      let cdOffset = dv.getUint32(eocd + 16, true);

      // ZIP64: the 32-bit fields are saturated and the real values live in the
      // ZIP64 EOCD record, which the locator right before the EOCD points at.
      if (cdOffset === 0xFFFFFFFF || count === 0xFFFF) {
        const loc = eocd - 20;
        if (loc >= 0 && dv.getUint32(loc, true) === SIG_EOCD64_LOC) {
          const z64 = Number(dv.getBigUint64(loc + 8, true));
          if (dv.getUint32(z64, true) !== SIG_EOCD64) throw new Error('Damaged ZIP64 record.');
          count = Number(dv.getBigUint64(z64 + 32, true));
          cdOffset = Number(dv.getBigUint64(z64 + 48, true));
        }
      }

      const files = new Map();
      let p = cdOffset;
      for (let i = 0; i < count; i++) {
        if (dv.getUint32(p, true) !== SIG_CD) throw new Error('Damaged ZIP central directory.');
        const flags = dv.getUint16(p + 8, true);
        const method = dv.getUint16(p + 10, true);
        let compSize = dv.getUint32(p + 20, true);
        let uncompSize = dv.getUint32(p + 24, true);
        const nameLen = dv.getUint16(p + 28, true);
        const extraLen = dv.getUint16(p + 30, true);
        const commentLen = dv.getUint16(p + 32, true);
        let localOff = dv.getUint32(p + 42, true);
        const name = decodeUtf8(bytes.subarray(p + 46, p + 46 + nameLen));

        if (compSize === 0xFFFFFFFF || uncompSize === 0xFFFFFFFF || localOff === 0xFFFFFFFF) {
          const ex = p + 46 + nameLen;
          let q = ex;
          while (q < ex + extraLen - 3) {
            const id = dv.getUint16(q, true);
            const size = dv.getUint16(q + 2, true);
            if (id === 0x0001) {
              let r = q + 4;
              if (uncompSize === 0xFFFFFFFF) { uncompSize = Number(dv.getBigUint64(r, true)); r += 8; }
              if (compSize === 0xFFFFFFFF) { compSize = Number(dv.getBigUint64(r, true)); r += 8; }
              if (localOff === 0xFFFFFFFF) { localOff = Number(dv.getBigUint64(r, true)); r += 8; }
              break;
            }
            q += 4 + size;
          }
        }
        p += 46 + nameLen + extraLen + commentLen;

        if (name.endsWith('/')) continue; // directory entry
        if (flags & 0x0001) throw new Error('This file is encrypted and cannot be converted.');

        // The local header repeats the name and may carry a different extra
        // field length, so the data offset must be read from the local header.
        if (dv.getUint32(localOff, true) !== SIG_LOCAL) throw new Error('Damaged ZIP local header for ' + name);
        const lNameLen = dv.getUint16(localOff + 26, true);
        const lExtraLen = dv.getUint16(localOff + 28, true);
        const dataOff = localOff + 30 + lNameLen + lExtraLen;
        const raw = bytes.subarray(dataOff, dataOff + compSize);

        if (method === 0) files.set(name, raw.slice());
        else if (method === 8) files.set(name, await inflateRaw(raw));
        else throw new Error('Unsupported ZIP compression method ' + method + ' in ' + name);
      }
      return files;
    }

    function dosTime(d) {
      const time = ((d.getHours() & 31) << 11) | ((d.getMinutes() & 63) << 5) | ((d.getSeconds() / 2) & 31);
      const date = (((d.getFullYear() - 1980) & 127) << 9) | (((d.getMonth() + 1) & 15) << 5) | (d.getDate() & 31);
      return { time, date };
    }

    // entries: [{ name, bytes, store? }]. The first entry is written exactly as
    // given; for EPUB that must be an uncompressed "mimetype" with no extra field.
    async function zipWrite(entries, when) {
      const { time, date } = dosTime(when || new Date());
      const locals = [];
      const central = [];
      let offset = 0;

      for (const e of entries) {
        const nameBytes = encodeUtf8(e.name);
        const crc = crc32(e.bytes);
        let method = 0;
        let payload = e.bytes;
        if (!e.store && e.bytes.length > 0) {
          const def = await deflateRaw(e.bytes);
          if (def.length < e.bytes.length) { method = 8; payload = def; }
        }
        const flags = e.store ? 0 : 0x0800; // 0x0800 = names are UTF-8

        const lh = new Uint8Array(30 + nameBytes.length);
        const ldv = new DataView(lh.buffer);
        ldv.setUint32(0, SIG_LOCAL, true);
        ldv.setUint16(4, 20, true);
        ldv.setUint16(6, flags, true);
        ldv.setUint16(8, method, true);
        ldv.setUint16(10, time, true);
        ldv.setUint16(12, date, true);
        ldv.setUint32(14, crc, true);
        ldv.setUint32(18, payload.length, true);
        ldv.setUint32(22, e.bytes.length, true);
        ldv.setUint16(26, nameBytes.length, true);
        ldv.setUint16(28, 0, true);
        lh.set(nameBytes, 30);
        locals.push(lh, payload);

        const ch = new Uint8Array(46 + nameBytes.length);
        const cdv = new DataView(ch.buffer);
        cdv.setUint32(0, SIG_CD, true);
        cdv.setUint16(4, 20, true);
        cdv.setUint16(6, 20, true);
        cdv.setUint16(8, flags, true);
        cdv.setUint16(10, method, true);
        cdv.setUint16(12, time, true);
        cdv.setUint16(14, date, true);
        cdv.setUint32(16, crc, true);
        cdv.setUint32(20, payload.length, true);
        cdv.setUint32(24, e.bytes.length, true);
        cdv.setUint16(28, nameBytes.length, true);
        cdv.setUint16(30, 0, true);
        cdv.setUint16(32, 0, true);
        cdv.setUint16(34, 0, true);
        cdv.setUint16(36, 0, true);
        cdv.setUint32(38, 0, true);
        cdv.setUint32(42, offset, true);
        ch.set(nameBytes, 46);
        central.push(ch);

        offset += lh.length + payload.length;
      }

      const cdBytes = concatBytes(central);
      const end = new Uint8Array(22);
      const edv = new DataView(end.buffer);
      edv.setUint32(0, SIG_EOCD, true);
      edv.setUint16(8, entries.length, true);
      edv.setUint16(10, entries.length, true);
      edv.setUint32(12, cdBytes.length, true);
      edv.setUint32(16, offset, true);
      return concatBytes([concatBytes(locals), cdBytes, end]);
    }

    // ══ minimal XML ══════════════════════════════════════════════════════════
    // DOMParser is not available in Node, and MOBI markup is too broken for it
    // anyway. This is a tolerant scanner, enough for OPF / NCX / nav / container.

    const NAMED_ENTITIES = {
      amp: '&', lt: '<', gt: '>', quot: '"', apos: "'", nbsp: ' ',
      mdash: '—', ndash: '–', hellip: '…', middot: '·',
      lsquo: '‘', rsquo: '’', ldquo: '“', rdquo: '”',
      bdquo: '„', sbquo: '‚', laquo: '«', raquo: '»',
      auml: 'ä', ouml: 'ö', uuml: 'ü', Auml: 'Ä', Ouml: 'Ö',
      Uuml: 'Ü', szlig: 'ß', eacute: 'é', egrave: 'è',
      agrave: 'à', ccedil: 'ç', copy: '©', reg: '®',
      trade: '™', deg: '°', euro: '€', pound: '£', shy: '­',
    };

    function decodeEntities(s) {
      if (s.indexOf('&') < 0) return s;
      return s.replace(/&(#[0-9]+|#[xX][0-9a-fA-F]+|[A-Za-z][A-Za-z0-9]*);/g, function (m, e) {
        if (e.charAt(0) === '#') {
          const cp = (e.charAt(1) === 'x' || e.charAt(1) === 'X')
            ? parseInt(e.slice(2), 16) : parseInt(e.slice(1), 10);
          if (!isFinite(cp) || cp <= 0 || cp > 0x10FFFF) return m;
          try { return String.fromCodePoint(cp); } catch (err) { return m; }
        }
        return Object.prototype.hasOwnProperty.call(NAMED_ENTITIES, e) ? NAMED_ENTITIES[e] : m;
      });
    }

    function escapeXml(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&apos;' }[c];
      });
    }

    // Attribute values may be double-quoted, single-quoted, unquoted (HTML4) or
    // absent entirely (<td nowrap>). MOBI markup uses all four.
    const ATTR_RE = /([A-Za-z_:][\w:.-]*)(?:\s*=\s*(?:"([^"]*)"|'([^']*)'|([^\s"'>]*)))?/g;

    function parseAttrs(s) {
      const out = {};
      ATTR_RE.lastIndex = 0;
      let m;
      while ((m = ATTR_RE.exec(s))) {
        if (!m[0]) { ATTR_RE.lastIndex++; continue; }
        const key = m[1].toLowerCase();
        const val = m[2] !== undefined ? m[2]
          : m[3] !== undefined ? m[3]
            : m[4] !== undefined && m[4] !== '' ? m[4]
              : key; // valueless attribute: XHTML wants name="name"
        out[key] = decodeEntities(val);
      }
      return out;
    }

    const VOID_TAGS = { br: 1, img: 1, hr: 1, meta: 1, link: 1, input: 1, area: 1, base: 1, col: 1, embed: 1, source: 1, track: 1, wbr: 1 };

    // An open <p> is ended by any block-level tag, and list/table cells end their
    // own kind. Without this, unclosed MOBI paragraphs nest inside one another.
    const ENDS_P = { p: 1, div: 1, h1: 1, h2: 1, h3: 1, h4: 1, h5: 1, h6: 1, blockquote: 1, table: 1, ul: 1, ol: 1, pre: 1, hr: 1, section: 1, article: 1, figure: 1 };
    const SELF_ENDING = { li: { li: 1 }, td: { td: 1, th: 1 }, th: { td: 1, th: 1 }, tr: { tr: 1, td: 1, th: 1 }, dd: { dd: 1, dt: 1 }, dt: { dd: 1, dt: 1 }, option: { option: 1 } };

    function textNode(v) { return { name: '#text', value: v }; }

    // Tolerant scanner. Text is kept as ordered child nodes so the tree can be
    // serialized back out as well-formed XML, which is how messy MOBI markup is
    // turned into the XHTML that EPUB requires.
    function parseXML(str) {
      const root = { name: '#root', attrs: {}, children: [] };
      const stack = [root];
      const re = /<!--[\s\S]*?-->|<!\[CDATA\[([\s\S]*?)\]\]>|<\?[\s\S]*?\?>|<![^>]*>|<\/([A-Za-z_][\w:.-]*)\s*>|<([A-Za-z_][\w:.-]*)((?:\s+[\w:.-]+(?:\s*=\s*(?:"[^"]*"|'[^']*'|[^\s"'>]*))?)*)\s*(\/?)>|([^<]+)|(<)/g;
      let m;
      while ((m = re.exec(str))) {
        const top = stack[stack.length - 1];
        if (m[1] !== undefined) {
          top.children.push(textNode(m[1]));
        } else if (m[2] !== undefined) {
          const close = m[2].toLowerCase();
          for (let i = stack.length - 1; i > 0; i--) {
            if (stack[i].name === close) { stack.length = i; break; }
          }
        } else if (m[3] !== undefined) {
          const name = m[3].toLowerCase();
          const ln = localName(name);
          // implicit closes
          for (;;) {
            const openName = stack.length > 1 ? localName(stack[stack.length - 1].name) : '';
            if (!openName) break;
            const selfEnd = SELF_ENDING[ln];
            if (openName === 'p' && ENDS_P[ln]) { stack.pop(); continue; }
            if (selfEnd && selfEnd[openName]) { stack.pop(); continue; }
            break;
          }
          const node = { name: name, attrs: parseAttrs(m[4] || ''), children: [] };
          stack[stack.length - 1].children.push(node);
          if (!m[5] && !VOID_TAGS[ln]) stack.push(node);
        } else if (m[6] !== undefined) {
          top.children.push(textNode(decodeEntities(m[6])));
        } else if (m[7] !== undefined) {
          top.children.push(textNode('<')); // a stray "<" that starts no tag
        }
      }
      return root;
    }

    function escapeText(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    function escapeAttr(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
    }

    // Serialize back to well-formed XML. Entities were decoded during parsing and
    // are re-escaped here, so an undefined entity like &foo; comes back out as
    // literal text rather than breaking the XHTML.
    function serializeXml(node, out) {
      out = out || [];
      if (node.name === '#text') { out.push(escapeText(node.value)); return out; }
      const isRoot = node.name === '#root';
      if (!isRoot) {
        out.push('<', node.name);
        for (const k of Object.keys(node.attrs)) out.push(' ', k, '="', escapeAttr(node.attrs[k]), '"');
        if (VOID_TAGS[localName(node.name)]) { out.push('/>'); return out; }
        out.push('>');
      }
      for (const c of node.children) serializeXml(c, out);
      if (!isRoot) out.push('</', node.name, '>');
      return out;
    }
    function toXml(node) { return serializeXml(node, []).join(''); }

    function localName(n) {
      const i = n.indexOf(':');
      return i < 0 ? n : n.slice(i + 1);
    }
    function isElement(n) { return n.name !== '#text'; }
    function findAll(node, name, out) {
      out = out || [];
      for (const c of node.children) {
        if (!isElement(c)) continue;
        if (localName(c.name) === name) out.push(c);
        findAll(c, name, out);
      }
      return out;
    }
    function findOne(node, name) {
      const all = findAll(node, name);
      return all.length ? all[0] : null;
    }
    function walkElements(node, fn) {
      for (const c of node.children) {
        if (!isElement(c)) continue;
        fn(c);
        walkElements(c, fn);
      }
    }
    function kids(node, name) {
      return node.children.filter(function (c) { return isElement(c) && localName(c.name) === name; });
    }
    function textOf(node) {
      if (!node) return '';
      return rawTextOf(node).replace(/\s+/g, ' ').trim();
    }
    function rawTextOf(node) {
      if (node.name === '#text') return node.value;
      let s = '';
      for (const c of node.children) s += rawTextOf(c);
      return s;
    }

    // ══ path helpers ═════════════════════════════════════════════════════════

    function dirOf(path) {
      const i = path.lastIndexOf('/');
      return i < 0 ? '' : path.slice(0, i);
    }
    function baseOf(path) {
      const i = path.lastIndexOf('/');
      return i < 0 ? path : path.slice(i + 1);
    }
    // Resolve a relative href against a directory, collapsing . and ..
    function resolvePath(baseDir, rel) {
      if (/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(rel)) return null; // http:, data:, mailto:
      let parts = (rel.charAt(0) === '/')
        ? rel.slice(1).split('/')
        : (baseDir ? baseDir.split('/') : []).concat(rel.split('/'));
      const out = [];
      for (const p of parts) {
        if (p === '' || p === '.') continue;
        if (p === '..') out.pop();
        else out.push(p);

      return out.join('/');

    function sanitizeName(name) {
      return name.replace(/[^A-Za-z0-9._-]+/g, '_').replace(/^_+|_+$/g, '') || 'file';

    // ══ the intermediate representation ══════════════════════════════════════
    //
    //   Book = {
    //     meta:      { title, author, language, publisher, date, identifier, coverRes },
    //     sections:  [ { id, title, html, css: [resName] } ],   // in reading order
    //     resources: Map<resName, { mime, bytes }>,             // flat, no directories
    //     toc:       [ { title, href, level } ]                 // href = "text/<id>.xhtml#frag"
    //   }
    //
    // Every reader produces this, every writer consumes it. Section markup refers
    // to resources as "../res/<resName>" and to other sections as "<id>.xhtml",
    // because sections are written to text/ and resources to res/.

    function emptyBook() {
      return {
        meta: { title: '', author: '', language: 'en', publisher: '', date: '', identifier: '', coverRes: '' },
        sections: [],
        resources: new Map(),
        toc: [],
      };
    }

    // Allocate a unique flat resource name.
    function addResource(book, preferredName, mime, bytes) {
      let base = sanitizeName(baseOf(preferredName));
      const wantExt = EXT_BY_MIME[mime];
      if (wantExt && extOf(base) !== wantExt) base = base.replace(/\.[A-Za-z0-9]+$/, '') + '.' + wantExt;
      let name = base;
      let i = 2;
      while (book.resources.has(name)) {
        name = base.replace(/(\.[A-Za-z0-9]+)?$/, function (ext) { return '-' + i + (ext || ''); });
        i++;

      book.resources.set(name, { mime: mime, bytes: bytes });
      return name;

    const RES_ATTR_RE = /\s(src|href|xlink:href|poster)\s*=\s*(?:"([^"]*)"|'([^']*)')/gi;

    // Point every relative link in a section at the flat layout the writers use.
    // pathMap: original zip path -> "../res/x" or "sec-0002.xhtml"
    function rewriteLinks(html, baseDir, pathMap) {
      return html.replace(RES_ATTR_RE, function (m, attr, dq, sq) {
        const raw = dq !== undefined ? dq : sq;
        const sf = splitFrag(raw);
        if (!sf.path) return m; // pure "#anchor", stays valid
        const abs = resolvePath(baseDir, sf.path);
        if (abs === null) return m; // absolute URL, leave alone
        const target = pathMap[abs];
        if (!target) return m;
        return ' ' + attr + '="' + escapeXml(target + sf.frag) + '"';

    function bodyInner(xhtml) {
      const m = /<body([^>]*)>([\s\S]*?)<\/body\s*>/i.exec(xhtml);
      if (m) {
        // Link targets and styling hooks often sit on the body element itself,
        // which does not survive into the new file. Keep them on a wrapper, or
        // those links would point at nothing.
        const attrs = parseAttrs(m[1]);

        if (attrs.id) keep += ' id="' + escapeAttr(attrs.id) + '"';
        if (attrs['class']) keep += ' class="' + escapeAttr(attrs['class']) + '"';
        return keep ? '<div' + keep + '>' + m[2] + '</div>' : m[2];
      }
      // No body tag (some MOBI-derived fragments): strip any head/html wrapper.
      return xhtml.replace(/<\?xml[\s\S]*?\?>/gi, '')
        .replace(/<!DOCTYPE[\s\S]*?>/gi, '')
        .replace(/<\/?html[^>]*>/gi, '')
        .replace(/<head[\s\S]*?<\/head\s*>/gi, '');
    }

    function titleFromHtml(html) {
      const h = /<h[1-3][^>]*>([\s\S]*?)<\/h[1-3]\s*>/i.exec(html);
      if (h) {
        const t = decodeEntities(h[1].replace(/<[^>]+>/g, '')).replace(/\s+/g, ' ').trim();
        if (t) return t.slice(0, 120);
      }
      return '';
    }

    // ══ EPUB reader ══════════════════════════════════════════════════════════

    async function readEpub(bytes, log) {
      const files = await zipRead(bytes);

      const containerRaw = files.get('META-INF/container.xml');
      if (!containerRaw) throw new Error('This ZIP file is not an EPUB (META-INF/container.xml is missing).');
      if (files.has('META-INF/encryption.xml')) {
        throw new Error('This EPUB is encrypted and cannot be converted.');

      if (!opfPath || !files.has(opfPath)) throw new Error('EPUB is damaged: the OPF package file is missing.');

      const opfDir = dirOf(opfPath);

      const metaNode = findOne(opf, 'metadata');
      if (metaNode) {
        const first = function (n) { const e = findOne(metaNode, n); return e ? textOf(e) : ''; };
        book.meta.title = first('title');
        book.meta.author = first('creator');
        book.meta.language = first('language') || 'en';
        book.meta.publisher = first('publisher');
        book.meta.date = first('date');
        book.meta.identifier = first('identifier');

      // manifest: id -> { path, mime, properties }
      const manifest = {};
      const manifestNode = findOne(opf, 'manifest');
      for (const item of (manifestNode ? kids(manifestNode, 'item') : [])) {
        const href = item.attrs.href;

        if (abs === null) continue;

          path: abs,
          mime: item.attrs['media-type'] || mimeForPath(abs),

      // cover id: EPUB2 <meta name="cover">, EPUB3 properties="cover-image"
      let coverId = '';
      for (const m of findAll(opf, 'meta')) {
        if ((m.attrs.name || '').toLowerCase() === 'cover' && m.attrs.content) coverId = m.attrs.content;
      }
      if (!coverId) {
        for (const id of Object.keys(manifest)) {
          if (/\bcover-image\b/.test(manifest[id].properties)) { coverId = id; break; }
        }
      }

      const spineNode = findOne(opf, 'spine');
      const spineIds = [];
      for (const ref of (spineNode ? kids(spineNode, 'itemref') : [])) {
        if (ref.attrs.idref && manifest[ref.attrs.idref]) spineIds.push(ref.attrs.idref);
      }
      if (!spineIds.length) throw new Error('EPUB is damaged: the spine is empty.');

      const spinePaths = new Set(spineIds.map(function (id) { return manifest[id].path; }));

      // Resources are everything in the manifest that is not a spine document
      // and not a navigation file. Keep an original-path -> flat-name map so the
      // links inside the sections can be rewritten.
      const pathMap = {};
      const NAV_MIME = { 'application/x-dtbncx+xml': 1, 'application/oebps-package+xml': 1 };
      let imageCount = 0;
      for (const id of Object.keys(manifest)) {
        const it = manifest[id];
        if (spinePaths.has(it.path)) continue;
        if (NAV_MIME[it.mime]) continue;
        if (/\bnav\b/.test(it.properties)) continue;
        const data = files.get(it.path);
        if (!data) { log.warn('Missing in archive, skipped: ' + it.path); continue; }
        const flat = addResource(book, it.path, it.mime, data);
        pathMap[it.path] = '../res/' + flat;
        if (/^image\//.test(it.mime)) imageCount++;
        if (id === coverId) book.meta.coverRes = flat;
      }

      // Section ids first, so cross-links between chapters can be resolved.
      const secIdByPath = {};
      spineIds.forEach(function (id, i) {
        const secId = 'sec-' + String(i + 1).padStart(4, '0');
        secIdByPath[manifest[id].path] = secId;
        pathMap[manifest[id].path] = secId + '.xhtml';
      });

      for (let i = 0; i < spineIds.length; i++) {
        const it = manifest[spineIds[i]];
        const raw = files.get(it.path);
        if (!raw) { log.warn('Missing in archive, skipped: ' + it.path); continue; }
        const doc = decodeUtf8(raw);
        const secDir = dirOf(it.path);

        const css = [];
        const linkRe = /<link\b[^>]*>/gi;
        let lm;
        while ((lm = linkRe.exec(doc))) {
          const a = parseAttrs(lm[0]);
          if (!a.href || !/stylesheet/i.test(a.rel || '')) continue;
          const abs = resolvePath(secDir, splitFrag(a.href).path);
          const flat = abs !== null && pathMap[abs];
          if (flat) css.push(flat.replace('../res/', ''));
        }

        const html = rewriteLinks(bodyInner(doc), secDir, pathMap);
        const titleTag = /<title[^>]*>([\s\S]*?)<\/title\s*>/i.exec(doc);
        book.sections.push({
          id: secIdByPath[it.path],
          title: (titleTag ? decodeEntities(titleTag[1]).trim() : '') || titleFromHtml(html),
          html: html,
          css: css,
        });
      }

      book.toc = readEpubToc(files, opf, manifest, opfDir, secIdByPath);
      log.info('EPUB: ' + book.sections.length + ' sections, ' + imageCount + ' images, '
        + book.toc.length + ' TOC entries');
      return book;
    }

    // Prefer the EPUB3 nav document, fall back to the EPUB2 NCX.
    function readEpubToc(files, opf, manifest, opfDir, secIdByPath) {
      const toHref = function (basePath, src) {
        const sf = splitFrag(src);
        const abs = resolvePath(dirOf(basePath), sf.path);
        const secId = abs !== null && secIdByPath[abs];
        return secId ? 'text/' + secId + '.xhtml' + sf.frag : null;

      let navPath = '';
      for (const id of Object.keys(manifest)) {
        if (/\bnav\b/.test(manifest[id].properties)) { navPath = manifest[id].path; break; }
      }
      if (navPath && files.has(navPath)) {
        const doc = parseXML(decodeUtf8(files.get(navPath)));
        for (const nav of findAll(doc, 'nav')) {
          const type = nav.attrs['epub:type'] || nav.attrs.type || '';
          if (type && type.indexOf('toc') < 0) continue;
          const out = [];
          const walk = function (ol, level) {
            for (const li of kids(ol, 'li')) {
              const a = findOne(li, 'a');
              if (a && a.attrs.href) {
                const href = toHref(navPath, a.attrs.href);
                if (href) out.push({ title: textOf(a) || 'Section', href: href, level: level });
              }
              for (const sub of kids(li, 'ol')) walk(sub, level + 1);
            }
          };
          for (const ol of kids(nav, 'ol')) walk(ol, 0);
          if (out.length) return out;
        }
      }

      let ncxPath = '';
      const spineNode = findOne(opf, 'spine');
      const tocId = spineNode && spineNode.attrs.toc;
      if (tocId && manifest[tocId]) ncxPath = manifest[tocId].path;
      if (!ncxPath) {
        for (const id of Object.keys(manifest)) {
          if (manifest[id].mime === 'application/x-dtbncx+xml') { ncxPath = manifest[id].path; break; }
        }
      }
      if (ncxPath && files.has(ncxPath)) {
        const doc = parseXML(decodeUtf8(files.get(ncxPath)));
        const map = findOne(doc, 'navMap'.toLowerCase());
        const out = [];
        const walk = function (node, level) {
          for (const np of kids(node, 'navpoint')) {
            const content = findOne(np, 'content');
            const label = findOne(np, 'navlabel');
            const src = content && content.attrs.src;
            if (src) {
              const href = toHref(ncxPath, src);
              if (href) out.push({ title: textOf(label) || 'Section', href: href, level: level });
            }
            walk(np, level + 1);
          }
        };
        if (map) walk(map, 0);
        if (out.length) return out;
      }
      return [];
    }

    // ══ EPUB writer ══════════════════════════════════════════════════════════

    function xhtmlDoc(title, lang, cssNames, body) {

      }).join('');

        + '<!DOCTYPE html>\n'
        + '<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="' + escapeXml(lang) + '" lang="' + escapeXml(lang) + '">\n'
        + '<head>\n  <meta charset="utf-8"/>\n  <title>' + escapeXml(title) + '</title>\n'
        + links
        + '</head>\n<body>\n' + body + '\n</body>\n</html>\n';

    async function writeEpub(book) {

        + '    <dc:title>' + escapeXml(title) + '</dc:title>\n'
        + '    <dc:language>' + escapeXml(lang) + '</dc:language>\n'

        + optional('publisher', book.meta.publisher)

        + coverMeta

        + '  <manifest>\n' + manifestItems.join('\n') + '\n  </manifest>\n'

      const toc = book.toc.length ? book.toc : book.sections.map(function (s, i) {

      });

        + '<!DOCTYPE html>\n'
        + '<html xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops" xml:lang="'
        + escapeXml(lang) + '" lang="' + escapeXml(lang) + '">\n'
        + '<head>\n  <meta charset="utf-8"/>\n  <title>' + escapeXml(title) + '</title>\n</head>\n'
        + '<body>\n  <nav epub:type="toc" id="toc">\n    <h1>Contents</h1>\n    <ol>\n'
        + navItems + '\n    </ol>\n  </nav>\n</body>\n</html>\n';

        return '    <navPoint id="np-' + (i + 1) + '" playOrder="' + (i + 1) + '">\n'
          + '      <navLabel><text>' + escapeXml(t.title) + '</text></navLabel>\n'
          + '      <content src="' + escapeXml(t.href) + '"/>\n'
          + '    </navPoint>';
      }).join('\n');
      const ncx = '<?xml version="1.0" encoding="utf-8"?>\n'
        + '<ncx xmlns="http://www.daisy.org/z3986/2005/ncx/" version="2005-1">\n'
        + '  <head>\n    <meta name="dtb:uid" content="' + escapeXml(uid) + '"/>\n'
        + '    <meta name="dtb:depth" content="1"/>\n'
        + '    <meta name="dtb:totalPageCount" content="0"/>\n'
        + '    <meta name="dtb:maxPageNumber" content="0"/>\n  </head>\n'
        + '  <docTitle><text>' + escapeXml(title) + '</text></docTitle>\n'
        + '  <navMap>\n' + ncxItems + '\n  </navMap>\n</ncx>\n';

        + '<container version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container">\n'
        + '  <rootfiles>\n'
        + '    <rootfile full-path="OEBPS/content.opf" media-type="application/oebps-package+xml"/>\n'
        + '  </rootfiles>\n</container>\n';

      // The mimetype entry must come first and be stored uncompressed, or strict
      // readers reject the archive.
      const entries = [
        { name: 'mimetype', bytes: encodeUtf8('application/epub+zip'), store: true },
        { name: 'META-INF/container.xml', bytes: encodeUtf8(container) },
        { name: 'OEBPS/content.opf', bytes: encodeUtf8(opf) },
        { name: 'OEBPS/nav.xhtml', bytes: encodeUtf8(nav) },
        { name: 'OEBPS/toc.ncx', bytes: encodeUtf8(ncx) },
      ];
      for (const s of book.sections) {
        entries.push({
          name: 'OEBPS/text/' + s.id + '.xhtml',
          bytes: encodeUtf8(xhtmlDoc(s.title || title, lang, s.css || [], s.html)),
        });

      for (const name of resList) {
        entries.push({ name: 'OEBPS/res/' + name, bytes: book.resources.get(name).bytes });

    // Deterministic pseudo-UUID from the title, so re-converting the same book
    // does not produce a new identifier every time.
    function fakeUuid(seed) {
      let h1 = 0x9e3779b9, h2 = 0x85ebca6b;
      for (let i = 0; i < seed.length; i++) {
        h1 = Math.imul(h1 ^ seed.charCodeAt(i), 0x01000193) >>> 0;
        h2 = Math.imul(h2 + seed.charCodeAt(i) + i, 0x85ebca6b) >>> 0;
      }
      const hex = function (x) { return ('00000000' + x.toString(16)).slice(-8); };
      const a = hex(h1), b = hex(h2), c = hex((h1 ^ h2) >>> 0), d = hex(Math.imul(h1, h2) >>> 0);
      return a + '-' + b.slice(0, 4) + '-4' + b.slice(5, 8) + '-a' + c.slice(1, 4) + '-' + c.slice(4) + d.slice(0, 4);

    // ══ plain text ═══════════════════════════════════════════════════════════

    const BLOCK_TAGS = 'address|article|aside|blockquote|div|dl|dd|dt|fieldset|figcaption|figure|footer|form|h[1-6]|header|hr|li|main|nav|ol|p|pre|section|table|tbody|td|tfoot|th|thead|tr|ul';

    function htmlToText(html) {
      let s = html;

      s = s.replace(/<!--[\s\S]*?-->/g, '');
      s = s.replace(/<br\s*\/?>/gi, '\n');
      s = s.replace(/<\/(?:h[1-6]|p|div|li|blockquote|tr|pre|section|article)\s*>/gi, '\n\n');
      s = s.replace(new RegExp('<(?:' + BLOCK_TAGS + ')\\b[^>]*>', 'gi'), '\n');
