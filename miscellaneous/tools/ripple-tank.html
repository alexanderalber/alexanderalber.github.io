    /* Full-screen canvas tool, same deliberate exception as reaction-diffusion:

    html, body { height: 100%; }
    body { margin: 0; overflow: hidden; background: #0b1017; }
    #root { position: fixed; inset: 0; }

    .rt-stage { position: absolute; inset: 0; touch-action: none; cursor: crosshair; }
    .rt-stage.move { cursor: grab; }
    .rt-stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

    .rt-back { position: absolute; top: 12px; left: 12px; z-index: 3;
      font-size: 12.5px; color: var(--tool-label); text-decoration: none;
      padding: 5px 11px; border-radius: 999px; border: 1px solid rgba(51,65,85,.8);
      background: color-mix(in srgb, var(--tool-ink) 60%, transparent); backdrop-filter: blur(6px); }
    .rt-back:hover { color: var(--tool-text); border-color: var(--tool-faint); }

    .rt-hud { position: absolute; bottom: 12px; left: 12px; z-index: 3;
      display: flex; align-items: baseline; gap: 10px;
      font-size: 11.5px; color: var(--tool-label); font-variant-numeric: tabular-nums;
      pointer-events: none; letter-spacing: .02em;

      background: color-mix(in srgb, var(--tool-ink) 60%, transparent); backdrop-filter: blur(6px); }
    .rt-hud b { color: var(--tool-text); font-weight: 600; }
    .rt-hud span { color: var(--tool-note); }

    .rt-panel { position: absolute; top: 12px; right: 12px; z-index: 4;

      border: 1px solid var(--tool-border); border-radius: 10px; padding: 12px 14px 14px;

    .rt-panel::-webkit-scrollbar { width: 8px; }

<body>
  <div id="root"></div>

  <!-- ────────────────────────────────────────────────────────────────────────
       Core: plain JS, no JSX and no DOM and no GL, so the Node test suite can
       pull this block out and eval it (notes/dev/ripple.test.mjs). All physics
       constants, the shape geometry and a CPU reference stepper live here.
       ──────────────────────────────────────────────────────────────────── -->
  <script id="rtcore">
  /* RT-CORE-START -- pure logic, also runs in the Node test suite */
  window.RTCore = (function () {
    'use strict';

    /* ---------- physics constants ----------

       The scheme is leapfrog FDTD of the scalar wave equation,
       u_new = 2u - u_prev + (C * c_rel)^2 * laplacian(u), five-point stencil.
       C is the Courant number c0*dt/dx; the 2D stability bound is 1/sqrt(2)
       and glass only ever makes c_rel smaller, so 0.5 is safe everywhere.

       The sponge is a band along each edge in which both time levels are
       multiplied by 1 - SPONGE_K * (1 - d/S)^2 per step. The quadratic ramp
       matters: a step in damping reflects, a smooth ramp absorbs. Its width
       has to scale with the wavelength (spongeFor): a fixed 56-texel band
       reflected ~15% of a default wave on a 2048 grid, which built visible
       standing stripes within a minute. With a plane source the LEFT edge is
       exempt, because the source columns sit inside that band and the wave
       was otherwise eaten on its way out. The GL sim shader takes all these
       numbers as uniforms straight from here, so the CPU reference below and
       the GPU run the same scheme. */

    var COURANT = 0.5;
    var SPONGE = 56;             // minimum width, texels
    var SPONGE_PER_LAMBDA = 1.2; // width as a multiple of the wavelength
    var SPONGE_K = 0.05;         // damping strength at the outermost texel

    function spongeFor(lambdaCells) {
      return Math.max(SPONGE, Math.round(SPONGE_PER_LAMBDA * Math.max(4, lambdaCells)));
    }
    var SRC_COLS = 3;        // driven columns of the plane source, texels
    var SRC_RADIUS = 2.5;    // point source radius, texels (scaled up on big grids)

    /* Radians per time step for a wavelength given in grid cells. */
    function omegaFor(lambdaCells) {
      return 2 * Math.PI * COURANT / Math.max(4, lambdaCells);
    }

    function spongeDamp(d, S) {
      if (!(S > 0) || d >= S) return 1;
      var s = d > 0 ? d / S : 0;
      return 1 - SPONGE_K * (1 - s) * (1 - s);
    }

    /* ---------- parameter ranges ----------
       lambda is a fraction of the grid height, so the picture survives a
       resolution change instead of rescaling: higher res only means the same
       wave is sampled more finely. */

    var RANGES = {
      lambda: [0.02, 0.30],
      n: [1.1, 3.0],
      steps: [1, 8],
      brush: [0.006, 0.08],
      gain: [0.3, 3.0]
    };

    /* Time constant of the intensity view's moving average of u^2, in source
       periods. Long enough to hold the pattern steady, short enough to follow
       a dragged lens within a second or two. */
    var ACC_PERIODS = 2.5;

    /* The medium texture's glass channel stores slowness 1 - 1/n directly
       (0 = free space, 0.67 = n of 3), so every piece of glass can carry its
       own refractive index and the sim shader needs no n uniform at all. */
    function slowness(n) {
      return 1 - 1 / Math.max(1.001, n);
    }

    function clamp(x, lo, hi) { return x < lo ? lo : (x > hi ? hi : x); }

    function clampTo(key, x) {
      var r = RANGES[key];
      if (!r || !isFinite(x)) return r ? r[0] : 0;
      return clamp(x, r[0], r[1]);
    }

    var SOURCES = [
      { id: 'plane', name: 'Plane' },
      { id: 'point', name: 'Point' },
      { id: 'off',   name: 'Off' }
    ];

    /* ---------- palettes ----------
       Diverging triples: troughs get neg, crests get pos, still water is mid.
       Hollywood (the site's default diverging pair) over a dark midpoint, and
       Paper: dark navy troughs and burnt orange crests on warm off-white, the
       look of the classic printed wave-optics figures. wall and glass are the
       overlay colours of the two materials. RGB in 0..1. */

    var PALETTES = [
      { id: 'hollywood', name: 'Hollywood',
        neg: [1.00, 0.55, 0.26], mid: [0.043, 0.055, 0.078], pos: [0.00, 0.55, 0.55],
        wall: [0.58, 0.64, 0.72], glass: [0.45, 0.75, 0.85] },
      { id: 'paper', name: 'Paper',
        neg: [0.10, 0.13, 0.25], mid: [0.94, 0.91, 0.86], pos: [0.78, 0.38, 0.24],
        wall: [0.06, 0.06, 0.09], glass: [0.35, 0.55, 0.65] }
    ];

    var PALETTE_BY_ID = {};
    for (var qi = 0; qi < PALETTES.length; qi++) PALETTE_BY_ID[PALETTES[qi].id] = PALETTES[qi];

    /* ---------- shapes ----------

       Positions are (x, y) in [0,1]^2 of the viewport; sizes are fractions of
       the viewport height. The world frame the SDFs run in is
       (x * aspect, y) with aspect = gridW / gridH, so shapes are never
       stretched. The JS functions here mirror the GLSL in the compose shader
       exactly; hit testing must agree with what is drawn.

       Types: circle (p1 = radius), box (p1/p2 = half extents), lens
       (biconvex, p1 = half aperture, p2 = half thickness at the axis), prism
       (equilateral triangle, p1 = size). mat is 'wall' or 'glass'.            */

    var SHAPE_LIMIT = 24;
    var SHAPE_TYPES = ['circle', 'box', 'lens', 'prism'];
    var TYPE_INDEX = { circle: 0, box: 1, lens: 2, prism: 3 };

    var shapeSeq = 1;
    function makeShape(type) {
      var s = { id: 's' + (shapeSeq++), type: type, x: 0.5, y: 0.5, rot: 0, mat: 'wall', p1: 0.1, p2: 0, n: 1.5 };
      if (type === 'circle') { s.p1 = 0.09; }
      else if (type === 'box') { s.p1 = 0.02; s.p2 = 0.20; }
      else if (type === 'lens') { s.p1 = 0.22; s.p2 = 0.055; s.mat = 'glass'; }
      else if (type === 'prism') { s.p1 = 0.16; s.mat = 'glass'; }
      return s;
    }

    function sdCircle(px, py, r) {
      return Math.sqrt(px * px + py * py) - r;
    }

    function sdBox(px, py, hw, hh) {
      var dx = Math.abs(px) - hw, dy = Math.abs(py) - hh;
      var ax = Math.max(dx, 0), ay = Math.max(dy, 0);
      return Math.sqrt(ax * ax + ay * ay) + Math.min(Math.max(dx, dy), 0);
    }

    /* Biconvex lens as the intersection of two circles. Given half aperture h
       and half thickness t, each surface is an arc of radius
       R = (h^2 + t^2) / 2t with its centre pushed off-axis by R - t. */
    function sdLens(px, py, h, t) {
      var R = (h * h + t * t) / (2 * t);
      var off = R - t;
      var d1 = Math.sqrt((px + off) * (px + off) + py * py) - R;
      var d2 = Math.sqrt((px - off) * (px - off) + py * py) - R;
      return Math.max(d1, d2);
    }

    /* Equilateral triangle (Inigo Quilez's exact SDF), size s. */
    function sdPrism(px, py, s) {
      var k = Math.sqrt(3);
      px = Math.abs(px) - s;
      py = py + s / k;
      if (px + k * py > 0) {
        var nx = (px - k * py) / 2, ny = (-k * px - py) / 2;
        px = nx; py = ny;
      }
      px -= clamp(px, -2 * s, 0);
      return -Math.sqrt(px * px + py * py) * (py > 0 ? 1 : py < 0 ? -1 : 0);
    }

    /* Signed distance of world point (wx, wy) to a shape, in world units. */
    function shapeSdf(s, wx, wy, aspect) {
      var qx = wx - s.x * aspect, qy = wy - s.y;
      var c = Math.cos(s.rot), sn = Math.sin(s.rot);
      var rx = c * qx + sn * qy, ry = -sn * qx + c * qy;
      if (s.type === 'circle') return sdCircle(rx, ry, s.p1);
      if (s.type === 'box') return sdBox(rx, ry, s.p1, s.p2);
      if (s.type === 'lens') return sdLens(rx, ry, s.p1, s.p2);
      return sdPrism(rx, ry, s.p1);
    }

    /* Topmost shape under (u, v), or null. Small positive margin so a thin
       wall is still grabbable. */
    function hitTest(shapes, u, v, aspect) {
      for (var i = shapes.length - 1; i >= 0; i--) {
        if (shapeSdf(shapes[i], u * aspect, v, aspect) <= 0.008) return shapes[i];
      }
      return null;
    }

    /* ---------- presets ----------
       Slit widths sized against the default wavelength (0.08 of the height):
       about one lambda diffracts visibly, and the double slit spacing of 0.2
       puts several fringes on screen. Each call returns fresh objects.       */

    function ps(type, x, y, p1, p2, rot, mat) {
      var s = makeShape(type);
      s.x = x; s.y = y; s.p1 = p1; if (p2 !== undefined && p2 !== null) s.p2 = p2;
      s.rot = rot || 0; if (mat) s.mat = mat;
      return s;
    }

    var PRESETS = [
      { id: 'empty', name: 'Empty', make: function () { return []; } },
      { id: 'single', name: 'Single slit', make: function () {
        return [ps('box', 0.38, 0.22, 0.012, 0.24, 0, 'wall'),
                ps('box', 0.38, 0.78, 0.012, 0.24, 0, 'wall')];
      } },
      { id: 'double', name: 'Double slit', make: function () {
        return [ps('box', 0.38, 0.17, 0.012, 0.20, 0, 'wall'),
                ps('box', 0.38, 0.50, 0.012, 0.07, 0, 'wall'),
                ps('box', 0.38, 0.83, 0.012, 0.20, 0, 'wall')];
      } },
      { id: 'lens', name: 'Lens', make: function () {
        return [ps('lens', 0.42, 0.5, 0.26, 0.06, 0, 'glass')];
      } },
      { id: 'prism', name: 'Prism', make: function () {
        return [ps('prism', 0.48, 0.5, 0.2, null, 0, 'glass')];
      } },
      { id: 'guide', name: 'Waveguide', make: function () {
        return [ps('box', 0.5, 0.36, 0.32, 0.014, 0, 'wall'),
                ps('box', 0.5, 0.64, 0.32, 0.014, 0, 'wall')];
      } }
    ];

    /* ---------- defaults and shareable state ---------- */

    var DEFAULTS = {
      lambda: 0.08, n: 1.5,
      steps: 1, res: 1024, palette: 'hollywood',
      source: 'plane', srcX: 0.22, srcY: 0.5,
      brush: 0.02, gain: 1.0, view: 'waves'
    };

    var STATE_KEYS = ['lambda', 'n', 'steps', 'res', 'brush', 'srcX', 'srcY', 'gain'];
    var RES_STEPS = [256, 512, 1024, 2048];

    /* One shape: "t!x!y!p1!p2!rot!m!n" with t in c/b/l/p and m in w/g; shapes
       joined by "~", or "none". "_" stays the outer separator of the hash. */
    function encodeShapes(shapes) {
      if (!shapes || !shapes.length) return 'none';
      var out = [];
      for (var i = 0; i < Math.min(shapes.length, SHAPE_LIMIT); i++) {
        var s = shapes[i];
        if (TYPE_INDEX[s.type] === undefined) continue;
        out.push([s.type.charAt(0), (+s.x).toFixed(3), (+s.y).toFixed(3),
                  (+s.p1).toFixed(3), (+s.p2 || 0).toFixed(3), (+s.rot || 0).toFixed(2),
                  s.mat === 'glass' ? 'g' : 'w', (+s.n || 1.5).toFixed(2)].join('!'));
      }
      return out.length ? out.join('~') : 'none';
    }

    function decodeShapes(str) {
      if (typeof str !== 'string' || str === 'none') return [];
      var out = [];
      var parts = str.split('~');
      var byInitial = { c: 'circle', b: 'box', l: 'lens', p: 'prism' };
      for (var i = 0; i < parts.length && out.length < SHAPE_LIMIT; i++) {
        var f = parts[i].split('!');
        var type = byInitial[f[0]];
        if (!type || f.length < 7) continue;
        var s = makeShape(type);
        var x = parseFloat(f[1]), y = parseFloat(f[2]);
        var p1 = parseFloat(f[3]), p2 = parseFloat(f[4]), rot = parseFloat(f[5]);
        if (!isFinite(x) || !isFinite(y) || !isFinite(p1)) continue;
        s.x = clamp(x, 0, 1); s.y = clamp(y, 0, 1);
        s.p1 = clamp(p1, 0.005, 0.6);
        s.p2 = isFinite(p2) ? clamp(p2, 0, 0.6) : s.p2;
        if (type === 'lens') s.p2 = clamp(s.p2, 0.01, 0.3);
        if (type === 'box') s.p2 = clamp(s.p2, 0.005, 0.6);
        s.rot = isFinite(rot) ? rot : 0;
        s.mat = f[6] === 'g' ? 'glass' : 'wall';
        var n = parseFloat(f[7]);
        s.n = isFinite(n) ? clampTo('n', n) : 1.5;
        out.push(s);
      }
      return out;
    }

    function encodeState(s, shapes) {
      var out = ['v1'];
      for (var i = 0; i < STATE_KEYS.length; i++) {
        var key = STATE_KEYS[i];
        var val = (s && isFinite(s[key])) ? s[key] : DEFAULTS[key];
        out.push(key === 'res' || key === 'steps' ? String(Math.round(val)) : (+val).toFixed(4));
      }
      out.push(PALETTE_BY_ID[s && s.palette] ? s.palette : DEFAULTS.palette);
      out.push(SOURCES.some(function (x) { return x.id === (s && s.source); }) ? s.source : DEFAULTS.source);
      out.push(encodeShapes(shapes));
      return out.join('_');
    }

    function decodeState(str) {
      var s = {};
      for (var key in DEFAULTS) if (DEFAULTS.hasOwnProperty(key)) s[key] = DEFAULTS[key];
      s.shapes = [];
      if (typeof str !== 'string') return s;
      var parts = str.replace(/^#/, '').split('_');
      if (parts[0] !== 'v1' || parts.length < STATE_KEYS.length + 4) return s;
      for (var i = 0; i < STATE_KEYS.length; i++) {
        var k2 = STATE_KEYS[i], v = parseFloat(parts[i + 1]);
        if (!isFinite(v)) continue;
        if (k2 === 'res') {

        var m = makeTarget(w, h, gl.RG8, gl.LINEAR);
        medTex = m.tex; medFbo = m.fbo;
        if (!m.ok) allocOk = false;
        cur = 0; pcur = 0;
        if (allocOk) {
          clearFbo(stateFbo[1]); clearFbo(paintFbo[1]); clearFbo(medFbo);
          if (oldState) {
            copyInto(stateFbo[0], oldState);
            copyInto(paintFbo[0], oldPaint);
          } else {
            clearFbo(stateFbo[0]); clearFbo(paintFbo[0]);
            stepsSinceClear = 0;
          }
        }
        for (var k = 0; k < oldTexs.length; k++) {
          if (oldTexs[k]) gl.deleteTexture(oldTexs[k]);
          if (oldFbos[k]) gl.deleteFramebuffer(oldFbos[k]);
        }
        mediumDirty = true;
        return allocOk;
      }

      function drawInto(fbo) {
        gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
        if (fbo === null) gl.viewport(0, 0, canvas.width, canvas.height);
        else gl.viewport(0, 0, GW, GH);
        gl.bindVertexArray(vao);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        gl.bindVertexArray(null);
      }

      function omega() {
        return core.omegaFor(Math.max(4, params.lambda * GH));
      }

      function srcRadius() {
        return Math.max(core.SRC_RADIUS, GH * 0.006);
      }

      function compose() {
        gl.useProgram(compP);
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, paintTex[pcur]);
        gl.uniform1i(compU.uPaint, 0);
        gl.uniform1i(compU.uCount, shapeCount);
        gl.uniform4fv(compU.uSA, shapeA);
        gl.uniform4fv(compU.uSB, shapeB);
        gl.uniform1f(compU.uAspect, GH > 0 ? GW / GH : 1);
        gl.uniform1f(compU.uEdge, 1.5 / Math.max(1, GH));
        drawInto(medFbo);
      }

      function simStep() {
        phase += omega();
        if (phase > Math.PI * 2) phase -= Math.PI * 2;
        stepsSinceClear++;
        // ramp the source in over two periods so the front is not a broadband bang
        var rampSteps = 2 * Math.PI * 2 / omega();
        var ramp = Math.min(1, stepsSinceClear / rampSteps);
        var drive = Math.sin(phase) * ramp;
        var srcType = params.source === 'plane' ? 1 : params.source === 'point' ? 2 : 0;

        var src = cur, dst = 1 - cur;
        gl.useProgram(simP);
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, stateTex[src]);
        gl.uniform1i(simU.uState, 0);
        gl.activeTexture(gl.TEXTURE1);
        gl.bindTexture(gl.TEXTURE_2D, medTex);
        gl.uniform1i(simU.uMedium, 1);
        gl.uniform2i(simU.uSize, GW, GH);
        gl.uniform1f(simU.uC2, core.COURANT * core.COURANT);
        // sponge width follows the wavelength, capped so it cannot swallow
        // more than a quarter of the short grid side
        var spongeTex = Math.min(core.spongeFor(params.lambda * GH),
                                 Math.floor(Math.min(GW, GH) * 0.25));
        gl.uniform1f(simU.uSponge, spongeTex);
        gl.uniform1f(simU.uSpongeK, core.SPONGE_K);
        // blend factor for the u^2 average: time constant ACC_PERIODS periods
        gl.uniform1f(simU.uAccK, Math.min(1, omega() / (2 * Math.PI * core.ACC_PERIODS)));
        gl.uniform1f(simU.uDrive, drive);
        gl.uniform1i(simU.uSrcType, srcType);
        gl.uniform2f(simU.uSrcPos, params.srcX * GW, params.srcY * GH);
        gl.uniform1f(simU.uSrcR, srcRadius());
        drawInto(stateFbo[dst]);
        cur = dst;
        totalSteps++;
      }

      function brushStroke(ax, ay, bx, by, m) {
        var src = pcur, dst = 1 - pcur;
        gl.useProgram(brushP);
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, paintTex[src]);
        gl.uniform1i(brushU.uPaint, 0);
        gl.uniform2f(brushU.uA, ax, ay);
        gl.uniform2f(brushU.uB, bx, by);
        gl.uniform1f(brushU.uRadius, params.brush);
        gl.uniform1f(brushU.uAspect, GH > 0 ? GW / GH : 1);
        gl.uniform1f(brushU.uMode, m);
        gl.uniform1f(brushU.uSlow, core.slowness(params.n));
        drawInto(paintFbo[dst]);
        pcur = dst;
        mediumDirty = true;
      }

      function display() {
        gl.useProgram(showP);
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, stateTex[cur]);
        gl.uniform1i(showU.uState, 0);
        gl.activeTexture(gl.TEXTURE1);
        gl.bindTexture(gl.TEXTURE_2D, medTex);
        gl.uniform1i(showU.uMedium, 1);
        gl.uniform2f(showU.uGrid, GW, GH);
        gl.uniform3fv(showU.uNeg, palette.neg);
        gl.uniform3fv(showU.uMid, palette.mid);
        gl.uniform3fv(showU.uPos, palette.pos);
        gl.uniform3fv(showU.uWall, palette.wall);
        gl.uniform3fv(showU.uGlass, palette.glass);
        gl.uniform1f(showU.uGain, params.gain);
        gl.uniform1f(showU.uView, params.view === 'intensity' ? 1 : 0);
        drawInto(null);
      }

      // ---- sizing (same scheme as reaction-diffusion: grid follows viewport
      // aspect, only reallocated when the quantised dims really change)
      function resize(force) {
        var w = container.clientWidth || window.innerWidth;
        var h = container.clientHeight || window.innerHeight;
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        var pw = Math.max(1, Math.round(w * dpr)), ph = Math.max(1, Math.round(h * dpr));
        if (canvas.width !== pw || canvas.height !== ph) {
          canvas.width = pw; canvas.height = ph;
        }
        var g = core.gridFor(res, w, h, force ? null : { w: GW, h: GH });
        if (force || g.w !== GW || g.h !== GH) allocate(g.w, g.h);
      }

      var ro = null;
      if (window.ResizeObserver) {
        ro = new ResizeObserver(function () { if (!disposed) resize(false); });
        ro.observe(container);
      } else {
        window.addEventListener('resize', function () { resize(false); });
      }

      resize(true);
      if (!allocOk) { container.innerHTML = ''; return null; }

      // ---- pointer: paint in the material modes, defer to the caller in move
      // mode (the caller owns the shape list and does the hit testing)
      var pointing = false, lastU = 0, lastV = 0, pid = -1;
      function toUv(ev) {
        var r = canvas.getBoundingClientRect();
        return {
          u: (ev.clientX - r.left) / Math.max(1, r.width),
          v: 1 - (ev.clientY - r.top) / Math.max(1, r.height)   // GL origin is bottom left
        };
      }
      function brushMode(ev) {
        if (ev.shiftKey || mode === 'erase') return 0;
        return mode === 'glass' ? 2 : 1;
      }
      function onDown(ev) {
        if (ev.button !== undefined && ev.button !== 0) return;
        var p = toUv(ev);
        pointing = true; pid = ev.pointerId;
        lastU = p.u; lastV = p.v;
        if (canvas.setPointerCapture) { try { canvas.setPointerCapture(pid); } catch (e) {} }
        if (mode === 'move') {
          if (opts.onPointer) opts.onPointer('down', p.u, p.v);
        } else {
          brushStroke(p.u, p.v, p.u, p.v, brushMode(ev));
          if (!running) { compose(); mediumDirty = false; display(); }
        }
        ev.preventDefault();
      }
      function onMove(ev) {
        if (!pointing || ev.pointerId !== pid) return;
        var p = toUv(ev);
        if (mode === 'move') {
          if (opts.onPointer) opts.onPointer('move', p.u, p.v);
        } else {
          brushStroke(lastU, lastV, p.u, p.v, brushMode(ev));
          if (!running) { compose(); mediumDirty = false; display(); }
        }
        lastU = p.u; lastV = p.v;
        ev.preventDefault();
      }
      function onUp(ev) {
        if (ev.pointerId !== pid) return;
        pointing = false; pid = -1;
        if (canvas.releasePointerCapture) { try { canvas.releasePointerCapture(ev.pointerId); } catch (e) {} }
        if (mode === 'move' && opts.onPointer) opts.onPointer('up', lastU, lastV);
      }
      canvas.addEventListener('pointerdown', onDown);
      canvas.addEventListener('pointermove', onMove);
      canvas.addEventListener('pointerup', onUp);
      canvas.addEventListener('pointercancel', onUp);

      function onLost(ev) { ev.preventDefault(); ctxLost = true; if (opts.onLost) opts.onLost(); }
      canvas.addEventListener('webglcontextlost', onLost);

      // ---- main loop
      var recorder = null, recChunks = [];

      var lastTs = -1, fpsAccum = 0, fpsFrames = 0;
      function frame(ts) {
        if (disposed || ctxLost) return;
        rafId = requestAnimationFrame(frame);
        var dt = lastTs < 0 ? 0.016 : Math.min(0.25, (ts - lastTs) / 1000);
        lastTs = ts;

        if (mediumDirty) { compose(); mediumDirty = false; }
        if (running) {
          var n = Math.max(1, Math.round(params.steps));
          for (var i = 0; i < n; i++) simStep();
        }
        display();

        fpsAccum += dt; fpsFrames++;
        if (fpsAccum > 0.5) {
          if (opts.onTick) opts.onTick({
            fps: fpsFrames / fpsAccum, grid: GW + '×' + GH, steps: totalSteps
          });
          fpsAccum = 0; fpsFrames = 0;
        }
      }
      rafId = requestAnimationFrame(frame);

      var api = {
        setParams: function (p) {
          for (var key in p) if (p.hasOwnProperty(key)) params[key] = p[key];
          if (p.palette !== undefined) palette = core.PALETTE_BY_ID[p.palette] || palette;
        },
        setMode: function (m) {
          mode = m;
        },
        setShapes: function (list) {
          shapeCount = Math.min(list.length, 24);
          for (var i = 0; i < shapeCount; i++) {
            var s = list[i], j = i * 4;
            shapeA[j] = s.x; shapeA[j + 1] = s.y; shapeA[j + 2] = s.p1; shapeA[j + 3] = s.p2 || 0;
            shapeB[j] = s.rot || 0;
            shapeB[j + 1] = core.TYPE_INDEX[s.type] || 0;
            shapeB[j + 2] = s.mat === 'glass' ? core.slowness(s.n || 1.5) : 0;
            shapeB[j + 3] = 0;
          }
          mediumDirty = true;
          if (!running) { compose(); mediumDirty = false; display(); }
        },
        setRunning: function (on) { running = !!on; },
        stepOnce: function () {
          if (mediumDirty) { compose(); mediumDirty = false; }
          simStep(); display();
        },
        clearWaves: function () {
          for (var i = 0; i < 2; i++) clearFbo(stateFbo[i]);
          phase = 0; stepsSinceClear = 0;
          if (!running) display();
        },
        clearPaint: function () {
          for (var i = 0; i < 2; i++) clearFbo(paintFbo[i]);
          mediumDirty = true;
          if (!running) { compose(); mediumDirty = false; display(); }
        },
        setResolution: function (nres) {
          if (nres === res) return;
          res = nres;
          resize(true);
          if (!running) { compose(); mediumDirty = false; display(); }
        },
        getAspect: function () { return GH > 0 ? GW / GH : 1; },
        /* WebM capture via MediaRecorder: zero dependencies, and the canvas
           stream captures on present, so preserveDrawingBuffer can stay off.
           Returns false when the browser lacks the machinery. */
        startRecord: function (onDone) {
          if (recorder || !canvas.captureStream || typeof MediaRecorder === 'undefined') return false;
          var stream = canvas.captureStream(60);
          var mime = MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported('video/webm;codecs=vp9')
            ? 'video/webm;codecs=vp9' : 'video/webm';
          try {
            recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 8000000 });
          } catch (e) { recorder = null; return false; }
          recChunks = [];
          recorder.ondataavailable = function (ev) { if (ev.data && ev.data.size) recChunks.push(ev.data); };
          recorder.onstop = function () {
            var blob = new Blob(recChunks, { type: 'video/webm' });
            recChunks = []; recorder = null;
            if (onDone) onDone(blob);
          };
          recorder.start();
          return true;
        },
        stopRecord: function () {
          if (recorder && recorder.state !== 'inactive') recorder.stop();
        },
        snapshot: function () {
          if (mediumDirty) { compose(); mediumDirty = false; }
          display();                        // re-render, then read before the compositor runs
          try { return canvas.toDataURL('image/png'); } catch (e) { return null; }
        },
        dispose: function () {
          disposed = true;
          if (recorder && recorder.state !== 'inactive') { try { recorder.stop(); } catch (e) {} }
          if (rafId) cancelAnimationFrame(rafId);
          if (ro) ro.disconnect();
          canvas.removeEventListener('pointerdown', onDown);
          canvas.removeEventListener('pointermove', onMove);
          canvas.removeEventListener('pointerup', onUp);
          canvas.removeEventListener('pointercancel', onUp);
          canvas.removeEventListener('webglcontextlost', onLost);
          freeTargets();
          gl.deleteBuffer(quad);
          gl.deleteVertexArray(vao);
          gl.deleteProgram(simP); gl.deleteProgram(brushP);
          gl.deleteProgram(compP); gl.deleteProgram(showP);
          gl.deleteProgram(copyP);
          if (canvas.parentNode) canvas.parentNode.removeChild(canvas);
        }
      };
      return api;
    }

    return { create: create };
  })();
  </script>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;
    const C = window.RTCore;

    const cssVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
    const COL = { emph: cssVar('--tool-emph'), text: cssVar('--tool-text'), label: cssVar('--tool-label'),
      foot: cssVar('--tool-note'), faint: cssVar('--tool-faint') };

    function Slider({ label, value, min, max, step, fmt, onChange }) {
      return (
        <div className="rt-param">
          <label>
            <span>{label}</span>
            <span className="rt-val">{fmt ? fmt(value) : value}</span>
          </label>
          <input type="range" min={min} max={max} step={step} value={value}
                 onChange={e => onChange(parseFloat(e.target.value))} />
        </div>
      );
    }

    function Seg({ items, value, onChange }) {
      return (
        <div className="rt-seg">
          {items.map(it => (
            <button key={it.id} type="button"
                    className={'lang-seg' + (value === it.id ? ' active' : '')}
                    onClick={() => onChange(it.id)}>{it.name}</button>
          ))}
        </div>
      );
    }

    function Section({ id, title, summary, open, onToggle, children }) {
      return (
        <div className="rt-acc">
          <button type="button" className={'rt-acc-h' + (open ? ' open' : '')}
                  aria-expanded={open} onClick={() => onToggle(id)}>
            <span>{title}</span>
            {!open && summary ? <span className="rt-acc-s">{summary}</span> : null}
            <span className="rt-acc-c">{open ? '−' : '+'}</span>
          </button>
          {open ? <div className="rt-acc-b">{children}</div> : null}
        </div>
      );
    }

    const MODES = [
      { id: 'move',  name: 'Move' },
      { id: 'wall',  name: 'Wall' },
      { id: 'glass', name: 'Glass' },
      { id: 'erase', name: 'Erase' }
    ];
    const MATS = [
      { id: 'wall',  name: 'Wall' },
      { id: 'glass', name: 'Glass' }
    ];
    const TYPE_NAMES = { circle: 'Circle', box: 'Box', lens: 'Lens', prism: 'Prism' };

    function App() {
      const [st, setSt] = useState(() => {
        const d = C.decodeState(location.hash);
        const { shapes, ...rest } = d;
        return rest;
      });
      const [shapes, setShapes] = useState(() => C.decodeState(location.hash).shapes);
      const [mode, setMode] = useState('move');
      const [selId, setSelId] = useState(null);
      const [running, setRunning] = useState(true);
      const [open, setOpen] = useState(() => localStorage.getItem('rt.panel') !== '0');
      const [sec, setSec] = useState(() => localStorage.getItem('rt.sec') || 'wave');
      const [webgl, setWebgl] = useState(true);
      const [hud, setHud] = useState(null);
      const [copied, setCopied] = useState(false);
      const [rec, setRec] = useState(false);

      const stageRef = useRef(null);
      const engineRef = useRef(null);
      const dragRef = useRef(null);
      const shapesRef = useRef(shapes);
      const stRef = useRef(st);
      shapesRef.current = shapes;
      stRef.current = st;

      const set = useCallback((patch) => setSt(s => Object.assign({}, s, patch)), []);

      useEffect(() => { localStorage.setItem('rt.panel', open ? '1' : '0'); }, [open]);
      useEffect(() => { localStorage.setItem('rt.sec', sec); }, [sec]);

      const toggleSec = useCallback((id) => setSec(s => (s === id ? '' : id)), []);

      // Move-mode pointer traffic comes back out of the engine, because the
      // shape list and the hit testing live here, not in GL.
      const onPointer = useCallback((type, u, v) => {
        const eng = engineRef.current;
        if (!eng) return;
        const aspect = eng.getAspect();
        if (type === 'down') {
          const s0 = stRef.current;
          if (s0.source === 'point') {
            const dx = (u - s0.srcX) * aspect, dy = v - s0.srcY;
            if (Math.sqrt(dx * dx + dy * dy) < 0.035) {
              dragRef.current = { src: true };
              return;
            }
          }
          const hit = C.hitTest(shapesRef.current, u, v, aspect);
          if (hit) {
            setSelId(hit.id);
            dragRef.current = { id: hit.id, dx: hit.x - u, dy: hit.y - v };
          } else {
            setSelId(null);
            dragRef.current = null;
          }
        } else if (type === 'move') {
          const d = dragRef.current;
          if (!d) return;
          if (d.src) {
            set({ srcX: C.clamp(u, 0, 1), srcY: C.clamp(v, 0, 1) });
          } else {
            setShapes(list => list.map(s => s.id === d.id
              ? Object.assign({}, s, { x: C.clamp(u + d.dx, 0, 1), y: C.clamp(v + d.dy, 0, 1) })
              : s));
          }
        } else {
          dragRef.current = null;
        }
      }, [set]);

      // The engine is built once; everything else is pushed through setters,
      // because rebuilding it would throw the running field away.
      useEffect(() => {
        if (!stageRef.current || !window.RTGL) { setWebgl(false); return; }
        let eng = null;
        try {
          eng = window.RTGL.create(stageRef.current, {
            params: st,
            mode: mode,
            running: true,
            onPointer: onPointer,
            onTick: s => setHud(s),
            onLost: () => setWebgl(false)
          });
        } catch (e) { eng = null; }
        if (!eng) { setWebgl(false); return; }
        engineRef.current = eng;
        eng.setShapes(shapesRef.current);
        return () => { eng.dispose(); engineRef.current = null; };
        // eslint-disable-next-line react-hooks/exhaustive-deps
      }, []);

      useEffect(() => {
        const e = engineRef.current;
        if (e) e.setParams(st);
      }, [st]);

      useEffect(() => {
        const e = engineRef.current;
        if (e) e.setResolution(st.res);
      }, [st.res]);

      useEffect(() => {
        const e = engineRef.current;
        if (e) e.setRunning(running);
      }, [running]);

      useEffect(() => {
        const e = engineRef.current;
        if (e) e.setMode(mode);
      }, [mode]);

      useEffect(() => {
        const e = engineRef.current;
        if (e) e.setShapes(shapes);
      }, [shapes]);

      const selected = shapes.find(s => s.id === selId) || null;

      const updateSel = (patch) => {
        if (!selected) return;
        setShapes(list => list.map(s => s.id === selected.id ? Object.assign({}, s, patch) : s));
      };

      const addShape = (type) => {
        if (shapes.length >= C.SHAPE_LIMIT) return;
        const s = C.makeShape(type);
        setShapes(list => list.concat([s]));
        setSelId(s.id);
        setMode('move');
      };

      const applyPreset = (p) => {
        const list = p.make();
        setShapes(list);
        setSelId(null);
        if (engineRef.current) engineRef.current.clearWaves();
      };

      const clearAll = () => {
        setShapes([]);
        setSelId(null);
        const e = engineRef.current;
        if (e) { e.clearPaint(); e.clearWaves(); }
      };

      const savePng = () => {
        const e = engineRef.current;
        if (!e) return;
        const url = e.snapshot();
        if (!url) return;
        const a = document.createElement('a');
        a.href = url;
        a.download = 'ripple-tank.png';
        a.click();
      };

      const saveBlob = (blob) => {
        setRec(false);
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'ripple-tank.webm';
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 5000);
      };

      const toggleRec = () => {
        const e = engineRef.current;
        if (!e) return;
        if (rec) { e.stopRecord(); return; }   // saveBlob flips the state back
        if (e.startRecord(saveBlob)) setRec(true);
      };

      const copyLink = () => {
        const hash = '#' + C.encodeState(st, shapes);
        history.replaceState(null, '', location.pathname + hash);
        const url = location.href;
        const done = () => { setCopied(true); setTimeout(() => setCopied(false), 1400); };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(url).then(done, done);
        } else done();
      };

      if (!webgl) {
        return (
          <div className="rt-fallback">
            <div>
              <p style={{ color: COL.text }}>This one needs WebGL2 with floating point render targets.</p>
              <p style={{ fontSize: 13, color: COL.foot }}>
                Your browser did not provide them, so there is nothing to simulate on.
                Everything else on <a href="/miscellaneous/">the tools page</a> works without a GPU.
              </p>
            </div>
          </div>
        );
      }

      const paletteName = (C.PALETTE_BY_ID[st.palette] || C.PALETTES[0]).name;
      const sourceName = (C.SOURCES.find(s => s.id === st.source) || C.SOURCES[0]).name;
      const hint = mode === 'move'
        ? 'drag shapes' + (st.source === 'point' ? ' and the source' : '')
        : mode === 'erase' ? 'drag to erase paint'
        : 'drag to paint ' + mode + ', shift-drag to erase';

      return (
        <React.Fragment>
          <div className={'rt-stage' + (mode === 'move' ? ' move' : '')} ref={stageRef}></div>
          <a className="rt-back" href="/miscellaneous/#playground">&larr; Playground</a>
          {hud && (
            <div className="rt-hud">
              <b>{hud.fps.toFixed(0)} fps</b>
              <span>{hud.grid}</span>
              <span>{hud.steps.toLocaleString('en-US')} steps</span>
              <span>{hint}</span>
            </div>
          )}

          {!open && (
            <button type="button" className="rt-toggle" onClick={() => setOpen(true)}>
              &#8801; Controls
            </button>
          )}

          {open && (
            <div className="rt-panel">
              <div className="rt-head">
                <h1>Ripple Tank</h1>
                <button type="button" className="rt-x" onClick={() => setOpen(false)}
                        aria-label="Collapse panel">&#10005;</button>
              </div>

              <div className="rt-row" style={{ marginBottom: 10 }}>
                <button type="button" className={'rt-run lang-seg' + (running ? '' : ' paused')}
                        onClick={() => setRunning(r => !r)}>
                  {running ? '⏸️ Pause' : '▶️ Run'}
                </button>
                <button type="button" className="rt-btn lang-seg"
                        onClick={() => engineRef.current && engineRef.current.stepOnce()}>👣 Step</button>
                <button type="button" className="rt-btn lang-seg"
                        onClick={() => engineRef.current && engineRef.current.clearWaves()}>Still</button>
                <button type="button" className="rt-btn lang-seg" onClick={clearAll}>Reset</button>
              </div>

              <div className="rt-row" style={{ marginBottom: 8 }}>
                <span style={{ fontSize: 11, color: COL.foot, letterSpacing: '.06em', textTransform: 'uppercase' }}>Pointer</span>
                <Seg items={MODES} value={mode} onChange={setMode} />
              </div>
              <div style={{ marginBottom: 4 }}>
                <Slider label="Brush size" value={st.brush} min={C.RANGES.brush[0]} max={C.RANGES.brush[1]}
                        step={0.002} fmt={v => (v * 100).toFixed(1) + '%'} onChange={v => set({ brush: v })} />
                {mode === 'glass' && (
                  <Slider label="Glass n (paint)" value={st.n} min={C.RANGES.n[0]} max={C.RANGES.n[1]}
                          step={0.05} fmt={v => v.toFixed(2)} onChange={v => set({ n: v })} />
                )}
              </div>

              <Section id="wave" title="Wave" summary={sourceName + ' · λ ' + (st.lambda * 100).toFixed(0) + '%'}
                       open={sec === 'wave'} onToggle={toggleSec}>
                <div className="rt-row" style={{ marginBottom: 9 }}>
                  <Seg items={C.SOURCES} value={st.source} onChange={v => set({ source: v })} />
                </div>
                <Slider label="Wavelength" value={st.lambda} min={C.RANGES.lambda[0]} max={C.RANGES.lambda[1]}
                        step={0.005} fmt={v => (v * 100).toFixed(1) + '%'} onChange={v => set({ lambda: v })} />
                <p style={{ fontSize: 11, color: COL.foot, margin: '0 0 2px', lineHeight: 1.6 }}>
                  {st.source === 'plane'
                    ? 'A plane wave rolls in from the left edge.'
                    : st.source === 'point'
                      ? 'A point source rings. Drag it around in Move mode.'
                      : 'No source. Whatever is still in the tank keeps travelling until the edges absorb it.'}
                </p>
              </Section>

              <Section id="objects" title="Objects"
                       summary={shapes.length + (shapes.length === 1 ? ' shape' : ' shapes')}
                       open={sec === 'objects'} onToggle={toggleSec}>
                <div className="rt-row">
                  {C.SHAPE_TYPES.map(t => (
                    <button key={t} type="button" className="rt-chip"
                            disabled={shapes.length >= C.SHAPE_LIMIT}
                            onClick={() => addShape(t)}>+ {TYPE_NAMES[t]}</button>
                  ))}
                </div>
                <div className="rt-row" style={{ marginTop: 9 }}>
                  {C.PRESETS.map(p => (
                    <button key={p.id} type="button" className="rt-chip"
                            onClick={() => applyPreset(p)}>{p.name}</button>
                  ))}
                </div>

                {selected && (
                  <div className="rt-sel">
                    <div className="rt-sel-head">
                      <b style={{ color: COL.text }}>{TYPE_NAMES[selected.type]}</b>
                      <Seg items={MATS} value={selected.mat}
                           onChange={v => updateSel({ mat: v, n: selected.n || 1.5 })} />
                      <button type="button" className="rt-del"
                              onClick={() => { setShapes(list => list.filter(s => s.id !== selected.id)); setSelId(null); }}>
                        Delete
                      </button>
                    </div>
                    {selected.type === 'circle' && (
                      <Slider label="Radius" value={selected.p1} min={0.01} max={0.4} step={0.005}
                              fmt={v => (v * 100).toFixed(1) + '%'} onChange={v => updateSel({ p1: v })} />
                    )}
                    {selected.type === 'box' && (
                      <React.Fragment>
                        <Slider label="Width" value={selected.p1} min={0.005} max={0.5} step={0.005}
                                fmt={v => (v * 200).toFixed(0) + '%'} onChange={v => updateSel({ p1: v })} />
                        <Slider label="Height" value={selected.p2} min={0.005} max={0.5} step={0.005}
                                fmt={v => (v * 200).toFixed(0) + '%'} onChange={v => updateSel({ p2: v })} />
                      </React.Fragment>
                    )}
                    {selected.type === 'lens' && (
                      <React.Fragment>
                        <Slider label="Aperture" value={selected.p1} min={0.05} max={0.45} step={0.005}
                                fmt={v => (v * 200).toFixed(0) + '%'} onChange={v => updateSel({ p1: v })} />
                        <Slider label="Thickness" value={selected.p2} min={0.015} max={0.15} step={0.005}
                                fmt={v => (v * 200).toFixed(0) + '%'} onChange={v => updateSel({ p2: v })} />
                      </React.Fragment>
                    )}
                    {selected.type === 'prism' && (
                      <Slider label="Size" value={selected.p1} min={0.04} max={0.35} step={0.005}
                              fmt={v => (v * 100).toFixed(0) + '%'} onChange={v => updateSel({ p1: v })} />
                    )}
                    {selected.type !== 'circle' && (
                      <Slider label="Rotation" value={selected.rot} min={-3.1416} max={3.1416} step={0.02}
                              fmt={v => (v * 180 / Math.PI).toFixed(0) + '°'} onChange={v => updateSel({ rot: v })} />
                    )}
                    {selected.mat === 'glass' && (
                      <React.Fragment>
                        <Slider label="Refractive index n" value={selected.n || 1.5}
                                min={C.RANGES.n[0]} max={C.RANGES.n[1]} step={0.05}
                                fmt={v => v.toFixed(2)} onChange={v => updateSel({ n: v })} />
                        <p style={{ fontSize: 11, color: COL.foot, margin: '0 0 2px', lineHeight: 1.6 }}>
                          Waves run 1/n as fast inside this piece.
                        </p>
                      </React.Fragment>
                    )}
                  </div>
                )}
                {!selected && shapes.length > 0 && (
                  <p style={{ fontSize: 11, color: COL.foot, margin: '9px 0 2px', lineHeight: 1.6 }}>
                    Click a shape on the canvas (in Move mode) to edit or delete it.
                  </p>
                )}
              </Section>

              <Section id="look" title="Look"
                       summary={paletteName + (st.view === 'intensity' ? ' · intensity' : '')}
                       open={sec === 'look'} onToggle={toggleSec}>
                <div className="rt-row" style={{ marginBottom: 9 }}>
                  <Seg items={[{ id: 'waves', name: 'Waves' }, { id: 'intensity', name: 'Intensity' }]}
                       value={st.view} onChange={v => set({ view: v })} />
                </div>
                <Seg items={C.PALETTES} value={st.palette} onChange={v => set({ palette: v })} />
                <div style={{ height: 9 }} />
                <Slider label="Contrast" value={st.gain} min={C.RANGES.gain[0]} max={C.RANGES.gain[1]}
                        step={0.05} fmt={v => '×' + v.toFixed(2)} onChange={v => set({ gain: v })} />
                <p style={{ fontSize: 11, color: COL.foot, margin: '0 0 2px', lineHeight: 1.6 }}>
                  {st.view === 'intensity'
                    ? 'Time-averaged amplitude over the last ~2.5 periods: the standing pattern without the phase. Takes a moment to settle after a change.'
                    : 'The wave height maps linearly to colour and clips beyond the contrast limit.'}
                </p>
              </Section>

              <Section id="perf" title="Speed &amp; grid" summary={st.steps + '/frame · ' + st.res}
                       open={sec === 'perf'} onToggle={toggleSec}>
                <Slider label="Steps per frame" value={st.steps} min={C.RANGES.steps[0]}
                        max={C.RANGES.steps[1]} step={1} onChange={v => set({ steps: v })} />
                <div className="rt-row">
                  <Seg items={C.RES_STEPS.map(n => ({ id: n, name: String(n) }))}
                       value={st.res} onChange={v => set({ res: v })} />
                </div>
                <p style={{ fontSize: 11, color: COL.foot, margin: '7px 0 0', lineHeight: 1.6 }}>
                  Cells on the long edge. The wavelength is a fraction of the screen and
                  the field is carried over, so the picture survives the change.
                </p>
              </Section>

              <Section id="share" title="Export" open={sec === 'share'} onToggle={toggleSec}>
                <div className="rt-row">
                  <button type="button" className="rt-btn lang-seg" onClick={savePng}>Save PNG</button>
                  <button type="button" className="rt-btn lang-seg" onClick={toggleRec}
                          style={rec ? { color: '#f87171', borderColor: '#f87171' } : null}>
                    {rec ? '⏹ Stop recording' : '⏺ Record video'}
                  </button>
                  <button type="button" className="rt-btn lang-seg" onClick={copyLink}>
                    {copied ? 'Copied' : 'Copy link'}
                  </button>
                </div>
                <p style={{ fontSize: 11, color: COL.foot, margin: '7px 0 0', lineHeight: 1.6 }}>
                  Recording captures the canvas as WebM until you stop it, then downloads.
                  The link carries the settings and the shapes, not the paint.
                </p>
              </Section>

              <Section id="about" title="About" open={sec === 'about'} onToggle={toggleSec}>
                <div className="rt-about">
                  <p>
                    One number per grid cell, the scalar wave equation, and nothing else.
                    Walls pin the field to zero, so waves reflect off them. Glass is a
                    region where the wave runs 1/n as fast, and that alone is refraction:
                    Snell's law, focusing lenses and total internal reflection are not
                    programmed in anywhere, they fall out of the slowdown.
                  </p>
                  <p>
                    The scheme is leapfrog finite differences, the same one every
                    textbook FDTD uses, at a Courant number of 0.5. The edges of the
                    screen carry an absorbing sponge: a band in which the amplitude is
                    damped a little per step, gently enough not to reflect on its own
                    account. Without it the tank turns into standing-wave soup within
                    seconds.
                  </p>
                  <p>
                    Things worth trying: the double slit with the wavelength slider (the
                    fringes move apart as λ grows); a lens with the refractive index
                    slider (the focus slides along the axis); painting a curved wall
                    freehand and watching it focus badly, which is what real mirrors do
                    too when you paint them freehand.
                  </p>
                  <p>
                    The colours are a diverging map over the wave height: one hue for
                    crests, one for troughs, still water sits at the midpoint. The
                    intensity view shows the time-averaged amplitude instead, which is
                    the diffraction pattern a long photographic exposure would see.
                    Every piece of glass carries its own n; painted glass bakes in the
                    n it was painted with. The absorbing band at the edges is about one
                    wavelength deep, so long waves dim visibly towards the border;
                    that is the sponge doing its job, not a rendering bug.
                  </p>
                  <p style={{ color: COL.foot }}>
                    Everything runs on your GPU, nothing is uploaded anywhere. The
                    sibling of this page is the <a href="/miscellaneous/tools/reaction-diffusion.html">reaction
                    diffusion tank</a>, which shares its skeleton.
                  </p>
                  <p className="rt-foot">
                    &copy; 2026 Franziska and Alexander Alber &middot; <a href="/">alber.me</a> &middot;{' '}
                    <a href="/datenschutz.html">Privacy</a> &middot;{' '}
                    <a href="https://creativecommons.org/licenses/by-nc/4.0/">CC BY-NC 4.0</a>
                  </p>
                </div>
              </Section>
            </div>
          )}
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
