  <!-- Math core: plain JS (no JSX, no DOM) so it can be unit-tested in Node. -->
  <script id="psycore">
  window.PsyCore = (function () {
    'use strict';

    // Deterministic PRNG (same construction as the other tools on this site).
    function mulberry32(seed) {
      return function () {
        let t = (seed += 0x6D2B79F5);
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function hash2(a, b) {
      let h = (a ^ 0x9E3779B9) >>> 0;
      h = Math.imul(h ^ b, 0x85EBCA6B) >>> 0;
      h ^= h >>> 13;
      h = Math.imul(h, 0xC2B2AE35) >>> 0;
      return (h ^ (h >>> 16)) >>> 0;
    }

    // Marsaglia polar method; returns a closure over the PRNG.
    function makeGauss(rand) {
      let spare = null;
      return function () {
        if (spare !== null) { const s = spare; spare = null; return s; }
        let u = 0, v = 0, s = 0;
        do { u = rand() * 2 - 1; v = rand() * 2 - 1; s = u * u + v * v; } while (s >= 1 || s === 0);
        const m = Math.sqrt(-2 * Math.log(s) / s);
        spare = v * m;
        return u * m;
      };
    }

    // --- Galaxy: exponential disk + two logarithmic spiral arms + bulge, unit-ish radius.
    function makeGalaxy(seed, n) {
      const rand = mulberry32(hash2(seed, 0x6A1A));
      const gauss = makeGauss(rand);
      const u = new Float32Array(n);
      const v = new Float32Array(n);
      const coreness = new Float32Array(n);
      const ARMS = 4, WIND = 3.1, R0 = 0.18, RMAX = 1.0;
      for (let i = 0; i < n; i++) {
        let x, y;
        const kind = rand();
        if (kind < 0.16) {                    // bulge
          x = gauss() * 0.10; y = gauss() * 0.10;
        } else if (kind < 0.24) {             // sparse halo
          const r = Math.sqrt(rand()) * RMAX, a = rand() * Math.PI * 2;
          x = Math.cos(a) * r; y = Math.sin(a) * r;
        } else {                              // spiral arms
          let r = R0 - Math.log(1 - rand() * 0.98) * 0.24;
          if (r > RMAX) r = RMAX * (0.7 + 0.3 * rand());
          const arm = Math.floor(rand() * ARMS);
          const spread = 0.20 * (0.35 + r);
          const theta = WIND * Math.log(r / R0 + 1) + arm * (2 * Math.PI / ARMS) + gauss() * spread;
          const rr = r + gauss() * 0.035;
          x = Math.cos(theta) * rr; y = Math.sin(theta) * rr;
        }
        u[i] = x; v[i] = y;
        const d = Math.sqrt(x * x + y * y);
        coreness[i] = Math.max(0, 1 - d / RMAX);
      }
      return { u: u, v: v, coreness: coreness };
    }

    // k nearest neighbours via a uniform grid (deterministic, O(n) buckets).
    function buildNeighbors(u, v, n, k) {
      const G = 24, lim = 1.25, cell = (2 * lim) / G;
      const heads = new Int32Array(G * G).fill(-1);
      const next = new Int32Array(n).fill(-1);
      const cx = new Int32Array(n), cy = new Int32Array(n);
      for (let i = 0; i < n; i++) {
        let gx = Math.floor((u[i] + lim) / cell); gx = gx < 0 ? 0 : (gx >= G ? G - 1 : gx);
        let gy = Math.floor((v[i] + lim) / cell); gy = gy < 0 ? 0 : (gy >= G ? G - 1 : gy);
        cx[i] = gx; cy[i] = gy;
        const c = gy * G + gx;
        next[i] = heads[c]; heads[c] = i;
      }
      const nbr = new Int32Array(n * k);
      const candD = new Float64Array(64), candI = new Int32Array(64);
      for (let i = 0; i < n; i++) {
        let count = 0;
        for (let ring = 0; ring <= G && count < k * 3; ring++) {
          const x0 = Math.max(0, cx[i] - ring), x1 = Math.min(G - 1, cx[i] + ring);
          const y0 = Math.max(0, cy[i] - ring), y1 = Math.min(G - 1, cy[i] + ring);
          for (let gy = y0; gy <= y1; gy++) for (let gx = x0; gx <= x1; gx++) {
            if (ring > 0 && gx > x0 && gx < x1 && gy > y0 && gy < y1) continue; // ring shell only
            for (let j = heads[gy * G + gx]; j !== -1; j = next[j]) {
              if (j === i) continue;
              const dx = u[j] - u[i], dy = v[j] - v[i];
              const d = dx * dx + dy * dy;
              if (count < 64) { candD[count] = d; candI[count] = j; count++; }
              else { // replace current worst
                let wi = 0; for (let m = 1; m < 64; m++) if (candD[m] > candD[wi]) wi = m;
                if (d < candD[wi]) { candD[wi] = d; candI[wi] = j; }
              }
            }
          }
          if (count >= k * 3 && ring >= 2) break;
        }
        // partial selection sort for the k smallest
        const kk = Math.min(k, count);
        for (let a = 0; a < kk; a++) {
          let best = a;
          for (let b = a + 1; b < count; b++) if (candD[b] < candD[best]) best = b;
          const td = candD[a]; candD[a] = candD[best]; candD[best] = td;
          const ti = candI[a]; candI[a] = candI[best]; candI[best] = ti;
          nbr[i * k + a] = candI[a];
        }
        for (let a = count; a < k; a++) nbr[i * k + a] = i; // degenerate fallback
      }
      return nbr;
    }

    // --- Simulation over the node graph -------------------------------------------------
    function createSim(seed, n, T, k, gridN) {
      const gal = makeGalaxy(seed, n);
      const sim = {
        seed: seed, n: n, T: T, k: k, gridN: gridN,
        u: gal.u, v: gal.v, coreness: gal.coreness,
        nbr: buildNeighbors(gal.u, gal.v, n, k),
        p: new Float32Array(n), pn: new Float32Array(n), m: new Float32Array(n),
        pu: new Float32Array(n), pv: new Float32Array(n),
        growthAdd: new Float32Array(n), sigMul: new Float32Array(n), coupMul: new Float32Array(n),
        sigT: new Float32Array(n), coupT: new Float32Array(n),
        timed: [], t: 0, drawIndex: 0,
        C: new Float32Array(T),
        grid: new Uint8Array(gridN * gridN),
        gridAcc: new Float32Array(gridN * gridN), gridCnt: new Float32Array(gridN * gridN),
        rand: null, gauss: null
      };
      resetRun(sim, 0);
      return sim;
    }

    function resetRun(sim, drawIndex) {
      sim.drawIndex = drawIndex;
      sim.t = 0;
      sim.timed.length = 0;
      sim.rand = mulberry32(hash2(sim.seed, 0x51ED + drawIndex * 2654435761));
      sim.gauss = makeGauss(sim.rand);
      for (let i = 0; i < sim.n; i++) {
        sim.p[i] = Math.max(-1.2, Math.min(1.5, 0.55 + 0.28 * sim.gauss()));
        sim.m[i] = sim.p[i];
        sim.pu[i] = sim.u[i]; sim.pv[i] = sim.v[i];
        sim.growthAdd[i] = 0; sim.sigMul[i] = 1; sim.coupMul[i] = 1;
      }
      // two travelling perturbation waves per draw (direction, speed, phase from the seed)
      const wr = sim.rand;
      sim.wave = {
        a1: wr() * Math.PI * 2, a2: wr() * Math.PI * 2,
        w1: 0.09 + wr() * 0.06, w2: 0.05 + wr() * 0.05,
        p1: wr() * Math.PI * 2, p2: wr() * Math.PI * 2,
        k1: 4.5, k2: 7.5
      };
      sim.C.fill(0);
    }

    // Gaussian kernel over base coordinates; near-zero entries are truncated.
    function kernelFor(sim, u0, v0, r) {
      const K = new Float32Array(sim.n);
      const inv = 1 / (2 * r * r);
      for (let i = 0; i < sim.n; i++) {
        const dx = sim.u[i] - u0, dy = sim.v[i] - v0;
        const k = Math.exp(-(dx * dx + dy * dy) * inv);
        K[i] = k > 0.01 ? k : 0;
      }
      return K;
    }

    function kernelMean(K) {
      let s = 0;
      for (let i = 0; i < K.length; i++) s += K[i];
      return s / K.length;
    }

    // Intervention effect constants. Durations are in years, converted per T below.
    const IV_FX = {
      archive:   { biasAdd: 0.10, sigMul: 0.55 },
      reform:    { impulseUp: 0.65 },
      exchange:  { coupAdd: 0.9 },
      isolation: { coupFac: 0.30, biasDur: -0.04, durYr: 150 },
      shock:     { impulseDown: -1.15, sigFac: 1.8, durYr: 100 }
    };
    const HORIZON_YEARS = 1200;

    function yearToStep(year, T) {
      const s = Math.round(year / HORIZON_YEARS * (T - 1));
      return Math.max(0, Math.min(T - 1, s));
    }

    function durSteps(years, T) {
      return Math.max(2, Math.round(years / HORIZON_YEARS * (T - 1)));
    }

    // Fires one intervention on the node system at its scheduled step.
    function fireIntervention(sim, ivR) {
      const K = ivR.kernel;   // Float32Array n (all-ones for global scope)
      const fx = IV_FX[ivR.type];
      if (!fx) return;
      const n = sim.n;
      if (fx.biasAdd) for (let i = 0; i < n; i++) sim.growthAdd[i] += fx.biasAdd * K[i];
      if (fx.sigMul) for (let i = 0; i < n; i++) sim.sigMul[i] *= (1 - (1 - fx.sigMul) * K[i]);
      if (fx.coupAdd) for (let i = 0; i < n; i++) sim.coupMul[i] += fx.coupAdd * K[i];
      if (fx.impulseUp) for (let i = 0; i < n; i++) {
        sim.p[i] += fx.impulseUp * K[i] * (1.2 - Math.min(1.2, sim.p[i]));
        sim.m[i] = sim.p[i];
      }
      if (fx.impulseDown) for (let i = 0; i < n; i++) sim.p[i] += fx.impulseDown * K[i];
      if (fx.coupFac) sim.timed.push({ until: sim.t + durSteps(fx.durYr, sim.T), kind: 'coup', f: fx.coupFac, K: K });
      if (fx.sigFac) sim.timed.push({ until: sim.t + durSteps(fx.durYr, sim.T), kind: 'sig', f: fx.sigFac, K: K });
    }

    // Local disturbance from a pointer poke (transient, negative).
    function poke(sim, u0, v0, r, amp) {
      const inv = 1 / (2 * r * r);
      for (let i = 0; i < sim.n; i++) {
        const dx = sim.pu[i] - u0, dy = sim.pv[i] - v0;
        const k = Math.exp(-(dx * dx + dy * dy) * inv);
        if (k > 0.01) sim.p[i] += amp * k;
      }
    }

    const DT = 0.05;

    // One Euler-Maruyama step of the coupled double-well system. Returns the
    // aggregate index in [0,1] and the list of interventions fired this step.
    function stepSim(sim, params, ivRs) {
      const n = sim.n, k = sim.k, t = sim.t;
      const fired = [];
      if (ivRs) for (let a = 0; a < ivRs.length; a++) {
        const r = ivRs[a];
        if (!r.fired && r.step === t) { fireIntervention(sim, r); r.fired = true; fired.push(r); }
      }
      // timed modifiers (isolation / shock aftermath)
      let hasTimed = false;
      for (let a = sim.timed.length - 1; a >= 0; a--) {
        if (sim.timed[a].until <= t) sim.timed.splice(a, 1); else hasTimed = true;
      }
      if (hasTimed) {
        sim.sigT.fill(1); sim.coupT.fill(1);
        for (let a = 0; a < sim.timed.length; a++) {
          const e = sim.timed[a], K = e.K, arr = (e.kind === 'sig' ? sim.sigT : sim.coupT);
          for (let i = 0; i < n; i++) arr[i] *= (1 + (e.f - 1) * K[i]);
        }
      }
      const bias = (params.growth - 0.5) * 1.3;
      const kappa = 3.0 * params.conn;
      const sigma = (0.10 + 0.70 * params.vol) * Math.sqrt(DT);
      const gamma = params.centr;
      const memk = 1.2 * params.mem;
      const wv = sim.wave, WAMP = 0.25;
      const wc1 = Math.cos(wv.a1), ws1 = Math.sin(wv.a1);
      const wc2 = Math.cos(wv.a2), ws2 = Math.sin(wv.a2);
      const wph1 = wv.p1 - wv.w1 * t, wph2 = wv.p2 - wv.w2 * t;
      const p = sim.p, pn = sim.pn, m = sim.m, nbr = sim.nbr, core = sim.coreness;
      const gAdd = sim.growthAdd, sMul = sim.sigMul, cMul = sim.coupMul;
      const sT = sim.sigT, cT = sim.coupT;
      const gauss = sim.gauss;
      let sum = 0;
      for (let i = 0; i < n; i++) {
        let lap = 0;
        const base = i * k;
        for (let j = 0; j < k; j++) lap += p[nbr[base + j]];
        lap = lap / k - p[i];
        const coup = kappa * cMul[i] * (hasTimed ? cT[i] : 1) * (1 - 0.75 * gamma * (1 - core[i]));
        const force = WAMP * 0.5 * (Math.sin(wv.k1 * (wc1 * sim.pu[i] + ws1 * sim.pv[i]) + wph1)
                                  + Math.sin(wv.k2 * (wc2 * sim.pu[i] + ws2 * sim.pv[i]) + wph2));
        const drift = p[i] - p[i] * p[i] * p[i] + bias + force + gAdd[i] + coup * lap + memk * (m[i] - p[i]);
        let x = p[i] + drift * DT + sigma * sMul[i] * (hasTimed ? sT[i] : 1) * gauss();
        if (x > 1.8) x = 1.8; else if (x < -1.8) x = -1.8;
        pn[i] = x;
        m[i] += (p[i] - m[i]) * DT * 1.2;
        sum += x;
        // slow positional drift: contraction under centralization + jitter
        sim.pu[i] = sim.pu[i] * (1 - 0.0015 * gamma) + 0.0035 * gauss();
        sim.pv[i] = sim.pv[i] * (1 - 0.0015 * gamma) + 0.0035 * gauss();
      }
      sim.p = pn; sim.pn = p;
      const C = Math.max(0, Math.min(1, (sum / n + 1) / 2));
      if (t < sim.T) sim.C[t] = C;
      sim.t = t + 1;
      return { C: C, fired: fired };
    }

    // Mean prosperity per grid cell (base coordinates), as bytes for a GPU texture.
    function gridOf(sim) {
      const G = sim.gridN, acc = sim.gridAcc, cnt = sim.gridCnt, out = sim.grid;
      acc.fill(0); cnt.fill(0);
      const lim = 1.25, cell = (2 * lim) / G;
      for (let i = 0; i < sim.n; i++) {
        let gx = Math.floor((sim.u[i] + lim) / cell); gx = gx < 0 ? 0 : (gx >= G ? G - 1 : gx);
        let gy = Math.floor((sim.v[i] + lim) / cell); gy = gy < 0 ? 0 : (gy >= G ? G - 1 : gy);
        const c = gy * G + gx;
        acc[c] += (sim.p[i] + 1) / 2; cnt[c] += 1;
      }
      for (let c = 0; c < G * G; c++) {
        const val = cnt[c] > 0 ? acc[c] / cnt[c] : 0.5;
        out[c] = Math.max(0, Math.min(255, Math.round(val * 255)));
      }
      return out;
    }

    function quantileSorted(a, q) {
      const pos = (a.length - 1) * q, lo = Math.floor(pos), hi = Math.ceil(pos);
      return a[lo] + (a[hi] - a[lo]) * (pos - lo);
    }

    // Junctures: the steps where P(collapse | y) shifts fastest.
    function findJunctures(pCasc, minSep, thresh) {
      const T = pCasc.length, w = 4, out = [];
      const slope = new Float32Array(T);
      for (let t = w; t < T - w; t++) slope[t] = Math.abs(pCasc[t + w] - pCasc[t - w]);
      const order = [];
      for (let t = w; t < T - w; t++) if (slope[t] >= thresh) order.push(t);
      order.sort(function (a, b) { return slope[b] - slope[a]; });
      for (let idx = 0; idx < order.length && out.length < 3; idx++) {
        const t = order[idx];
        let ok = true;
        for (let j = 0; j < out.length; j++) if (Math.abs(out[j].t - t) < minSep) { ok = false; break; }
        if (ok) out.push({ t: t, p: pCasc[Math.min(T - 1, t + w)] });
      }
      out.sort(function (a, b) { return a.t - b.t; });
      return out;
    }

    // Aggregate surrogate: M replicates of a 1-D double-well SDE with the same
    // drift family; produces the credible bands and P(collapse | y).
    function runEnsemble(seed, params, ivGs, T, M) {
      const rand = mulberry32(hash2(seed, 0xE45E));
      const gauss = makeGauss(rand);
      const bias0 = (params.growth - 0.5) * 1.3;
      const sig0 = (0.10 + 0.70 * params.vol) * 0.55;
      // per-step effect timelines from the interventions
      const biasAdd = new Float32Array(T), sigFac = new Float32Array(T).fill(1);
      const impulses = [];
      if (ivGs) for (let a = 0; a < ivGs.length; a++) {
        const iv = ivGs[a], g = iv.g, t0 = iv.step;
        const fx = IV_FX[iv.type];
        if (!fx) continue;
        if (fx.biasAdd) for (let t = t0; t < T; t++) biasAdd[t] += fx.biasAdd * g * 0.8;
        if (fx.sigMul) for (let t = t0; t < T; t++) sigFac[t] *= (1 - (1 - fx.sigMul) * g);
        if (fx.coupAdd) for (let t = t0; t < T; t++) sigFac[t] *= (1 - 0.25 * g); // sync reduces aggregate noise
        if (fx.impulseUp) impulses.push({ t: t0, dx: 0.5 * g });
        if (fx.impulseDown) impulses.push({ t: t0, dx: 0.9 * fx.impulseDown * g * 0.8 });

        gl.uniform1f(nodeU.uFade, fadeAll);
        gl.uniform1f(nodeU.uPtBase, QUALITY[opts.quality] ? QUALITY[opts.quality].pt : 2.3);
        gl.uniform3f(nodeU.uA, BAS.A[0], BAS.A[1], BAS.A[2]);
        gl.uniform3f(nodeU.uB2, BAS.B[0], BAS.B[1], BAS.B[2]);
        setShocks(nodeU);
        gl.bindVertexArray(nodeVao);
        gl.bindBuffer(gl.ARRAY_BUFFER, lineBuf);
        var off0 = s0 * N * stride, off1 = (s0 + 1) * N * stride;
        gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, stride, off0);
        gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 1, gl.FLOAT, false, stride, off0 + 12);
        gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 2, gl.FLOAT, false, stride, off1);
        gl.enableVertexAttribArray(3); gl.vertexAttribPointer(3, 1, gl.FLOAT, false, stride, off1 + 12);
        gl.drawArrays(gl.POINTS, 0, N);
        gl.bindVertexArray(null);

        // flat overlays: axis, sweep ring, markers
        gl.useProgram(flatP);
        gl.uniformMatrix4fv(flatU.uVP, false, cam.vp);
        gl.bindVertexArray(flatVao);
        // axis baseline
        lineScratch[0] = X0; lineScratch[1] = -0.98; lineScratch[2] = 0;
        lineScratch[3] = CFG.TIME_X1; lineScratch[4] = -0.98; lineScratch[5] = 0;
        gl.bindBuffer(gl.ARRAY_BUFFER, flatBuf);
        gl.bufferData(gl.ARRAY_BUFFER, lineScratch, gl.DYNAMIC_DRAW);
        flatColor(1, 1, 1, 0.10);
        gl.drawArrays(gl.LINES, 0, 2);
        // sweep ring
        flatColor(0.72, 1.0, 0.94, 0.13 * fadeAll);
        ringAt(shownSweep, RAD * 1.02, 0, 0, false);
        // intervention markers
        for (var mi = 0; mi < ivRs.length; mi++) {
          var r3 = ivRs[mi];
          flatColor(0.37, 0.92, 0.83, r3.fired ? 0.08 : 0.22);
          if (r3.scope === 'global') ringAt(r3.step, RAD * 1.07, 0, 0, false);
          else if (r3.locus) ringAt(r3.step, r3.r, r3.locus.u, r3.locus.v, true);
        }
        // juncture markers
        if (ens) for (var ji = 0; ji < ens.junctures.length; ji++) {
          flatColor(0.97, 0.44, 0.44, 0.24 + 0.10 * Math.sin(timeSec * 1.8 + ji));
          ringAt(ens.junctures[ji].t, RAD * 1.04, 0, 0, false);
        }
        // impact flashes
        for (var fi2 = 0; fi2 < flashes.length; fi2++) {
          var fl2 = flashes[fi2];
          flatColor(1.0, 0.72, 0.38, 0.5 * Math.exp(-fl2.age * 2.6));
          ringAt(fl2.step, RAD * (1.05 + fl2.age * 0.25), 0, 0, false);
        }
        gl.bindVertexArray(null);

        // ---- post: downsample -> blur -> composite
        if (postOk) {
          gl.disable(gl.BLEND);
          gl.bindVertexArray(quadVao);
          gl.useProgram(downP);
          gl.bindFramebuffer(gl.FRAMEBUFFER, bloomFB[0]);
          gl.viewport(0, 0, blW, blH);
          gl.activeTexture(gl.TEXTURE0);
          gl.bindTexture(gl.TEXTURE_2D, sceneTex);
          gl.uniform1i(downU.uTex, 0);
          gl.uniform2f(downU.uTexel, 1 / fbW, 1 / fbH);
          gl.drawArrays(gl.TRIANGLES, 0, 3);
          gl.useProgram(blurP);
          gl.uniform1i(blurU.uTex, 0);
          gl.bindFramebuffer(gl.FRAMEBUFFER, bloomFB[1]);
          gl.bindTexture(gl.TEXTURE_2D, bloomTex[0]);
          gl.uniform2f(blurU.uDir, 1 / blW, 0);
          gl.drawArrays(gl.TRIANGLES, 0, 3);
          gl.bindFramebuffer(gl.FRAMEBUFFER, bloomFB[0]);
          gl.bindTexture(gl.TEXTURE_2D, bloomTex[1]);
          gl.uniform2f(blurU.uDir, 0, 1 / blH);
          gl.drawArrays(gl.TRIANGLES, 0, 3);
          gl.bindFramebuffer(gl.FRAMEBUFFER, null);
          gl.viewport(0, 0, fbW, fbH);
          gl.useProgram(compP);
          gl.activeTexture(gl.TEXTURE0);
          gl.bindTexture(gl.TEXTURE_2D, sceneTex);
          gl.uniform1i(compU.uScene, 0);
          gl.activeTexture(gl.TEXTURE1);
          gl.bindTexture(gl.TEXTURE_2D, bloomTex[0]);
          gl.uniform1i(compU.uBloom, 1);
          gl.uniform3f(compU.uBg, CFG.BG[0], CFG.BG[1], CFG.BG[2]);
          gl.uniform1f(compU.uBloomAmt, CFG.BLOOM);
          gl.uniform1f(compU.uExpo, CFG.EXPOSURE);
          gl.uniform1f(compU.uTime, timeSec);
          gl.drawArrays(gl.TRIANGLES, 0, 3);
          gl.bindVertexArray(null);
          gl.activeTexture(gl.TEXTURE0);
        }

        // ---- HTML overlays
        var scr = [0, 0];
        for (var fo = 0; fo < FORMULAS.length; fo++) {
          var F = FORMULAS[fo], d3 = formulaEls[fo];
          var wob = Math.sin(timeSec * 0.21 + fo * 2.4) * 0.03;
          var vis = project(cam, [F.x + wob, F.y + Math.cos(timeSec * 0.17 + fo) * 0.025, F.z], scr);
          if (!vis) { d3.style.opacity = 0; continue; }
          d3.style.transform = 'translate(-50%,-50%) translate(' + scr[0].toFixed(1) + 'px,' + scr[1].toFixed(1) + 'px)';
          d3.style.opacity = (0.13 + 0.10 * (0.5 + 0.5 * Math.sin(timeSec * 0.23 + fo * 1.7))).toFixed(3);
        }
        for (var ax = 0; ax <= 4; ax++) {
          var axX = X0 + (CFG.TIME_X1 - X0) * ax / 4;
          if (project(cam, [axX, -1.04, 0], scr)) {
            axisEls[ax].style.transform = 'translate(-50%,0) translate(' + scr[0].toFixed(1) + 'px,' + scr[1].toFixed(1) + 'px)';
            axisEls[ax].style.opacity = 0.8;
          } else axisEls[ax].style.opacity = 0;
        }

        statAccum += dt;
        if (statAccum > 0.2) {
          statAccum = 0;
          var tIdx = Math.min(Math.floor(shownSweep), T - 1);
          var year = Math.round(tIdx / (T - 1) * core.HORIZON_YEARS / 10) * 10;
          var pNow = ens ? ens.pCasc[tIdx] : 0;
          hud.textContent = 'draw #' + sim.drawIndex + ' · +' + year + ' yr · P(collapse | y) = ' + pNow.toFixed(2);
          if (opts.onTick) opts.onTick({
            draw: sim.drawIndex, year: year, pNow: pNow,
            sweepFrac: shownSweep / (T - 1), steps: stepsDone, T: T
          });
        }
      }
      rafId = requestAnimationFrame(frame);

      // --- public API
      var engine = {
        setParams: function (p2) { params = Object.assign({}, p2); scheduleEnsemble(); },
        setSpeed: function (sec) { speedSec = sec; },
        setInterventions: function (list) {
          var old = {};
          for (var i = 0; i < ivRs.length; i++) old[ivRs[i].id] = ivRs[i];
          ivRs = [];
          for (var j = 0; j < list.length; j++) {
            var iv = list[j];
            if (iv.scope === 'local' && !iv.locus) continue;   // awaiting placement
            var step = core.yearToStep(iv.year, T);
            var prev = old[iv.id];
            var kernel = iv.scope === 'global' ? onesKernel
              : core.kernelFor(sim, iv.locus.u, iv.locus.v, iv.r);
            ivRs.push({
              id: iv.id, type: iv.type, scope: iv.scope, locus: iv.locus, r: iv.r,
              step: step, kernel: kernel,
              fired: prev && prev.step === step ? prev.fired : (step < sim.t)
            });
          }
          scheduleEnsemble();
        },
        enterPlacement: function (cb) {
          pendingPlace = cb;
          hint.style.display = '';
          container.style.cursor = 'crosshair';
        },
        cancelPlacement: function () {
          pendingPlace = null;
          hint.style.display = 'none';
          container.style.cursor = '';
        },
        getTrace: function () { return { C: sim.C, prevC: prevC, steps: stepsDone, T: T }; },
        dispose: function () {
          disposed = true;
          cancelAnimationFrame(rafId);
          if (ensTimer) clearTimeout(ensTimer);
          window.removeEventListener('resize', onWinResize);
          if (ro) ro.disconnect();
          container.removeEventListener('mousemove', onMove);
          container.removeEventListener('click', onClick);
          var lose = gl.getExtension('WEBGL_lose_context');
          if (lose) lose.loseContext();
          container.innerHTML = '';
        }
      };
      return engine;
    }

    return { create: create, CFG: CFG, QUALITY: QUALITY };
  })();
  </script>

  <script type="text/babel">
  const { useState, useEffect, useRef, useCallback } = React;

  const SLIDERS = [
    { k: 'conn',   g: 'κ', label: 'Connectivity' },
    { k: 'vol',    g: 'σ', label: 'Volatility' },
    { k: 'centr',  g: 'γ', label: 'Centralization' },
    { k: 'growth', g: 'α', label: 'Growth' },
    { k: 'mem',    g: 'λ', label: 'Institutional memory' }
  ];
  const DEFAULT_PARAMS = { conn: 0.55, vol: 0.35, centr: 0.4, growth: 0.55, mem: 0.5 };

  const IV_TYPES = [
    { id: 'archive',   label: 'Preserve knowledge', desc: 'archives and education: sustained recovery, lower local volatility' },
    { id: 'reform',    label: 'Institutional reform', desc: 'one-time push toward the stable basin' },
    { id: 'exchange',  label: 'Open exchange', desc: 'permanently stronger coupling between systems' },
    { id: 'isolation', label: 'Enforced isolation', desc: 'links throttled for roughly 150 years' },
    { id: 'shock',     label: 'Systemic shock', desc: 'exogenous negative impulse with elevated volatility' }
  ];

  function drawFan(canvas, ens, trace, sweepFrac) {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (w === 0) return;
    if (canvas.width !== Math.round(w * dpr)) { canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr); }
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    const padL = 30, padR = 8, padT = 8, padB = 20;
    const iw = w - padL - padR, ih = h - padT - padB;
    const X = (t, T) => padL + t / (T - 1) * iw;
    const Y = v => padT + (1 - Math.max(0, Math.min(1, v))) * ih;
    ctx.font = '10px sans-serif';
    ctx.fillStyle = '#64748b';
    ctx.strokeStyle = 'rgba(148,163,184,0.15)';
    ctx.lineWidth = 1;
    [0, 0.5, 1].forEach(v => {
      ctx.beginPath(); ctx.moveTo(padL, Y(v)); ctx.lineTo(w - padR, Y(v)); ctx.stroke();
      ctx.fillText(v.toFixed(1), 6, Y(v) + 3);
    });
    const HY = window.PsyCore.HORIZON_YEARS;
    for (let a = 0; a <= 4; a++) {
      const x = padL + iw * a / 4;
      ctx.fillText('+' + (a * HY / 4), x - 8, h - 6);
    }
    if (!ens) return;
    const T = ens.q50.length;
    const band = (lo, hi, alpha) => {
      ctx.beginPath();
      for (let t = 0; t < T; t++) { const x = X(t, T), y = Y(hi[t]); t === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
      for (let t = T - 1; t >= 0; t--) ctx.lineTo(X(t, T), Y(lo[t]));
      ctx.closePath();
      ctx.fillStyle = 'rgba(255,255,255,' + alpha + ')';
      ctx.fill();
    };
    band(ens.q05, ens.q95, 0.06);
    band(ens.q25, ens.q75, 0.10);
    ctx.beginPath();
    for (let t = 0; t < T; t++) { const x = X(t, T), y = Y(ens.q50[t]); t === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
    ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.lineWidth = 1.2; ctx.stroke();
    // collapse threshold
    ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(padL, Y(0.425)); ctx.lineTo(w - padR, Y(0.425));
    ctx.strokeStyle = 'rgba(248,113,113,0.35)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.setLineDash([]);
    // junctures
    ens.junctures.forEach(j => {
      const x = X(j.t, T);
      ctx.beginPath(); ctx.moveTo(x, padT); ctx.lineTo(x, h - padB);
      ctx.strokeStyle = 'rgba(255,183,94,0.4)'; ctx.stroke();
    });
    if (trace) {
      // previous draw, faint
      ctx.beginPath();
      for (let t = 0; t < trace.T; t++) { const x = X(t, trace.T), y = Y(trace.prevC[t]); t === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
      ctx.strokeStyle = 'rgba(147,176,232,0.30)'; ctx.lineWidth = 1; ctx.stroke();
      // current draw up to the frontier
      const upTo = Math.max(1, Math.min(trace.steps - 1, trace.T - 1));
      ctx.beginPath();
      for (let t = 0; t <= upTo; t++) { const x = X(t, trace.T), y = Y(trace.C[t]); t === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
      ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 1.4; ctx.stroke();
      // frontier cursor
      const cx = padL + iw * Math.max(0, Math.min(1, sweepFrac));
      ctx.beginPath(); ctx.moveTo(cx, padT); ctx.lineTo(cx, h - padB);
      ctx.strokeStyle = 'rgba(94,234,212,0.55)'; ctx.lineWidth = 1; ctx.stroke();
    }
  }

  function Seg({ options, value, onChange }) {
    return (
      <span className="seg-row" role="group">
        {options.map(o => (
          <button key={o.v} type="button"
            className={'lang-seg' + (value === o.v ? ' active' : '')}
            onClick={() => onChange(o.v)}>{o.label}</button>
        ))}
      </span>
    );
  }

  function App() {
    const [params, setParams] = useState(DEFAULT_PARAMS);
    const [ivs, setIvs] = useState([]);
    const [seed, setSeed] = useState(1088);
    const [seedInput, setSeedInput] = useState('1088');
    const [quality, setQuality] = useState('auto');
    const [speed, setSpeed] = useState(16);
    const [stats, setStats] = useState(null);
    const [ens, setEns] = useState(null);
    const [placing, setPlacing] = useState(null);
    const [ivType, setIvType] = useState('archive');
    const [ivYear, setIvYear] = useState(400);
    const [ivScope, setIvScope] = useState('global');
    const [webgl, setWebgl] = useState(true);

    const heroRef = useRef(null);
    const fanRef = useRef(null);
    const engineRef = useRef(null);
    const nextId = useRef(1);

    const resolvedQuality = quality === 'auto'
      ? (('ontouchstart' in window) && Math.min(screen.width, screen.height) < 900 ? 'low' : 'high')
      : quality;

    useEffect(() => {
      if (!heroRef.current || !window.PsyGL) return;
      let eng = null;
      try {
        eng = window.PsyGL.create(heroRef.current, {
          seed: seed,
          params: params,
          quality: resolvedQuality,
          speedSec: speed,
          onTick: s => setStats(s),
          onEnsemble: e => setEns(e),
          onSweep: () => {}
        });
      } catch (err) {
        eng = null;
        if (heroRef.current) heroRef.current.innerHTML = '';
      }
      if (!eng) setWebgl(false);
      engineRef.current = eng;
      if (eng) {
        eng.setParams(params);
        eng.setInterventions(ivs);
        eng.setSpeed(speed);
      }
      return () => { if (eng) eng.dispose(); engineRef.current = null; };
      // eslint-disable-next-line react-hooks/exhaustive-deps
    }, [resolvedQuality, seed]);

    useEffect(() => { if (engineRef.current) engineRef.current.setParams(params); }, [params]);
    useEffect(() => { if (engineRef.current) engineRef.current.setInterventions(ivs); }, [ivs]);
    useEffect(() => { if (engineRef.current) engineRef.current.setSpeed(speed); }, [speed]);

    useEffect(() => {
      if (!fanRef.current) return;
      const trace = engineRef.current ? engineRef.current.getTrace() : null;
      drawFan(fanRef.current, ens, trace, stats ? stats.sweepFrac : 0);
    }, [ens, stats]);

    const addIv = () => {
      const iv = { id: nextId.current++, type: ivType, year: ivYear, scope: ivScope,
                   locus: null, r: 0.22 };
      setIvs(list => [...list, iv]);
      if (ivScope === 'local' && engineRef.current) {
        setPlacing(iv.id);
        engineRef.current.enterPlacement(uv => {
          setIvs(list => list.map(x => x.id === iv.id ? { ...x, locus: uv } : x));
          setPlacing(null);
        });
      }
    };
    const removeIv = id => {
      if (placing === id && engineRef.current) { engineRef.current.cancelPlacement(); setPlacing(null); }
      setIvs(list => list.filter(x => x.id !== id));
    };

    const rederive = () => {
      const s = parseInt(seedInput, 10);
      if (Number.isFinite(s)) setSeed(((s % 2147483647) + 2147483647) % 2147483647);
    };

    const HY = window.PsyCore.HORIZON_YEARS;
    const junctureYears = ens ? ens.junctures.map(j => ({
      year: Math.round(j.t / (ens.q50.length - 1) * HY / 10) * 10, p: j.p
    })) : [];

    return (
      <div>
        <div className="container">
          <h1 style={{ fontSize: '1.5rem', color: '#cbd5e1', marginBottom: 8 }}>A Model of Psychohistory</h1>
          <p style={{ color: '#94a3b8', maxWidth: '78ch', marginBottom: 12 }}>
            A hierarchical stochastic model of the long-run trajectory of a galactic civilization,
            conditioned on its recorded history and sampled forward. Each sweep of the frontier draws
            one future from p(&#x1EF9;&thinsp;|&thinsp;y); the faint imprint ahead of the frontier is the
            previous draw. Set priors, schedule interventions, and watch where the mass of futures goes.
            Click the map to perturb it.
          </p>
        </div>

        <div className="psy-hero" ref={heroRef}>
          {!webgl && (
            <div className="psy-fallback">
              <strong style={{ color: '#cbd5e1' }}>This model requires WebGL2.</strong>
              <span style={{ fontSize: 13 }}>Your browser exposes no WebGL2 context, so the posterior cannot be explored here.</span>
            </div>
          )}
        </div>

        <div className="container" style={{ paddingTop: 18 }}>
          <div className="psy-card">
            <div style={{ fontSize: 13, color: '#94a3b8', marginBottom: 6 }}>
              Aggregate posterior &middot; civilizational index C&#8348; with 50% and 90% credible bands
            </div>
            <canvas className="psy-fan" ref={fanRef} />
            <div style={{ fontSize: 12, color: '#94a3b8', marginTop: 8 }}>
              {junctureYears.length === 0
                ? <span>no critical junctures detected on this horizon</span>
                : junctureYears.map((j, i) => (
                    <span key={i} style={{ marginRight: 18 }}>
                      <span style={{ color: '#ffb75e' }}>&#9679;</span> critical juncture at
                      +{j.year} yr &middot; P(collapse | y) = {j.p.toFixed(2)}
                    </span>
                  ))}
            </div>
          </div>

          <div className="psy-card">
            <div style={{ fontSize: 13, color: '#cbd5e1', marginBottom: 10 }}>Priors over structural parameters</div>
            <div className="psy-grid">
              {SLIDERS.map(s => (
                <div key={s.k}>
                  <label>
                    {s.g} &middot; {s.label}
                    <span style={{ float: 'right', color: '#64748b' }}>prior mean {params[s.k].toFixed(2)}</span>
                  </label>
                  <input type="range" min="0" max="1" step="0.01" value={params[s.k]}
                    onChange={e => { const v = parseFloat(e.target.value); setParams(p => ({ ...p, [s.k]: v })); }} />
                </div>
              ))}
            </div>
          </div>

          <div className="psy-card">
            <div style={{ fontSize: 13, color: '#cbd5e1', marginBottom: 10 }}>Interventions (applied when the frontier next passes them)</div>
            <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', alignItems: 'flex-end', marginBottom: 6 }}>
              <label style={{ fontSize: 12.5, color: '#94a3b8', marginBottom: 0, flex: '1 1 190px' }}>
                type
                <select value={ivType} onChange={e => setIvType(e.target.value)} style={{ marginBottom: 0 }}>
                  {IV_TYPES.map(t => <option key={t.id} value={t.id}>{t.label}</option>)}
                </select>
              </label>
              <label style={{ fontSize: 12.5, color: '#94a3b8', marginBottom: 0, flex: '1 1 150px' }}>
                year (+{ivYear})
                <input type="range" min="0" max={HY} step="10" value={ivYear}
                  onChange={e => setIvYear(parseInt(e.target.value, 10))} style={{ marginBottom: 0 }} />
              </label>
              <Seg options={[{ v: 'global', label: 'Global' }, { v: 'local', label: 'Local' }]}
                value={ivScope} onChange={setIvScope} />
              <button type="button" className="lang-seg" onClick={addIv}>Add</button>
            </div>
            <div style={{ fontSize: 11.5, color: '#64748b', marginBottom: 8 }}>
              {(IV_TYPES.find(t => t.id === ivType) || {}).desc}
            </div>
            {ivs.length === 0 && <div style={{ fontSize: 12.5, color: '#64748b' }}>none scheduled - the future runs on priors alone</div>}
            {ivs.map(iv => (
              <div className="psy-ivrow" key={iv.id}>
                <span style={{ color: '#5eead4' }}>&#9675;</span>
                <span style={{ color: '#cbd5e1' }}>{(IV_TYPES.find(t => t.id === iv.type) || {}).label}</span>
                <span>at +{iv.year} yr</span>
                <span>&middot; {iv.scope === 'global' ? 'global' : (iv.locus ? 'local' : (placing === iv.id ? 'click the map to place' : 'unplaced'))}</span>
                <button type="button" className="psy-x" aria-label="remove" onClick={() => removeIv(iv.id)}>&#10005;</button>
              </div>
            ))}
          </div>

          <div className="psy-card">
            <div style={{ fontSize: 13, color: '#cbd5e1', marginBottom: 10 }}>Inference</div>
            <div style={{ display: 'flex', gap: 18, flexWrap: 'wrap', alignItems: 'flex-end' }}>
              <label style={{ fontSize: 12.5, color: '#94a3b8', marginBottom: 0 }}>
                chain seed
                <span style={{ display: 'flex', gap: 8 }}>
                  <input type="number" value={seedInput} onChange={e => setSeedInput(e.target.value)}
                    style={{ width: 120, marginBottom: 0 }} />
                  <button type="button" className="lang-seg" onClick={rederive}>Re-derive</button>
                </span>
              </label>
              <label style={{ fontSize: 12.5, color: '#94a3b8', marginBottom: 0 }}>
                sweep
                <span style={{ display: 'block' }}>
                  <Seg options={[{ v: 28, label: 'Slow' }, { v: 16, label: 'Normal' }, { v: 8, label: 'Fast' }]}
                    value={speed} onChange={setSpeed} />
                </span>
              </label>
              <label style={{ fontSize: 12.5, color: '#94a3b8', marginBottom: 0 }}>
                render
                <span style={{ display: 'block' }}>
                  <Seg options={[{ v: 'auto', label: 'Auto' }, { v: 'low', label: 'Low' }, { v: 'high', label: 'High' }, { v: 'ultra', label: 'Ultra' }]}
                    value={quality} onChange={setQuality} />
                </span>
              </label>
              {stats && (
                <span style={{ fontSize: 12, color: '#64748b', fontVariantNumeric: 'tabular-nums' }}>
                  draw #{stats.draw} &middot; {stats.T} steps &middot; identical seed, priors and
                  interventions reproduce the identical future
                </span>
              )}
            </div>
          </div>

          <p style={{ fontSize: 11, color: '#64748b', lineHeight: 1.55 }}>
            Method: coupled stochastic differential equations on a k-nearest-neighbour graph over the
            simulated systems (double-well drift, Euler-Maruyama integration); one sweep of the frontier
            is one draw from the posterior predictive distribution given priors, seed and scheduled
            interventions. Bands: 25-75% and 5-95% credible intervals over 48 aggregate replicates;
            junctures are flagged where P(collapse | y) shifts fastest. All computation runs client-side
            in your browser; nothing you do here is sent, stored or tracked.
          </p>
          <p style={{ fontSize: 10, color: '#475569' }}>
            All models are wrong. The credible bands above quantify how wrong this one expects to be.
          </p>
        </div>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
