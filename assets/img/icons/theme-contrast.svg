<!-- Own drawing, matching the lucide geometry of theme-sun/theme-moon (24 grid,
     2.4 stroke, round joins), with the same r=9 circle as the moon arc so all
     three icons sit on one outer edge. Half filled, because that is what the
     grey skin is: neither of the two, the value between them.

     The fill is legitimate here even though the two neighbours are stroke-only:
     the switcher paints the file as a CSS mask (custom.css .theme-seg::before),
     so only coverage matters, not paint. The arc runs along the circle's stroke
     centreline, so the filled half stays inside the outline instead of bleeding
     past it. -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="12" cy="12" r="9" />
  <path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none" />
</svg>
