<!-- hand-authored, Lucide-style icon (not part of lucide-static): the colormap
     strip the tool draws, a rounded bar divided into discrete steps, with a
     shorter second strip under it for the reversed direction the tool always
     offers alongside.

     Two icons were tried and discarded first. The ternary diagram read as a
     warning sign at list size, an upright triangle with a mark in the middle
     being exactly that. A row of rising bars was then indistinguishable from
     sliders-vertical, which is already in this set. Note that a lightness ramp
     cannot be drawn here at all: the icon goes through a CSS mask that keeps
     only the alpha channel, so every stop would arrive in one flat colour. The
     divisions have to carry the meaning. -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
  <rect x="2.4" y="5" width="19.2" height="7" rx="1.6" />
  <path d="M7.2 5v7" stroke-opacity=".5" />
  <path d="M12 5v7" stroke-opacity=".5" />
  <path d="M16.8 5v7" stroke-opacity=".5" />
  <rect x="2.4" y="15.4" width="13.4" height="3.6" rx="1.4" stroke-opacity=".55" />
</svg>
