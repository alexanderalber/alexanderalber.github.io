<!-- hand-authored, Lucide-style icon (not part of lucide-static): a lane running
     between two rocks, which is the whole of asteroid-corridor. The rocks are
     irregular polygons rather than circles, because a circle is the one thing
     the tool deliberately does not collide against. They are drawn large and
     the lane straight: an earlier version had four small rocks and a diagonal
     dashed path, and at 18px that read as scattered debris. -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
  <path d="M5.6 2.9 8.2 5.1 7.6 8.5 4.4 9.6 2.2 7.1 2.9 3.9Z" />
  <path d="M18.9 14 21.6 16.2 21 19.7 17.8 20.9 15.5 18.3 16.2 15.1Z" />
  <path d="M12 21.4 12 4.2" stroke-dasharray="2.6 2.6" />
  <path d="M9.4 6.6 12 3.4 14.6 6.6" />
</svg>
