<!-- hand-authored, Lucide-style icon (not part of lucide-static): one large
     asteroid, an irregular polygon with three craters.

     Two earlier versions tried to draw the corridor itself. The first had four
     small rocks and a diagonal dashed path and read as scattered debris at list
     size; the second had two rocks with a dashed lane and an arrow between
     them, which was legible but busy. The owner asked for the single big rock
     on 2026-09-03. The outline is deliberately not a circle: the body in the
     tool is a displaced icosphere, and a circle is the one shape it never is.
     The craters carry reduced stroke-opacity so the silhouette stays first. -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
  <path d="M11.6 2.6 17.9 4.7 21.4 10.4 19.6 17.4 13.4 21.4 6.5 20.1 2.7 14.6 3.6 7.5Z" />
  <circle cx="9.2" cy="9.6" r="1.9" stroke-opacity=".55" />
  <circle cx="15.3" cy="14.2" r="1.3" stroke-opacity=".55" />
  <circle cx="10.4" cy="16.6" r=".85" stroke-opacity=".55" />
</svg>
