<!-- hand-authored, Lucide-style icon (not part of lucide-static): one large
     eighth note, nothing else.

     The previous version drew a sheet of paper, an arrow and a small note, the
     three steps of the tool. At list size (1.9em) that was three unreadable
     things instead of one readable one, so it is a single note now, on the
     owner's call. The head is filled and slanted like a real notehead rather
     than being a lucide-style circle: through the mask everything arrives in
     one colour, so the shape has to do the work. -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <ellipse cx="8.1" cy="18.1" rx="4.6" ry="3.4" transform="rotate(-22 8.1 18.1)" fill="currentColor" stroke="none" />
  <path d="M12.4 17.2V3.4" />
  <path d="M12.4 3.4c2.6.9 5.4 2.5 5.4 5.4 0 1.5-.7 2.7-1.8 3.6" />
</svg>
