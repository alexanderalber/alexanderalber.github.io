<!-- hand-authored, Lucide-style icon (not part of lucide-static): a stylised
     heatmap, sixteen cells whose fill-opacity rises towards one hot corner.

     Replaces colormap-ramp.svg (a divided strip plus a shorter reversed one),
     which was correct about the tool but read as a progress bar at list size.
     Before that, two further icons were tried and discarded: the ternary
     diagram read as a warning sign, an upright triangle with a mark in the
     middle being exactly that, and a row of rising bars was indistinguishable
     from sliders-vertical, which is already in this set.

     Note that a colour ramp cannot be drawn here at all: the icon goes through
     a CSS mask that keeps only the alpha channel, so every stop would arrive
     in one flat colour. Opacity is the only gradient available, which is why
     the cells carry fill-opacity rather than different fills. -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="none">
  <g>
    <rect x="2.6" y="2.6" width="4.3" height="4.3" rx="0.9" fill-opacity=".12" />
    <rect x="7.6" y="2.6" width="4.3" height="4.3" rx="0.9" fill-opacity=".22" />
    <rect x="12.6" y="2.6" width="4.3" height="4.3" rx="0.9" fill-opacity=".38" />
    <rect x="17.6" y="2.6" width="4.3" height="4.3" rx="0.9" fill-opacity=".22" />

    <rect x="2.6" y="7.6" width="4.3" height="4.3" rx="0.9" fill-opacity=".22" />
    <rect x="7.6" y="7.6" width="4.3" height="4.3" rx="0.9" fill-opacity=".55" />
    <rect x="12.6" y="7.6" width="4.3" height="4.3" rx="0.9" fill-opacity=".85" />
    <rect x="17.6" y="7.6" width="4.3" height="4.3" rx="0.9" fill-opacity=".38" />

    <rect x="2.6" y="12.6" width="4.3" height="4.3" rx="0.9" fill-opacity=".38" />
    <rect x="7.6" y="12.6" width="4.3" height="4.3" rx="0.9" fill-opacity=".85" />
    <rect x="12.6" y="12.6" width="4.3" height="4.3" rx="0.9" fill-opacity="1" />
    <rect x="17.6" y="12.6" width="4.3" height="4.3" rx="0.9" fill-opacity=".5" />

    <rect x="2.6" y="17.6" width="4.3" height="4.3" rx="0.9" fill-opacity=".16" />
    <rect x="7.6" y="17.6" width="4.3" height="4.3" rx="0.9" fill-opacity=".38" />
    <rect x="12.6" y="17.6" width="4.3" height="4.3" rx="0.9" fill-opacity=".5" />
    <rect x="17.6" y="17.6" width="4.3" height="4.3" rx="0.9" fill-opacity=".22" />
  </g>
</svg>
