<!-- Duval triangle: hand-drawn in the lucide stroke style, not a lucide icon.
     The inner lines follow the real layout of Duval Triangle 1, simplified:
     one line parallel to the right edge (constant acetylene), and two lines
     parallel to the left edge (constant ethylene) that end on it. That gives
     the thermal strip on the right and the discharge zones on the left. -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
  <path d="M12 3.2 21.4 20.3H2.6Z" />
  <path d="M10.1 6.6 17.6 20.3" stroke-opacity=".45" />
  <path d="M8.2 20.3 12.9 11.8" stroke-opacity=".45" />
  <path d="M16.7 11.8 14.8 15.2" stroke-opacity=".45" />
  <circle cx="7.9" cy="16.4" r="1.25" fill="currentColor" stroke="none" />
</svg>
