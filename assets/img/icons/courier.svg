<!-- hand-authored, Lucide-style icon (not part of lucide-static): the Hikyaku
     courier glider seen from above, nose up, as a flat wide delta with its four
     ducted fans set into the wing (the mask cuts the hull outline where a fan
     ring crosses it), the cabin as a faint centre line and two tail nozzles.
     Replaced the generic Lucide "navigation" arrow on 2026-10-25. Rejected:
     a narrow hull with four detached fan rings (reads as a quadcopter, the
     drone silhouette the owner turned down for the ship itself), the wedge
     flying through a ring (a planet below 24px), towers around a ring (a bar
     chart). -->
