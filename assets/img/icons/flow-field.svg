<!-- hand-authored, Lucide-style icon (not part of lucide-static): four arrows in
     a 2x2 pattern, all pointing in similar but not identical directions, which
     is what a flow field looks like where it is smooth.

     Two versions were discarded. The first had four arrows converging on a dot
     inside a rounded frame, which is honest about the tool (every arrow points
     at the goal) but reads as the pictogram for a meeting point; the owner said
     so on 2026-09-03. Before that, eight short arrows closed up into blobs at
     list size. The angles here fan by 15 degrees per cell so the field reads as
     one flow rather than four unrelated arrows. -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
  <g transform="translate(6.9 6.9) rotate(-35)">
    <path d="M-3.6 0H3.4" />
    <path d="m1.1 -2.2 2.3 2.2-2.3 2.2" />
  </g>
  <g transform="translate(17.1 6.9) rotate(-20)">
    <path d="M-3.6 0H3.4" />
    <path d="m1.1 -2.2 2.3 2.2-2.3 2.2" />
  </g>
  <g transform="translate(6.9 17.1) rotate(-20)">
    <path d="M-3.6 0H3.4" />
    <path d="m1.1 -2.2 2.3 2.2-2.3 2.2" />
  </g>
  <g transform="translate(17.1 17.1) rotate(-5)">
    <path d="M-3.6 0H3.4" />
    <path d="m1.1 -2.2 2.3 2.2-2.3 2.2" />
  </g>
</svg>
