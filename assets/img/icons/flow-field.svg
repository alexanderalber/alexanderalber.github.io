<!-- hand-authored, Lucide-style icon (not part of lucide-static): a cost field
     whose arrows all point at one goal, which is what flow-field-defense
     actually draws. Four arrows rather than eight, with barbs long enough to
     survive 18px: an earlier version had shorter ones and they closed up into
     blobs at the list size. -->
