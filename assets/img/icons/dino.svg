<!-- hand-authored, Lucide-style icon (not part of lucide-static); proportions traced from Noto Emoji sauropod U+1F995 (Apache 2.0) -->
<!-- The "v3" badge in the bottom right names the model generation the tool
     runs (DINOv3). It is drawn as strokes, not as a <text> element: the icon
     goes through a CSS mask, so it is rasterised as an image with no access to
     page fonts, and a text node would render in whatever the platform picks or
     not at all. Its stroke is thinner than the body (0.95 against 1.3) so the
     badge stays legible without competing with the animal. -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
